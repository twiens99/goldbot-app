   max bear, matching the BEAR chip beside it. BLUE toward max bull -- NOT the
   app's --bull green, which is the middle of this axis and would make the two
   ends of the scale the same colour.

   WHERE THE ENDS LAND IS TREVOR'S CALL, NOT THE ARITHMETIC'S. First cut spread
   the ramp evenly over the reach, which put full blue out at 3150 and left
   2450 -- a bucket that actually exists -- reading cyan. Trevor, 2026-09-16:
   *"the 2450 bucket would be almost fully blue while the 150 bucket was almost
   Fully Red."* So the stops are placed to hit those two, per regime: **150 is
   red, 2450 is blue, 1600 is green**, and the slack past each of them is a
   short run to a slightly deeper shade rather than the bulk of the ramp.

   THE REACH IS STILL 1550. Only the DISTRIBUTION inside it moved; the
   generation-5 derivation below is untouched.

   WHY STOPS AND NOT ONE MIX. Mixing straight from green to red goes THROUGH
   MUD: the two are near-opposites, so the halfway point comes out a 17%
   saturation tan that is exactly the unreadable grey this change was asked to
   get rid of. Fixed stops keep every step of the ramp saturated, because no
   single mix ever has to cross the whole distance.

   THE BEAR HALF PASSES THROUGH AMBER and there is no way around it -- red and
   green are far enough apart on the wheel that the only routes between them are
   warm (yellow, orange) or through purple, and purple is where the BULL half
   already goes. It is close to --warn, which is a real cost, but --warn never
   appears as a number in this slot, and the alternative is the mud. */
const BKT_ROOT = 1600;
const BKT_REACH = 1550;              // 1600 - 1600/2**5: the generation-5 edge
const BKT_STOPS = [                  // [position on the axis, colour]
  [-1.00, [232,  86,  72]],          // id   50 -- deepest red there is
  [-0.85, [224, 104,  90]],          // id  150 -- "almost fully red", --bear
  [-0.55, [226, 140,  72]],          // id  750 -- orange
  [-0.28, [222, 196,  86]],          // id 1166 -- gold; see THE BEAR HALF above
  [ 0.00, [ 95, 190, 149]],          // id 1600 -- root, --bull/--good exactly
  [ 0.25, [ 95, 198, 200]],          // id 1987 -- cyan
  [ 0.55, [104, 158, 234]],          // id 2450 -- "almost fully blue"
  [ 1.00, [122, 132, 244]],          // id 3150 -- deepest indigo there is
];

const bktMix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const bktRgb = (c, a) => a == null ? `rgb(${c[0]},${c[1]},${c[2]})`
                                   : `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* Which pair of stops `t` falls between, mixed by how far along it is. */
function bktTone(t){
  for(let i = 1; i < BKT_STOPS.length; i++){
    const [hi, cHi] = BKT_STOPS[i];
    if(t <= hi){
      const [lo, cLo] = BKT_STOPS[i - 1];
      return bktMix(cLo, cHi, (t - lo) / (hi - lo));
    }
  }
  return BKT_STOPS[BKT_STOPS.length - 1][1];
}

/* The whole element, so the two call sites cannot disagree about it. A
   non-numeric id renders plain rather than being dropped: an id this cannot
   place is still an id worth showing. */
function bktEl(id, trail, filterId){
  if(id == null) return "";
  const tail = trail ? " " : "";
  /* On a results row the bucket is a control as well as a label -- see the
     results chips. Everywhere else it is just the id. */
  const fil = filterId != null ? ` data-rfilter="bucket:${esc(filterId)}"` : "";
  const n = Number(id);
  if(!isFinite(n)) return `<span class="bkt"${fil}>${esc(id)}</span>` + tail;
  const t = Math.max(-1, Math.min(1, (n - BKT_ROOT) / BKT_REACH));
  const tone = bktTone(t);
  const lift = bktMix(tone, [255, 255, 255], .34);
  return `<span class="bkt"${fil} style="background:${bktRgb(tone, .15)}">` +
         `<i style="color:${bktRgb(lift)};background-image:linear-gradient(` +
         `120deg,${bktRgb(lift)},${bktRgb(tone)})">${esc(id)}</i></span>` + tail;
}

const stale = f => f.age_seconds != null && f.age_seconds > 900;
const running = f => f.group_id && f.phase;
/* A PHASE WITH NO GROUP IS NOT IDLE. The picking phase writes no detail
   upstream, so
   regime, bucket, group and mode all arrive null and the phase is the only
   true thing on the record. `running` is false for it, which titled the card
   "Idle -- no round" while it wore a picking chip -- the card contradicted
   itself, and the fabricated preview data was hiding it. */
const picking = f => f.phase && !f.group_id;
/* AN AGENT RUNS NO ROUND. It lends MT5 cores to another machine's optimization
   and says which machine on its own beacon (`agents.agent_for`). Every round
   predicate above is false for it by construction, which is how Kylee read
   "idle - no round" on 2026-09-23 while lending 4 of 4 cores to the Desktop. */
const isAgent = f => !!(f && f.agents && f.agents.agent_for);
const completed = r => !r.failed;

/* "5 of 28" -- the groups this BUCKET has optimized, out of its own. null when
   the machine is idle or the bucket is unknown, so metaRow drops the cell
   rather than printing a confident zero. */
function jobsDone(regime, bucketId){
  const b = BUCKETS.find(x => x.regime === regime && x.bucket_id === bucketId);
  if(!b || b.groups_done == null) return null;
  return b.groups_total ? `${b.groups_done} of ${b.groups_total}` : String(b.groups_done);
}

/* ETA -- the LOCAL CLOCK TIME this job should finish at. The rate already on
   this row answers the same question, but only after arithmetic: "64% at
   9.4 %/h" is 3.8 hours, and what you want to know is whether that lands
   before or after you go to bed.

   THE ARITHMETIC IS UPSTREAM'S, RESTATED. mt5_progress.hours_remaining and
   backtest_progress.hours_remaining are both `(100 - percent) / rate` behind
   the same two guards used here, so this agrees with them by construction
   rather than by luck. The figure itself does not ride the beacon --
   _BEACON_PROGRESS_FIELDS forwards percent and pct_per_hour and drops
   hours_remaining -- so the renderer re-derives it rather than the publisher
   growing a field for a thing it already has the inputs for.

   ANCHORED TO THE BEACON, NOT TO NOW. `percent` was true when the machine last
   reported; adding the remaining hours to `now` would push every ETA later by
   the beacon's own age. That is seconds on a live card -- and it is the whole
   story on a stale one, which is why a STALE BEACON GETS NO ETA. Its percent is
   fifteen-plus minutes old, and the card already carries a warning saying the
   page cannot say what that machine is doing now; a confident finishing time
   printed under that warning would contradict it. Same lesson the backtest
   freshness guard was written for: "91% -- ~0h left" on a machine that has
   moved on is worse than no number. */
function etaAt(f){
  if(stale(f)) return null;
  if(f.percent == null || !f.pct_per_hour || f.percent >= 100) return null;
  const beaconMs = Date.now() - (f.age_seconds || 0) * 1000;
  return new Date(beaconMs + ((100 - f.percent) / f.pct_per_hour) * 3600e3);
}

/* A bare "03:12" is a lie by omission when it means tomorrow, and at 9 %/h a
   round is ten hours long -- crossing midnight is the ordinary case here, not
   the edge one. So the day is NAMED whenever it is not today. Local, for the
   reason fmtWhen gives. Day distance is measured midnight-to-midnight and
   rounded, so a 23- or 25-hour DST day still counts as one day. */
const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtEta(d){
  if(!d) return null;
  const p = n => String(n).padStart(2, "0");
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const now = new Date();
  // A LIVE beacon can still sit behind a job that is nearly done: 99% at
  // 60 %/h is one minute left, read four minutes ago. A finishing time in the
  // past is not wrong, but printing it as a clock time reads as one.
  if(d <= now) return "due now";
  const days = Math.round(
    (new Date(d.getFullYear(), d.getMonth(), d.getDate()) -
     new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  if(days === 0) return hm;
  if(days < 7) return DAY_NAMES[d.getDay()] + " " + hm;
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${hm}`;
}

/* WHEN THIS TASK STARTED -- the counterpart to fmtEta, and shaped like it on
   purpose. The two sit side by side on the live card and read as a pair: this
   began at X, it should land at Y.

   NOT fmtWhen(), which always prints the date. Beside an ETA that says "13:38"
   for today, a start reading "09-17 14:59" is a wider, noisier cell saying less.

   NOT fmtEta() either, and this is the part worth stating: fmtEta returns
   "due now" for anything in the past, which is right for a finishing time and
   nonsense for a start -- a start is ALWAYS in the past. So the day distance
   is measured the other way round.

   THE DAY NAME IS NOT DECORATION. Rounds here run for days -- one on the tree
   right now is 66 hours in and another is estimating 32 -- so "Started 14:59"
   on a job that began on Monday is the same lie by omission fmtEta's own
   comment was written about. Same midnight-to-midnight rounding, so a DST day
   still counts as one.

   Accepts an ISO string or unix SECONDS, matching fmtWhen, because not every
   caller upstream carries the same shape. */
function fmtStarted(v){
  if(v == null || v === "") return null;
  const d = (typeof v === "number") ? new Date(v * 1000) : new Date(v);
  if(isNaN(d.getTime())) return null;
  const p = n => String(n).padStart(2, "0");
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const now = new Date();
  const days = Math.round(
    (new Date(now.getFullYear(), now.getMonth(), now.getDate()) -
     new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  /* <= 0 rather than === 0: a beacon written on a machine whose clock runs a
     little ahead must read as today, never as a day in the future. */
  if(days <= 0) return hm;
  if(days < 7) return DAY_NAMES[d.getDay()] + " " + hm;
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${hm}`;
}

/* No cells means NO ROW. The .meta rule draws a border top and bottom, so an
   empty one is not invisible -- it is a 20px band of two stray rules. Idle
   machines hit this the moment a field is dropped from the row, which is
   exactly what happened when Tier came out. */
/* HOW MANY PASSES ACTUALLY RAN, and how big the space was. Trevor,
   2026-09-17: *"Passes 8192 I want to know how many actual passes were run."*

   BOTH NUMBERS, NOT A SWAP. `passes` is estimate_group_passes() -- the size of
   the grid, and the figure the scheduler calls a group HEAVY on. The count that
   actually ran is a different fact: a GA reaches a fraction of the space, and
   "1,184 of 8,192" says how hard it looked as well as how big the room was.
   Replacing one with the other would lose the reason the round was scheduled
   the way it was.

   ⚠️ PUBLISHER-GATED. The real count exists as RoundOutcome.pass_count
   (len(df) off the parsed report) and STOPS THERE -- run_next_round writes only
   the estimate onto the LedgerRow, and `passes_run` is not on the row or in
   app_snapshot._LEDGER_FIELDS. Until it is, this falls back to the single
   number the card has always shown. */
function passesText(r){
  const est = r.passes, run = r.passes_run;
  if(run == null) return est != null ? est.toLocaleString() : null;
  if(est == null) return run.toLocaleString();
  return run.toLocaleString() + " of " + est.toLocaleString();
}

function metaRow(pairs){
  const cells = pairs.filter(x => x[1] != null && x[1] !== "");
  if(!cells.length) return "";
  return '<div class="meta">' + cells
    .map(([k, v, cls]) => `<div><span class="k">${esc(k)}</span>` +
      `<span class="v ${cls || ""}">${esc(v)}</span></div>`).join("") + '</div>';
}

function progressBar(f, rc){
  if(f.percent == null) return "";
  return `<div class="prog">
      <div class="prog-top"><span>${esc(f.mode === "real_ticks" ? "Real Ticks"
        : f.mode === "ohlc" ? "OHLC" : (phaseText(f.phase) || "Progress"))}</span>
        <span class="pct">${f.percent}%</span></div>
      <div class="bar"><i class="${rc}" style="width:${Math.max(0, Math.min(100, f.percent))}%"></i></div>
    </div>`;
}

/* STARTED, AND NOT FINISHED WITH. `running`/`claimed` is work in flight;
   `consult` is a sweep that produced its measurement and is waiting on a
   person, which is open work too -- it is the one state that cannot clear
   itself. `pending` is NOT here: nothing has picked it up, so it has not
   started, and the Active page is about what IS happening.

   Read off the seed's own status rather than from a count of leases: the lease
   is the mechanism, the status is the record, and every other surface reads
   the record. */
const STARTED_STATUSES = new Set(["running", "claimed", "consult"]);
const startedSeed = sd => STARTED_STATUSES.has(String(sd.status || "").toLowerCase());
/* EXECUTING IS NOT THE SAME QUESTION AS OPEN, and one set answering both is
   what put the wrong label on a running machine.

   `consult` is a sweep that FINISHED and is waiting on a person. It is open
   work -- it belongs in the counts and in Unfinished -- but nothing is running
   it, and `claimed_by` stays behind as the record of who ran it, not as a claim
   on the machine now.

   Measured 2026-09-16: the Laptop was 69% through a full-range backtest on
   one group while its card read SWEEP and named an A/B arm that
   had finished two days earlier. Three seeds sat at consult with
   claimed_by=Laptop, `seedOnMachine` matched the first of them, and the rule
   that a claimed seed outranks the beacon then did exactly what it says --
   against a seed that was not being executed at all. */
const EXECUTING_STATUSES = new Set(["running", "claimed"]);
const executingSeed = sd =>
  EXECUTING_STATUSES.has(String(sd.status || "").toLowerCase());
const queuedSeed = sd => String(sd.status || "").toLowerCase() === "pending";
const needsDecision = sd => String(sd.status || "").toLowerCase() === "consult";

function renderSeeds(list, label){
  if(!list || !list.length) return "";
  return (label ? '<div class="section-label">' + esc(label) + '</div>' : "")
    + list.map(seedCard).join("");
}

/* ONE SEED, ONE CARD, wherever it is shown -- the list and the job detail call
   the same function, so a seed cannot read two ways on two screens. */
function seedCard(sd){
      // No `compact` variant any more: this card is only ever drawn for a seed
      // with NO machine card above it, so there is nothing to avoid repeating.
      const rc = RC[sd.regime] || "";
      const when = sd.claimed_at || sd.created_at;
      return `
      <article class="card">
        <div class="stripe ${rc || "warn"}"></div>
        <div class="card-in">
          <div class="top">
            ${sd.regime ? `<span class="chip ${rc}">${esc(sd.regime)}</span>` : ""}
            ${sd.claimed_by ? `<span class="chip gold">${esc(sd.claimed_by)}</span>`
              /* PINNED AND UNCLAIMED. Once a machine has taken it the gold chip
                 says which, and repeating the pin beside it answers a question
                 nobody is still asking. Before that it is the difference
                 between "waiting for a machine" and "waiting for THAT one". */
              : sd.only_machine
                ? `<span class="chip">${esc(sd.only_machine)} only</span>` : ""}
            <span class="chip">${esc(roundType(sd))}</span>
            <span class="sp"></span>
            <span class="when">${esc(String(sd.status || ""))}</span>
          </div>
          <div>
            <div class="title">${esc(sd.label || humanize(sd.group_id) || "Seeded work")}</div>
            <div class="sub">${sd.claimed_by ? "" : "unclaimed"}` +
              `${when ? (sd.claimed_by ? "since " : " · created ") + esc(fmtWhen(when)) : ""}</div>
          </div>
          ${sweptList(sd.variables, sd.cells)}
          ${sd.note ? `<div class="noterow" data-toggle><span>Why it cut in line</span>` +
            `<span class="car">▾</span></div>` +
            `<div class="notebody" hidden>${esc(sd.note)}</div>` : ""}
        </div>
      </article>`;
}

/* A FAILED ROUND WRITES NO LEDGER ROW -- the retry state machine is what
   remembers it, and a success clears that entirely. So this is "what is failing
   NOW", not a history, and it is the only place a failure is visible at all.

   Parked (3 failures) is the one state that does not auto-revive: it is asking
   for a decision, which is exactly what this page should not make someone go
   looking for. */
/* ---------- a failure, and what you can do about it ----------
   Trevor, 2026-09-19: *"I'm trying to give the app the capability to deal with
   the failure, rather than always having you to look into it."*

   🔴 THE PANEL REUSES THE OPERATIONS VOCABULARY on purpose -- same opener,
   same armed buttons, same honest commit. Two panels of machine actions that
   looked different would be two things to learn for one idea, and the arming
   rule matters more here than there: Delete is on this card.

   🔴 WHAT SURVIVES IS USUALLY NOTHING, AND SAYING SO IS THE POINT. The failure
   path already cleans up after itself, so most cards have no data to offer and
   the honest line is that nothing was left behind -- not an empty list. The
   case worth a decision is the other one: a finished sweep whose round never
   closed out, leaving reports nothing points at. */
/* `sent` is per card: {key: {act, after, park}} for a write fleet_api
   accepted. The card keeps saying so until a snapshot without the row
   arrives -- the write lands on the shared JSON at once, but THIS page reads a
   published snapshot, and a card that vanished on 202 would claim the
   scheduler had already seen it. */
const FAILSTATE = { open: null, arm: null, said: null, busy: null, sent: {} };

/* key, icon, label, loud, needs arming */
const FAIL_ACTS = [
  ["clear", "\u2713", "Clear this failure", false, true],
  ["retry", "\u21bb", "Retry now", false, true],
  ["count", "\u2261", "Set the count", false, true],
  ["recover", "\u21e9", "Recover the round", false, true],
  ["delete", "\u2715", "Delete the data", true, true],
];

/* \ud83d\udd34 WHAT HAS A ROUTE (2026-09-23). Until today NONE of these did -- every
   Confirm on this card printed "was not sent", Clear included, and Set the
   count had no number to send. fleet_api's POST /failure takes these three.
   Recover and Delete stay unwired ON PURPOSE: both DO something (apply a
   round's parameters; remove reports), and the write endpoint only ever
   leaves a note for the tick loop. See fleet_api's banner. */
const FAIL_WIRED = { clear: true, retry: true, count: true };

/* The ladder, as round_failures.OPERATOR_RUNGS defines it. The picker offers
   exactly these; fleet_api refuses anything else. */
const FAIL_RUNGS = [
  [0, "clear"],
  [1, "retry now"],
  [2, "after one other round"],
  [3, "park"],
];

function failSentLine(s){
  const a = s.after || {};
  const park = s.park === "lifted" ? " The scheduler\u2019s park was lifted with it."
    : s.park === "parked" ? " The scheduler parks it too, so the two agree."
    : "";
  const head = s.act === "clear"
    ? "<b>Cleared.</b> Back in normal rotation."
    : s.act === "retry"
      ? `<b>Retry sent.</b> Due now, at ${esc(a.failures)} failure${
          a.failures === 1 ? "" : "s"}. Due is not first \u2014 what runs is
         still filtered by regime, lease and machine.`
      : `<b>Count set to ${esc(a.failures)}.</b> ${esc(
          (FAIL_RUNGS.find(r => r[0] === a.failures) || [0, ""])[1])}.`;
  return `\u2713 ${head}${park} The scheduler reads it at its next tick;
    this card updates on the next snapshot.`;
}

function failSendError(act, err){
  const what = "<b>" + esc(failActLabel(act)) + "</b>";
  if(err === "read-only")
    return "\u26a0\ufe0f " + what + " was not sent. This page is served from a "
      + "public host and has no route to the Laptop \u2014 the write endpoint "
      + "answers only on the tailnet, to a page served from there. Nothing changed.";
  if(err === "unreachable")
    return "\u26a0\ufe0f " + what + " was not sent \u2014 the Laptop\u2019s write "
      + "endpoint did not answer. It may not be running. Nothing changed.";
  return "\u26a0\ufe0f " + what + " was refused: " + esc(err) + ". Nothing changed.";
}

async function failSend(key, act, n){
  if(!FAIL_WIRED[act]){
    FAILSTATE.said = "\u26a0\ufe0f <b>" + esc(failActLabel(act)) + "</b> was not "
      + "sent. It has no route, on purpose: it does something rather than "
      + "leaving a note, and the write endpoint only leaves notes. Ask for it "
      + "in a session.";
    repaintCards(); return;
  }
  const parts = String(key).split("|");
  const body = {regime: parts[0], bucket_id: Number(parts[1]),
                group_id: parts[2], action: act, by: "app"};
  if(act === "count") body.failures = Number(n);
  FAILSTATE.busy = key; FAILSTATE.said = null;
  repaintCards();
  const res = await apiCall("/failure", body);
  FAILSTATE.busy = null;
  if(res.ok){
    FAILSTATE.sent[key] = {act: act, after: res.out.after, park: res.out.park};
  }else{
    FAILSTATE.said = failSendError(act, res.error);
  }
  repaintCards();
}

function failKey(f){
  return [f.regime, f.bucket_id, f.group_id].join("|");
}
function failActLabel(k){
  const r = FAIL_ACTS.find(x => x[0] === k);
  return r ? r[2] : k;
}
/* The orphans -- reports no round resolves to. `claimed` is the whole join:
   a claimed folder belongs to a round you can already open from Results, so it
   is not a decision and must not be offered as one. */
function failOrphans(f){
  return ((f || {}).data || []).filter(p => p && !p.claimed);
}

function failData(f){
  const rows = (f || {}).data || [];
  if(!rows.length)
    return `<div class="opsnote"><b>Nothing was left behind.</b> An incomplete
      round is cleaned up on the way out \u2014 the pass folder is removed and the
      round counter rolled back, so the retry reuses the same number. There is
      no data here to keep or discard.</div>`;
  return rows.map(p => `<div class="failrow">
      <span class="failp">${esc(p.pass)}</span>
      <span class="failr">${esc(p.reports)} report${p.reports === 1 ? "" : "s"}</span>
      <span class="failc ${p.claimed ? "ok" : "orphan"}">${
        p.claimed ? "attached to a round" : "no round claims it"}</span>
    </div>`).join("") +
    `<div class="opsnote">${failOrphans(f).length
      ? `A sweep that finished whose round never closed out. The reports are
         real \u2014 often days of compute \u2014 and nothing points at them, which is
         what <b>Recover the round</b> re-attaches.`
      : `Every folder here already belongs to a round you can open from Results,
         so there is nothing to decide.`}</div>`;
}

function failPanel(f){
  const key = failKey(f);
  if(FAILSTATE.open !== key) return "";
  const armed = FAILSTATE.arm && FAILSTATE.arm.key === key ? FAILSTATE.arm.act : null;
  const orphans = failOrphans(f).length;

  const sent = FAILSTATE.sent[key];
  const busy = FAILSTATE.busy === key;
  const row = FAIL_ACTS.filter(([k]) =>
      /* Recover and Delete are about DATA, so they appear only when there is
         some. An action with nothing to act on is a control that can only
         disappoint. */
      (k !== "recover" && k !== "delete") || orphans)
    .map(([k, ic, label, loud, needs]) => {
      /* SET THE COUNT CONFIRMS BY CHOOSING THE RUNG. It had one Confirm and
         no number, so even with a route there was nothing to send. Arming it
         now offers the ladder; tapping a rung is the commit. The current rung
         is shown and not offered -- setting it to what it is would be a write
         that changes nothing and says it did. */
      if(armed === k && k === "count")
        return FAIL_RUNGS.map(([n, what]) => n === (f.failures || 0)
          ? `<span class="opsb dim">${n} \u00b7 ${esc(what)} (now)</span>`
          : `<button type="button" class="opsb loud armed" data-failgo="${
              esc(key)}" data-failact="count" data-failn="${n}">${n} \u00b7 ${
              esc(what)}</button>`).join("");
      if(armed === k)
        return `<button type="button" class="opsb loud armed" data-failgo="${
          esc(key)}" data-failact="${esc(k)}">\u2713 Confirm \u2014 ${esc(label)}</button>`;
      return `<button type="button" class="opsb${loud ? " loud" : ""}${
        armed ? " dim" : ""}" data-fail${needs ? "arm" : "go"}="${esc(key)}" data-failact="${
        esc(k)}">${ic} ${esc(label)}</button>`;
    }).join("") + (armed
      ? `<button type="button" class="opsb cancel" data-failcancel>Cancel</button>` : "");

  return `<div class="opsp">
      <div class="opsh">Why it failed</div>
      <div class="opsnote">${f.failed_reason
        ? `${esc(f.failed_reason).replace(/ -- /g, " \u2014 ")}${
            f.failed_on ? ` \u00b7 on <b>${esc(f.failed_on)}</b>` : ""}${
            f.failed_at ? ` \u00b7 ${esc(ago(Date.now() / 1000 - Number(f.failed_at)))}` : ""}`
        : `<b>No reason was recorded.</b> This row predates the app storing one.
           The next failure on this group will say what happened, on which
           machine, and when.`}</div>
      ${f.blocked ? `<div class="opsdis">\u26a0\ufe0f <b>Parked in two places.</b> The
        failure count is one record and the scheduler's own block is another
        \u2014 reason <b>${esc(f.blocked.reason || "unknown")}</b>. Clearing has to
        remove both, or the app and the scheduler disagree about whether this
        group may run.</div>` : ""}

      <div class="opsh">What data exists</div>
      ${failData(f)}

      <div class="opsh">Actions</div>
      ${sent ? `<div class="opsnote">${failSentLine(sent)}</div>`
        : busy ? `<div class="opsnote">Sending\u2026</div>`
        : `<div class="opsrow">${row}</div>`}
      ${armed && !sent && !busy ? `<div class="opsarm">Armed. ${armed === "count"
        ? "Tap a rung to set the count"
        : `Press <b>Confirm</b> to send \u201c${esc(failActLabel(armed))}\u201d`},
        or Cancel.</div>` : ""}
      ${FAILSTATE.said ? `<div class="opsdis">${FAILSTATE.said}</div>` : ""}
      <div class="opsnote"><b>Clear</b> wipes the count and the scheduler's
        third-failure park together, so the group goes back into normal
        rotation. <b>Retry now</b> makes it due without clearing its history
        \u2014 due, not first; a parked group comes back with one life.
        <b>Set the count</b> moves it up or down the three-failure ladder by
        hand.</div>
    </div>`;
}

function renderFailures(){
  if(!FAILURES.length) return "";
  return '<div class="section-label">Failing — needs a look</div>' +
    FAILURES.map(f => {
      const rc = RC[f.regime] || "";
      const n = f.failures || 0;
      const why = f.parked ? "parked after 3 — waiting on you"
        : f.awaiting_other_round ? "one other round runs first, then it retries"
        : "retrying";
      return `
      <article class="card">
        <div class="stripe warn"></div>
        <div class="card-in">
          <div class="top">
            ${f.regime ? `<span class="chip ${rc}">${esc(f.regime)}</span>` : ""}
            ${f.released_by ? `<span class="chip gold">${esc(f.released_by)}</span>` : ""}
            <span class="chip warn">${f.parked ? "PARKED" : "FAILED"}</span>
            <span class="sp"></span>
            <span class="when">${n} failure${n === 1 ? "" : "s"}</span>
          </div>
          <div>
            <div class="title">${esc(humanize(f.group_id) || "Unknown group")}</div>
            <div class="sub">${esc(why)}</div>
            ${/* 🔴 WHAT HAPPENED, AND ON WHICH MACHINE. The count alone cannot
                  tell three broken groups apart from one machine having a bad
                  afternoon -- and the second is the common case: 2026-09-18 put
                  three failures across two regimes on this screen inside
                  fourteen minutes, and the only way to date them was the file
                  mtimes on disk.

                  ABSENT RATHER THAN INVENTED. Rows written before the reason
                  was recorded carry none of this, so the line is simply not
                  drawn. A card that said "unknown" for every old row would be
                  three lines of noise saying nothing. */
              (f.failed_reason || f.failed_at || f.failed_on)
                ? `<div class="failwhy">${
                    /* The publisher keeps these ASCII on purpose -- a reason is
                       printed to a console too, and a cp1252 one raises on an
                       em dash. So the dash is made pretty HERE, where the only
                       consumer is a browser. */
                    f.failed_reason
                      ? esc(f.failed_reason).replace(/ -- /g, " — ")
                      : "no reason recorded"}${
                    f.failed_on ? " · on " + esc(f.failed_on) : ""}${
                    f.failed_at
                      ? " · " + esc(ago(Date.now() / 1000 - Number(f.failed_at)))
                      : ""}</div>`
                : ""}
          </div>
          <button type="button" class="opsopen${
            FAILSTATE.open === failKey(f) ? " on" : ""}" data-failopen="${
            esc(failKey(f))}">
            <span class="opsog">\u2699</span>
            <span class="opsol">${FAILSTATE.open === failKey(f)
              ? "Hide" : "Look into it"}</span>
            <span class="opsoc">${FAILSTATE.open === failKey(f)
              ? "\u2039" : "\u203a"}</span>
          </button>
          ${failPanel(f)}
        </div>
      </article>`;
    }).join("");
}

function renderRounds(){
  if(!FLEET.length) return '<div class="empty">No machines reporting.</div>';
  // Nothing per-machine here any more. "Rounds done by this box" counted a
  // real thing, but not a thing anyone steers by: a ROUND is one group run
  // once, and a group is deliberately re-run (2 consecutive middle wins before
  // a variable can lock), so 26 rounds is 17 groups. The campaign's own unit is
  // GROUPS PER BUCKET, and that belongs to the bucket, not to the box.
  // EVERY machine, not just the ones with a round. A machine that vanishes from
  // this page when it goes idle hides exactly the thing worth knowing -- that is
  // how a manually launched sweep read as a dead Laptop for three hours.
  // AGENTS HANG OFF THE MACHINE THEY SERVE, and the machine says which --
  // `agents.agent_for` is declared BY THE AGENT on its own beacon. The page
  // never infers the relationship: the only other source is the Strategy
  // Tester farm list, which lives on the controller and nothing here reads.
  const under = {};
  FLEET.forEach(f => {
    const who = f.agents && f.agents.agent_for;
    if(who) (under[who] = under[who] || []).push(f);
  });
  const names = new Set(FLEET.map(f => f.machine));
  const card = f => machineCard(fleetWithSeed(f, seedOnMachine(f.machine)));
  // An agent whose controller is not reporting is shown at the TOP LEVEL
  // rather than dropped. A machine that vanishes from this page is the
  // failure this list already exists to prevent.
  const orphan = f => f.agents && f.agents.agent_for
                   && !names.has(f.agents.agent_for);
  return FLEET
    .filter(f => !(f.agents && f.agents.agent_for) || orphan(f))
    .map(f => card(f) + (under[f.machine] || [])
        .map(a => `<div class="agent-of">${agentCard(a)}</div>`).join(""))
    .join("");
}

/* PICK A PASS, ON THE PHONE. Mockup; see the .pick CSS for what does not
   exist behind it yet.

   THE RANKING IS THE ONE UPSTREAM ALREADY COMPUTES -- pick_pass.rank(), the
   same rows notify.format_recommendation prints into the Telegram message.
   Re-ranking here would put two orders for the same report on two surfaces,
   which is the exact failure that module's docstring warns about: "Two numbers
   that differ are two numbers you cannot use."

   SELECTION IS LOCAL AND UNSENT until Apply. The row and the free field are one
   value, not two -- typing clears the row highlight, tapping a row clears the
   field -- because a form that can show a chosen pass AND a different typed one
   at the same time is a form that applies the wrong number eventually. */
let PICKED = {};

function passRow(r, i, key){
  const on = PICKED[key] != null && Number(PICKED[key]) === Number(r.pass);
  return `<button type="button" class="pickrow${on ? " on" : ""}" ` +
    `data-pick="${esc(key)}" data-pass="${esc(r.pass)}">
      <span class="rk">${i + 1}</span>
      <span class="pickme">
        <span class="pickp">pass ${esc(r.pass)}</span>
        <span class="pickm"> · ${esc(r.trades)} trades (${esc(r.per_year)}/yr)</span>
        <div class="pickm">${r.profit >= 0 ? "+" : ""}${esc(r.profit)}</div>
      </span>
      <span class="pickpf">${esc(r.pf)}</span>
    </button>`;
}

function passPick(f){
  const a = f.awaiting_pass;
  if(!a) return "";
  const key = `${f.regime}|${f.bucket_id}|${f.group_id}`;
  const rows = a.rows || [];
  const sel = PICKED[key];
  const typed = sel != null && !rows.some(r => Number(r.pass) === Number(sel));
  return `<div class="pick">
      <div class="pickhd">⏸ Round finished — pick a pass</div>
      <div class="picksub">Nothing is applied until you do. ${esc(a.passes)} passes ran;
        target is ${esc(a.band_low)}–${esc(a.band_high)} trades.</div>` +
    (a.on_cadence === false
      ? `<div class="pickwarn">⚠️ NOTHING landed on-cadence
           (${esc(a.band_low)}–${esc(a.band_high)} trades). These are NEAREST TO
           TARGET instead, so "best PF among on-cadence" is not what ranked
           them.</div>`
      : `<div class="picksub">Best PF among the on-cadence passes:</div>`) +
    rows.map((r, i) => passRow(r, i, key)).join("") + `
      <div class="pickother">
        <label for="pin-${esc(key)}">Or any pass</label>
        <input class="pickin" id="pin-${esc(key)}" type="number" inputmode="numeric"
               min="1" max="${esc(a.passes)}" placeholder="—"
               data-pickin="${esc(key)}" value="${typed ? esc(sel) : ""}">
      </div>
      <button type="button" class="applyb" data-apply="${esc(key)}"
        ${sel == null ? "disabled" : ""}>${
          sel == null ? "Pick a pass to apply" : "Apply pass " + esc(sel)}</button>
      <div class="pickfoot">Applies from the pre-round snapshot and re-runs both
        backtests. Reversible until the next round on this group.</div>
    </div>`;
}

/* ONE MACHINE, ONE CARD. Same reason as seedCard. */
/* ---------- operations: a machine's own controls ----------
   Trevor, 2026-09-18: *"Click on a machine. I want an Operations Badge here."*

   🔴 BEHIND A CHIP, AND THAT IS NOT A SPACE DECISION. `Stop everything` and
   `Kill current job` live in here. A control that ends a seventeen-day round
   must not sit one stray thumb away on a card you are scrolling past.

   🔴 AND ARMED BEFORE IT FIRES. Trevor: *"I want a confirm action. I don't
   want to accidentally click restart. or stop."* The first tap arms one action
   and names it back to you; the second commits. Only ONE can be armed at a
   time, and arming dims the rest -- so a mis-tap while something is armed
   cannot fire a different thing than the one you are reading.

   🔴 PAUSE AND RESUME ARE NOT ARMED, deliberately. They are reversible by
   pressing the other one, and putting a confirm in front of a harmless toggle
   is how people learn to tap through confirms without reading them -- which
   spends the safety exactly where it was needed.

   🔴 THE WORDS ARE THE TRAY'S WORDS. "Pause after current job", not "Pause".
   If the phone and the tray name the same action differently, the person
   holding both has to work out whether they ARE the same action -- and for two
   of these the honest answer is "nearly, but not in when it takes effect". The
   tier and compute ladders are the engine's own tables for the same reason.

   🔴 WITH ONE DELIBERATE EXCEPTION, AND IT IS NOT A RENAME. The tray's "Restart
   current job" starts the whole ROUND again. Trevor, 2026-09-18: *"restart
   actually means Restart, update, and then restart same task. (NOT JOB)"* --
   take the pending update, come back up, and resume at the TASK that was
   running, rather than throwing away the tasks that already finished. A round
   is several tasks and its sweep can be days of them, so restarting the job to
   recover one backtest is not a smaller version of the same action, it is a
   much larger one.

   ⚠️ SO THIS BUTTON HAS NO TRAY ITEM BEHIND IT YET. It is not `restart_current()`
   under a friendlier name, and wiring it to that would do the destructive thing
   while the card promised the careful one. It needs its own supervisor action;
   until then the commit refuses like the rest.

   WHAT IS IN THAT MENU AND DELIBERATELY NOT HERE. Trevor, 2026-09-18: the
   tray's "Restart tray after current job" is *"not necessary anymore"*, and
   "Update after current job" *"already automatically does that"*. Copying them
   onto the phone would put back two controls the machine has stopped needing,
   and a control for something that happens by itself is a control that can only
   confuse the next reader about whether it happened. "Open Strategy Tester"
   opens a window on the machine, which is no use from a phone.

   🔴 NOTHING IS SENT YET, AND THE COMMIT IS WHERE THAT SURFACES. The page is
   https on a public host; the machine's API is plain http on its own network,
   which a secure page may not call. Disabling every button would have hidden
   the arming behaviour that this badge mostly IS, so the buttons work, the
   confirm works, and the commit reports honestly that it went nowhere. */
const OPSTATE = { open: null, arm: null, said: null };

/* The engine's ladders, not this card's -- machine_capabilities.TIERS and
   compute_mode.MODE_LABELS, shown whole with the current rung marked. */
const OPS_TIERS = [
  ["realtick_20000", "Heavy", "real ticks, up to 20,000 passes"],
  ["realtick_8000", "Regular", "real ticks, up to 8,000 passes"],
  ["ohlc_only", "No real ticks", "takes no real-tick work at all"],
];
const OPS_COMPUTE = [
  ["full", "Full", "all cores, normal priority"],
  ["background", "Background", "all cores, idle priority"],
  ["minimum", "Minimum", "one core, idle priority"],
];
/* key, icon, the tray's own label, loud, needs arming */
const OPS_RUN = [
  ["skip", "\u23ed", "Skip this group", false, true],
  ["pause", "\u23f8", "Pause after current job", false, false],
  ["resume", "\u25b6", "Resume", false, false],
  ["restart", "\u21ba", "Restart this task", true, true],
  ["kill", "\u2715", "Kill current job", true, true],
  ["stop", "\u23f9", "Stop everything", true, true],
];

function opsKey(f){
  return [f.machine, f.regime, f.bucket_id, f.group_id].join("|");
}
function opsLabel(k){
  const r = OPS_RUN.find(x => x[0] === k);
  return r ? r[2] : k;
}

/* 🔴 REACHABLE AND WORKING ARE TWO QUESTIONS, and one chip cannot hold both.
   A machine paused on purpose is connected and not running -- neither "Running"
   nor "Not responding" -- and a single three-way chip paints that as broken,
   which is how a deliberate pause gets "fixed" by somebody at 7am. So the link
   is one fact and the work is another, and both are always shown. */
function opsStatus(f){
  const st = stale(f);
  const run = String(f.tray_state || "").toUpperCase();
  /* 🔴 THE PHASE ALREADY SAYS PAUSED, so do not assert "Running" over it.
     job_control has a paused-after-a-phase form, and phaseText renders it with
     the word PAUSED ahead of the phase it stopped in. Prefixing THAT produced
     "Running · " in front of a string beginning "PAUSED" -- the card
     contradicting itself in four words. The PHASE is the authority on what the
     machine is doing; tray_state only adds what a phase cannot express, like
     STOPPED, and a machine on older code sends none at all. */
  const phPaused = String(f.phase || "").toUpperCase().indexOf("PAUSED") === 0;
  let work;
  if(phPaused) work = phaseText(f.phase);
  else if(run === "PAUSED") work = "Paused";
  else if(run === "PAUSING") work = "Pausing after this job";
  else if(run === "STOPPED") work = "Stopped";
  else if(run === "RESTARTING") work = "Restarting";
  else if(running(f)) work = "Running \u00b7 " + phaseText(f.phase);
  else if(picking(f)) work = "Choosing a group";
  else work = "Idle";
  return `<div class="opsst">
      <span class="opsdot ${st ? "bad" : "good"}"></span>${
        st ? "Not responding" : "Connected"}
      <span class="opssep">\u00b7</span><span>${esc(work)}</span>${
      st ? `<span class="opsage">last beat ${esc(ago(f.age_seconds))}</span>` : ""}
    </div>`;
}

/* One ladder, current rung marked. "What is it set to" and "what could it be"
   are the two things you came here for and neither answers the other. */
function opsLadder(rows, current, unknownText){
  const cur = String(current || "").toLowerCase();
  const known = cur && rows.some(r => r[0] === cur);
  return rows.map(([k, label, note]) =>
    `<div class="opsopt${known && k === cur ? " on" : ""}">
       <span class="opsr">${known && k === cur ? "\u25cf" : "\u25cb"}</span>
       <span class="opsl">${esc(label)}</span>
       <span class="opsn">${esc(note)}</span>
     </div>`).join("") +
    (known ? "" : `<div class="opsunk">${esc(unknownText)}</div>`);
}

function opsBadge(f){
  const key = opsKey(f);
  if(OPSTATE.open !== key) return "";
  /* \ud83d\udd34 THE KEY AND THE ACTION TRAVEL IN SEPARATE ATTRIBUTES. They were one
     "key|action" string, and the key is itself machine|regime|bucket|group --
     so splitting on "|" handed the action the REGIME, and confirming "Stop
     everything" reported back "BULL was not sent". Two fields, no delimiter,
     nothing to collide. */
  const armed = OPSTATE.arm && OPSTATE.arm.key === key ? OPSTATE.arm.act : null;

  const runRow = OPS_RUN.map(([k, ic, label, loud, needs]) => {
    if(armed === k)
      return `<button type="button" class="opsb loud armed" data-opsgo="${
        esc(key)}" data-opsact="${esc(k)}">\u2713 Confirm \u2014 ${esc(label)}</button>`;
    return `<button type="button" class="opsb${loud ? " loud" : ""}${
      armed ? " dim" : ""}" data-ops${needs ? "arm" : "go"}="${esc(key)}" data-opsact="${
      esc(k)}">${ic} ${esc(label)}</button>`;
  }).join("") + (armed
    ? `<button type="button" class="opsb cancel" data-opscancel>Cancel</button>` : "");

  return `<div class="opsp">
      ${opsStatus(f)}

      <div class="opsh">Run state</div>
      <div class="opsrow">${runRow}</div>
      ${armed ? `<div class="opsarm">Armed. Press <b>Confirm</b> to send
        \u201c${esc(opsLabel(armed))}\u201d, or Cancel.</div>` : ""}
      ${OPSTATE.said ? `<div class="opsdis">${OPSTATE.said}</div>` : ""}
      <div class="opsnote"><b>Skip this group</b> hands it back and takes the
        next one. <b>Pause</b> waits for the current job to finish \u2014 nothing is
        interrupted. <b>Restart this task</b> takes the pending update and comes
        back up at the <i>task</i> that was running, so the tasks this round has
        already finished are kept. <b>Kill</b> ends the running pass now and
        releases the group so a peer can claim it. <b>Stop everything</b> ends
        the job and the supervisor with it.</div>

      <div class="opsh">This machine</div>
      ${opsLadder(OPS_TIERS, f.tier, "This machine has not reported a tier.")}
      <div class="opsnote">The ceiling on a real-tick sweep. A property of the
        machine, not of the round \u2014 the scheduler reads it when deciding what
        this one may be given.</div>

      <div class="opsh">Compute</div>
      ${opsLadder(OPS_COMPUTE, f.compute_mode,
                  "This machine is not reporting its compute mode yet.")}
      <div class="opsnote">Applied to the running processes, never written into
        MT5 \u2014 reversible in one tap, and the round is unaffected either way.</div>
    </div>`;
}

/* A COMPACT CARD FOR A MACHINE THAT LENDS CORES.

   Deliberately NOT machineCard(). Every field that card leads with --
   regime, bucket, group, percentage -- is empty on an agent, because an
   agent runs no round of its own. Reusing it would draw a machine that
   looks broken. What an agent HAS is: who it serves, how many of its
   cores are lent right now, and why they are or are not running. */
/* SEVEN DAYS OF LENDING, and the reason for the gaps.

   Trevor, 2026-09-21: *"how much time it's running per day, i want to
   monitor if the kids have forgotten to plug thier laptops in."*

   Bars are hours lent, scaled to the busiest day rather than to 24 -- a
   laptop that is only ever home in the evenings would otherwise draw seven
   identical stubs and tell you nothing about which evening it missed.

   NO PERCENTAGE, deliberately. Hours over 24 reads as a score, and a laptop
   at school SHOULD be at zero; the honest facts are the hours and the
   reason, and what counts as good is the reader's call. */
function agentMeter(machine){
  const rows = (AGENTEFF && AGENTEFF[machine]) || [];
  if(!rows.length) return "";
  const days = rows.slice(0, 7).reverse();
  const peak = Math.max(1, ...days.map(r => r.lending_h || 0));
  const bars = days.map(r => {
    const h = r.lending_h || 0;
    const pct = Math.round((h / peak) * 100);
    const top = Object.entries(r.stopped_h || {})
                      .sort((x, y) => y[1] - x[1])[0];
    const tip = `${r.day}: ${h}h lent` + (top ? ` · ${top[0]} ${top[1]}h` : "");
    return `<span class="agbar" title="${esc(tip)}">`
         + `<i style="height:${Math.max(pct, 3)}%"></i></span>`;
  }).join("");
  const today = days[days.length - 1] || {};
  const worst = Object.entries(today.stopped_h || {})
                      .sort((a2, b2) => b2[1] - a2[1])[0];
  return `<div class="agmeter"><div class="agbars">${bars}</div>`
       + `<div class="agnote">${esc(String(today.lending_h || 0))}h today`
       + (worst ? ` · ${esc(worst[0])} ${esc(String(worst[1]))}h` : "")
       + `</div></div>`;
}

function agentCard(f){
  const a = f.agents || {};
  const on = a.state === "RUN";
  const st = stale(f);
  return `
    <article class="card">
      <div class="stripe ${st ? "warn" : "agent"}"></div>
      <div class="card-in">
        <div class="top">
          <span class="chip gold">${esc(f.machine)}</span>
          <span class="chip">${on ? "lending" : "idle"}</span>
          <span class="sp"></span>
          <span class="when">${f.age_seconds != null
            ? "♥ " + esc(ago(f.age_seconds)) : "never reported"}</span>
        </div>
        <div class="sub">${esc(String(a.running == null ? "?" : a.running))} of ${esc(String(a.installed == null ? "?" : a.installed))} core(s) · ${esc(a.why || (on ? "running" : "stopped"))}</div>
        ${agentMeter(f.machine)}
      </div>
    </article>`;
}

/* WHO FED THIS MACHINE, and how much of their potential they delivered.

   Trevor, 2026-09-21: *"I want to know how much Each machine contributed to
   it. And it's efficiency ... how many core's it's thrown out, vs what it
   should have for the amount of time it's been working."*

   Drawn on the CONTROLLER, not the agent: the agent's own card already
   carries its seven-day history, and this is the other question -- what did
   this job actually receive, and from whom.

   THE REASON IS NEVER OMITTED. 25% with `away 20h` is a laptop that went to
   school, which is its job. 25% with `on battery 34h` is a charger nobody
   plugged in. Same number, different meaning -- so the percentage never
   appears on its own.

   AND NEITHER ARE THE INTERRUPTIONS, for a sharper reason: the percentage
   CANNOT SEE THEM. It measures whether a machine was lending, not whether the
   work survived -- so an agent bounced mid-pass loses that pass, the
   controller re-queues it from zero, and the hours spent recomputing it count
   as delivered. 2026-09-21: three tray restarts threw away twelve of one
   agent's in-flight passes and efficiency read 99.8% throughout. The count
   is drawn
   next to the number it contradicts, never folded into it -- pricing a lost
   pass needs a mean pass length nobody measures, and a guessed one would be
   the MT5 ETA mistake with a decimal point. */
function contribCard(machine){
  const rep = AGENTCONTRIB && AGENTCONTRIB[machine];
  if(!rep || !rep.machines || !Object.keys(rep.machines).length) return "";
  const rows = Object.entries(rep.machines)
    .sort((a2, b2) => (b2[1].core_hours || 0) - (a2[1].core_hours || 0))
    .map(([m, v]) => {
      const share = v.share_pct == null ? 0 : v.share_pct;
      const eff = v.efficiency_pct == null ? "-" : v.efficiency_pct + "%";
      const top = Object.entries(v.by_reason || {})
                        .sort((x, y) => y[1] - x[1])[0];
      const ints = v.interruptions || 0;
      const lost = v.cores_interrupted || 0;
      // "up to", deliberately: cores_interrupted counts the cores that were
      // lending, and a core is not certain to have had a pass in flight. An
      // upper bound stated as one is honest; stated as a fact it is a number
      // somebody would plan against.
      const intTxt = ints
        ? `${ints} interruption${ints === 1 ? "" : "s"}`
          + ` · up to ${lost} pass${lost === 1 ? "" : "es"} lost`
        : "";
      return `<div class="cbrow">`
           + `<span class="cbname">${esc(m)}</span>`
           + `<span class="cbbar"><i style="width:${share}%"></i></span>`
           + `<span class="cbnum">${esc(String(v.core_hours))}ch`
           + ` · eff ${esc(String(eff))}</span>`
           + (top ? `<span class="cbwhy">${esc(top[0])} ${esc(String(top[1]))}h</span>` : "")
           + (intTxt ? `<span class="cbint">${esc(intTxt)}</span>` : "")
           + `</div>`;
    }).join("");
  return `<div class="contrib">`
       + `<div class="section-label">Cores received`
       + ` · ${esc(String(rep.total_core_hours))} core-hours</div>`
       + rows + `</div>`;
}

/* ---------- A HALTED MACHINE, EXPLAINED (2026-09-25) ----------
   job_control.halt_summary, off the machine's own beacon: the title, why it
   halted, and numbered steps ending with the REAL path of that machine's halt
   file. The same words the Telegram alert uses, so the phone and the chat
   never describe one halt two ways. */
function haltPanel(h){
  if(!h) return "";
  const since = h.at && isFinite(Date.parse(h.at))
    ? " · since " + ago((Date.now() - Date.parse(h.at)) / 1000) : "";
  return `<div class="haltp">
      <div class="opsh">Why it halted${esc(since)}</div>
      <div class="opsnote">${esc(h.why || h.reason || "")}</div>
      <div class="opsh">What to do</div>
      <ol class="haltsteps">${(h.steps || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      <div class="opsnote">No new rounds start on this machine until then; the
        rest of the fleet keeps working.</div>
    </div>`;
}

function machineCard(f){
    const rc = RC[f.regime] || "";
    const live = running(f);
    const st = stale(f);
    return `
    <article class="card">
      <div class="stripe ${st || f.halt ? "warn" : (live ? rc : "")}"></div>
      <div class="card-in">
        <div class="top">
          ${f.regime ? `<span class="chip ${rc}">${esc(f.regime)}</span>` : ""}
          ${/* THE BUCKET, beside the regime it belongs to. Trevor, 2026-09-16:
                *"add that bucket id on the job tab to the right of BULL."* It
                used to appear only inside the title sentence this card no
                longer has. */
            bktEl(f.bucket_id)}
          <span class="chip gold">${esc(f.machine)}</span>
          ${f.halt ? `<span class="chip warn">HALTED</span>`
            : (f.seed || f.phase)
            ? `<span class="chip">${esc(f.seed ? roundType(f.seed)
                                               : phaseText(f.phase))}</span>` : ""}
          <span class="sp"></span>
          <span class="when">${f.age_seconds != null
            ? "♥ " + esc(ago(f.age_seconds)) : "never reported"}</span>
        </div>
        <div>
          ${/* THE JOB IS THE TITLE. Trevor, 2026-09-16: *"take the 'bull
                1600 round running' line completely out. 'Entry G3 Composite
                Blend Score Gates' takes its place."*

                That line restated the three chips directly above it -- regime,
                round type, and now the bucket -- and spent the card's biggest
                type on them, leaving the one thing unique to this job in the
                small grey sub-line underneath. The chips already say BULL, 1600
                and the sweep; what they cannot say is WHICH GROUP.

                A SWEEP'S OWN NAME STILL WINS over the group it sweeps: on an
                A/B the arm is the whole point, and two arms over one group are
                two jobs that differ only in their label. */""}
          <div class="title">${f.halt ? esc(f.halt.title) : live
            ? esc((f.seed && f.seed.label) || humanize(f.group_id))
            : picking(f) ? "No group picked yet"
            : "Idle — no round"}</div>
          ${/* ONLY WHAT THE TITLE DID NOT SAY. The group used to live here
                and is now the title, so repeating it would be the same string
                twice. A LABELLED SWEEP is the one case with something left
                over: its label is the title, so the group it sweeps comes
                here instead of being lost. */
            live && f.seed && f.seed.label && f.group_id
              ? `<div class="sub">${esc(humanize(f.group_id))}</div>` : ""}
        </div>
        ${haltPanel(f.halt)}
        ${f.halt ? "" : picking(f)
            /* Picking writes no group, no mode and no percent, so this row is
               otherwise empty and the card has nothing to say at all. How long
               it has been choosing is the one fact that exists. */
            ? metaRow([["Selecting for", phaseFor(f)]])
            : metaRow([["Mode", f.mode === "real_ticks" ? "Real Ticks"
                      : f.mode === "ohlc" ? "OHLC" : null, "gold"],
                   ["Rate", f.pct_per_hour != null
                      ? f.pct_per_hour.toFixed(1) + " %/h" : null],
                   /* 2026-09-17 (Trevor): "beside ETA, I want the time that
                      the task started." BESIDE means beside: the two sit
                      together, started first, so the row reads "began at X,
                      lands at Y".

                      AND THAT IS WHY `Jobs done` MOVED BEHIND THEM. Six cells
                      wrap at 375px, and with Started left where Jobs done had
                      been the tier broke exactly between Started and ETA --
                      the one seam this change exists to close. Started is a
                      narrower cell than Jobs done ("00:24" against "10 of 28"),
                      so the pair fits the first tier in the width the old
                      four-cell row was already tuned to.

                      `phase_since` is the transition stamp job_control writes
                      as the phase is written -- the same field "In phase"
                      already counts from, shown as a clock time rather than a
                      duration. A machine on older code sends none and metaRow
                      drops the cell, which is why this needs no guard. */
                   ["Started", fmtStarted(f.phase_since)],
                   ["ETA", fmtEta(etaAt(f))],
                   ["Jobs done", jobsDone(f.regime, f.bucket_id)],
                   ["In phase", phaseFor(f)]])}
        ${progressBar(f, rc)}
        ${passPick(f)}
        ${(f.seed && (f.seed.variables || []).some(v => v && v.min != null))
            ? sweptList(f.seed.variables, f.seed.cells)
            : varList(f.variables, liveStates(f))}
        ${st ? `<div class="warnrow"><span>⚠️</span><span>` +
          `Last reported ${esc(ago(f.age_seconds))} — the beacon is stale, ` +
          `so this page cannot say what it is doing now.</span></div>` : ""}
        ${/* OPERATIONS, ON EVERY MACHINE AND NOT ONLY A RUNNING ONE. The three
              buttons that used to sit here were live-and-inert and rendered only
              while `live`, so a machine that had stopped -- the one you most want
              to reach -- offered nothing at all.

              TO OHLC AND TO TICKS ARE GONE. Trevor, 2026-09-18: *"We actually
              don't have any OHLC anymore anyway."* A control that switches a
              round into a mode no group runs in can only ever be wrong. Old
              rounds still READ as OHLC where they ran and the tier ladder keeps
              its no-real-ticks rung, because those are a record and a setting
              rather than an action. */
          /* 🔴 IT OPENS STOP EVERYTHING, SO IT CANNOT LOOK LIKE A FILTER.
             Trevor, 2026-09-18: *"still no setting badge"* -- and he was on the
             current build, with the control rendering, on screen, unscrolled.
             It was a `.gch` chip: 0.6rem, faint grey, hairline border, the same
             shell the metric-GROUP filters wear -- sitting at the foot of a card
             under a loud amber beacon warning. Every other way into a badge on
             that screen is a full-width card with a title, so the eye reads this
             one as leftover furniture and slides past it.

             THE PASS TABLE'S CHIP IS NOT A PRECEDENT for it, which is where I
             got this wrong: that chip sits INSIDE a badge that has already
             announced itself with a heading. This one is the announcement. */
          `<button type="button" class="opsopen${
            OPSTATE.open === opsKey(f) ? " on" : ""}" data-opsopen="${esc(opsKey(f))}">
             <span class="opsog">⚙</span>
             <span class="opsol">${OPSTATE.open === opsKey(f)
               ? "Hide operations" : "Operations"}</span>
             <span class="opsoc">${OPSTATE.open === opsKey(f)
               ? "‹" : "›"}</span>
           </button>`}
        ${contribCard(f.machine)}
        ${opsBadge(f)}
      </div>
    </article>`;
}

/* ---------- page: results ---------- */
/* ONE FINISHED JOB: its tasks, its reports, its graphs. Built by handing the
   ledger row's own `reports` block to renderTimeline -- the SAME renderer the
   running job uses, so a task looks and behaves identically whether the job
   finished five minutes ago or five days ago, and the task card comes along
   with it for free. */
/* First report to last, worded so it cannot be read as a stopwatch. "" when
   a job has fewer than two reports, because one timestamp is not a span. */
function jobSpan(tasks){
  const ts = (tasks || []).map(t => Date.parse(t.at || "")).filter(v => !isNaN(v));
  if(ts.length < 2) return null;
  /* hm(), not ago(): this is a SPAN, and ago() appends "ago" -- which turned a
     seven-hour job into "7.0h ago", a different and untrue statement. */
  return hm(Math.round((Math.max.apply(null, ts) - Math.min.apply(null, ts)) / 1000));
}

/* The variable states a finished job left behind. "" when no task carried
   any, which is every job whose reports never resolved. */
function jobVariables(rep, openTask){
  const tasks = (rep || {}).tasks || [];
  /* "WHERE THEY STAND" IS A LIVE QUESTION. Since 2026-09-23 a finished sweep
     carries its OWN states (or none, if it predates the record), so the last
     task with a list is no longer necessarily the bucket as it is now. Prefer
     the last LIVE list -- a backtest's -- and fall back to any list only on a
     job that has no live one yet. A snapshot from before `states_at` existed
     has no such field on any task, which reads as live, exactly as before. */
  let vars = null, live = null;
  tasks.forEach(t => {
    const d = t.detail || {};
    const v = d.variables;
    if(!(v && v.length)) return;
    vars = v;
    if(!d.states_at || d.states_at === "live") live = v;
  });
  vars = live || vars;
  if(!vars) return "";
  /* THE GRAPH FOLLOWS THE CHIP AT THE TOP. On a sweep there is nothing to plot
     that the card is not already showing, so the badge falls back to the plain
     list and the names stop being buttons -- see isBacktest. */
  const hist = isBacktest(openTask)
    ? ((rep || {}).variable_history || null) : null;
  /* 2026-09-17 -- THE FIVE-STATE GLOSSARY IS OFF THIS BADGE. Trevor: *"Take the
     Lower explanation section out. Here's where I want a graph to show up."*
     It was five paragraphs restating what the chips already say in colour, and
     it sat exactly where the history belongs. `taskStateKey` is untouched and
     still runs on the task card, so the vocabulary is still explained
     somewhere -- it just stops being explained twice on one screen. */
  return `<div class="card"><div class="card-in">
      <div class="tlab">Variables — where they stand</div>` +
      taskVars(vars, hist) +
      /* THE HISTORY DRAWS IN THE GRAPH BADGE AT THE TOP, not here -- see
         graphBadge. What stays is the list, which is what this badge is for:
         where every variable STANDS. The buttons are the control; the picture
         they drive lives with every other picture on the card. */
      (hist && VHSTATE.on.length
        ? `<div class="vhwrap"><div class="vhempty">${VHSTATE.on.length} drawing
             in the graph at the top of the card.</div></div>`
        : hist
          ? `<div class="vhwrap"><div class="vhempty">Tap a variable to draw its
               history in the graph at the top. Several can share it.</div></div>`
          : "") +
      `</div></div>`;
}

/* ---------- THE JOB CARD SCHEMA ----------
   Trevor, 2026-09-17: *"Job card has a full version and a condensed version. The
   condensed version is what I want to see on the home screen. The full version
   is whenever I click on a Job, I see the job in the same way as the results tab
   works."*

   ONE DEFINITION, TWO DENSITIES -- which is the whole point of writing it down as
   a schema. The home screen used to hand-build its own compact row, so the two
   drifted the moment either changed: the badge showed a bucket PF the results
   card had reformatted, and it opened jobs the results list refuses to open.
   Every part of the card is now declared once and the density decides what is
   drawn, never a second copy of the markup.

   WHAT CONDENSED DROPS, and it is a list, not a judgement call:

       Round number    the home screen is not a ledger index
       Pass picked     a decision you inspect, not one you scan past
       Passes          the size of a search you are not looking at yet

   All three are answers you go to the FULL card for. What survives is what
   decides whether to open it at all: which regime and bucket, which group, how
   the PF moved, and how recently. Mode and Took stay because they qualify the PF
   beside them -- an OHLC number and a real-tick number are not comparable, and a
   two-hour job and a three-day job are different claims about the same delta. */
const JOB_META_CONDENSED = ["Mode", "Took"];

function jobCard(r, rep, condensed, hint, cadence){
  const rc = REGIME_CLASS[r.regime] || "";
  rep = rep || {};
  const cells = [
    ["Round", "r" + r.round_no],
    ["Pass picked", r.picked_pass ?? null],
    ["Mode", r.ticks_mode === "real_ticks" ? "Real Ticks"
           : r.ticks_mode === "ohlc" ? "OHLC" : null, "gold"],
    ["Passes", passesText(r)],
    /* THE JOB'S OWN SPAN -- first report to last. Same evidence and the same
       caveat as a task's: it is the gap between reports, so it misses whatever
       ran before the first one. */
    ["Took", jobSpan(rep.tasks)],
  ].filter(c => !condensed || JOB_META_CONDENSED.indexOf(c[0]) >= 0);

  const pfBlock = (lab, before, after) =>
    `<div>
       <div class="lab">${esc(lab)}</div>
       <div class="pf"><b>${before ?? "\u2014"}</b>\u2192<b>${after ?? "\u2014"}</b>
         ${deltaEl(before, after)}</div>
     </div>`;

  return `<article class="card${condensed ? " jc-sm" : ""}">
      <div class="stripe ${esc(rc)}"></div>
      <div class="card-in">
        <div class="top">
          ${r.failed ? `<span class="chip warn">FAILED</span>`
            : r.regime ? `<span class="chip ${esc(rc)}">${esc(r.regime)}</span>` : ""}
          ${bktEl(r.bucket_id)}
          <span class="chip gold">${esc(r.machine)}</span>
          ${r.seeded ? `<span class="chip gold">SEED</span>` : ""}
          <span class="sp"></span>
          <span class="when">${esc(fmtWhen(r.recorded_at))}</span>
          ${condensed ? `<span class="hcar">\u203a</span>` : ""}
        </div>
        <div><div class="title">${esc(humanize(r.group_id))}</div></div>
        ${metaRow(cells)}` +
        /* A FAILED ROUND HAS NO PF TO SHOW and must not print a pair of dashes
           where two measurements belong -- "it did not finish" and "it finished
           at nothing" are different statements. The reason takes the space. */
        (r.failed
          ? `<div class="sub" style="padding:0">${
               esc(r.fail_reason || "no reason recorded")}</div>`
          : `<div class="row-pf">
               ${pfBlock("Bucket PF", r.bucket_pf_before, r.bucket_pf_after)}
               ${pfBlock("Portfolio PF", r.pf_before, r.pf_after)}
             </div>`) +
        /* THE HINT IS THE CALLER'S, NOT THE CARD'S. It said "opens the results
           list" for ANY unopenable condensed card -- which reads as nonsense ON
           the results list, where that is where you already are. Only the home
           badge knows its tap goes somewhere else, so only it says so. */
        (hint ? `<div class="jc-note">${esc(hint)}</div>` : "") +
        /* THE TRADE BAND LIVES IN THE CARD NOW. Trevor, 2026-09-17: *"Insert the
           Trade Band inside the uncondensed Job card."* It used to render bare
           between the card and the badge below it -- a heading and two lines
           floating on the page background, which read as something half-drawn.

           STILL ONLY FOR A SWEEP, per the earlier call that it belongs with the
           search rather than with a result: the caller passes a cadence only
           when the open chip is one, so a backtest's card shows none. */
        (cadence && !condensed
          ? `<div class="tsec" style="margin-top:2px">
               <div class="tlab">Trade band</div>` + taskBand(cadence) + `</div>`
          : "") + `
      </div>
    </article>`;
}

function renderResultsJob(r){
  if(!r) { RESULTS_JOB = null; return renderResultsList(); }
  const rc = REGIME_CLASS[r.regime] || "";
  const rep = r.reports || {};
  const back = '<button type="button" class="backbtn" data-rjob="">' +
               '\u2039 All jobs</button>';
  /* THE TASKS, AT THE VERY TOP. One chip per task this job ran, in the order it
     ran them, each opening that task's card below. This replaces the rounds
     list that used to sit at the BOTTOM: the same information, reachable in one
     tap instead of a scroll, and only one card on screen at a time. */
  const tasks = rep.tasks || [];
  const open = Math.min(RESULTS_TASK_OPEN, Math.max(0, tasks.length - 1));
  const chips = tasks.length
    ? `<div class="rctl">` + tasks.map((t, i) =>
        `<button type="button" class="cchip${i === open ? " on" : ""}"
           data-rtask="${i}">${esc(phaseText(t.kind))}</button>`).join("") +
      `</div>`
    : "";
  /* The pass number comes off the folder, which is the only place it exists for
     a finished job -- `round_no` is a fleet-wide counter, not this. */
  const pass = String(rep.rel_dir || "").split("/").filter(Boolean).pop() || null;
  /* The task chips sit between the back button and the job -- Trevor: *"Right
     below (Back All Jobs)."* */
  /* A SWEEP'S BAND, and only a sweep's -- see the note in jobCard. */
  const openTask = tasks[open];
  const band = (openTask && !isBacktest(openTask) && openTask.detail)
    ? openTask.detail.cadence : null;
  return back + chips + jobCard(r, rep, false, null, band) +
    /* THE VARIABLES, BELOW THE PF AND ABOVE THE BUTTONS. Trevor, 2026-09-16:
       *"I want the Variables and their status info in here right below the PF
       numbers, above the Reports."*

       TAKEN FROM THE LAST TASK THAT HAS ANY. A job's tasks narrow as it runs --
       the second pass sweeps fewer than the first -- and the LAST one to carry a
       list is the backtest, which carries the group entire with every state as
       it stands once the job is done. That is the right thing on a card about a
       FINISHED job: not what was swept, but where everything ended up. */
    /* NO TASK PANEL HERE. It carried the chip's own header, how long it ran,
       the pass it picked and its trade band, and Trevor took it out on
       2026-09-17: the Information badge above already names the job and the
       chips already say which task you are on, so it was a third header on one
       screen. ⚠️ THE TRADE BAND AND THE SEED REASON WENT WITH IT -- neither has
       another home on this card yet, and both are worth one.
       `taskPanel` itself is untouched: the Active tab still uses it. */
    /* WHY, FIRST. Trevor, 2026-09-18: *"If it was an optimize, I want the
       Optimize badge under it. If it was a bucket or backtest, I want those
       badges displayed also."* -- so the explanation leads and the kind-specific
       set follows, whichever set that is. It is job-level, not task-level: the
       seed explains why the whole job exists, so it does NOT change with the
       chip, the same rule the Information badge above it follows. Read off the
       first task for that reason, not off `tasks[open]`. */
    whyBadge(tasks.length ? tasks[0] : null, r) +
    /* THE PER-CHIP BADGES. The panel above carries what belongs to the TASK
       and nothing else -- its header, what it picked, its trade band -- and
       these three carry the rest. A sweep gets its own badge instead, because
       none of the three says anything true about a grid. */
    (tasks.length && isBacktest(tasks[open])
      ? equityBadge(tasks[open], rep) +
        graphBadge(tasks[open], rep) + jobVariables(rep, tasks[open]) +
        metricsBadge(tasks[open]) + slopeBadge(tasks[open]) +
        sessionBadge(tasks[open])
      : tasks.length
        /* THE GRAPH BADGE RIDES A SWEEP TOO. It was backtest-only, so a response
           curve had nowhere to draw -- the chip toggled and the page did
           nothing. On a sweep it renders ONLY when a curve is on: there are no
           metrics behind it to fall back to, so it is absent the rest of the
           time rather than empty. */
        ? graphBadge(tasks[open], rep) +
          /* How many non-backtest tasks the job has reached, this one included. */
          optimizeBadge(tasks[open],
            tasks.slice(0, open + 1).filter(x => !isBacktest(x)).length) +
          nextRoundBadge(tasks[open])
        : "") +
    (tasks.length ? graphFull(tasks[open], rep) : "") +
    /* NOTHING BEHIND THE HEADER IS A REAL STATE, and it needs saying rather than
       showing as a card that simply stops. The round happened -- its PF moved and
       the ledger recorded it -- but nothing tied its report folder to it, so
       there are no tasks to open and no metrics to read. */
    (tasks.length ? "" : `<div class="card"><div class="card-in">
        <div class="tlab">No reports linked</div>
        <div class="soon">This round is in the ledger and its PF is above, but no
          report folder was matched to it \u2014 so there are no tasks, no metrics
          and no graphs to show. Rounds recorded before the pass number was
          written on the row are the usual reason.</div>
      </div></div>`) +
    (rep.exact === false
      ? `<div class="inexact">⚠️ These reports were matched to this round <b>by
           order</b>, not by key — it ran before the pass number was recorded on
           the row. They are almost certainly this round's, and this page will
           not claim more than that.</div>`
      : "");
}

/* ONE TASK, OPEN, WITH ITS OWN HEADING. The expanding panel inside a timeline
   row got its name and time from the row above it; standing alone it has to
   carry them itself -- plus the report buttons, which used to live on that row.

   `ran` is the gap back to the previous task's report, which is the only
   durable evidence of how long anything took -- see app_snapshot
   ._attach_task_elapsed. The FIRST task of a job has no predecessor and says
   so rather than showing a number derived from another job. */
function taskPanel(t, relDir, lift){
  if(!t) return "";
  const d = t.detail || {};
  const ran = d.elapsed_seconds;
  return `<div class="tpanel">
      <div class="tphead">
        <span class="tpk">${esc(phaseText(t.kind))}</span>` +
        (t.at ? `<span class="tpw">${esc(fmtWhen(t.at))}</span>` : "") +
        `<span class="sp"></span>` +
        (ran != null ? `<span class="tpran">ran ${esc(hm(ran))}</span>`
                     : `<span class="tpran none">run time not recorded</span>`) +
      `</div>` +
      /* 2026-09-17 -- THE FIVE REPORT BUTTONS ARE GONE FROM HERE. The job
         workbook above the graphs carries every artifact they opened, for every
         task at once, so a per-task strip repeated the whole job once per task.
         The Active tab's timeline keeps its buttons: a RUNNING job is the case
         where you may want one raw artifact before the job is done.

         A parallel session restored the strip here on 2026-09-17; Trevor:
         *"NO, i want your render."* Removed again. If the strip is ever wanted
         back it is one line -- `reportButtons(t, relDir) +` right here. */
      /* NO GRAPH HERE ON THIS PAGE. This used to say "jobGraphs above already
         drew every curve" -- that pair of balance curves at the foot of the job
         card was deleted on 2026-09-17, so nothing draws one here now. The task
         card keeps drawing its own everywhere else, so the Active tab is
         unchanged. */
      taskCard(t, relDir, true, true, lift) + `</div>`;
}

/* DOES THIS ROUND OPEN INTO A JOB CARD. Extracted 2026-09-17 because the home
   screen's review badge has to answer the SAME question: it was opening jobs the
   results list refuses to open, landing on an Information card with nothing under
   it and a back button -- a destination that exists nowhere else in the app.
   Trevor: *"when i click on that job i want it to take me to the same place as
   the results tab has."* One function, so the two cannot drift. */
function hasJobCard(r){
  return !!(r && r.reports && (r.reports.tasks || []).length);
}

function renderResultsList(){
  const rows = resultsRows().map(r => {
    const rc = REGIME_CLASS[r.regime] || "";
    /* THE WHOLE ROW OPENS THE JOB, and only when there is a job to open. A
       row whose reports never resolved has no tasks behind it, so it stays an
       inert card rather than a button that does nothing. */
    /* EVERY ROW OPENS NOW. It used to be a button only when reports had
       resolved, which left inert cards in the list and a condensed card whose
       behaviour depended on data the reader could not see. The full card carries
       the Information badge whatever else is missing, and says what is missing --
       that is a destination; an unclickable row is not. */
    /* 🔴 NOTHING INTERACTIVE MAY GO INSIDE THIS ROW. It is a <button>, and a
       button inside a button is invalid HTML: the parser CLOSES the outer one
       where the inner starts, so the rest of the row falls out of it and renders
       full-width underneath. That is what the report buttons did here -- they
       looked stacked because the row had been torn open around them, not
       because of any style.

       They belong on the detail card anyway. Trevor, 2026-09-16: *"The Results
       tab itself won't have the reports on it, Just the Bucket pf and Portfolio
       PF, along with the round counter, machine id, mode and pass picked."* */
    /* THE SAME CONDENSED CARD THE HOME SCREEN SHOWS. Trevor, 2026-09-17: *"The
       Results tab also has all the condensed Job cards."* This used to be its own
       hand-built row -- a second layout for the same record, which is how the
       home badge and this list came to disagree about what a job looks like.

       \u26a0\ufe0f THIS DROPS THE ROUND NUMBER AND THE PASS PICKED from the list, which
       the 2026-09-16 row spec put there on purpose ("the round counter, machine
       id, mode and pass picked"). Superseded deliberately: those are full-card
       facts now, one tap away, and the condensed card is the same everywhere or
       it is not a schema. `heavy` went the same way.

       The SHELL keeps every attribute -- what opens, what is filtered, what gets
       scrolled to -- and the card keeps every pixel. */
    return `<button type="button" class="jrow" data-rrow="${esc(r.round_no)}"
        data-rjob="${esc(r.round_no)}">` +
      jobCard(r, r.reports, true) + `</button>`;
  }).join("") ||
    /* NARROWED TO NOTHING is not the same as having no results, and the
       difference is one tap away. */
    `<div class="empty">No rounds match this filter.<br><br>` +
    `Tap a chip above to widen it.</div>`;
  // "completed" has to mean completed. Counting every row here while the
  // machine cards count only finished ones would put two different totals for
  // the same thing on two tabs of one app.
  const shown = resultsRows();
  const nf = shown.length - shown.filter(completed).length;
  const buckets = resultsBuckets();
  /* "newest first" WAS TEXT AND IS NOW A CONTROL. Trevor: *"Where it currently
     says NEWEST FIRST, i want that to be a button chip also."* Same words, same
     place -- it simply does something now. */
  return `<div class="section-label">${shown.filter(completed).length} completed` +
    (nf ? ` · ${nf} failed` : "") + `</div>
    <div class="rctl">
      <span class="rlab">Show</span>
      <button type="button" class="cchip${RESULTS_SORT === "oldest" ? " on" : ""}"
        data-rfilter="sort">${RESULTS_SORT === "oldest" ? "Oldest first"
                                                        : "Newest first"}</button>
      <button type="button" class="cchip${RESULTS_REGIME ? " on" : ""}"
        data-rfilter="regime">${esc(RESULTS_REGIME || "All regimes")}</button>` +
    (buckets.length > 1 || RESULTS_BUCKET != null
      ? `<button type="button" class="cchip${RESULTS_BUCKET != null ? " on" : ""}"
           data-rfilter="bucket">${RESULTS_BUCKET != null
             ? "Bucket " + esc(RESULTS_BUCKET) : "All buckets"}</button>`
      /* ONE BUCKET IS NOT A CHOICE. Hiding the control until a split gives it
         something to cycle through keeps a dead button off the screen. */
      : "") +
    (resultsMachines().length > 1 || RESULTS_MACHINE
      ? `<button type="button" class="cchip${RESULTS_MACHINE ? " on" : ""}"
           data-rfilter="machine">${esc(RESULTS_MACHINE || "All machines")}</button>`
      : "") +
    (resultsTasks().length > 1 || RESULTS_TASK
      ? `<button type="button" class="cchip${RESULTS_TASK ? " on" : ""}"
           data-rfilter="task">${RESULTS_TASK ? esc(phaseText(RESULTS_TASK))
                                              : "All tasks"}</button>`
      : "") + `
    </div>` + rows;
}

/* The tab itself: the list, or the one job that is open. */
function renderResults(){
  if(RESULTS_JOB == null) return renderResultsList();
  const r = LEDGER.find(x => String(x.round_no) === String(RESULTS_JOB));
  return renderResultsJob(r);
}

/* ---------- shell ---------- */

// The gist id is deliberately NOT in this repo. It arrives in the URL
// fragment -- https://twiens99.github.io/goldbot-app/#g=<id> -- and browsers
