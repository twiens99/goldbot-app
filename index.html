<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without the viewport tag a phone renders this at desktop width and scales
     it down -- unreadable. Both of these were supplied by the artifact wrapper
     during design; served raw from Pages there is no wrapper. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1016">
<meta name="color-scheme" content="dark">
<!-- Add to Home Screen: launch without browser chrome. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GoldBot">
<meta name="robots" content="noindex, nofollow">
<title>GoldBot Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">

</head>
<body>
<style>
/* The app commits to one visual world -- a dark instrument panel -- rather than
   following the host theme, because that is what it will be as an APK. */
:root{
  --bg:#0A1016;
  --card:#141E26;
  --card-2:#1B2933;
  --line:#22313C;
  --text:#E8EFF3;
  --dim:#8CA0AC;
  --faint:#5F727E;
  --gold:#E0B457;
  --tonal:#1D3244;
  --warn:#E08B4A;
  --bad:#E0685A;
  --good:#5FBE95;
  --bull:#5FBE95;
  --bear:#E0685A;
  --range:#6FA8D4;
}

*{box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}

/* ---------- header ---------- */
header{
  padding:16px 16px 12px;
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;
  position:sticky;top:0;background:var(--bg);z-index:5;
}
.h-row{display:flex;align-items:baseline;gap:9px;}
h1{
  margin:0;font-size:1.2rem;font-weight:700;letter-spacing:-.02em;
}
.h-sub{font-size:.76rem;color:var(--dim);}
.stamp{
  font-size:.68rem;color:var(--faint);
  font-family:"Roboto Mono",ui-monospace,monospace;
}
.baked{
  margin-top:7px;
  font-size:.7rem;color:var(--warn);
  background:rgba(224,139,74,.1);
  border:1px solid rgba(224,139,74,.25);
  border-radius:6px;padding:5px 8px;
  line-height:1.4;
}

/* ---------- pages ---------- */
main{flex:1;padding:14px 14px 90px;display:flex;flex-direction:column;gap:12px;}
.page[hidden]{display:none;}
.page{display:flex;flex-direction:column;gap:12px;}

.section-label{
  font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--faint);
  margin:4px 0 -4px 2px;
}

/* ---------- card ---------- */
.card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.stripe{height:3px;background:var(--gold);}
.stripe.bull{background:var(--bull);}
.stripe.bear{background:var(--bear);}
.stripe.range{background:var(--range);}
.stripe.warn{background:var(--warn);}
.card-in{padding:13px 14px 14px;display:flex;flex-direction:column;gap:11px;}

.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.sp{flex:1;}
.chip{
  font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;
  background:var(--tonal);color:#9CC6E8;white-space:nowrap;
}
.chip.gold{background:rgba(224,180,87,.15);color:var(--gold);}
.chip.warn{background:rgba(224,139,74,.16);color:var(--warn);}
.chip.bull{background:rgba(95,190,149,.14);color:var(--bull);}
.chip.bear{background:rgba(224,104,90,.14);color:var(--bear);}
.chip.range{background:rgba(111,168,212,.14);color:var(--range);}
.when{font-size:.69rem;color:var(--faint);font-family:"Roboto Mono",ui-monospace,monospace;}

.title{font-size:1rem;font-weight:700;letter-spacing:-.012em;line-height:1.25;}
.sub{font-size:.83rem;color:var(--dim);margin-top:1px;}

.meta{
  display:flex;gap:13px;flex-wrap:wrap;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:9px 0;font-size:.775rem;
  font-variant-numeric:tabular-nums;
}
.meta .k{color:var(--faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;}
.meta .v{color:var(--text);font-weight:600;}
.meta .v.gold{color:var(--gold);}
.meta div{display:flex;flex-direction:column;gap:1px;}

/* progress */
.prog{display:flex;flex-direction:column;gap:6px;}
.prog-top{display:flex;justify-content:space-between;font-size:.76rem;}
.prog-top .pct{font-weight:700;font-variant-numeric:tabular-nums;}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:3px;background:var(--gold);}
.bar i.bull{background:var(--bull);}
.bar i.bear{background:var(--bear);}
.bar i.range{background:var(--range);}

/* variable list */
.vars{display:flex;flex-direction:column;gap:3px;}
.vhead{
  font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700;margin-bottom:3px;
}
.v{
  font-family:"Roboto Mono",ui-monospace,monospace;
  font-size:.755rem;color:var(--text);
  word-break:break-all;line-height:1.45;
  display:flex;align-items:center;gap:7px;
}
.sv{display:flex;flex-direction:column;gap:1px;}
.sv .spec{
  color:var(--dim);font-size:.7rem;letter-spacing:.01em;
  word-break:normal;
}
.v::before{
  content:"";width:3px;height:3px;border-radius:50%;
  background:var(--faint);flex:none;
}
.v.rider{color:var(--gold);}
.v.rider::before{background:var(--gold);}

.warnrow{
  font-size:.78rem;color:var(--warn);line-height:1.42;font-weight:500;
  display:flex;gap:7px;align-items:flex-start;
}
.noterow{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:.75rem;color:var(--dim);cursor:pointer;
  border-top:1px solid var(--line);padding-top:9px;
}
.noterow .car{color:var(--faint);font-size:.7rem;}
.notebody{
  font-size:.755rem;color:var(--dim);line-height:1.5;
  border-left:2px solid var(--line);padding-left:10px;
}
.notebody[hidden]{display:none;}

.acts{display:flex;gap:7px;flex-wrap:wrap;}
.acts button{
  font-family:inherit;font-size:.775rem;font-weight:600;
  border-radius:18px;padding:8px 14px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);
}
.acts button.primary{background:var(--gold);color:#121A22;border-color:transparent;}
.acts button:active{transform:translateY(1px);}

/* ---------- results rows ---------- */
.row{
  background:var(--card);
  border-radius:11px;
  padding:11px 12px;
  display:flex;flex-direction:column;gap:7px;
}
.row-top{display:flex;align-items:center;gap:7px;}
.row-grp{
  font-size:.85rem;font-weight:600;letter-spacing:-.005em;
  flex:1;min-width:0;line-height:1.3;
}
.row-when{font-size:.67rem;color:var(--faint);font-family:"Roboto Mono",ui-monospace,monospace;white-space:nowrap;}
.row-pf{
  display:flex;gap:16px;font-size:.75rem;
  font-variant-numeric:tabular-nums;
}
.row-pf .lab{color:var(--faint);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;}
.pf{display:flex;align-items:baseline;gap:5px;}
.pf b{font-weight:600;}
.delta{font-weight:700;font-size:.73rem;}
.delta.up{color:var(--good);}
.delta.dn{color:var(--bad);}
.delta.flat{color:var(--faint);}
.row-foot{
  display:flex;gap:12px;font-size:.68rem;color:var(--faint);
  font-family:"Roboto Mono",ui-monospace,monospace;
}

.empty{
  color:var(--faint);font-size:.85rem;text-align:center;
  padding:40px 20px;line-height:1.6;
}

/* ---------- tab bar ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,16,22,.96);
  border-top:1px solid var(--line);
  display:flex;
  max-width:460px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(8px);
}
nav button{
  flex:1;background:transparent;border:0;cursor:pointer;
  padding:10px 4px 12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:inherit;font-size:.68rem;font-weight:600;
  color:var(--faint);letter-spacing:.01em;
}
nav button .ic{font-size:1.05rem;line-height:1;}
nav button[aria-selected="true"]{color:var(--gold);}
nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-3px;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div class="app">
  <header>
    <div class="h-row">
      <h1>GoldBot</h1>
      <!-- Placeholder only, and deliberately NOT a plausible figure. The mockup
     numbers that used to sit here were read back as a measurement and quoted
     onward as one. The real figure is computed in paint(). -->
      <span class="h-sub" id="hsub">…</span>
    </div>
    <div class="stamp" id="stamp"></div>
    <div class="baked" id="banner" hidden></div>
  </header>

  <main>
    <section class="page" id="page-rounds"></section>
    <section class="page" id="page-results" hidden></section>
  </main>

  <nav role="tablist">
    <button role="tab" aria-selected="true" data-p="rounds"><span class="ic">▶</span>Rounds</button>
    <button role="tab" aria-selected="false" data-p="results"><span class="ic">✓</span>Results</button>
  </nav>
</div>

<script>
const EPOCH = "V3.0.0";

// NO DATA IS BAKED INTO THIS REPO. The repo is public (GitHub Pages requires
// that on a free account), and anything committed here is in the git history
// permanently -- deleting a file later does not remove it. Performance figures
// and group/variable names are "how it is built", which is the half Trevor
// wants private: people should copy the ACCOUNT, not rebuild the system.
let FLEET = [], LEDGER = [], SEEDS = [], FAILURES = [], BUCKETS = [];

const REGIME_CLASS = { BULL: "bull", BEAR: "bear", RANGING: "range" };
const ACRONYMS = new Set(["ATR","EMA","MA","BB","SL","TP","RSI","ADX","MACD","OHLC","PF"]);
const TIMEFRAMES = new Set(["M1","M5","M15","M30","H1","H4","D1","W1","MN1"]);

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* Mirrors message_doc.humanize_group -- one implementation per renderer is the
   cost of the split; the canonical id always travels alongside so a tap can
   still look the group up. */
function humanize(gid){
  if(!gid) return "";
  let n = String(gid).replace(/^(BULL|BEAR|RANGING|GLOBALS)_/, "");
  return n.split("_").filter(Boolean).map(t => {
    const u = t.toUpperCase();
    if(ACRONYMS.has(u) || TIMEFRAMES.has(u)) return u;
    if(/^G\d+$/.test(u)) return u;
    return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  }).join(" ");
}

const REGIME_SUFFIXES = ["_Bull", "_Bear", "_Range", "_Ranging"];
function stripRegime(n){
  for(const suf of REGIME_SUFFIXES){
    if(String(n).endsWith(suf)) return String(n).slice(0, -suf.length);
  }
  return String(n);
}

/* Underscores are how the EA writes an identifier; they are not how a person
   reads one. Display only -- the canonical name with its underscores still
   travels in the snapshot, so a tap-through can still look it up. */
const spaceOut = n => String(n).replace(/_/g, " ");

/* A step resolution and the bound it steps between do not share a sensible
   width -- toFixed on either lies about the other. Trim instead of picking. */
const num = x => (typeof x !== "number" || !isFinite(x)) ? ""
  : String(Number(x.toFixed(6)));

/* A SWEPT variable, unlike a round's, carries its own grid -- a sweep has no
   group_id, so the catalog cannot answer for it and the spec travels on the
   seed record itself. Trevor asked for three things here and they are all
   derived from the file the tester is actually running: the NAMES, the STEP
   COUNT, and the STEP RESOLUTION. */
/* ONE SPELLING FOR AN OPERATION, wherever it appears -- machine chip, progress
   bar, seed chip. The trailing digit is split off GENERICALLY (FOO2 -> "FOO 2")
   rather than from a lookup table: the vocabulary lives upstream, and a copy
   here would be the thing that drifts. It already did once on another surface,
   where a numbered variant reached the screen raw and stayed wrong for days --
   and this page was about to repeat it, rendering the raw value into a chip.

   The paused states share a prefix upstream rather than being spelled out one
   by one, so the prefix is unfolded here rather than matched. */
const PAUSED_PREFIX = "PAUSED_AFTER_";
function phaseText(p){
  let t = String(p || "").toUpperCase();
  if(!t) return "";
  const paused = t.startsWith(PAUSED_PREFIX);
  if(paused) t = t.slice(PAUSED_PREFIX.length);
  t = t.replace(/^([A-Z]+?)(\d+)$/, "$1 $2");
  return paused ? "PAUSED · " + t : t;
}

/* The third chip on a seed answers "what KIND of round is this", in the same
   vocabulary the machine cards use for `phase`, so a seed and a rotation round
   read the same way on one screen. `round_type` is the record's own answer and
   wins outright; `kind` is the coarse fallback and cannot tell a second pass
   from a first. */
const roundType = sd => phaseText(sd.round_type || sd.kind || "seed");

function sweptList(vars, cells){
  if(!Array.isArray(vars) || !vars.length) return "";
  const n = vars.length;
  return `<div class="vars">
      <div class="vhead">${n} Variable${n === 1 ? "" : "s"}` +
        (cells ? ` · ${cells}-cell grid` : "") + `</div>
      ${vars.map(v => {
        const bits = [];
        if(v.min != null && v.max != null) bits.push(num(v.min) + " → " + num(v.max));
        if(v.points != null) bits.push(v.points + " step" + (v.points === 1 ? "" : "s"));
        if(v.step != null) bits.push("Δ " + num(v.step));
        return `<div class="v"><span class="sv">` +
          `<span>${esc(spaceOut(stripRegime(v.name || "")))}</span>` +
          (bits.length ? `<span class="spec">${esc(bits.join(" · "))}</span>` : "") +
          `</span></div>`;
      }).join("")}
    </div>`;
}

function varList(vars){
  if(!Array.isArray(vars) || !vars.length) return "";
  const n = vars.length;
  return `<div class="vars">
      <div class="vhead">${n} Variable${n === 1 ? "" : "s"}</div>
      ${vars.map(v => `<div class="v">${esc(spaceOut(stripRegime(v)))}</div>`).join("")}
    </div>`;
}

const titleCase = s => String(s).charAt(0) + String(s).slice(1).toLowerCase();

function ago(sec){
  if(sec == null) return "";
  if(sec < 90) return sec + "s ago";
  if(sec < 5400) return Math.round(sec/60) + "m ago";
  return (sec/3600).toFixed(1) + "h ago";
}

/* LOCAL time, deliberately. Everything upstream is UTC -- `recorded_at` carries
   +00:00 and the beacons are unix seconds -- and rendering that raw meant a
   sweep started at 15:00 displayed as 22:00. The stored values stay UTC; only
   the display converts, so the phone and the desktop each read in their own
   zone without the records ever changing.

   Accepts an ISO string OR unix SECONDS, because seeds carry the latter. */
function fmtWhen(v){
  const d = (typeof v === "number") ? new Date(v * 1000) : new Date(v);
  if(isNaN(d.getTime())) return "";
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function deltaEl(before, after){
  if(before == null || after == null) return '<span class="delta flat">—</span>';
  const d = after - before;
  if(Math.abs(d) < 0.005) return '<span class="delta flat">±0.00</span>';
  const cls = d > 0 ? "up" : "dn";
  return `<span class="delta ${cls}">${d > 0 ? "+" : "−"}${Math.abs(d).toFixed(2)}</span>`;
}

/* ---------- page: rounds ---------- */
/* The publisher emits the RECORD shape, faithful to the beacons. Adapting it
   for display is the renderer's job -- that split is the whole reason the app
   can be rebuilt without touching the pipeline. */
const RC = { BULL: "bull", BEAR: "bear", RANGING: "range" };
const stale = f => f.age_seconds != null && f.age_seconds > 900;
const running = f => f.group_id && f.phase;
/* A PHASE WITH NO GROUP IS NOT IDLE. SELECTING writes no detail upstream, so
   regime, bucket, group and mode all arrive null and the phase is the only
   true thing on the record. `running` is false for it, which titled the card
   "Idle -- no round" while it wore a SELECTING chip -- the card contradicted
   itself, and the fabricated preview data was hiding it. */
const picking = f => f.phase && !f.group_id;
const completed = r => !r.failed;

/* "5 of 28" -- the groups this BUCKET has optimized, out of its own. null when
   the machine is idle or the bucket is unknown, so metaRow drops the cell
   rather than printing a confident zero. */
function jobsDone(regime, bucketId){
  const b = BUCKETS.find(x => x.regime === regime && x.bucket_id === bucketId);
  if(!b || b.groups_done == null) return null;
  return b.groups_total ? `${b.groups_done} of ${b.groups_total}` : String(b.groups_done);
}

/* ETA -- the LOCAL CLOCK TIME this job should finish at. The rate already on
   this row answers the same question, but only after arithmetic: "64% at
   9.4 %/h" is 3.8 hours, and what you want to know is whether that lands
   before or after you go to bed.

   THE ARITHMETIC IS UPSTREAM'S, RESTATED. mt5_progress.hours_remaining and
   backtest_progress.hours_remaining are both `(100 - percent) / rate` behind
   the same two guards used here, so this agrees with them by construction
   rather than by luck. The figure itself does not ride the beacon --
   _BEACON_PROGRESS_FIELDS forwards percent and pct_per_hour and drops
   hours_remaining -- so the renderer re-derives it rather than the publisher
   growing a field for a thing it already has the inputs for.

   ANCHORED TO THE BEACON, NOT TO NOW. `percent` was true when the machine last
   reported; adding the remaining hours to `now` would push every ETA later by
   the beacon's own age. That is seconds on a live card -- and it is the whole
   story on a stale one, which is why a STALE BEACON GETS NO ETA. Its percent is
   fifteen-plus minutes old, and the card already carries a warning saying the
   page cannot say what that machine is doing now; a confident finishing time
   printed under that warning would contradict it. Same lesson the backtest
   freshness guard was written for: "91% -- ~0h left" on a machine that has
   moved on is worse than no number. */
function etaAt(f){
  if(stale(f)) return null;
  if(f.percent == null || !f.pct_per_hour || f.percent >= 100) return null;
  const beaconMs = Date.now() - (f.age_seconds || 0) * 1000;
  return new Date(beaconMs + ((100 - f.percent) / f.pct_per_hour) * 3600e3);
}

/* A bare "03:12" is a lie by omission when it means tomorrow, and at 9 %/h a
   round is ten hours long -- crossing midnight is the ordinary case here, not
   the edge one. So the day is NAMED whenever it is not today. Local, for the
   reason fmtWhen gives. Day distance is measured midnight-to-midnight and
   rounded, so a 23- or 25-hour DST day still counts as one day. */
const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtEta(d){
  if(!d) return null;
  const p = n => String(n).padStart(2, "0");
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const now = new Date();
  // A LIVE beacon can still sit behind a job that is nearly done: 99% at
  // 60 %/h is one minute left, read four minutes ago. A finishing time in the
  // past is not wrong, but printing it as a clock time reads as one.
  if(d <= now) return "due now";
  const days = Math.round(
    (new Date(d.getFullYear(), d.getMonth(), d.getDate()) -
     new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  if(days === 0) return hm;
  if(days < 7) return DAY_NAMES[d.getDay()] + " " + hm;
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${hm}`;
}

/* No cells means NO ROW. The .meta rule draws a border top and bottom, so an
   empty one is not invisible -- it is a 20px band of two stray rules. Idle
   machines hit this the moment a field is dropped from the row, which is
   exactly what happened when Tier came out. */
function metaRow(pairs){
  const cells = pairs.filter(x => x[1] != null && x[1] !== "");
  if(!cells.length) return "";
  return '<div class="meta">' + cells
    .map(([k, v, cls]) => `<div><span class="k">${esc(k)}</span>` +
      `<span class="v ${cls || ""}">${esc(v)}</span></div>`).join("") + '</div>';
}

function progressBar(f, rc){
  if(f.percent == null) return "";
  return `<div class="prog">
      <div class="prog-top"><span>${esc(f.mode === "real_ticks" ? "Real Ticks"
        : f.mode === "ohlc" ? "OHLC" : (phaseText(f.phase) || "Progress"))}</span>
        <span class="pct">${f.percent}%</span></div>
      <div class="bar"><i class="${rc}" style="width:${Math.max(0, Math.min(100, f.percent))}%"></i></div>
    </div>`;
}

function renderSeeds(){
  if(!SEEDS.length) return "";
  return '<div class="section-label">Seeded — cutting in line</div>' +
    SEEDS.map(sd => {
      const rc = RC[sd.regime] || "";
      const when = sd.claimed_at || sd.created_at;
      return `
      <article class="card">
        <div class="stripe ${rc || "warn"}"></div>
        <div class="card-in">
          <div class="top">
            ${sd.regime ? `<span class="chip ${rc}">${esc(sd.regime)}</span>` : ""}
            ${sd.claimed_by ? `<span class="chip gold">${esc(sd.claimed_by)}</span>` : ""}
            <span class="chip">${esc(roundType(sd))}</span>
            <span class="sp"></span>
            <span class="when">${esc(String(sd.status || ""))}</span>
          </div>
          <div>
            <div class="title">${esc(sd.label || humanize(sd.group_id) || "Seeded work")}</div>
            <div class="sub">${sd.claimed_by ? "" : "unclaimed"}` +
              `${when ? (sd.claimed_by ? "since " : " · created ") + esc(fmtWhen(when)) : ""}</div>
          </div>
          ${sweptList(sd.variables, sd.cells)}
          ${sd.note ? `<div class="noterow" data-toggle><span>Why it cut in line</span>` +
            `<span class="car">▾</span></div>` +
            `<div class="notebody" hidden>${esc(sd.note)}</div>` : ""}
        </div>
      </article>`;
    }).join("");
}

/* A FAILED ROUND WRITES NO LEDGER ROW -- the retry state machine is what
   remembers it, and a success clears that entirely. So this is "what is failing
   NOW", not a history, and it is the only place a failure is visible at all.

   Parked (3 failures) is the one state that does not auto-revive: it is asking
   for a decision, which is exactly what this page should not make someone go
   looking for. */
function renderFailures(){
  if(!FAILURES.length) return "";
  return '<div class="section-label">Failing — needs a look</div>' +
    FAILURES.map(f => {
      const rc = RC[f.regime] || "";
      const n = f.failures || 0;
      const why = f.parked ? "parked after 3 — waiting on you"
        : f.awaiting_other_round ? "one other round runs first, then it retries"
        : "retrying";
      return `
      <article class="card">
        <div class="stripe warn"></div>
        <div class="card-in">
          <div class="top">
            ${f.regime ? `<span class="chip ${rc}">${esc(f.regime)}</span>` : ""}
            ${f.released_by ? `<span class="chip gold">${esc(f.released_by)}</span>` : ""}
            <span class="chip warn">${f.parked ? "PARKED" : "FAILED"}</span>
            <span class="sp"></span>
            <span class="when">${n} failure${n === 1 ? "" : "s"}</span>
          </div>
          <div>
            <div class="title">${esc(humanize(f.group_id) || "Unknown group")}</div>
            <div class="sub">${esc(why)}</div>
          </div>
        </div>
      </article>`;
    }).join("");
}

function renderRounds(){
  if(!FLEET.length) return '<div class="empty">No machines reporting.</div>';
  // Nothing per-machine here any more. "Rounds done by this box" counted a
  // real thing, but not a thing anyone steers by: a ROUND is one group run
  // once, and a group is deliberately re-run (2 consecutive middle wins before
  // a variable can lock), so 26 rounds is 17 groups. The campaign's own unit is
  // GROUPS PER BUCKET, and that belongs to the bucket, not to the box.
  // EVERY machine, not just the ones with a round. A machine that vanishes from
  // this page when it goes idle hides exactly the thing worth knowing -- that is
  // how a manually launched sweep read as a dead Laptop for three hours.
  return FLEET.map(f => {
    const rc = RC[f.regime] || "";
    const live = running(f);
    const st = stale(f);
    return `
    <article class="card">
      <div class="stripe ${st ? "warn" : (live ? rc : "")}"></div>
      <div class="card-in">
        <div class="top">
          ${f.regime ? `<span class="chip ${rc}">${esc(f.regime)}</span>` : ""}
          <span class="chip gold">${esc(f.machine)}</span>
          ${f.phase ? `<span class="chip">${esc(phaseText(f.phase))}</span>` : ""}
          <span class="sp"></span>
          <span class="when">${f.age_seconds != null
            ? "♥ " + esc(ago(f.age_seconds)) : "never reported"}</span>
        </div>
        <div>
          <div class="title">${live
            ? esc(titleCase(f.regime || "")) + " " + (f.bucket_id ?? "") + " Round Running"
            : picking(f) ? "No group picked yet"
            : "Idle — no round"}</div>
          ${f.group_id ? `<div class="sub">${esc(humanize(f.group_id))}</div>` : ""}
        </div>
        ${metaRow([["Mode", f.mode === "real_ticks" ? "Real Ticks"
                      : f.mode === "ohlc" ? "OHLC" : null, "gold"],
                   ["Rate", f.pct_per_hour != null
                      ? f.pct_per_hour.toFixed(1) + " %/h" : null],
                   ["Jobs done", jobsDone(f.regime, f.bucket_id)],
                   ["ETA", fmtEta(etaAt(f))]])}
        ${progressBar(f, rc)}
        ${varList(f.variables)}
        ${st ? `<div class="warnrow"><span>⚠️</span><span>` +
          `Last reported ${esc(ago(f.age_seconds))} — the beacon is stale, ` +
          `so this page cannot say what it is doing now.</span></div>` : ""}
        ${live ? `<div class="acts">
          <button type="button" class="primary">Skip</button>
          <button type="button">To OHLC</button>
          <button type="button">To Ticks</button>
        </div>` : ""}
      </div>
    </article>`;
  }).join("");
}

/* ---------- page: results ---------- */
function renderResults(){
  const rows = LEDGER.map(r => {
    const rc = REGIME_CLASS[r.regime] || "";
    return `
    <article class="row">
      <div class="row-top">
        <span class="chip ${r.failed ? "warn" : rc}">${
          r.failed ? "FAILED" : esc(r.regime)}</span>
        <span class="row-grp">${esc(humanize(r.group_id))}</span>
        <span class="row-when">${esc(fmtWhen(r.recorded_at))}</span>
      </div>
      ${r.failed ? `<div class="sub" style="padding:0 0 2px">${
          esc(r.fail_reason || "no reason recorded")}</div>` : `
      <div class="row-pf">
        <div>
          <div class="lab">Bucket PF</div>
          <div class="pf"><b>${r.bucket_pf_before ?? "—"}</b>→<b>${r.bucket_pf_after ?? "—"}</b>
            ${deltaEl(r.bucket_pf_before, r.bucket_pf_after)}</div>
        </div>
        <div>
          <div class="lab">Portfolio PF</div>
          <div class="pf"><b>${r.pf_before ?? "—"}</b>→<b>${r.pf_after ?? "—"}</b>
            ${deltaEl(r.pf_before, r.pf_after)}</div>
        </div>
      </div>`}
      <div class="row-foot">
        <span>r${r.round_no}</span>
        <span>${esc(r.machine)}</span>
        <span>${r.ticks_mode === "real_ticks" ? "ticks" : "ohlc"}</span>
        <span>pass ${r.picked_pass ?? "—"}</span>
        ${r.heavy ? "<span>heavy</span>" : ""}
      </div>
    </article>`;
  }).join("");
  // "completed" has to mean completed. Counting every row here while the
  // machine cards count only finished ones would put two different totals for
  // the same thing on two tabs of one app.
  const nf = LEDGER.length - LEDGER.filter(completed).length;
  return `<div class="section-label">${LEDGER.filter(completed).length} completed` +
    (nf ? ` · ${nf} failed` : "") + ` · newest first</div>` + rows;
}

/* ---------- shell ---------- */

// The gist id is deliberately NOT in this repo. It arrives in the URL
// fragment -- https://twiens99.github.io/goldbot-app/#g=<id> -- and browsers
// never send a fragment to a server, so it appears in no request log and no
// commit. Without it this page is an empty shell. Obscurity, not security: a
// random 32-hex id is a meaningful lock, not a real one.
const GIST_ID = new URLSearchParams(location.hash.slice(1)).get("g");
const GIST_URL = GIST_ID
  ? "https://gist.githubusercontent.com/twiens99/" + encodeURIComponent(GIST_ID) +
    "/raw/goldbot_snapshot.json"
  : null;

function showState(msg){
  document.getElementById("page-rounds").innerHTML =
    '<div class="empty">' + msg + '</div>';
  document.getElementById("page-results").innerHTML = "";
}

/* Groups, not rounds. "26 rounds this epoch" answered a question nobody was
   asking -- it counts attempts at groups, and a group is re-run on purpose. */
function campaignProgress(){
  const done = BUCKETS.reduce((a, b) => a + (b.groups_done || 0), 0);
  const total = BUCKETS.reduce((a, b) => a + (b.groups_total || 0), 0);
  if(!total) return LEDGER.filter(completed).length + " rounds this epoch";
  return `${done} of ${total} groups this epoch`;
}

function paint(stamp){
  document.getElementById("page-rounds").innerHTML =
    renderSeeds() + renderFailures() + renderRounds();
  document.getElementById("page-results").innerHTML = renderResults();
  document.getElementById("stamp").textContent = stamp;
  document.getElementById("hsub").textContent =
    FLEET.length + " running · " + campaignProgress();
  document.getElementById("banner").hidden = true;
}

function applySnapshot(d, source){
  if(!d || d.kind !== "goldbot.app.snapshot") return false;
  if(!Array.isArray(d.fleet) || !Array.isArray(d.ledger)) return false;
  FLEET = d.fleet;
  SEEDS = Array.isArray(d.seeds) ? d.seeds : [];
  FAILURES = Array.isArray(d.failures) ? d.failures : [];
  BUCKETS = Array.isArray(d.buckets) ? d.buckets : [];
  LEDGER = d.ledger.filter(x => x.epoch === EPOCH);
  paint(source + " · " + fmtWhen(d.generated_at) + " · epoch " + EPOCH);
  return true;
}

/* TWO HOSTS, ONE PAGE.
   - As an ARTIFACT: read the runtime `db` store. An artifact's CSP blocks
     cross-origin fetch, so it can never reach the gist -- the snapshot is
     seeded into db from the Claude session instead, and onSnapshot repaints
     live when a new one is written.
   - On GITHUB PAGES: window.claude does not exist, so fall through and fetch
     the gist, which is the live path the phone uses.
   Trying db FIRST matters: on the artifact the gist fetch would fail silently
   and leave the page looking broken. */
async function fromArtifactDb(){
  try{
    if(!(window.claude && typeof window.claude.use === "function")) return false;
    const db = await window.claude.use("db");   // null = not granted/served
    if(!db) return false;
    const ref = db.doc("snapshot/current");
    const snap = await ref.get();
    let painted = snap.exists && applySnapshot(snap.data(), "artifact");
    if(!painted){
      showState("No snapshot in this artifact's store yet.<br><br>" +
                "Ask Claude to push one.");
      document.getElementById("stamp").textContent = "artifact · empty";
    }
    // Live: repaint whenever a new snapshot is written.
    ref.onSnapshot(s => { if(s.exists) applySnapshot(s.data(), "artifact"); },
                   () => {});
    return true;
  }catch(e){ return false; }
}

(async () => {
  showState("Loading…");
  if(await fromArtifactDb()) return;

  if(!GIST_URL){
    showState("This page has no data source.<br><br>It needs the snapshot id in " +
              "the link: <b>#g=&lt;id&gt;</b><br>Open it from your saved shortcut.");
    document.getElementById("stamp").textContent = "no source";
    return;
  }
  try{
    // ?t= defeats the raw URL's 5-minute CDN cache (verified 200).
    const r = await fetch(GIST_URL + "?t=" + Date.now(), {cache: "no-store"});
    if(!r.ok){ showState("Snapshot unreachable — HTTP " + r.status + "."); return; }
    const d = await r.json();
    if(!applySnapshot(d, "live")){
      showState("The publisher has not written a snapshot yet.<br><br>" +
                "This page goes live on its own once it does.");
      document.getElementById("stamp").textContent = "waiting for first publish";
    }
  } catch(e){
    showState("Could not load the snapshot.<br><br>Offline, or the id in the " +
              "link is wrong.");
  }
})();

document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b =>
      b.setAttribute("aria-selected", String(b === btn)));
    ["rounds","results"].forEach(p =>
      document.getElementById("page-" + p).hidden = (p !== btn.dataset.p));
    window.scrollTo(0, 0);
  });
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if(!t) return;
  const body = t.nextElementSibling;
  body.hidden = !body.hidden;
  t.querySelector(".car").textContent = body.hidden ? "▾" : "▴";
});
</script>
</body>
</html>
