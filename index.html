<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without the viewport tag a phone renders this at desktop width and scales
     it down -- unreadable. Both of these were supplied by the artifact wrapper
     during design; served raw from Pages there is no wrapper. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1016">
<meta name="color-scheme" content="dark">
<!-- Add to Home Screen: launch without browser chrome. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GoldBot">
<meta name="robots" content="noindex, nofollow">
<title>GoldBot Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">

</head>
<body>
<style>
/* The app commits to one visual world -- a dark instrument panel -- rather than
   following the host theme, because that is what it will be as an APK. */
:root{
  --bg:#0A1016;
  --card:#141E26;
  --card-2:#1B2933;
  --line:#22313C;
  --text:#E8EFF3;
  --dim:#8CA0AC;
  --faint:#5F727E;
  --gold:#E0B457;
  --tonal:#1D3244;
  --warn:#E08B4A;
  --bad:#E0685A;
  --good:#5FBE95;
  --bull:#5FBE95;
  --bear:#E0685A;
  --range:#6FA8D4;
  /* 2026-09-16 -- the one hue this palette did not have, added for LOCKED.
     Everything else here is earned by a regime or a severity; LOCKED is neither,
     it is DONE, and it needed a colour that is not competing with either. */
  --done:#A98BE0;
}

*{box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}

/* ---------- header ---------- */
header{
  padding:16px 16px 12px;
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;
  position:sticky;top:0;background:var(--bg);z-index:5;
}
.h-row{display:flex;align-items:baseline;gap:9px;}
h1{
  margin:0;font-size:1.2rem;font-weight:700;letter-spacing:-.02em;
}
.h-sub{font-size:.76rem;color:var(--dim);}
.stamp{
  font-size:.68rem;color:var(--faint);
  font-family:"Roboto Mono",ui-monospace,monospace;
}
.baked{
  margin-top:7px;
  font-size:.7rem;color:var(--warn);
  background:rgba(224,139,74,.1);
  border:1px solid rgba(224,139,74,.25);
  border-radius:6px;padding:5px 8px;
  line-height:1.4;
}

/* ---------- pages ---------- */
main{flex:1;padding:14px 14px 90px;display:flex;flex-direction:column;gap:12px;}
.page[hidden]{display:none;}
.page{display:flex;flex-direction:column;gap:12px;}

.section-label{
  font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--faint);
  margin:4px 0 -4px 2px;
}

/* ---------- card ---------- */
.card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.stripe{height:3px;background:var(--gold);}
.stripe.bull{background:var(--bull);}
.stripe.bear{background:var(--bear);}
.stripe.range{background:var(--range);}
.stripe.warn{background:var(--warn);}
/* AN AGENT IS DRAWN UNDER THE MACHINE IT SERVES. The rail is the whole
   point: an agent runs no round, so its card carries none of the progress
   a machine card normally leads with, and side by side with real machines
   it reads as an idle box. Indented under its controller it reads as what
   it is -- borrowed cores. */
.agent-of{margin-left:14px;padding-left:12px;border-left:2px solid var(--line,#333);}
.stripe.agent{background:var(--gold);opacity:.55;}
.agmeter{display:flex;align-items:flex-end;gap:10px;margin-top:2px;}
.agbars{display:flex;align-items:flex-end;gap:3px;height:22px;}
.agbar{display:flex;align-items:flex-end;width:9px;height:100%;background:rgba(255,255,255,.06);border-radius:2px;}
.agbar i{display:block;width:100%;background:var(--gold);opacity:.75;border-radius:2px;}
.agnote{font-size:12px;opacity:.65;}
.contrib{display:flex;flex-direction:column;gap:6px;}
.cbrow{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;font-size:12px;}
.cbname{opacity:.85;font-weight:600;}
.cbbar{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.cbbar i{display:block;height:100%;background:var(--gold);opacity:.8;}
.cbnum{opacity:.7;white-space:nowrap;}
.cbwhy{grid-column:2 / -1;font-size:11px;opacity:.55;}
.cbint{grid-column:2 / -1;font-size:11px;color:var(--warn);opacity:.9;}
.card-in{padding:13px 14px 14px;display:flex;flex-direction:column;gap:11px;}

.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.sp{flex:1;}
.chip{
  font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;
  background:var(--tonal);color:#9CC6E8;white-space:nowrap;
}
.chip.gold{background:rgba(224,180,87,.15);color:var(--gold);}
.chip.warn{background:rgba(224,139,74,.16);color:var(--warn);}
.chip.bull{background:rgba(95,190,149,.14);color:var(--bull);}
.chip.bear{background:rgba(224,104,90,.14);color:var(--bear);}
.chip.range{background:rgba(111,168,212,.14);color:var(--range);}
.when{font-size:.69rem;color:var(--faint);font-family:"Roboto Mono",ui-monospace,monospace;}

.title{font-size:1rem;font-weight:700;letter-spacing:-.012em;line-height:1.25;
  /* A seed label is an identifier, not prose -- they run to forty characters
     has no spaces to break at and ran off the card. */
  overflow-wrap:anywhere;}
.sub{font-size:.83rem;color:var(--dim);margin-top:1px;}

.meta{
  /* 11px, not 13px. Mode/Rate/Jobs done/ETA needed 306px at 375px wide and the
     card gives it 302 -- four pixels short, so the ETA wrapped alone onto a
     second line and the row grew a ragged half-empty tier. Three gaps at 2px
     less buys 6px and lands it. The longer ETA forms ("Wed 13:38") still wrap,
     which is correct: that is a genuinely wider row, not a near miss.

     2026-09-17 -- STARTED makes six cells, so the row now wraps by design
     rather than by four pixels. That is the reason this is flex-wrap and not a
     grid: a wrapped tier of whole cells is fine, and it was only ever ONE cell
     stranded on a line of its own that read as broken. The 11px gap stays --
     it is what keeps the first tier whole. */
  display:flex;gap:11px;flex-wrap:wrap;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:9px 0;font-size:.775rem;
  font-variant-numeric:tabular-nums;
}
.meta .k{color:var(--faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;}
.meta .v{color:var(--text);font-weight:600;}
.meta .v.gold{color:var(--gold);}
.meta div{display:flex;flex-direction:column;gap:1px;}

/* progress */
.prog{display:flex;flex-direction:column;gap:6px;}
.prog-top{display:flex;justify-content:space-between;font-size:.76rem;}
.prog-top .pct{font-weight:700;font-variant-numeric:tabular-nums;}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:3px;background:var(--gold);}
.bar i.bull{background:var(--bull);}
.bar i.bear{background:var(--bear);}
.bar i.range{background:var(--range);}

/* variable list */
.vars{display:flex;flex-direction:column;gap:3px;}
.vhead{
  font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700;margin-bottom:3px;
}
.v{
  font-family:"Roboto Mono",ui-monospace,monospace;
  font-size:.755rem;color:var(--text);
  word-break:break-all;line-height:1.45;
  display:flex;align-items:center;gap:7px;
}
.sv{display:flex;flex-direction:column;gap:1px;}
.sv .spec{
  color:var(--dim);font-size:.7rem;letter-spacing:.01em;
  word-break:normal;
}
.v::before{
  content:"";width:3px;height:3px;border-radius:50%;
  background:var(--faint);flex:none;
}
.v.rider{color:var(--gold);}
.v.rider::before{background:var(--gold);}

.warnrow{
  font-size:.78rem;color:var(--warn);line-height:1.42;font-weight:500;
  display:flex;gap:7px;align-items:flex-start;
}
.noterow{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:.75rem;color:var(--dim);cursor:pointer;
  border-top:1px solid var(--line);padding-top:9px;
}
.noterow .car{color:var(--faint);font-size:.7rem;}
.notebody{
  font-size:.755rem;color:var(--dim);line-height:1.5;
  border-left:2px solid var(--line);padding-left:10px;
}
.notebody[hidden]{display:none;}

.acts{display:flex;gap:7px;flex-wrap:wrap;}
.acts button{
  font-family:inherit;font-size:.775rem;font-weight:600;
  border-radius:18px;padding:8px 14px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);
}
.acts button.primary{background:var(--gold);color:#121A22;border-color:transparent;}
.acts button:active{transform:translateY(1px);}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;gap:9px;}
.hbtn{
  background:var(--card);
  border:0;border-radius:14px;
  padding:0;cursor:pointer;width:100%;
  font-family:inherit;color:var(--text);
  overflow:hidden;display:flex;flex-direction:column;
  text-align:left;
}
.hbtn .hstripe{height:3px;background:var(--gold);}
.hbtn .hrow{display:flex;align-items:center;gap:13px;padding:15px 15px 16px;}
.hic{font-size:1.45rem;line-height:1;width:30px;text-align:center;flex:none;}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.hname{
  font-size:1rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  /* Same reason .title wraps: a seed label is an identifier with no spaces. */
  overflow-wrap:anywhere;min-width:0;
}
.hsubline{font-size:.79rem;color:var(--dim);line-height:1.35;}
.hcar{color:var(--faint);font-size:1.1rem;flex:none;}
.hbtn:active{transform:translateY(1px);}
.hbtn:focus-visible{outline:2px solid var(--gold);outline-offset:-3px;}
/* The count that decides whether you need to open it at all. */
.hcount{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;}
.hcount.quiet{color:var(--faint);font-weight:600;}
.hcount.warn{color:var(--warn);}

/* ---------- to review ---------- */
/* A finished job you have not opened yet. Smaller than a home BUTTON because it
   is one item in a list rather than a place to go, but it carries the same
   left-edge stripe so the regime reads at the same glance. */
/* THE SHELL A CONDENSED CARD TRAVELS IN -- used by the home screen and by the
   results list, because they are the same thing: a condensed job card that
   navigates. The shell carries every attribute and draws nothing; the card
   draws everything and carries nothing. */
.jrow{
  width:100%;text-align:left;font-family:inherit;color:var(--text);
  background:transparent;border:0;padding:0;cursor:pointer;display:block;
}
.jrow:active{transform:translateY(1px);}
.jrow:focus-visible{outline:2px solid var(--gold);outline-offset:-3px;}
/* An article shell is a row that cannot be opened -- it must not look tappable. */
article.jrow{cursor:default;}
/* THE CONDENSED CARD. Same card, tighter -- it is one item in a list rather than
   the subject of a screen, so it gives back the vertical space the full one
   spends on being the thing you came to read. */
.jc-sm .card-in{padding:10px 12px;gap:8px;}
.jc-sm .title{font-size:.9rem;}
.jc-sm .meta{padding:7px 0;font-size:.72rem;}
.jc-sm .row-pf{font-size:.72rem;}
.jc-note{font-size:.67rem;color:var(--warn);line-height:1.4;}

/* (the hand-built badge's own styles went with it) */

/* ---------- job selector ---------- */
.jrow .hstripe{background:var(--faint);}
.jrow .hstripe.bull{background:var(--bull);}
.jrow .hstripe.bear{background:var(--bear);}
.jrow .hstripe.range{background:var(--range);}
.jrow .hstripe.warn{background:var(--warn);}
.jrow .hstripe.agent{background:var(--gold);opacity:.55;}
.jtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.backbtn{
  background:transparent;border:0;cursor:pointer;
  font-family:inherit;font-size:.82rem;font-weight:600;
  color:var(--dim);padding:2px 0;text-align:left;align-self:flex-start;
}
.backbtn:active{transform:translateY(1px);}

/* ---------- the job's rounds ---------- */
.tl{display:flex;flex-direction:column;gap:0;}
.tlr{
  display:flex;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line);
}
.tlr:last-child{border-bottom:0;}
.tlm{
  width:16px;flex:none;text-align:center;line-height:1.5;
  font-size:.8rem;color:var(--faint);
}
.tlr.passed .tlm{color:var(--good);}
/* Ran, but on inference rather than on a file -- dimmer than a tick backed by
   a report you can open. */
.tlr.inferred .tlm{color:var(--faint);}
.tlr.running .tlm{color:var(--gold);}
.tlb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.tlh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.tlk{
  font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
}
.tlr.queued .tlk,.tlr.skipped .tlk{color:var(--faint);font-weight:600;}
.tlw{
  font-size:.68rem;color:var(--faint);
  font-family:"Roboto Mono",ui-monospace,monospace;
}
.tlnote{font-size:.73rem;color:var(--faint);line-height:1.4;}
/* HORIZONTAL, AND WRAPPING TO A SECOND ROW RATHER THAN A COLUMN. `wrap` was
   always set; what made it stack was the buttons being wide enough that two
   rarely fitted. Narrower padding and one-word labels put four or five on a
   line at 375px, and the fifth drops to a second row instead of each taking
   one of its own. */
.rbtns{display:flex;gap:5px;flex-wrap:wrap;row-gap:5px;}
.rbtn{
  font-family:inherit;font-size:.68rem;font-weight:600;
  border-radius:13px;padding:3px 9px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);
  text-decoration:none;display:inline-block;white-space:nowrap;
}
.rbtn:active{transform:translateY(1px);}
/* A button with nowhere to go says so rather than looking broken when tapped. */
.rbtn.pending{color:var(--faint);}
.rfile{
  font-family:"Roboto Mono",ui-monospace,monospace;
  font-size:.67rem;color:var(--dim);word-break:break-all;line-height:1.45;
}
.rfile[hidden]{display:none;}

/* ---------- the schedule flowchart ---------- */
/* Trevor, 2026-09-19: *"a page showing running and upcoming blocks as a bubble
   diagram."*

   A COLUMN, NOT A ROW OF BUBBLES ACROSS. This renders at 375px, and a chain of
   six blocks laid out horizontally is either six unreadable dots or a sideways
   scroll -- and a flowchart you have to scroll sideways to read has stopped
   being a picture of the plan. Down the page it is the same shape `.tl`
   already uses for a job's rounds, which is the point: the same colours mean
   the same things. Good is done, gold is running now, faint has not started. */
.fc{display:flex;flex-direction:column;gap:0;}
.fcr{display:flex;gap:11px;position:relative;padding:0 0 15px;}
.fcr:last-child{padding-bottom:0;}
/* THE SPINE IS A PSEUDO-ELEMENT ON THE ROW, not an element drawn between rows,
   so it cannot fall out of step with the bubbles it joins. */
.fcr::before{
  content:"";position:absolute;left:13px;top:30px;bottom:0;width:2px;
  background:var(--line);
}
.fcr:last-child::before{display:none;}
.fcr.done::before{background:var(--good);opacity:.4;}
.fcb{
  width:28px;height:28px;flex:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;line-height:1;
  border:2px solid var(--line);background:var(--card-2);color:var(--faint);
  position:relative;z-index:1;
}
.fcr.done .fcb{border-color:var(--good);color:var(--good);}
.fcr.active .fcb{
  border-color:var(--gold);color:var(--gold);background:rgba(224,180,87,.15);
  box-shadow:0 0 0 4px rgba(224,180,87,.12);
}
.fcbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-top:3px;}
.fch{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
.fcn{font-size:.82rem;font-weight:700;letter-spacing:.01em;}
.fcr.upcoming .fcn{color:var(--dim);font-weight:600;}
.fcsay{font-size:.74rem;color:var(--dim);line-height:1.45;}
.fcr.upcoming .fcsay{color:var(--faint);}
/* The loop marker CLOSES the chain rather than leaving it dangling: a looping
   schedule whose last bubble just ended would read as finished. */
.fcloop{
  display:flex;gap:11px;align-items:center;
  font-size:.72rem;color:var(--faint);padding-top:2px;
}
.fcloop .fcb{border-style:dashed;}

/* ---------- the task card ---------- */
/* ONE ROUND, FULLY DESCRIBED. Trevor, 2026-09-16: *"build a Task Card ...
   clickable from any job card ... as much information about that particular
   task."*

   INLINE, NOT A THIRD SCREEN. The app is already two levels deep by the time a
   job card is open, and a third back button to get out of a detail panel is the
   navigation nobody wants on a phone. Expanding in place also keeps the row it
   belongs to on screen, which is the thing that says WHICH task this is. */
.task{
  margin-top:8px;padding:10px 11px;border-radius:9px;
  background:var(--card-2);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;
}
.task[hidden]{display:none;}
.tsec{display:flex;flex-direction:column;gap:6px;}
.tlab{
  font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);
}
.tnote{font-size:.75rem;color:var(--dim);line-height:1.45;}
.tby{font-size:.67rem;color:var(--faint);font-family:"Roboto Mono",ui-monospace,monospace;}

/* A variable and where it is up to. The state carries the colour because it is
   the thing worth scanning down a list for -- a column of names is a column of
   names whatever colour it is. */
.tvar{
  display:flex;align-items:baseline;gap:8px;
  font-size:.73rem;font-family:"Roboto Mono",ui-monospace,monospace;
}
.tvn{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--text);}
/* TWO BOXES, SIDE BY SIDE. Trevor, 2026-09-16: *"I was hoping to get
   Default, Pinned, Floating, Center. And then next to it i want the Resolution
   in a similar box next to it."* Same shell for both so they read as a pair --
   where the variable is up to, and how finely it is being looked at. */
.tst{
  font-size:.58rem;font-weight:700;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;white-space:nowrap;
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
}
/* THE SCHEME IS THE LIFECYCLE, not five arbitrary colours. A variable travels
   left to right, and the palette travels with it:

     DEFAULT   slate    nothing has happened to this one yet
     FLOATING  blue     active and moving
     CENTER    green    the centre keeps winning -- converging
     PINNED    amber    at the wall, and asking for something
     LOCKED    violet   done

   COOL TO WARM IS THE ATTENTION GRADIENT. Slate and blue are states you scroll
   past; amber is the one that wants you. That ordering is the whole point --
   PINNED has to win a glance down a column of twenty rows, and it only can if
   everything quieter than it actually is quieter.

   VIOLET FOR LOCKED because done is not a severity and not a regime. It used to
   share grey with DEFAULT, which put the two OPPOSITE ends of the lifecycle --
   never touched, and finished forever -- in the same colour. */
.tst.default{background:rgba(140,160,172,.12);color:#8CA0AC;}
.tst.floating{background:rgba(111,168,212,.16);color:#7FB6DE;}
.tst.center{background:rgba(95,190,149,.16);color:var(--good);}
.tst.pinned{background:rgba(224,139,74,.20);color:#F0A05E;}
/* A PIN UNDER 2σ -- same amber, turned down. Still a PINNED chip, because the
   streak is real; quieter, because the evidence behind it is not. */
.tst.pinned.weak{background:rgba(224,139,74,.09);color:rgba(240,160,94,.62);}
.tst.locked{background:rgba(169,139,224,.16);color:var(--done);}
/* 2026-09-23 -- a variable this task did NOT sweep, listed so the whole group
   is on the card; quieter than the ticked ones. */
.tvar.isheld{opacity:.62;}
/* 2026-09-25 -- a halted machine's why + what-to-do, on its card. */
.haltp{border-left:3px solid var(--warn);background:rgba(224,139,74,.07);
  border-radius:8px;padding:8px 11px;display:flex;flex-direction:column;gap:5px;}
.haltsteps{margin:0 0 0 18px;padding:0;color:var(--text);font-size:13px;line-height:1.5;}
.haltsteps li{margin:2px 0;overflow-wrap:anywhere;}
/* 2026-09-23 -- THE BALANCE OVERLAY. The wrapper is the crosshair's frame. */
.eqwrap{position:relative;}
.eqsvg{width:100%;height:auto;display:block;touch-action:pan-y;}
.eqtip{position:absolute;top:2px;pointer-events:none;z-index:2;
  background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:5px 8px;font-size:11px;line-height:1.45;color:var(--dim);
  white-space:nowrap;}
.eqtip b{color:var(--text);font-weight:600;}
.eqtip .eqsw{display:inline-block;width:9px;height:2px;margin-right:5px;
  vertical-align:middle;border-radius:1px;}
.eqleg{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim);}
.eqleg .eqrow{display:flex;flex-direction:row;align-items:center;gap:7px;min-width:0;}
.eqleg .eqsw{flex:0 0 14px;height:3px;border-radius:2px;}
.eqleg .eqnm{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.eqleg .eqsp{flex:1;}
.eqstep{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
.eqstep button{min-width:32px;height:28px;border-radius:7px;border:1px solid var(--line);
  background:var(--card-2);color:var(--text);font-size:13px;}
.eqstep button:disabled{opacity:.35;}
.eqstep .n{font-size:11px;color:var(--faint);min-width:44px;text-align:center;}
.eqlist{display:flex;flex-direction:column;gap:2px;margin-top:2px;}
.eqlist button{display:flex;gap:8px;align-items:baseline;text-align:left;
  background:transparent;border:0;border-radius:6px;padding:5px 6px;color:var(--dim);
  font-size:12px;}
.eqlist button.on{background:var(--tonal);color:var(--text);}
.eqlist .d{color:var(--faint);flex:0 0 auto;font-variant-numeric:tabular-nums;}
.eqlist .g{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 2026-09-23 -- a sweep from before tasks recorded their own states. Outlined,
   not filled: it is the absence of a state, and must not read as a sixth one. */
.tst.unrec{background:transparent;color:var(--faint);
  box-shadow:inset 0 0 0 1px rgba(140,160,172,.28);}
.tst.chased{background:transparent;color:#F0A05E;
  box-shadow:inset 0 0 0 1px rgba(224,139,74,.35);}
/* THE SWEPT RANGE wears the filled chip without wearing a STATE. Gold-tinted
   rather than one of the five lifecycle colours, because a range is not a
   position in that lifecycle and must not be read as one. Mono, since it is a
   pair of numbers and they should line up down a column. */
.tst.grid{
  background:rgba(224,180,87,.13);color:var(--gold);
  font-family:"Roboto Mono",ui-monospace,monospace;
  letter-spacing:0;text-transform:none;
}
/* RESOLUTION IS OUTLINED, NOT FILLED -- deliberately a different KIND of chip
   from the state beside it. Two filled chips in a row would read as two facts
   of equal weight, and they are not: the state is where the variable is, the
   resolution only says how finely the next sweep will look at it.

   It still carries a signal, one notch down: FULL is the normal case and stays
   neutral, COARSE is brighter because a COARSE variable is being looked at
   roughly -- "PINNED at COARSE" may only need a finer pass, "PINNED at FULL" is
   genuinely at the wall. Fixed width so a column of them lines up. */
.tvr{
  font-size:.58rem;font-weight:700;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;white-space:nowrap;
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  background:transparent;color:var(--faint);
  border:1px solid var(--line);
  min-width:58px;text-align:center;
}
.tvr.coarse{color:#C8B78A;border-color:rgba(224,180,87,.30);}
.tvr.full{color:var(--dim);}
/* 🔴 THE SWEEP'S FINENESS CHIP IS READ, NOT SCANNED. Trevor, 2026-09-17: *"the
   steps and resolutions is hard to read. it's not bright enough. too close to
   the background."* He is right, and the reason is that this chip inherited a
   style built for a different job: on the VARIABLES badge the resolution is a
   quiet qualifier beside a loud state, and being recessive is the point. Here it
   carries the actual numbers -- how many steps, what delta -- which is content,
   not decoration. So it takes the body colour and a visible edge.

   Three chips can outrun 375px once a variable name is long, so this row wraps
   rather than squeezing them into unreadability. */
/* NAME ON ITS OWN LINE, CHIPS ON THE NEXT. Three chips plus a name does not
   fit 375px, and letting flex squeeze the name instead turned "Entry Total Score
   Min" into three stacked words beside a tidy row of chips -- the least
   important thing on the row taking the most space. Giving the name the full
   first line costs one line and reads at a glance.

   The VARIABLES badge keeps its single-line shape: two chips and a name do fit,
   which is why this is a variant rather than a change to .tvar. */
.tvar.swept{flex-wrap:wrap;row-gap:5px;}
/* IN OR OUT OF THIS ROUND. Filled and gold when the sweep is moving it, hollow
   and faint when it is being held -- the same loud/quiet split the state chips
   use, applied to the more basic question. */
.tmem{
  font-size:.58rem;font-weight:700;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;white-space:nowrap;
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
}
.tmem.in{background:rgba(224,180,87,.18);color:var(--gold);}
.tmem.held{background:transparent;color:var(--faint);border:1px solid var(--line);}
/* A RIDER IS IN THE ROUND BUT NOT OF THE GROUP -- filled like SWEPT because it
   is being moved, but blue rather than gold so a glance down the column never
   mistakes one for a group variable. */
.tmem.rider{background:rgba(111,168,212,.20);color:#7FB6DE;}
/* Swept, not the group's, and nobody said it was a rider. That is two records
   disagreeing and it gets the colour this app reserves for wrong. */
.tmem.stray{background:rgba(224,104,90,.18);color:var(--bad);}
/* THE VERDICT CHIP. Widen and narrow are different ACTIONS, not two ends of one
   dial, so they get different colours rather than one scale -- and NO SIGNAL is
   deliberately the quietest thing on the row, because the honest answer to a
   shapeless response is to do nothing. */
.tshape{
  font-size:.58rem;font-weight:700;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;white-space:nowrap;
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
}
.tshape.widen{background:rgba(224,139,74,.20);color:#F0A05E;}
.tshape.narrow{background:rgba(95,190,149,.16);color:var(--good);}
.tshape.noisy{background:transparent;color:var(--faint);border:1px solid var(--line);}
/* The numbers that make the verdict actionable. Mono and unboxed -- it reads as
   the sentence the chip started, not as a fourth chip competing with it. */
/* ---------- the next-round rows ----------
   The name takes its own line for the reason the sweep badge's rows do: three
   chips plus a name does not fit 375px, and squeezing the name stacks it into
   three words beside a tidy row of chips. */
.nrv{
  border-top:1px solid var(--line);
  padding:9px 2px 3px;
}
.nrv:first-of-type{border-top:0;}
.nrn{font-size:.78rem;font-weight:600;color:var(--text);margin-bottom:5px;}
.nrc{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px;}
.nrw{
  font-size:.6rem;color:var(--faint);letter-spacing:.04em;
  font-family:"Roboto Mono",ui-monospace,monospace;
}
.tshaped{
  font-size:.66rem;color:var(--dim);
  font-family:"Roboto Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;
}
/* The curve button and its correlations, under the row they belong to. */
.tsub{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:-2px 0 4px 0;
}
.tcorr{
  font-size:.63rem;color:var(--faint);
  font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
}
.tvar.swept .tvn{flex:1 0 100%;}
.tvar.swept .tvr{
  color:var(--text);border-color:rgba(140,160,172,.45);
  font-family:"Roboto Mono",ui-monospace,monospace;
  letter-spacing:0;text-transform:none;min-width:0;
}

/* ---------- a variable is a button, and the graph is shared ---------- */
/* THE NAME IS THE CONTROL. Trevor, 2026-09-17: *"The Words of the Variable
   become the button ... I want them in Badges style like you've got on yours."*
   So it wears the same shell as the metric group chips -- same radius, same
   hairline, same on-state -- because it does the same job: it adds one series
   to a shared view. A second button shape for the same idea would be a second
   thing to learn.

   ON CARRIES THE SERIES COLOUR, set inline rather than by class. The colour is
   assigned by SELECTION ORDER, not by name, so it cannot be a stylesheet rule:
   the first variable you tap is gold whichever one it is. */
.vbtn{
  font-family:"Roboto Mono",ui-monospace,monospace;
  font-size:.735rem;font-weight:500;text-align:left;
  padding:2px 8px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);
  flex:1;min-width:0;overflow-wrap:anywhere;
}
.vbtn:active{transform:translateY(1px);}
/* A VARIABLE WITH NO HISTORY IS NOT A BUTTON. Same rule as a results row with
   no job behind it: nothing that does nothing may look tappable. */
.vbtn.flat{border-color:transparent;padding-left:0;cursor:default;}
.vhwrap{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
.vhempty{font-size:.72rem;color:var(--faint);line-height:1.45;}
.vhsvg{width:100%;height:auto;display:block;border-radius:7px;background:var(--bg);
  cursor:zoom-in;}

/* FULL SCREEN, SIDEWAYS. Fixed to the viewport, above the sticky header and the
   tab bar -- both of which are the app's own furniture and would otherwise sit
   on top of a thing that is supposed to be the whole screen. */
.gfull{
  position:fixed;inset:0;z-index:80;background:var(--bg);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.gfullin{
  display:flex;flex-direction:column;justify-content:center;gap:10px;
  padding:16px;box-sizing:border-box;width:100%;height:100%;
  /* NOT SHRINKABLE. As a flex child of a 375px-wide overlay, `width:100vh`
     (812px) was being squeezed straight back down to 375 -- the one dimension
     the rotation exists to escape. */
  flex:none;
}
.gfullin .vhsvg{cursor:zoom-out;height:auto;}
.gfx{
  align-self:flex-end;font-family:inherit;font-size:.72rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:var(--dim);border:1px solid var(--line);
  border-radius:9px;padding:5px 12px;cursor:pointer;
}
/* THE ROTATION ONLY HAPPENS IN PORTRAIT. Sized to the SWAPPED viewport so that
   after the quarter turn it fills the screen exactly. A phone already held
   sideways needs none of this and gets none of it. */
@media (orientation:portrait){
  .gfullin{width:100vh;height:100vw;transform:rotate(90deg);}
}
.vhcap{font-size:.65rem;color:var(--faint);line-height:1.5;margin-top:5px;}
/* The history table. Same grid discipline as .mrw -- a column of numbers only
   reads as a column if every row agrees where it starts. */
.vht{
  width:100%;font-family:"Roboto Mono",ui-monospace,monospace;
  font-size:.63rem;font-variant-numeric:tabular-nums;
  border-collapse:collapse;margin-top:8px;
}
.vht th{
  font-size:.55rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700;text-align:right;padding:0 4px 3px;
}
.vht th:first-child,.vht td:first-child{text-align:left;}
.vht td{padding:3px 4px;border-top:1px solid var(--line);color:var(--dim);text-align:right;}
/* NOT `.v` -- that class already belongs to the swept-variable list, where it
   draws a bullet with ::before and sets display:flex. Reusing the name put a
   stray dot in front of every number in this table. */
.vht td.vhv{color:var(--text);font-weight:600;}
.vht td.st{font-size:.55rem;font-weight:700;letter-spacing:.05em;}
/* The swatch that ties a table block to its line on the graph. */
.vhkey{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;}

/* ---------- the metrics badge's own graph ---------- */
/* THE DOT IS THE TOGGLE. A metric row is already a button that opens its
   explanation, so the thing that puts it on the graph cannot also be the row --
   it is a target of its own at the start of the line, where a column of them
   reads as a column. Hollow = off, filled = on and carrying that series colour. */
.mdot{
  width:9px;height:9px;border-radius:50%;flex:none;
  border:1.5px solid var(--faint);background:transparent;padding:0;
  cursor:pointer;margin-right:7px;
}
.mrw .nm{display:flex;align-items:center;min-width:0;}
/* THE GRAPH FOLLOWS YOU DOWN THE CARD. Trevor, 2026-09-17: *"I want the graph
   to be locked to the top of the screen as soon as we scroll down. if we go
   above it, it's not locked."* Which is exactly what sticky does and nothing
   more -- it sits in flow until its top edge would leave, then holds there.

   `top` IS SET FROM JS, not typed here. The header is itself sticky at top:0, so
   a hard-coded offset would be wrong the moment the header wraps to two lines --
   which it does at 375px with a long group name. See stickTop(). */
.gbadge{position:sticky;top:var(--hdr,64px);z-index:4;}
/* It is over live content once it sticks, so it needs to be opaque and to cast
   a little shade -- without this the rows scroll THROUGH it. */
.gbadge > .card-in{background:var(--card);border-radius:14px;}
.gbadge{box-shadow:0 6px 14px rgba(10,16,22,.55);}
/* PINNED, THE PROSE GOES. Trevor, 2026-09-17: *"lets remove those captions as
   soon as we start scrolling."* The caption and the history table are for
   reading; once the card is holding the top of the screen its whole job is to be
   a picture you glance at while the rows go past underneath. Unpinned they come
   back -- nothing is lost, it is deferred.

   THE COLLAPSE IS A REVEAL, NOT A LURCH, and that is worth stating because it
   sounds like one. The card only ever collapses at the moment its top reaches
   the header -- when it already fills most of the screen -- so the content that
   moves up into the gap is content that was below the fold anyway. No scroll
   compensation is needed and none is done; compensating would fight momentum
   scrolling on a phone for no gain.

   max-height rather than display:none so it eases instead of snapping. The value
   only has to be comfortably larger than the tallest table this ever holds. */
.gbadge .vht,.gbadge .vhcap{
  overflow:hidden;max-height:600px;opacity:1;
  transition:max-height .18s ease,opacity .12s ease,margin .18s ease;
}
.gbadge.stuck .vht,.gbadge.stuck .vhcap{max-height:0;opacity:0;margin-top:0;margin-bottom:0;}
@media (prefers-reduced-motion:reduce){
  .gbadge .vht,.gbadge .vhcap{transition:none;}
}

/* No rule above it any more: on its own card the graph header is the first
   thing in the box, and a border there would draw a line under nothing. */
.mghead{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.mgttl{
  font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);flex:1;min-width:0;
}
.mgbtn{
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.58rem;font-weight:700;
  letter-spacing:.06em;padding:2px 8px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--dim);
}
.mgbtn.on{border-color:var(--gold);color:var(--gold);}
.mglg{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.mglgr{
  display:flex;align-items:baseline;gap:6px;width:100%;text-align:left;
  font-size:.66rem;font-family:"Roboto Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;color:var(--dim);
  /* A row that removes a line has to look like it does something without
     becoming a fifth button shape on this card: the press, and a rail that
     only shows while it is held. */
  background:transparent;border:0;border-left:2px solid transparent;
  padding:2px 0 2px 7px;margin-left:-9px;cursor:pointer;border-radius:4px;
}
.mglgr:active{transform:translateY(1px);background:var(--card-2);border-left-color:var(--faint);}
/* An absence is not a control -- it has nothing to remove and must not invite a
   tap. Rendered as a div rather than a button for the same reason. */
.mglgr.none{color:var(--faint);cursor:default;font-style:italic;}
.mglgr:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}

/* ---------- the pass table ---------- */
/* A ROW IS A GRID, not a paragraph -- the columns are chosen at runtime, so the
   template is set inline from however many are on. */
.optr{
  width:100%;display:grid;gap:8px;align-items:baseline;text-align:right;
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.72rem;
  font-variant-numeric:tabular-nums;color:var(--text);
  background:transparent;border:0;border-top:1px solid var(--line);
  padding:6px 3px;cursor:pointer;
}
.optr > span:first-child{text-align:left;}
.optr:active{transform:translateY(1px);}
.optr.on{background:rgba(224,180,87,.10);}
.optr.on .optp{color:var(--gold);}
.opth{
  cursor:default;border-top:0;padding-bottom:2px;
  font-size:.55rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700;
}
.opth:active{transform:none;}
.optp{font-weight:700;}
/* OUT OF BAND, on the pass itself, so it survives whichever columns are shown. */
.optp.oob{color:var(--warn);}
.mglgr .nm{flex:1;min-width:0;color:var(--text);overflow-wrap:anywhere;}
.mgdash{display:inline-block;width:11px;height:2px;border-radius:1px;flex:none;}
/* The count of what is PLOTTED, on a group chip that is otherwise about what is
   listed. Gold because it survives the filter -- see the note in taskMetrics. */
.gch .p{color:var(--gold);font-weight:700;margin-left:4px;}

/* A badge that is named but not built. It says so plainly rather than
   rendering an empty card, which would read as a badge that is broken. */
.soon{
  font-size:.73rem;color:var(--faint);line-height:1.5;
}
.soon b{color:var(--dim);font-weight:600;}

/* ---------- the session badge ---------- */
.srw{
  width:100%;display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;
  align-items:baseline;background:transparent;cursor:pointer;text-align:left;
  border:0;border-top:1px solid var(--line);padding:5px 3px;
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.7rem;
  color:var(--dim);font-variant-numeric:tabular-nums;
}
.srw .snm{color:var(--text);overflow-wrap:anywhere;}
.srw.on .snm{color:var(--gold);}
.srw .spips{font-weight:600;}
.srw .spips.up{color:var(--good);}
.srw .spips.dn{color:var(--bad);}
/* Same dot as the metrics badge -- one shape for "this is on", page-wide. */
.sdot{
  width:9px;height:9px;border-radius:50%;flex:none;align-self:center;
  border:1.5px solid var(--faint);background:transparent;
}
.srw.on .sdot{background:var(--gold);border-color:var(--gold);}
/* WHAT A NUMBER IS, when a session is picked: a slice of the run, or the whole
   run because it cannot be cut. Quiet -- it qualifies the number beside it. */
.mws{font-size:.58rem;font-style:italic;color:var(--faint);white-space:nowrap;}
.mrw.ses{grid-template-columns:1fr auto auto auto;}
.mhd.ses{grid-template-columns:1fr auto auto auto;}
/* A row that CANNOT be re-sliced is dimmed whole, because the number it is
   showing is not the number the rest of the card is showing. */
.mrw.na{opacity:.45;}
/* The slope row carries one column more than a session row: the lift figure. */
.srw.slb{grid-template-columns:auto 1fr auto auto auto;}
.mhd.sl{grid-template-columns:1fr auto auto auto;}
.sbid{margin-left:6px;}
.slift{font-weight:700;font-variant-numeric:tabular-nums;}
.slift.up{color:var(--good);}
.slift.dn{color:var(--faint);}
/* Share of net, as a bar rather than a fifth number. It is a proportion of a
   whole that is already on the row, so it wants a shape, not a digit. */
.sbar{height:3px;border-radius:2px;background:var(--line);margin:0 3px 5px;}
.sbar i{display:block;height:100%;border-radius:2px;}


/* The trade-band verdict. IN BAND is the quiet one; both misses are loud,
   because a round outside the band is a round whose result the EA discounted. */
.tband{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-size:.76rem;font-variant-numeric:tabular-nums;
}
.tbv{font-weight:700;}
.tbv.inband{color:var(--good);}
.tbv.under{color:var(--bad);}
.tbv.over{color:var(--warn);}
.tbv.unknown{color:var(--faint);font-weight:600;}
.tbm{color:var(--dim);font-family:"Roboto Mono",ui-monospace,monospace;font-size:.68rem;}

/* A graph is the one output you want to SEE rather than tap, so it is drawn
   rather than turned into a button. Bounded height: a curve is wider than it is
   tall and an unbounded one pushes everything below it off the screen. */
.tgraph{
  width:100%;border-radius:7px;border:1px solid var(--line);
  background:var(--bg);display:block;
}
.tgcap{font-size:.65rem;color:var(--faint);margin-top:3px;}
/* ---- test results, 2026-09-17 ----
   The card carried ONE of these (cadence.profit_factor). task_metrics publishes
   the rest off the artifacts the task already wrote. */
.mgrp{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:5px;}
.gch{
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.6rem;font-weight:500;
  padding:2px 7px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--dim);
}
.gch.on{background:var(--tonal);color:var(--gold);border-color:var(--gold);}
.gch .n{opacity:.55;margin-left:3px;}
.mhd{display:grid;grid-template-columns:1fr auto auto;gap:6px;
     font-size:.55rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
     padding:0 3px 3px;text-align:right;font-family:"Roboto Mono",ui-monospace,monospace;}
.mhd span:first-child{text-align:left;}
.mrw{
  width:100%;display:grid;grid-template-columns:1fr auto auto;gap:6px;
  align-items:baseline;background:transparent;cursor:pointer;text-align:right;
  border:0;border-top:1px solid var(--line);padding:4px 3px;
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.69rem;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.mrw:hover{background:rgba(224,180,87,.06);}
.mrw .nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
         border-bottom:1px dotted rgba(140,160,172,.35);}
.mrw .vv{color:var(--text);font-weight:500;}
.mrw.open .nm{color:var(--text);border-bottom-style:solid;}
/* ARROW = which way it moved. COLOUR = whether that was good. A falling
   drawdown is a GREEN down-arrow; collapsing the two would either colour an
   improvement red or point the arrow the wrong way. */
.mv{font-size:.55rem;font-weight:700;padding:2px 5px;border-radius:4px;
    white-space:nowrap;display:inline-flex;gap:3px;align-items:center;
    font-family:"Archivo","Segoe UI",system-ui,sans-serif;justify-self:end;}
.mv.up{background:rgba(95,190,149,.16);color:var(--good);}
.mv.dn{background:rgba(224,104,90,.16);color:var(--bad);}
.mv.fl{background:rgba(140,160,172,.12);color:#8CA0AC;}
.mdf{font-size:.66rem;color:var(--faint);line-height:1.45;padding:3px 3px 6px;}

/* The state key. Indented under the list it explains, and quiet -- it is a
   reminder for the reader who has forgotten the vocabulary, not a finding. */
/* The open task, standing on its own rather than inside a timeline row. */
.tpanel{
  background:var(--card);border-radius:11px;padding:12px 13px;
  display:flex;flex-direction:column;gap:9px;
}
.tphead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.tpk{font-size:.86rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.tpw{font-size:.68rem;color:var(--faint);font-family:"Roboto Mono",ui-monospace,monospace;}
.tpran{
  font-size:.68rem;color:var(--dim);font-family:"Roboto Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
}
.tpran.none{color:var(--faint);}
.tpanel .task{background:transparent;border:0;padding:0;margin-top:0;}
.tkey{display:flex;gap:8px;align-items:baseline;margin-top:6px;}
.tkt{font-size:.68rem;color:var(--faint);line-height:1.45;flex:1;min-width:0;}

/* THE ROW IS THE BUTTON. It was a div; making the whole thing tappable is what
   "clickable from any job card" means, and a small chevron on its own would be
   a target nobody hits on a phone. */
.tlr.tappable{cursor:pointer;}
.tlr.tappable .tlh:after{
  content:"\203A";color:var(--faint);font-size:.9rem;line-height:1;
  margin-left:auto;padding-left:6px;transition:transform .12s;
}
.tlr.tappable.open .tlh:after{content:"\2039";}

/* ---------- picking a pass, in the app ---------- */
/* MOCKUP -- PREVIEW ONLY, NOT IN THE LIVE PAGE. Trevor, 2026-09-16: *"I want to
   apply the pass number on the app now rather than reply with telegram. Lets
   see what that would look like."* This is the dev sandbox doing its job: the
   format is tried here before anything is ported.

   ⚠️ THE APP CANNOT APPLY ANYTHING TODAY. It is a static page on Pages reading
   a published snapshot -- there is no write path back to the machines at all.
   The reply-to-Telegram route exists precisely because the bot is the only
   inbound channel that reaches them. So this is a picture of a screen, and the
   channel underneath it is a separate build. */
.pick{
  border-top:1px solid var(--line);
  padding-top:11px;display:flex;flex-direction:column;gap:9px;
}
.pickhd{
  font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold);
}
.picksub{font-size:.73rem;color:var(--dim);line-height:1.45;}
/* NOTHING ON CADENCE is a different claim, not a footnote -- see
   notify.format_recommendation, which refuses to let that case print under the
   heading it would otherwise inherit. Same rule, same words, one surface. */
.pickwarn{
  font-size:.72rem;color:var(--warn);line-height:1.45;
  background:rgba(224,139,74,.09);border-radius:7px;padding:7px 9px;
}
.pickrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  font-family:inherit;color:var(--text);cursor:pointer;
  background:var(--card-2);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;
}
.pickrow.on{border-color:var(--gold);background:rgba(224,180,87,.10);}
.pickrow .rk{
  font-size:.62rem;font-weight:700;color:var(--faint);
  width:14px;flex:none;font-variant-numeric:tabular-nums;
}
.pickrow.on .rk{color:var(--gold);}
.pickp{font-size:.82rem;font-weight:700;white-space:nowrap;}
.pickm{
  font-size:.67rem;color:var(--dim);font-family:"Roboto Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;line-height:1.4;
}
.pickme{flex:1;min-width:0;}
.pickpf{font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums;}
/* THE FREE FIELD IS NOT A FALLBACK. Trevor picks from the workbook as often as
   from the ranking, and a form that only offers three passes out of 8,192 is a
   form that gets abandoned for the one that takes any number. */
.pickother{display:flex;align-items:center;gap:8px;}
.pickother label{font-size:.72rem;color:var(--dim);white-space:nowrap;}
.pickin{
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.82rem;
  background:var(--card-2);color:var(--text);
  border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;width:104px;
  font-variant-numeric:tabular-nums;
}
.pickin:focus{outline:none;border-color:var(--gold);}
/* Narrower than the pass picker's: it sits at the end of a row of chips
   rather than on a line of its own. */
.schedin{width:82px;padding:4px 8px;font-size:.72rem;}
.applyb{
  font-family:inherit;font-size:.8rem;font-weight:700;letter-spacing:.01em;
  border:0;border-radius:9px;padding:11px 12px;width:100%;
  background:var(--gold);color:#1A1204;cursor:pointer;
}
.applyb:disabled{background:var(--card-2);color:var(--faint);cursor:default;}
.applyb:active:not(:disabled){transform:translateY(1px);}
.pickfoot{font-size:.68rem;color:var(--faint);line-height:1.45;}
/* THE WAY IN. Full width with a chevron, because that is this app's own shape
   for "this opens something" -- the same read as a home button or a results
   row. Tonal rather than gold: it must be findable at a glance without
   competing with the beacon warning that often sits right above it. */
.opsopen{
  width:100%;display:flex;align-items:center;gap:9px;
  font-family:inherit;font-size:.8rem;font-weight:600;color:var(--text);
  background:var(--card-2);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;
  margin-top:2px;
}
.opsopen:active{transform:translateY(1px);}
.opsopen:focus-visible{outline:2px solid var(--gold);outline-offset:-3px;}
.opsopen.on{border-color:var(--gold);color:var(--gold);}
.opsog{font-size:.95rem;line-height:1;color:var(--dim);}
.opsopen.on .opsog{color:var(--gold);}
.opsol{flex:1;min-width:0;}
.opsoc{color:var(--faint);font-size:1rem;line-height:1;}

/* What broke, on which machine, how long ago. Quiet: it qualifies the line
   above it rather than competing with the group name. */
.failwhy{
  font-size:.68rem;color:var(--faint);line-height:1.45;margin-top:3px;
  font-family:"Roboto Mono",ui-monospace,monospace;overflow-wrap:anywhere;
}

/* One surviving pass folder, and whether anything claims it. */
.failrow{
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  font-size:.72rem;padding:5px 2px;border-top:1px solid var(--line);
  font-family:"Roboto Mono",ui-monospace,monospace;
}
.failp{font-weight:700;color:var(--text);}
.failr{color:var(--dim);}
/* ORPHAN IS THE LOUD ONE. A claimed folder is already reachable from Results
   and needs no attention; an unclaimed one is evidence nothing points at. */
.failc{font-size:.63rem;margin-left:auto;}
.failc.ok{color:var(--faint);}
.failc.orphan{color:var(--warn);font-weight:700;}

/* ---------- the operations panel ---------- */
.opsp{
  border-top:1px solid var(--line);margin-top:9px;padding-top:9px;
  display:flex;flex-direction:column;gap:2px;
}
.opsst{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:.72rem;color:var(--dim);margin-bottom:4px;
}
.opsdot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.opsdot.good{background:var(--good);}
.opsdot.bad{background:var(--bad);}
.opssep{color:var(--faint);}
.opsage{color:var(--faint);font-size:.66rem;}
.opsh{
  font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin:9px 0 5px;
}
.opsrow{display:flex;flex-wrap:wrap;gap:6px;}
.opsb{
  flex:1 1 auto;min-width:calc(50% - 3px);
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-size:.74rem;font-weight:600;
  color:var(--text);background:var(--card-2);border:1px solid var(--line);
  border-radius:8px;padding:9px 8px;cursor:pointer;
}
.opsb:active{transform:translateY(1px);}
/* LOUD IS A BORDER, NOT A FILL. Three filled red buttons in one row read as an
   error state rather than as three controls that happen to be serious. */
.opsb.loud{color:var(--bad);border-color:rgba(224,104,90,.45);}
.opsb.armed{
  flex:1 1 100%;background:rgba(224,104,90,.14);border-color:var(--bad);
  color:var(--bad);
}
/* The unarmed buttons stay visible while something is armed -- you must be able
   to read what you did NOT pick -- but they cannot be mistaken for the live one. */
.opsb.dim{opacity:.38;}
.opsb.cancel{flex:1 1 100%;color:var(--dim);}
.opsarm{
  font-size:.72rem;color:var(--bad);line-height:1.45;
  background:rgba(224,104,90,.10);border-radius:7px;padding:8px 10px;margin-top:6px;
}
.opsopt{
  display:flex;align-items:baseline;gap:8px;
  padding:6px 2px;font-size:.74rem;color:var(--dim);
}
.opsopt.on{color:var(--text);}
.opsr{color:var(--faint);font-size:.7rem;}
.opsopt.on .opsr{color:var(--gold);}
.opsl{font-weight:600;min-width:98px;}
.opsn{font-size:.66rem;color:var(--faint);}
.opsunk{font-size:.66rem;color:var(--warn);padding:3px 2px 0;}
.opsnote{font-size:.66rem;color:var(--faint);line-height:1.45;padding:4px 2px 0;}
.opsdis{
  font-size:.7rem;color:var(--warn);line-height:1.45;
  background:rgba(224,139,74,.10);border-radius:7px;padding:8px 10px;margin-top:6px;
}
.pickdone{
  font-size:.75rem;color:var(--good);line-height:1.45;
  background:rgba(95,190,149,.10);border-radius:7px;padding:9px 10px;
}
.pickwarn{
  font-size:.75rem;color:var(--bad);line-height:1.45;
  background:rgba(224,104,90,.10);border-radius:7px;padding:9px 10px;
}
/* The withheld count sits with the slice chips because it describes the
   POPULATION the slices are cut from, not a footnote about one of them. */
.optheld{
  font-size:.7rem;color:var(--warn);line-height:1.45;
  background:rgba(224,139,74,.10);border-radius:7px;
  padding:7px 9px;margin:6px 0 2px;
}

/* ---------- results rows ---------- */
.row{
  background:var(--card);
  border-radius:11px;
  padding:11px 12px;
  display:flex;flex-direction:column;gap:7px;
}
.row-top{display:flex;align-items:center;gap:7px;}
.row-grp{
  font-size:.85rem;font-weight:600;letter-spacing:-.005em;
  flex:1;min-width:0;line-height:1.3;
}
/* THE DATE SITS UNDER THE ROW, NOT IN IT. Trevor, 2026-09-16: *"the date can go
   where the red horizontal line. It'll allow longer group names on one line."*
   It was the last thing on the title row, so a long group name wrapped to a
   second line to make room for a timestamp nobody scans first. Down here it
   costs no width at all, and it joins the mono meta line that already carries
   the round number and the machine -- which is where a reader looking for
   "when" was going to end up anyway. */
.row-foot .row-when{margin-left:auto;}
/* THE BUCKET ID WEARS THE CHIP SCHEMA. Trevor, 2026-09-16: its font and
   schema did not match the three chips it sits between, and it was *"too
   close to the background."* It sat in the same row as three chips as a bare
   grey number in the body font -- a different size, a different weight, no
   tracking, no plate -- so it read as something that had leaked into the row
   rather than as one of its parts. Same metrics as .chip now; tabular on top,
   so a column of ids still lines up down the results list.

   THE COLOUR IS THE ONE THING IT DOES NOT SHARE with .chip, and it is not
   decoration -- see bktEl() for what the gradient means.

   One class, used by the results row and the machine card, so the two cannot
   drift apart. inline-block because in the results row it sits inside wrapping
   prose, where a padded inline box would otherwise bleed through the line. */
/* A results row is a BUTTON now, not a card: the whole row opens the job. */
.row.jrowbtn{
  width:100%;text-align:left;font-family:inherit;color:var(--text);
  border:0;cursor:pointer;
}
.row.jrowbtn:active{transform:translateY(1px);}
.row-car{color:var(--faint);font-size:.95rem;line-height:1;padding-left:4px;}
/* Which row you were sent to. Loud enough to find in a list of twenty, gone
   again before it becomes decoration. On the SHELL, so it rings the whole card. */
.jrow.flash .card{box-shadow:0 0 0 2px var(--gold);}
@media (prefers-reduced-motion:no-preference){
  .jrow .card{transition:box-shadow .25s ease;}
}
/* THE CONTROL ROW. The same chips as a results row, doing the other job: these
   say what the list is showing, and tapping one moves it on. Kept beside the
   count so the state of the list and the size of it are read together. */
.rctl{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:0 2px 9px;
}
.rctl .rlab{
  font-size:.62rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-right:2px;
}
/* A CHIP THAT DOES SOMETHING looks like it does: the inert ones on a row are
   flat, these carry a hairline. Without it the only difference between a label
   and a control is that one of them moves when you tap it. */
.cchip{
  font-family:inherit;border:1px solid var(--line);cursor:pointer;
  font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;white-space:nowrap;
  background:var(--card-2);color:var(--dim);
}
.cchip:active{transform:translateY(1px);}
/* ON means the list is narrowed -- the one state you must not have to hunt for
   when rows are missing. */
.cchip.on{background:rgba(224,180,87,.15);color:var(--gold);border-color:rgba(224,180,87,.35);}
.cchip .car{opacity:.55;font-weight:400;}
/* NOTHING INSIDE A RESULTS ROW IS A CONTROL. Trevor, 2026-09-16: *"I had
   initially thought that the chip themselves would work as the switch, but I
   like your idea better."* The control row above owns every filter, which means
   the row needs no exceptions -- the WHOLE grey box is the button, with no
   small targets inside it that do something else when mis-tapped. */
/* MATCHED BY ORDER, NOT BY KEY. Rows written before round_id was recorded are
   placed positionally -- a sound guess, and still a guess. It is said on the
   job it qualifies rather than in a footnote, because the reader is about to
   open these exact reports. */
.inexact{
  font-size:.7rem;color:var(--warn);line-height:1.45;
  background:rgba(224,139,74,.09);border-radius:7px;padding:8px 10px;
  margin-bottom:10px;
}
.bkt{
  display:inline-block;vertical-align:baseline;
  font-size:.65rem;font-weight:700;letter-spacing:.05em;line-height:1.15;
  padding:3px 7px;border-radius:5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
  background:var(--tonal);
}
/* THE DIGITS ARE FILLED WITH THE GRADIENT, not coloured flat, which needs a
   second box: the plate above carries its own background and background-clip
   would eat it. <i> for brevity in a string that is built per row; the font
   style it would normally imply is turned back off.

   THE FALLBACK IS A REAL COLOUR, not transparent text. Everything that renders
   this page supports background-clip:text, but "unsupported" here would mean an
   INVISIBLE id rather than a plainer one, and that is not a failure worth
   risking for a gradient. bktEl() sets the flat colour inline; the @supports
   only takes it away where the clip will actually paint. */
.bkt i{font-style:normal;}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .bkt i{-webkit-background-clip:text;background-clip:text;
         color:transparent;-webkit-text-fill-color:transparent;}
}
.row-when{font-size:.67rem;color:var(--faint);font-family:"Roboto Mono",ui-monospace,monospace;white-space:nowrap;}
.row-pf{
  display:flex;gap:16px;font-size:.75rem;
  font-variant-numeric:tabular-nums;
}
.row-pf .lab{color:var(--faint);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;}
.pf{display:flex;align-items:baseline;gap:5px;}
.pf b{font-weight:600;}
.delta{font-weight:700;font-size:.73rem;}
.delta.up{color:var(--good);}
.delta.dn{color:var(--bad);}
.delta.flat{color:var(--faint);}
/* wrap, because the date moved in here and a narrow phone with `heavy` set
   would otherwise push it off the edge rather than onto a second line. */
.row-foot{
  display:flex;gap:12px;font-size:.68rem;color:var(--faint);
  font-family:"Roboto Mono",ui-monospace,monospace;
  flex-wrap:wrap;align-items:baseline;
}

.empty{
  color:var(--faint);font-size:.85rem;text-align:center;
  padding:40px 20px;line-height:1.6;
}

/* ---------- tab bar ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,16,22,.96);
  border-top:1px solid var(--line);
  display:flex;
  max-width:460px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(8px);
}
nav button{
  flex:1;background:transparent;border:0;cursor:pointer;
  padding:10px 4px 12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:inherit;font-size:.68rem;font-weight:600;
  color:var(--faint);letter-spacing:.01em;
}
nav button .ic{font-size:1.05rem;line-height:1;}
nav button[aria-selected="true"]{color:var(--gold);}
nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-3px;}

/* ---------- live (the VPS: account, open trade, history, chart) ---------- */
/* Everything here is prefixed lv- so it cannot collide with a fleet card. */
.lv-dot{
  display:inline-block;width:12px;height:12px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 0 rgba(224,180,87,.55);
  animation:lvpulse 2s infinite;
}
.lv-dot.off{background:var(--faint);animation:none;}
@keyframes lvpulse{
  0%{box-shadow:0 0 0 0 rgba(224,180,87,.55);}
  70%{box-shadow:0 0 0 9px rgba(224,180,87,0);}
  100%{box-shadow:0 0 0 0 rgba(224,180,87,0);}
}
@media (prefers-reduced-motion:reduce){.lv-dot{animation:none;}}
.lv-good{color:var(--good);}
.lv-bad{color:var(--bad);}
.lv-mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.lv-note{
  font-size:.76rem;line-height:1.45;border-radius:9px;padding:8px 11px;
  background:var(--card);color:var(--dim);
}
.lv-note.warn{background:rgba(224,139,74,.1);border:1px solid rgba(224,139,74,.25);color:var(--warn);}
.lv-note b{font-weight:700;}
.lv-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;}
.lv-stat{background:var(--card);padding:10px 12px 11px;display:flex;flex-direction:column;gap:1px;min-width:0;}
.lv-k{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--faint);}
.lv-v{font-family:"Roboto Mono",ui-monospace,monospace;font-size:1.02rem;font-weight:500;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
.lv-dir{
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.72rem;font-weight:500;
  padding:2px 6px;border-radius:5px;background:var(--card-2);color:var(--text);white-space:nowrap;
}
.lv-dir .ar{color:var(--gold);}

/* trading in */
.lv-tin{padding:12px 13px 6px;gap:8px;}
.lv-tinhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.lv-pill{
  margin-left:auto;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;white-space:nowrap;
}
.lv-pill.on{background:rgba(95,190,149,.16);color:var(--good);}
.lv-pill.off{background:rgba(95,114,126,.18);color:var(--dim);}
.lv-line{font-size:.78rem;color:var(--dim);line-height:1.45;}
.lv-line b{color:var(--text);font-weight:500;font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.lv-line.warn{color:var(--warn);}
.lv-gates{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:2px;}
.lv-grow{
  display:grid;grid-template-columns:auto auto 1fr auto;gap:4px 8px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:.74rem;
}
.lv-grow:last-child{border-bottom:0;}
.lv-grow.cur{box-shadow:inset 3px 0 0 var(--gold);background:rgba(224,180,87,.05);
  margin:0 -13px;padding:7px 13px 7px 10px;}
/* The reading sits on its own line under the chips: beside them, at phone
   width, it lost its date to an ellipsis. */
.lv-gpf{grid-column:1 / -1;font-family:"Roboto Mono",ui-monospace,monospace;color:var(--dim);
  font-size:.7rem;font-variant-numeric:tabular-nums;}
.lv-gpf b{color:var(--text);font-weight:500;}
.lv-gst{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.lv-gst.on{color:var(--good);}
.lv-gst.off{color:var(--faint);}

/* chart */
.lv-chead{display:flex;align-items:baseline;gap:9px;padding:12px 13px 8px;flex-wrap:wrap;}
.lv-sym{font-weight:700;letter-spacing:.02em;}
.lv-px{font-family:"Roboto Mono",ui-monospace,monospace;font-size:1.05rem;font-variant-numeric:tabular-nums;}
.lv-spread{font-family:"Roboto Mono",ui-monospace,monospace;font-size:.72rem;color:var(--faint);}
.lv-acct{margin-left:auto;}
.lv-controls{display:flex;gap:8px;padding:0 10px 8px;align-items:center;flex-wrap:wrap;}
.lv-seg{display:flex;background:var(--bg);border-radius:9px;padding:2px;gap:2px;}
.lv-seg button{
  border:0;background:transparent;cursor:pointer;color:var(--dim);
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.74rem;
  padding:5px 8px;border-radius:7px;min-width:34px;
}
.lv-seg button[aria-pressed="true"]{background:var(--card-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--gold);}
.lv-seg.small button{min-width:0;padding:5px 7px;font-family:inherit;font-size:.72rem;}
.lv-seg button:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
.lv-ohlc{
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.68rem;color:var(--dim);
  padding:0 13px 4px;min-height:1.4em;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lv-ohlc b{font-weight:500;color:var(--text);}
.lv-chart{height:300px;position:relative;}
.lv-legend{
  display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 13px 11px;

<script>
const EPOCH = "V3.0.0";

// NO DATA IS BAKED INTO THIS REPO. The repo is public (GitHub Pages requires
// that on a free account), and anything committed here is in the git history
// permanently -- deleting a file later does not remove it. Performance figures
// and group/variable names are "how it is built", which is the half Trevor
// wants private: people should copy the ACCOUNT, not rebuild the system.
/* 🔴 WHICH BUILD IS THIS PHONE ACTUALLY RUNNING. 2026-09-18, after an hour of
   guessing: a badge was missing, and neither of us could tell whether the code
   was wrong or the page was stale. Every proxy test I invented was weaker than
   it looked -- "you would see the old Skip button" failed because that button
   only rendered while a machine was RUNNING, so its absence proved nothing.

   The page is served from a public host with ordinary cache headers and there
   is no service worker, so a stale copy is normal and expected. What was
   missing is any way to SAY so. publish.py rewrites this line as it commits;
   "dev" means the file was never published, which is what the preview shows. */
const APP_BUILD = "20260925-213827";

let FLEET = [], LEDGER = [], SEEDS = [], FAILURES = [], BUCKETS = [], TIMELINES = [];
let CURVES = [];
/* The published queue, or null when the snapshot predates it -- null, not
   [], so the page can fall back to the seeds-only queue it always had. */
let QUEUE = null;
let QUEUE_HELD = {};
/* Rounds waiting on a PASS PICK, in Telegram's own numbering. */
let PICKS = [];
/* Per-agent lending hours per day, and why it was not lending the rest of
   the time. {} until a machine has actually lent something. */
let AGENTEFF = {};
/* Who fed each controller, keyed by controller machine name. */
let AGENTCONTRIB = {};
/* The four words for where a variable is up to, explained -- published once at
   the top of the snapshot rather than repeated on every variable. {} until a
   snapshot carrying it arrives, which is what an older publisher sends. */
let STATE_TEXT = {};
/* Where the report files can be fetched, when something is serving them. null
   is the normal resting state -- the machine that ran the round has to be on
   for its files to exist anywhere at all. */
/* THE NAME IS DELIBERATE, AND SHORTER THAN IT WAS. It used to be prefixed with
   one of job_control's PHASE constants, which puts it on publish.py's derived
   denylist -- and that scan is a SUBSTRING match, on purpose, so a group id
   buried inside a longer identifier cannot slip past it. The old name therefore
   refused every publish that touched a line mentioning it, over a collision
   that was never a leak.

   RENAMING THE IDENTIFIER IS THE FIX. Loosening the scan to special-case this
   would trade a real protection for a cosmetic convenience, and the next thing
   it failed to catch would be an actual one. The snapshot key this reads
   (`reports_base`, lower case) is untouched -- the wire format did not move. */
let FILE_BASE = null;

const REGIME_CLASS = { BULL: "bull", BEAR: "bear", RANGING: "range" };
const ACRONYMS = new Set(["ATR","EMA","MA","BB","SL","TP","RSI","ADX","MACD","OHLC","PF"]);
const TIMEFRAMES = new Set(["M1","M5","M15","M30","H1","H4","D1","W1","MN1"]);

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* Mirrors message_doc.humanize_group -- one implementation per renderer is the
   cost of the split; the canonical id always travels alongside so a tap can
   still look the group up. */
function humanize(gid){
  if(!gid) return "";
  let n = String(gid).replace(/^(BULL|BEAR|RANGING|GLOBALS)_/, "");
  return n.split("_").filter(Boolean).map(t => {
    const u = t.toUpperCase();
    if(ACRONYMS.has(u) || TIMEFRAMES.has(u)) return u;
    if(/^G\d+$/.test(u)) return u;
    return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  }).join(" ");
}

const REGIME_SUFFIXES = ["_Bull", "_Bear", "_Range", "_Ranging"];
function stripRegime(n){
  for(const suf of REGIME_SUFFIXES){
    if(String(n).endsWith(suf)) return String(n).slice(0, -suf.length);
  }
  return String(n);
}

/* Underscores are how the EA writes an identifier; they are not how a person
   reads one. Display only -- the canonical name with its underscores still
   travels in the snapshot, so a tap-through can still look it up. */
const spaceOut = n => String(n).replace(/_/g, " ");

/* A step resolution and the bound it steps between do not share a sensible
   width -- toFixed on either lies about the other. Trim instead of picking. */
const num = x => (typeof x !== "number" || !isFinite(x)) ? ""
  : String(Number(x.toFixed(6)));

/* A SWEPT variable, unlike a round's, carries its own grid -- a sweep has no
   group_id, so the catalog cannot answer for it and the spec travels on the
   seed record itself. Trevor asked for three things here and they are all
   derived from the file the tester is actually running: the NAMES, the STEP
   COUNT, and the STEP RESOLUTION. */
/* ONE SPELLING FOR AN OPERATION, wherever it appears -- machine chip, progress
   bar, seed chip. The trailing digit is split off GENERICALLY (FOO2 -> "FOO 2")
   rather than from a lookup table: the vocabulary lives upstream, and a copy
   here would be the thing that drifts. It already did once on another surface,
   where a numbered variant reached the screen raw and stayed wrong for days --
   and this page was about to repeat it, rendering the raw value into a chip.

   The paused states share a prefix upstream rather than being spelled out one
   by one, so the prefix is unfolded here rather than matched. */
const PAUSED_PREFIX = "PAUSED_AFTER_";
function phaseText(p){
  let t = String(p || "").toUpperCase();
  if(!t) return "";
  const paused = t.startsWith(PAUSED_PREFIX);
  if(paused) t = t.slice(PAUSED_PREFIX.length);
  t = t.replace(/^([A-Z]+?)(\d+)$/, "$1 $2");
  return paused ? "PAUSED · " + t : t;
}

/* The third chip on a seed answers "what KIND of round is this", in the same
   vocabulary the machine cards use for `phase`, so a seed and a rotation round
   read the same way on one screen. `round_type` is the record's own answer and
   wins outright; `kind` is the coarse fallback and cannot tell a second pass
   from a first. */
const roundType = sd => phaseText(sd.round_type || sd.kind || "seed");

function sweptList(vars, cells){
  if(!Array.isArray(vars) || !vars.length) return "";
  const n = vars.length;
  return `<div class="vars">
      <div class="vhead">${n} Variable${n === 1 ? "" : "s"}` +
        (cells ? ` · ${cells}-cell grid` : "") + `</div>
      ${vars.map(v => {
        const bits = [];
        if(v.min != null && v.max != null) bits.push(num(v.min) + " → " + num(v.max));
        if(v.points != null) bits.push(v.points + " step" + (v.points === 1 ? "" : "s"));
        if(v.step != null) bits.push("Δ " + num(v.step));
        return `<div class="v"><span class="sv">` +
          `<span>${esc(spaceOut(stripRegime(v.name || "")))}</span>` +
          (bits.length ? `<span class="spec">${esc(bits.join(" · "))}</span>` : "") +
          `</span></div>`;
      }).join("")}
    </div>`;
}

/* THE LIVE TILE'S VARIABLES, with where each one is up to. Trevor,
   2026-09-16: *"Beside the 3 Variables that are listed there. Lets put their
   resolution and status chips on the right."*

   `vars` is a list of NAMES on the beacon. The states come from the running
   job's own task detail, which the publisher has already built against the same
   bucket -- looked up by name rather than re-derived, so the tile and the task
   card cannot disagree about a variable.

   A name with no state still renders: an older publisher sends no detail at
   all, and a tile that dropped its variable list in that case would look broken
   rather than plain. */
function varList(vars, states){
  if(!Array.isArray(vars) || !vars.length) return "";
  const by = {};
  (states || []).forEach(s => { if(s && s.name) by[s.name] = s; });
  const n = vars.length;
  return `<div class="vars">
      <div class="vhead">${n} Variable${n === 1 ? "" : "s"}</div>
      ${vars.map(v => {
        const st = by[v];
        return `<div class="tvar">
          <span class="tvn">${esc(spaceOut(stripRegime(v)))}</span>` +
          (st && st.state
            ? stateChip(st) +
              `<span class="tvr ${stateClass(st.resolution)}">${
                 st.resolution ? esc(st.resolution) : "—"}</span>`
            : "") + `</div>`;
      }).join("")}
    </div>`;
}

/* The states for the job on ONE machine, from the task that machine is ON.
   Null when the publisher sent no detail.

   MATCHED BY PHASE FIRST. A job's tasks do not sweep the same variables -- a
   second pass takes only the pinned ones -- so "whichever round is running"
   would show a machine midway through its second pass the FIRST pass's list.
   The beacon already says which task it is on; that is the one to read. */
function liveStates(f){
  const tl = timelineFor(f.regime, f.bucket_id, f.group_id);
  if(!tl) return null;
  const rounds = tl.rounds || [];
  const mine = (f.phase && rounds.find(r => r.kind === f.phase)) ||
               rounds.find(r => r.status === "running") || rounds[0];
  return mine && mine.detail ? mine.detail.variables : null;
}

const titleCase = s => String(s).charAt(0) + String(s).slice(1).toLowerCase();

/* A LENGTH OF TIME, not a moment. `ago` is this plus the word, and they are
   one function so a heartbeat and a phase duration can never round differently
   on the same screen. */
function dur(sec){
  if(sec == null) return "";
  if(sec < 90) return Math.round(sec) + "s";
  if(sec < 5400) return Math.round(sec/60) + "m";
  return (sec/3600).toFixed(1) + "h";
}

/* HOW LONG SOMETHING RAN, in hours and minutes. Trevor, 2026-09-16: *"the
   runtime recording lets get that so that it does hours and min."*

   SEPARATE FROM dur(), which stays as it is. dur() answers "how stale is this"
   for a beacon age and an ETA, where 1.6h is the right shape -- a rough
   magnitude you glance at. A RUN TIME is a measurement you compare against
   another run, and "2h 36m" is the form that survives that comparison. Two
   questions, two answers; collapsing them would make one of the two worse. */
function hm(sec){
  if(sec == null) return "";
  const t = Math.round(sec);
  if(t < 60) return t + "s";
  const h = Math.floor(t / 3600), m = Math.round((t % 3600) / 60);
  /* 59.6 minutes rounding to 60 would print "0h 60m". */
  if(m === 60) return (h + 1) + "h 0m";
  return h ? h + "h " + m + "m" : m + "m";
}

function ago(sec){
  if(sec == null) return "";
  return dur(sec) + " ago";
}

/* HOW LONG THIS MACHINE HAS BEEN IN THIS PHASE. Trevor, 2026-09-16: *"I'd like
   to see the time portion that it is in the picking phase -- the moment the
   last task finished (or upon tray start) and the start of the next."*

   `phase_since` is job_control's own `updated` stamp, written as the phase is
   written, so it IS that moment. Measured against the BEACON, not against now:
   the snapshot was built when the machine last reported, and adding the time
   since would quietly inflate every duration by the beacon's age -- the same
   correction the ETA makes, for the same reason. */
function phaseFor(f){
  if(!f || !f.phase_since) return null;
  const began = new Date(f.phase_since);
  if(isNaN(began.getTime())) return null;
  const beaconMs = Date.now() - (f.age_seconds || 0) * 1000;
  const secs = (beaconMs - began.getTime()) / 1000;
  return secs >= 0 ? dur(secs) : null;
}

/* LOCAL time, deliberately. Everything upstream is UTC -- `recorded_at` carries
   +00:00 and the beacons are unix seconds -- and rendering that raw meant a
   sweep started at 15:00 displayed as 22:00. The stored values stay UTC; only
   the display converts, so the phone and the desktop each read in their own
   zone without the records ever changing.

   Accepts an ISO string OR unix SECONDS, because seeds carry the latter. */
function fmtWhen(v){
  const d = (typeof v === "number") ? new Date(v * 1000) : new Date(v);
  if(isNaN(d.getTime())) return "";
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function deltaEl(before, after){
  if(before == null || after == null) return '<span class="delta flat">—</span>';
  const d = after - before;
  if(Math.abs(d) < 0.005) return '<span class="delta flat">±0.00</span>';
  const cls = d > 0 ? "up" : "dn";
  return `<span class="delta ${cls}">${d > 0 ? "+" : "−"}${Math.abs(d).toFixed(2)}</span>`;
}

/* ---------- page: rounds ---------- */
/* The publisher emits the RECORD shape, faithful to the beacons. Adapting it
   for display is the renderer's job -- that split is the whole reason the app
   can be rebuilt without touching the pipeline. */
const RC = { BULL: "bull", BEAR: "bear", RANGING: "range" };

/* ---------- the bucket id, coloured by where it sits on slope ---------- */
/* A BUCKET ID IS A POSITION, NOT A NAME. Every regime's root is 1600 covering
   the whole slope range, and a split makes two children at parent -/+ gap with
   gap halving each generation (decision_engine.compute_child_bucket_ids). So
   the number itself says where on the slope axis the bucket sits: BELOW 1600 is
   the bearish end of that regime's range, ABOVE it the bullish end, and 1600
   itself is dead centre. Nothing else on the page carries that, and it was
   being spent on a grey number nobody could read.

   HOW FAR THE SCALE RUNS -- i.e. what counts as "max bear". A split needs 100
   trades in the parent (decision_engine.SPLIT_TRADE_VOLUME_MIN), so the
   SMALLEST bucket that can ever exist holds about 50 over the 2yr window, and a
   regime can hold at most (its trades / 50) leaves. Against the band ceilings
   the EA compiles -- hi x target x years -- that is:

       RANGING  1.30 x 500.00 x 2 = 1290 trades  ->  25 leaves
       BULL     1.50 x 166.21 x 2 =  495 trades  ->   9 leaves
       BEAR     1.50 x 108.74 x 2 =  324 trades  ->   6 leaves

   ~40 buckets over the fleet, and the DEEPEST single regime is RANGING at 25,
   which is generation 5 (32 leaves). Generation 5's gap is 1600/2**5 = 50, so
   the outermost ids the campaign can reach are 50 and 3150 -- a reach of 1550
   either side of the root. That is what the gradient is normalised over.

   DEEPER SPLITS CLAMP RATHER THAN RESCALE. If a regime ever does go past
   generation 5 the extra ids pin at full red or full blue, because the
   alternative -- widening the scale -- would silently restain every bucket that
   had not moved, and the colour is supposed to mean the same thing on Tuesday
   as it did on Monday.

   THE COLOURS. Green in the middle, because centre is where an unsplit bucket
   lives and green is this page's "nothing wrong" everywhere else. Red toward
