   opens the job and [data-go] moves to the tab it lives on, and both listeners
   are document-level so one tap does both. [data-review] is this section's own,
   and only takes the badge off the list. */
function reviewBadge(r){
  /* ALWAYS THE FULL CARD. Trevor, 2026-09-17: *"I want to click on the condensed
     job card, and have it bring me to that particular Full Job Card."*

     An earlier version sent rounds whose reports never resolved to the results
     LIST instead, on the reasoning that the list refuses to open them. That was
     the wrong end to fix: the answer is not to withhold the destination, it is to
     let the destination say what it has. A condensed card opens its full card,
     every time, and the full card is honest about an empty one. */
  return `<button type="button" class="jrow" data-go="results"
      data-rjob="${esc(r.round_no)}" data-review="${esc(r.round_no)}">` +
    jobCard(r, r.reports, true) + `</button>`;
}

function renderHome(){
  const news = toReview();
  return '<div class="home">'
    /* LIVE, FIRST. Trevor, 2026-09-25: *"another section on the home screen.
       This is gonna be the live trading section."* It is the one badge about
       money rather than about the machines, so it leads. Its subline is
       painted by lvPaintBadge() from the VPS poll, not from the snapshot. */
    + homeButton("live", `<span class="lv-dot${liveUrl() ? "" : " off"}"></span>`, "Live",
                 `<span id="lvsub">${lvBadgeText()}</span>`, "var(--gold)")
    + homeButton("active", "▶", "Active", activeSummary())
    + homeButton("results", "✓", "Results",
        `<span class="hcount">${LEDGER.filter(completed).length}</span> ` +
        `completed · ${campaignProgress()}`, "var(--good)")
    /* SETTINGS, under Results. Trevor, 2026-09-18: *"On the homescreen. I
       want another Badge Here. Settings ... Each Number Can be it's own
       Badge."* -- so it is a PAGE OF BADGES rather than a form, and each
       thing you can change is one badge.

       The subline states what is APPLIED, never how many settings exist: a
       priority switched off and a priority nobody ever set are the same
       screen and very different situations. */
    /* THE SCHEDULE, DIRECTLY UNDER RESULTS. Trevor, 2026-09-19: *"Below
       Results we'll have another badge that says Schedule. We won't have this
       section in with settings."* It was a badge on the Settings page, which
       put the thing that decides WHAT RUNS NEXT behind the same tap as a
       bucket-priority toggle. It is not a setting; it is the plan. */
    + homeButton("schedule", "☷", "Schedule", scheduleSummary(), "var(--range)")
    + homeButton("settings", "⚙", "Settings", settingsSummary())
    /* BELOW RESULTS, and only when there is something in it. An empty "To
       review" heading is a heading that trains you to stop looking. */
    + (news.length
        ? '<div class="section-label" style="margin-top:9px">To review' +
          `<span class="hcount" style="margin-left:6px">${news.length}</span>` +
          '</div>' + news.map(reviewBadge).join("")
        : "")
    + '</div>';
}


/* ==========================================================================
   SETTINGS -- one badge per thing you can change
   ==========================================================================
   🔴 NOTHING HERE APPLIES ANYTHING ITSELF. That is fleet_api's standing
   rule rather than a limitation of this page -- *"a handler may write a request
   that the tick loop reads. It may not start MT5, move a file the EA reads, or
   call into run_next_round."* So every control states what it WILL do and when,
   and a change reads as QUEUED until a machine has picked it up. A control that
   claimed to have taken effect the moment it was tapped would be lying for as
   long as the current job had left, which on a real-tick round is days.

   ⚠️ AND IT IS ONLY AS GOOD AS THE OLDEST MACHINE READING IT. A peer on
   code predating app_settings.py ignores the file and schedules on the computed
   shares -- the same caveat seeds.only_machine carries, and it fails OPEN the
   same way. Until every machine has it, a priority is advisory. */

/* Defaults that match app_settings.default_settings(), so the page renders a
   true "nothing overridden" before any snapshot has arrived rather than an
   empty one. A blank settings page and an unreachable fleet must not look the
   same. */
let SETTINGS_STATE = {bucket_priority: {mode: "off",
                                        regimes: ["BULL", "BEAR", "RANGING"],
                                        pins: {}, regime_pins: {},
                                        focus_pct: 80, top_n: 3},
                      lease_extensions: {}};
let LEASES = [];
let BUCKET_SHARES = [];

const MODE_LABEL = {
  off: "Computed shares",
  manual: "Manual priority",
  auto_top: "Targeting winners",
  auto_bottom: "Targeting losers",
  auto_defaults: "Targeting defaults",
  regime: "Regime percentages",
};

/* The prose lives in app_settings.MODE_TEXT and is PUBLISHED with the settings,
   for the reason seeds.REASON_TEXT gives: a vocabulary and its explanation
   drifting apart is the failure the text exists to prevent. These are the
   fallback for a snapshot that predates it, not a second copy to maintain. */
const MODE_TEXT_FALLBACK = {
  off: "The scheduler uses each bucket's computed share of the market. Nothing here is applied.",
  manual: "You set the percentages. A bucket you pin keeps exactly that share; the rest split what is left.",
  auto_top: "Favours the best-performing buckets by Profit Factor, inside the regimes you have selected.",
  auto_bottom: "Favours the worst-performing buckets by Profit Factor -- the ones with the most left to gain.",
  auto_defaults: "Favours the buckets holding the most variables still at their compiled DEFAULT.",
  regime: "You set the percentages per REGIME. A regime you pin keeps exactly that share and its buckets divide it between them; the rest split what is left.",
};

function modeText(mode){
  return (SETTINGS_STATE.mode_text || {})[mode] || MODE_TEXT_FALLBACK[mode] || "";
}

function scheduleSummary(){
  const sch = schedule();
  const blocks = (sch.blocks || []).length;
  if(!blocks) return "No blocks yet \u2014 nothing is queued";
  const status = sch.status || "idle";
  const cur = Number(sch.cursor || 0);
  /* WHAT IT IS DOING FIRST, then how much there is of it. A count alone cannot
     tell a schedule that is running from one that was built and never started,
     and those are the two states worth telling apart from the home screen. */
  return `<span class="hcount${status === "running" ? "" : " quiet"}">${
      esc(status)}</span> \u00b7 ${blocks} block${blocks === 1 ? "" : "s"}` +
    (status === "running" && blocks ? ` \u00b7 on ${cur + 1} of ${blocks}` : "");
}

function settingsSummary(){
  const bp = SETTINGS_STATE.bucket_priority || {};
  const bits = [];
  if(bp.mode && bp.mode !== "off") bits.push(MODE_LABEL[bp.mode] || bp.mode);
  const ext = Object.keys(SETTINGS_STATE.lease_extensions || {}).length;
  if(ext) bits.push(ext + " lease" + (ext === 1 ? "" : "s") + " extended");
  return bits.length ? bits.join(" \u00b7 ") : "Nothing overridden";
}



let SCHED_VIEW = false;

/* THE BLOCKS ARE EDITED LOCALLY AND SAVED IN ONE GO.
   🔴 A CHIP TAP IS NOT A SAVE, and that is deliberate. Building a block is
   six or seven taps; POSTing each one would write six half-finished schedules
   to a record the whole fleet reads, and a machine ticking mid-edit would pick
   work from a block nobody had finished describing. So edits mutate a local
   copy and `Save chain` is the only thing that writes. The badge says which
   state it is in. */
let SCHED_DRAFT = null;

function schedDraft(){
  if(!SCHED_DRAFT){
    const sch = schedule();
    SCHED_DRAFT = JSON.parse(JSON.stringify(sch.blocks || []));
  }
  return SCHED_DRAFT;
}
function schedDirty(){ return SCHED_DRAFT !== null; }

/* The draft wins while one exists, so the page shows what you are building
   rather than what is saved. */
const _schedule_saved = schedule;
schedule = function(){
  const sch = SETTINGS_STATE.schedule || {};
  if(SCHED_DRAFT) return Object.assign({}, sch, {blocks: SCHED_DRAFT});
  return sch;
};

function schedFind(id){
  return schedDraft().filter(function(b){ return b.id === id; })[0] || null;
}

function schedNewBlock(){
  /* Mirrors schedule_builder.new_block's defaults. A block created here and one
     created by the engine must be the same shape, or a chain saved from the
     phone would behave differently from one written by a tool. */
  return {
    id: Math.random().toString(16).slice(2, 10),
    name: "", buckets: [], regimes: [], select: "explicit", select_n: 1,
    groups: "any", machines: [], until: {kind: "jobs", n: 3}, max_jobs: null,
  };
}

function schedToggle(list, value){
  const i = list.indexOf(value);
  if(i >= 0) list.splice(i, 1); else list.push(value);
  return list;
}

document.addEventListener("click", async e => {
  const t = e.target.closest(
    /* 🔴 A HANDLER NOT LISTED HERE IS A HANDLER THAT NEVER RUNS. This dispatcher
       gates on one closest() over the whole list, so adding a branch below
       without adding its attribute here produces a button that looks right,
       reports no error, and does nothing -- which is exactly how
       `data-schedclear` shipped its first five minutes. */
    "[data-schedgo],[data-schedback],[data-schedadd],[data-schedsave],"
    + "[data-schedclear],"
    + "[data-schededit],[data-scheddel],[data-schedmove],[data-schedact],"
    + "[data-schedsel],[data-schedreg],[data-schedbkt],[data-schedn],"
    + "[data-schedgrp],[data-schedmac],[data-scheduntil],[data-schedval],"
    + "[data-schedscope],[data-schedcap]");
  if(!t) return;
  e.preventDefault();
  e.stopPropagation();
  const d = t.dataset;
  const pair = function(v){
    const i = String(v).lastIndexOf(":");
    return [String(v).slice(0, i), String(v).slice(i + 1)];
  };

  if(d.schedgo !== undefined){ SCHED_VIEW = true; return repaintSettings(); }
  if(d.schedback !== undefined){ SCHED_VIEW = false; SCHED_EDIT = null; return repaintSettings(); }
  if(d.schedadd !== undefined){ schedDraft().push(schedNewBlock()); return repaintSettings(); }
  if(d.schedclear !== undefined){
    /* THE NAME SURVIVES. It is the one field you wrote rather than picked, and
       clearing what you chose is not the same as forgetting what you called it. */
    const blk = schedDraft().find(function(x){ return x.id === d.schedclear; });
    if(blk){
      const fresh = schedNewBlock();
      fresh.id = blk.id;
      fresh.name = blk.name;
      Object.keys(fresh).forEach(function(k){ blk[k] = fresh[k]; });
    }
    return repaintSettings();
  }
  if(d.schededit !== undefined){
    SCHED_EDIT = (SCHED_EDIT === d.schededit) ? null : d.schededit;
    return repaintSettings();
  }
  if(d.scheddel !== undefined){
    SCHED_DRAFT = schedDraft().filter(function(b){ return b.id !== d.scheddel; });
    return repaintSettings();
  }
  if(d.schedmove !== undefined){
    const [id, dir] = pair(d.schedmove);
    const list = schedDraft();
    const i = list.findIndex(function(b){ return b.id === id; });
    const j = i + Number(dir);
    if(i >= 0 && j >= 0 && j < list.length){
      list.splice(j, 0, list.splice(i, 1)[0]);
    }
    return repaintSettings();
  }
  if(d.schedsave !== undefined){
    const ok = await apiPost("/schedule", {action: "save",
                                           name: schedule().name || "schedule",
                                           blocks: schedDraft()});
    if(ok) SCHED_DRAFT = null;      // saved -- the record is the truth again
    return repaintSettings();
  }
  if(d.schedact !== undefined){
    /* 🔴 START AND STOP GO STRAIGHT TO THE FLEET, unlike the edits. Starting
       FREEZES every baseline the conditions are judged against, so it has to be
       a deliberate act against what is SAVED -- starting a draft would freeze a
       baseline for blocks the fleet has never seen. */
    if(schedDirty()){
      SETTINGS_ERROR = "save the chain before starting it";
      return repaintSettings();
    }
    await apiPost("/schedule", {action: d.schedact});
    return repaintSettings();
  }

  // ---- per-block edits, all local ----
  const [id, val] = pair(d.schedsel || d.schedreg || d.schedbkt || d.schedn
    || d.schedgrp || d.schedmac || d.scheduntil || d.schedval || d.schedscope
    || d.schedcap || ":");
  const b = schedFind(id);
  if(!b) return;
  if(d.schedsel !== undefined) b.select = val;
  else if(d.schedreg !== undefined) schedToggle(b.regimes, val);
  else if(d.schedbkt !== undefined) schedToggle(b.buckets, val);
  else if(d.schedn !== undefined) b.select_n = Number(val);
  else if(d.schedgrp !== undefined) b.groups = val;
  else if(d.schedmac !== undefined) schedToggle(b.machines, val);
  else if(d.scheduntil !== undefined){
    /* THE VALUE IS DROPPED WITH THE KIND. "3" means jobs under one condition
       and a PF under another; carrying it across would silently make "until PF
       reaches 3" out of "until 3 jobs". */
    b.until = {kind: val};
  }
  else if(d.schedval !== undefined){
    b.until[schedUntilField(b.until.kind)] = Number(val);
  }
  else if(d.schedscope !== undefined) b.until.scope = val;
  else if(d.schedcap !== undefined) b.max_jobs = Number(val) || null;
  repaintSettings();
});

/* ---------- the write client ----------
   🔴 THE BASE URL AND ITS TOKEN NEVER TRAVEL IN THE SNAPSHOT, and this is
   not caution, it is fleet_api's own rule: *"every design that let it write
   ended in a bearer token sitting in a phone browser on a public origin ... a
   token whose blast radius is 'applies passes to a live trading account'."*
   This page is currently served from a PUBLIC gist, so anything published into
   the snapshot is public with it.

   So the base is read from somewhere private, in this order:
     window.FLEET_API   -- injected by the page when it is served over the
                           tailnet, which is what the private move delivers
     localStorage       -- set once on a device you own, by hand
   and when neither exists every control here is READ-ONLY and says so. That is
   the honest state today: the endpoint is live and tested on the Laptop, and
   nothing has ever called it.

   ⚠️ DO NOT "FIX" THIS by publishing the base into the snapshot. It would
   work immediately and would hand the write credential to anyone who found the
   gist. The private move is the fix. */
function apiBase(){
  try{
    if(window.FLEET_API) return String(window.FLEET_API).replace(/\/+$/, "");
    const v = localStorage.getItem("gb.api.v1");
    return v ? String(v).replace(/\/+$/, "") : "";
  }catch(e){ return ""; }
}

let SETTINGS_BUSY = false;
let SETTINGS_ERROR = "";

/* ONE POST, SHARED BY EVERY WRITE ON THE PAGE. Split out of apiPost on
   2026-09-23 when the failure card got a route: apiPost also owns the Settings
   badge's busy flag and repaint, and a failure card borrowing those would
   spin the wrong badge. Resolves {ok, out, error}; never throws.
   error is "read-only" (no base), "unreachable" (no answer), or the
   endpoint's own refusal. */
async function apiCall(path, body){
  const base = apiBase();
  if(!base) return {ok: false, out: {}, error: "read-only"};
  try{
    const r = await fetch(base + path, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body || {}),
    });
    const out = await r.json().catch(() => ({}));
    /* 202 IS THE SUCCESS CODE HERE, not 200 -- fleet_api answers "accepted, not
       applied" on purpose and no control may upgrade that to "done". */
    if(r.status !== 202)
      return {ok: false, out: out, error: out.error || ("HTTP " + r.status)};
    return {ok: true, out: out, error: ""};
  }catch(e){
    return {ok: false, out: {}, error: "unreachable"};
  }
}

async function apiPost(path, body){
  if(!apiBase()){
    SETTINGS_ERROR = "read-only";
    return false;
  }
  SETTINGS_BUSY = true;
  SETTINGS_ERROR = "";
  try{
    const res = await apiCall(path, body);
    if(!res.ok){
      SETTINGS_ERROR = res.error;
      return false;
    }
    if(res.out.bucket_priority) SETTINGS_STATE.bucket_priority = res.out.bucket_priority;
    else await refreshSettings();
    return true;
  }finally{
    SETTINGS_BUSY = false;
    repaintSettings();
  }
}

async function refreshSettings(){
  const base = apiBase();
  if(!base) return;
  try{
    const r = await fetch(base + "/settings", {cache: "no-store"});
    const out = await r.json();
    if(out && out.settings) SETTINGS_STATE = out.settings;
    if(out && out.mode_text) SETTINGS_STATE.mode_text = out.mode_text;
  }catch(e){ /* the badge keeps the snapshot's copy, which is still true */ }
}

function renderSchedule(){
  /* The builder takes the whole page when it is open -- it is a form, and a
     summary card above a form you are already inside is one more thing between
     you and the field you came to change. Its own back control returns here. */
  if(SCHED_VIEW) return renderScheduleBuilder();
  return '<div class="home">'
    + '<button type="button" class="backbtn" data-go="home">\u2039 Home</button>'
    + '<div class="section-label">Schedule</div>'
    + scheduleBadge()
    + '<div class="section-label" style="margin-top:14px">Flow</div>'
    + scheduleFlowchart()
    + '</div>';
}

function repaintSchedule(){
  const el = document.getElementById("page-schedule");
  if(el) el.innerHTML = renderSchedule();
}

function repaintSettings(){
  const el = document.getElementById("page-settings");
  if(el) el.innerHTML = renderSettings();
  /* 🔴 BOTH PAGES, and repaintCards learned this the same way. The schedule's
     controls live on their own page now but still route through this one
     function from eleven call sites -- and eleven call sites are eleven chances
     to update ten of them. Repainting a hidden page costs nothing and cannot
     drift; rewiring each caller could. */
  repaintSchedule();
}

/* EVERY CONTROL ON THE PAGE, one listener. Registered on document rather than
   per button because the whole badge is re-rendered after each change, and
   per-button listeners would be re-attached (or silently lost) each time. */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-lease],[data-bpregime],[data-bpmode],"
    + "[data-bppin],[data-bprpin],[data-bpreset]");
  if(!t) return;
  e.preventDefault();
  e.stopPropagation();
  const d = t.dataset;
  if(d.lease !== undefined){
    const i = String(d.lease).lastIndexOf(":");
    await apiPost("/lease", {key: String(d.lease).slice(0, i),
                             hours: Number(String(d.lease).slice(i + 1))});
  } else if(d.bpregime !== undefined){
    const cur = (SETTINGS_STATE.bucket_priority || {}).regimes || [];
    const next = cur.indexOf(d.bpregime) >= 0
      ? cur.filter(r => r !== d.bpregime) : cur.concat([d.bpregime]);
    await apiPost("/priority", {regimes: next});
  } else if(d.bpmode !== undefined){
    await apiPost("/priority", {mode: d.bpmode});
  } else if(d.bppin !== undefined){
    const i = String(d.bppin).lastIndexOf(":");
    const key = String(d.bppin).slice(0, i);
    const pct = Number(String(d.bppin).slice(i + 1));
    /* -1 is Unpin. `null` rather than 0 -- a bucket pinned at 0% is a real and
       different instruction ("never schedule this"), so they must not collapse. */
    await apiPost("/priority", {mode: "manual",
                                pin: {key: key, percent: pct < 0 ? null : pct}});
  } else if(d.bprpin !== undefined){
    const i = String(d.bprpin).lastIndexOf(":");
    const regime = String(d.bprpin).slice(0, i);
    const pct = Number(String(d.bprpin).slice(i + 1));
    /* Mode and pin in ONE post, the same as a bucket pin: setting a percentage
       IS choosing the mode, and two posts would leave a window where the badge
       shows a pin nothing is applying. -1 is Unpin; null rather than 0, because
       a regime pinned at 0% is a real and different instruction. */
    await apiPost("/priority", {mode: "regime",
                                regime_pin: {regime: regime,
                                             percent: pct < 0 ? null : pct}});
  } else if(d.bpreset !== undefined){
    await apiPost("/priority", {reset: true});
  }
});

document.addEventListener("change", async e => {
  const t = e.target.closest("[data-bpfocus]");

/* ==========================================================================
   THE SCHEDULE BUILDER
   ==========================================================================
   Trevor, 2026-09-18: *"I want to 'Build' A Schedule ... I want to be able to
   daisy chain several together. I also want an ETA on the blocks that can
   actually be measured."*

   THE VOCABULARY IS PUBLISHED, NOT KEPT HERE. Every option and every sentence
   describing it comes from schedule_builder via the snapshot, for the reason
   seeds.REASON_TEXT gives: a list of conditions here and a list of conditions
   there drift, and the drift shows as a builder that describes one behaviour
   while the fleet does another. The fallbacks below exist only for a snapshot
   published before the vocabulary travelled.

   🔴 THE ETA IS THE HONEST HALF, and the renderer must not flatten it.
   Three kinds come off the engine and they are drawn differently:
     exact      arithmetic -- N jobs x a measured median. Shown as a time.
     projected  a rate seen so far. Shown as a time WITH the word estimate and
                the rate it came from, never alone.
     none       no defensible number exists. Shows elapsed and rounds spent and
                says so outright.
   Collapsing these into one number is precisely the mistake the standing rule
   about MT5's time-remaining exists to stop: a plausible figure gets planned
   around and then blamed. */
let VOCAB = {};
let SCHED_EDIT = null;        // block id being edited, or null

const SCHED_FALLBACK = {
  selects: ["explicit", "lowest_pf", "highest_pf", "highest_profit",
            "worst_giveback", "most_defaults"],
  groups: ["any", "pinned", "exit", "entry", "ema", "moved_giveback"],
  untils: ["jobs", "pf_at_least", "pinned_cleared", "bucket_splits",
           "profit_up_pct", "giveback_below", "epoch_done"],
  scopes: ["live", "frozen"],
};

const SCHED_LABEL = {
  explicit: "Named", lowest_pf: "Lowest PF", highest_pf: "Highest PF",
  highest_profit: "Most profit", worst_giveback: "Worst give-back",
  most_defaults: "Most defaults",
  any: "Any group", pinned: "Pinned only", exit: "EXIT only", entry: "ENTRY only",
  ema: "EMA lane", moved_giveback: "Moved give-back",
  jobs: "N jobs", pf_at_least: "PF reaches", pinned_cleared: "Pins cleared",
  bucket_splits: "It splits", profit_up_pct: "Profit up", giveback_below: "Give-back under",
  epoch_done: "Epoch done",
  live: "Whatever is targeted now", frozen: "The buckets it started on",
};

function vocab(name){
  return (VOCAB[name] && VOCAB[name].length) ? VOCAB[name] : (SCHED_FALLBACK[name] || []);
}
function vocabText(kind, key){
  return ((VOCAB[kind] || {})[key]) || "";
}

function schedule(){ return SETTINGS_STATE.schedule || {}; }

function scheduleBadge(){
  const sch = schedule();
  const blocks = sch.blocks || [];
  const status = sch.status || "idle";
  const cur = Number(sch.cursor || 0);
  return '<div class="card"><div class="card-in">'
    + '<div class="trow"><span class="tlab">Schedule</span>'
    + '<span class="chip ' + (status === "running" ? "gold" : "") + '">'
    + esc(status) + '</span></div>'
    + '<div class="tnote">A chain of blocks. Each one targets buckets, narrows to '
    + 'certain groups and machines, and runs until its own condition is met \u2014 '
    + 'then the next one starts.</div>'
    + (blocks.length
        ? '<div class="tnote" style="margin-top:8px">'
          + esc(sch.name || "unnamed") + " \u00b7 " + blocks.length + " block"
          + (blocks.length === 1 ? "" : "s")
          + (status === "running" ? " \u00b7 on block " + (cur + 1) : "") + '</div>'
        : '<div class="tnote" style="margin-top:8px">No blocks yet.</div>')
    + '<div class="chips" style="margin-top:10px">'
    + '<button type="button" class="chip" data-schedgo>Open builder</button>'
    + (blocks.length && status !== "running"
        ? '<button type="button" class="chip gold" data-schedact="start">Start</button>' : "")
    + (status === "running"
        ? '<button type="button" class="chip" data-schedact="stop">Stop</button>' : "")
    + '</div></div></div>';
}

/* THE PLAN AS A PICTURE. Everything here is read straight off the stored
   chain -- which block is active, what each one targets, what ends it.

   \U0001F534 NO PERCENTAGE PER BLOCK, AND THAT IS DELIBERATE. `evaluate()`
   computes the fraction and it runs in PYTHON; nothing publishes it, so the
   only way to draw a bar here would be to re-derive every condition in
   JavaScript. That is the second-formula mistake this project keeps writing
   down -- the picture and the engine would drift, and the picture is the one
   people would believe. Jobs spent and time elapsed ARE on the record, so
   those are shown, and `schedEtaLine` says which kind of answer the condition
   can even support. A real per-block bar needs one publisher field. */
function scheduleFlowchart(){
  const sch = schedule();
  const blocks = sch.blocks || [];
  const status = sch.status || "idle";
  const cur = Number(sch.cursor || 0);
  const running = (status === "running");
  if(!blocks.length){
    return '<div class="card"><div class="card-in">'
      + '<div class="tlab">The plan</div>'
      + '<div class="tnote">No blocks yet. The builder is where a chain is made'
      + ' \u2014 each block targets buckets, narrows to certain groups and'
      + ' machines, and runs until its own condition is met.</div>'
      + '</div></div>';
  }
  return '<div class="card"><div class="card-in">'
    + '<div class="trow"><span class="tlab">The plan</span>'
    + '<span class="chip' + (running ? " gold" : "") + '">'
    + (running ? "on block " + (cur + 1) + " of " + blocks.length
               : esc(status)) + '</span></div>'
    + '<div class="fc" style="margin-top:4px">'
    + blocks.map(function(b, i){
        /* IDLE MEANS NOTHING HAS RUN, not "block 1 is active". `cursor` is 0 on
           a chain that was never started, so trusting it alone would light the
           first bubble gold on a schedule sitting untouched -- a picture of
           work in progress where there is none. */
        const state = (status === "finished") ? "done"
                    : !running ? "upcoming"
                    : (i < cur) ? "done" : (i === cur) ? "active" : "upcoming";
        const mark = state === "done" ? "\u2713"
                   : state === "active" ? "\u25cf" : String(i + 1);
        return '<div class="fcr ' + state + '">'
          + '<div class="fcb">' + mark + '</div>'
          + '<div class="fcbody">'
          + '<div class="fch">'
          + '<span class="fcn">' + esc(b.name || ("Block " + (i + 1))) + '</span>'
          + (state === "active" ? '<span class="chip gold">running</span>' : "")
          /* NO CAP CHIP HERE: schedSentence already ends with "(give up
             after N jobs)", and a row stating the same number twice reads as
             two different facts until you stop and check. */
          + '</div>'
          + '<div class="fcsay">' + schedSentence(b) + '</div>'
          + (state === "active"
              ? schedFrozen(sch) + schedBar(b) + schedProgress(b, sch) : "")
          + '</div></div>'; }).join("")
    + '</div>'
    + (sch.loop
        ? '<div class="fcloop"><div class="fcb">\u21ba</div>'
          + '<span>Loops back to block 1 when the last one finishes.</span></div>'
        : "")
    + '</div></div>';
}

/* WHAT THE ACTIVE BLOCK FROZE WHEN IT STARTED -- the denominators its condition
   is judged against. Facts on the record, not anything re-derived here.

   Worth the line because a frozen set is the one thing about a running block
   that is visible nowhere else, and "79 groups owed" against nothing at all is
   the difference between a block that is merely slow and a block that froze an
   empty set and can therefore never finish. */
/* THE ENGINE'S OWN FRACTION, published as `schedule_progress`.
   🔴 ONLY FOR THE BLOCK IT MEASURED. A snapshot can be older than a
   block advance, and a bar drawn against the wrong block is not a stale
   number -- it is a confident statement about work that is not being done.
   The block id is checked rather than assumed, and a mismatch draws nothing,
   which is what the page did before this field existed. */
function schedProgressOf(b){
  const p = (SETTINGS_STATE || {}).schedule_progress;
  return (p && b && p.block_id && p.block_id === b.id) ? p : null;
}

function schedBar(b){
  const p = schedProgressOf(b);
  if(!p) return "";
  let out = "";
  if(p.measured) out += '<div class="fcsay">' + esc(p.measured) + '</div>';
  /* ABSENT IS NOT ZERO. A condition with no defensible fraction -- "until it
     splits", before it splits -- publishes none, and an empty bar would read
     as "measured, and none of it done". The sentence above still says where
     it stands. */
  if(typeof p.fraction === "number"){
    const pct = Math.max(0, Math.min(100, p.fraction * 100));
    out += '<div class="bar" style="margin-top:5px"><i style="width:'
         + pct.toFixed(1) + '%"></i></div>';
  }
  return out;
}

function schedFrozen(sch){
  const st = sch.block_state || {};
  const bits = [];
  const targets = (st.targets_at_start || []).length;
  if(targets) bits.push(targets + " bucket" + (targets === 1 ? "" : "s"));
  const owed = (st.owed_at_start || []).length;
  if(owed) bits.push(owed + " groups owed");
  const pinned = Object.keys(st.pinned_at_start || {}).reduce(
    function(a, k){ return a + (st.pinned_at_start[k] || []).length; }, 0);
  if(pinned) bits.push(pinned + " pinned at start");
  if(!bits.length) return "";
  return '<div class="fcsay" style="color:var(--faint)">Froze '
    + esc(bits.join(" \u00b7 ")) + '.</div>';
}

/* ---------- the builder page ---------- */
function renderScheduleBuilder(){
  const sch = schedule();
  const blocks = sch.blocks || [];
  const status = sch.status || "idle";
  const cur = Number(sch.cursor || 0);
  return '<div class="home">'
    /* 2026-09-19 -- it said "Settings", which is where this used to live. The
       builder is one level inside the Schedule page now, so back means back to
       the schedule, not out to a page it no longer belongs to. */
    + '<button type="button" class="chip" data-schedback>\u2039 Schedule</button>'
    + '<div class="section-label" style="margin-top:8px">Schedule \u00b7 '
    + esc(status) + '</div>'
    + (blocks.length
        ? blocks.map(function(b, i){
            return schedBlockCard(b, i, status === "running" && i === cur,
                                  sch, i < cur || status === "finished"); }).join("")
        : '<div class="card"><div class="card-in"><div class="tnote">'
          + 'Nothing here yet. A block is three choices \u2014 which buckets, which '
          + 'groups and machines, and what ends it.</div></div></div>')
    + (schedDirty()
        ? '<div class="tnote" style="margin-top:10px"><b>Unsaved changes.</b> Nothing here reaches the fleet until you save the chain.</div>' : "")
    + '<div class="chips" style="margin-top:10px">'
    + '<button type="button" class="chip" data-schedadd>+ Add block</button>'
    + (blocks.length ? '<button type="button" class="chip" data-schedsave>Save chain</button>' : "")
    + '</div>'
    + '<div class="tnote" style="margin-top:10px">' + '⚠️' + ' A change takes effect '
    + 'at each machine\u2019s next tick. A round already running finishes on the '
    + 'bucket it claimed.</div>'
    + '</div>';
}

/* ONE BLOCK. Collapsed it states what it will do; the ACTIVE one also carries
   what it has done so far, and the editor opens under whichever is being
   changed. */
function schedBlockCard(b, i, isActive, sch, isPast){
  const editing = (SCHED_EDIT === b.id);
  const hist = (sch.history || []).filter(function(h){ return h.block_id === b.id; });
  const outcome = hist.length ? hist[hist.length - 1] : null;
  return '<div class="card"><div class="card-in">'
    + '<div class="trow">'
    + '<span class="tname">' + (i + 1) + '. ' + esc(b.name || "block") + '</span>'
    + (isActive ? '<span class="chip gold">running</span>' : "")
    + (outcome ? '<span class="chip ' + (outcome.kind === "gave_up" ? "bad" : "")
        + '">' + (outcome.kind === "gave_up" ? "gave up" : "met") + '</span>' : "")
    + (isPast && !outcome ? '<span class="chip">done</span>' : "")
    + '</div>'
    + '<div class="tnote">' + schedSentence(b) + '</div>'
    + (isActive ? schedProgress(b, sch) : "")
    + (outcome && outcome.measured
        ? '<div class="tnote" style="margin-top:6px">' + esc(outcome.measured) + '</div>' : "")
    + '<div class="chips" style="margin-top:8px">'
    + '<button type="button" class="chip' + (editing ? " on" : "") + '" data-schededit="'
    + esc(b.id) + '">' + (editing ? "Close" : "Edit") + '</button>'
    + '<button type="button" class="chip" data-schedmove="' + esc(b.id) + ':-1">\u2191</button>'
    + '<button type="button" class="chip" data-schedmove="' + esc(b.id) + ':1">\u2193</button>'
    + '<button type="button" class="chip" data-scheddel="' + esc(b.id) + '">Remove</button>'
    + '</div>'
    + (editing ? schedEditor(b) : "")
    + '</div></div>';
}

/* THE BLOCK AS ONE SENTENCE. A builder that only shows chips makes you
   reassemble the meaning in your head every time you read it. */
function schedSentence(b){
  const sel = b.select || "explicit";
  let what;
  if(sel === "explicit"){
    const names = (b.buckets || []).map(function(k){ return k.replace("|", "/"); });
    const regs = b.regimes || [];
    what = names.length ? names.join(" + ")
         : (regs.length ? regs.join(" + ") : "every bucket");
  } else {
    /* 🔴 NAMED WITH NOTHING TICKED IS "EVERY BUCKET", NOT "NOTHING".
       Trevor, 2026-09-19: *"Named Target doesn't make any sense, other than
       using it as a NO target -- which would be just the same thing as not
       selecting a target."* He is reading the behaviour correctly, and the
       engine agrees: it takes `set(block["buckets"] or [])`, and an empty set
       restricts nothing. So Named is a FILTER that happens to be empty rather
       than a mode that means something on its own -- and this sentence has
       always said "every bucket" when it is. The confusion is in the CHIP,
       which sits in a row of selection MODES and so reads like one.

       🔴 MY FIRST ATTEMPT AT THIS WAS WORSE THAN THE PROBLEM. I put an
       explicit-vs-counted branch inside the `else`, which only ever runs for
       the COUNTED modes -- dead code that also claimed an empty Named "targets
       nothing", the opposite of what the engine does. Reverted. */
    what = (SCHED_LABEL[sel] || sel) + " × " + (b.select_n || 1)
         + ((b.regimes || []).length ? " in " + b.regimes.join("/") : "");
  }
  const g = (b.groups && b.groups !== "any")
          ? ", " + (SCHED_LABEL[b.groups] || b.groups) : "";
  const m = (b.machines || []).length ? ", on " + b.machines.join(" + ") : "";
  return esc("Target " + what + g + m + " \u2014 until " + schedUntilPhrase(b.until || {})
             + ((b.max_jobs) ? " (give up after " + b.max_jobs + " jobs)" : "")) ;
}

function schedUntilPhrase(u){
  const k = u.kind;
  if(k === "jobs") return (u.n || 1) + " job" + ((u.n || 1) === 1 ? "" : "s");
  if(k === "pf_at_least") return "PF reaches " + (u.value != null ? u.value : "?");
  if(k === "pinned_cleared") return (u.percent != null ? u.percent : 50)
      + "% of its pinned variables clear";
  if(k === "bucket_splits") return "the bucket splits";
  if(k === "profit_up_pct") return "profit is " + (u.percent != null ? u.percent : 10)
      + "% higher";
  if(k === "giveback_below") return "give-back drops under " + (u.value != null ? u.value : "?") + "%";
  if(k === "epoch_done"){
    const n = Number(u.passes || 1);
    return "every group has run "
         + (n === 1 ? "once" : n === 2 ? "twice" : n + " times");
  }
  return "an unknown condition (" + esc(String(k)) + ")";
}

/* WHAT IT HAS DONE SO FAR. Elapsed and rounds spent ALWAYS -- Trevor asked for
   both, and they are the two facts that are never in doubt. */
function schedProgress(b, sch){
  const st = sch.block_state || {};
  const spent = Number(st.jobs_spent || 0);
  const started = Number(st.started_at || 0);
  const elapsed = started ? (Date.now() / 1000 - started) : 0;
  const uk = (b.until || {}).kind;
  const etaKind = (VOCAB.eta_kind || {})[uk] || ETA_KIND_FALLBACK[uk] || "none";
  return '<div class="tsec" style="margin-top:8px">'
    + '<div class="trow">'
    + '<span class="chip">' + spent + ' job' + (spent === 1 ? "" : "s") + ' spent</span>'
    + '<span class="chip">' + esc(dur(elapsed)) + ' elapsed</span>'
    + '</div>'
    + '<div class="tnote" style="margin-top:6px">' + schedEtaLine(etaKind) + '</div>'
    + '</div>';
}

/* 🔴 THE THREE KINDS, DRAWN DIFFERENTLY ON PURPOSE. The live measurement and
   any projection come from the engine when the snapshot carries them; until
   then this states which KIND of answer the condition can support, which is
   itself the useful thing and is never wrong. */
/* 🔴 A MISSING VOCABULARY MUST NOT BECOME "NO ETA IS POSSIBLE".
   `eta_kind` is published with the settings, and every OTHER vocabulary in this
   file already carries a fallback for the snapshot that predates it -- this one
   did not, so an app yet to receive the vocab told you a job-count block could
   never be estimated. That is not a missing answer, it is the opposite of the
   right one, which is the exact wrongness this table exists to prevent. Found
   by rendering the flowchart against a preview that has no VOCAB at all. */
const ETA_KIND_FALLBACK = {
  jobs: "exact", epoch_done: "exact",
  pinned_cleared: "projected", pf_at_least: "projected",
  profit_up_pct: "projected", giveback_below: "projected",
  bucket_splits: "none",
};

function schedEtaLine(kind){
  if(kind === "exact")
    return "<b>Countable.</b> This block ends after a set number of jobs, so its "
         + "finish is arithmetic once a round has been timed.";
  if(kind === "projected")
    return "<b>Estimate only.</b> Any time shown for this block is the rate seen "
         + "so far, extrapolated \u2014 not a deadline. Progress is the reliable part.";
  return "<b>No ETA is possible.</b> Nobody can say how many rounds this takes. "
       + "Rounds spent and time elapsed are what can be known.";
}

/* ---------- the editor ---------- */
function schedEditor(b){
  const u = b.until || {};
  const chip = function(attr, val, on, label){
    return '<button type="button" class="chip' + (on ? " on" : "") + '" data-'
      + attr + '="' + esc(b.id) + ':' + esc(String(val)) + '">' + esc(label) + '</button>';
  };
  const buckets = (BUCKETS || []).filter(function(x){
    return String(x.regime).toUpperCase() !== "GLOBALS"; });
  return '<div class="tsec" style="margin-top:10px">'

    /* 🔴 CLEAR, NOT DELETE. Trevor, 2026-09-19: *"We need a Clear button
       somewhere. That would clear all the selections without removing the block
       completely."* Starting a block over meant removing it and adding another,
       which loses its place in the chain -- so the only way to start over also
       moved the thing you were not trying to move. */
    + '<div class="trow" style="margin-bottom:2px">'
    + '<span class="section-label" style="margin:0">Target</span>'
    + '<button type="button" class="chip" data-schedclear="' + esc(b.id)
    + '">Clear selections</button></div>'
    + '<div class="chips">'
    + vocab("selects").map(function(v){
        return chip("schedsel", v, (b.select || "explicit") === v,
                    SCHED_LABEL[v] || v); }).join("")
    + '</div>'
    + '<div class="tnote">' + esc(vocabText("select_text", b.select || "explicit")) + '</div>'
    + '<div class="chips" style="margin-top:6px">'
    + ["BULL", "BEAR", "RANGING"].map(function(r){
        return chip("schedreg", r, (b.regimes || []).indexOf(r) >= 0, r); }).join("")
    + '</div>'
    + ((b.select || "explicit") === "explicit"
        ? '<div class="chips" style="margin-top:6px">'
          + buckets.map(function(x){
              const k = String(x.regime).toUpperCase() + "|" + x.bucket_id;
              return chip("schedbkt", k, (b.buckets || []).indexOf(k) >= 0,
                          k.replace("|", "/")); }).join("")
          + '</div>'
        : '<div class="chips" style="margin-top:6px">'
          + [1, 2, 3].map(function(n){
              return chip("schedn", n, Number(b.select_n || 1) === n, "top " + n); }).join("")
          + '</div>')

    + '<div class="section-label" style="margin-top:12px">Groups</div>'
    + '<div class="chips">'
    + vocab("groups").map(function(v){
        return chip("schedgrp", v, (b.groups || "any") === v,
                    SCHED_LABEL[v] || v); }).join("")
    + '</div>'
    + '<div class="tnote">' + esc(vocabText("group_text", b.groups || "any")) + '</div>'

    + '<div class="section-label" style="margin-top:12px">Machines</div>'
    + '<div class="chips">'
    /* `machine`, not `machine_id` -- the fleet row's own field name, and the
       snapshot carries ONE ROW PER BEACON rather than one per machine, so the
       list is deduped. Reading the wrong key put a chip labelled "undefined"
       on the card and wrote the string "undefined" into the block, which the
       scheduler would then have matched against no machine at all. */
    + schedMachines().map(function(name){
        return chip("schedmac", name, (b.machines || []).indexOf(name) >= 0,
                    name); }).join("")
    + '</div>'
    + '<div class="tnote">None selected means any machine may take it.</div>'

    + '<div class="section-label" style="margin-top:12px">Until</div>'
    + '<div class="chips">'
    + vocab("untils").map(function(v){
        return chip("scheduntil", v, u.kind === v, SCHED_LABEL[v] || v); }).join("")
    + '</div>'
    + '<div class="tnote">' + esc(vocabText("until_text", u.kind)) + '</div>'
    + schedValueRow(b, u)

    + (["pf_at_least", "giveback_below", "profit_up_pct"].indexOf(u.kind) >= 0
        ? '<div class="section-label" style="margin-top:12px">Judged on</div>'
          + '<div class="chips">'
          + vocab("scopes").map(function(v){
              return chip("schedscope", v, (u.scope || "live") === v,
                          SCHED_LABEL[v] || v); }).join("")
          + '</div>'
          + '<div class="tnote">' + esc(vocabText("scope_text", u.scope || "live")) + '</div>'
        : "")

    + '<div class="section-label" style="margin-top:12px">Give up after</div>'
    + '<div class="chips">'
    + [0, 5, 10, 20, 50].map(function(n){
        return chip("schedcap", n, Number(b.max_jobs || 0) === n,
                    n ? n + " jobs" : "never"); }).join("")
    + '</div>'
    + '<div class="tnote">On reaching this the block moves on rather than '
    + 'stopping the chain \u2014 and says loudly that it gave up.</div>'
    + '</div>';
}

function schedMachines(){
  const seen = {};
  (FLEET || []).forEach(function(f){
    const n = f && f.machine;
    if(n) seen[n] = true;
  });
  return Object.keys(seen).sort();
}

/* The one number a condition needs, as chips rather than a keyboard: a phone
   keyboard over a list like this is three taps and a dismiss. */
/* 🔴 ONE MAPPING, READ FROM THREE PLACES. The field a condition's number
   lives under was written out as the same ternary in schedValueRow, in the
   chip handler and in the custom-input handler. Adding a condition meant
   editing three copies, and missing one writes a number to a field the engine
   never reads -- no error, just a setting that does nothing. Same lesson
   data-schedclear taught on 09-19 from the other end: a handler the dispatcher
   cannot see never runs. */
const SCHED_UNTIL_FIELD = {
  jobs: "n", pinned_cleared: "percent", profit_up_pct: "percent",
  epoch_done: "passes",
};
function schedUntilField(kind){ return SCHED_UNTIL_FIELD[kind] || "value"; }
/* Counts are whole numbers and at least 1. A "1.5th pass" is not a thing, and
   0 passes would complete the block the instant it activated. */
function schedUntilIsCount(field){ return field === "n" || field === "passes"; }

function schedValueRow(b, u){
  const opts = {
    jobs: [1, 2, 3, 5, 10],
    pf_at_least: [1.0, 1.2, 1.4, 1.6, 2.0],
    pinned_cleared: [25, 50, 75, 100],
    profit_up_pct: [5, 10, 25, 50],
    giveback_below: [30, 40, 50],
    /* ONCE is a full pass; TWICE is the first point at which anything CAN
       lock, because a variable needs two consecutive middle wins. */
    epoch_done: [1, 2, 3],
  }[u.kind];
  if(!opts) return "";
  const field = schedUntilField(u.kind);
  const cur = u[field];
  return '<div class="chips" style="margin-top:6px">'
    + opts.map(function(v){
        return '<button type="button" class="chip' + (Number(cur) === v ? " on" : "")
          + '" data-schedval="' + esc(b.id) + ':' + v + '">' + v
          + (field === "percent" ? "%" : "") + '</button>'; }).join("")
    /* 🔴 THE PRESETS ARE A SHORTCUT, NOT THE RANGE. Trevor, 2026-09-19:
       *"Until needs a text box next to it to have custom numbers."* Five chips
       cannot say "run 40 jobs" or "PF reaches 1.35", and a builder that only
       expresses the five numbers somebody guessed at is one you stop using the
       first time you want a sixth. */
    + '<input class="pickin schedin" type="number" inputmode="decimal" '
    + 'step="any" min="0" placeholder="\u2014" data-schedvalin="' + esc(b.id)
    + '" value="' + (cur === undefined || cur === null ? "" : esc(cur)) + '">'
    + '</div>';
}

function renderSettings(){
  const ro = !apiBase();
  return '<div class="home">'
    + '<div class="section-label">Settings</div>'
    /* SAID ONCE, AT THE TOP, rather than on every control. A disabled chip with
       no explanation reads as a bug; the same sentence repeated eleven times
       reads as noise. */
    + (ro ? '<div class="card"><div class="card-in">'
      + '<div class="tlab">Read-only</div>'
      + '<div class="tnote">This page cannot reach the fleet\'s write endpoint, '
      + 'so nothing below can be saved. The endpoint deliberately has no public '
      + 'address \u2014 it answers only over the private network, which is what '
      + 'the Tailscale move delivers. Until then this badge shows what is set '
      + 'and cannot change it.</div></div></div>' : "")
    + (SETTINGS_ERROR && SETTINGS_ERROR !== "read-only"
        ? '<div class="card"><div class="card-in"><div class="tlab">Not saved</div>'
        + '<div class="tnote">' + esc(SETTINGS_ERROR) + '</div></div></div>' : "")
    + leaseBadge()
    + bucketPriorityBadge()
    + '</div>';
}

/* ---------- 1. LEASES ---------- */
/* Trevor, 2026-09-18: *"I want to be able to Add hours to a machines lease. In
   case a machine goes offline for longer than 24 hours. And I personally know
   that round is still going."*

   🔴 THE ROW KEEPS SHOWING THE AGE AFTER AN EXTENSION, and that is the whole
   design. Extending does NOT bump the heartbeat -- which is how it has been done
   by hand, and which makes the record say the machine reported in when it did
   not. It records that somebody who knows why has vouched for it until a stated
   time. So both facts stay on screen: "31h since heartbeat" AND "vouched to
   09:00" is the true state, where "1m since heartbeat" would be a fabricated
   one. See leasing.LeaseManager.extensions. */
function leaseBadge(){
  const rows = (LEASES || []).slice()
    .sort((a, b) => (Number(b.age_hours) || 0) - (Number(a.age_hours) || 0));
  return '<div class="card"><div class="card-in">'
    + '<div class="tlab">Leases</div>'
    + '<div class="tnote">A lease goes stale after <b>24 hours</b> without a '
    + 'heartbeat, and a peer may then reclaim the group. Extend one when a '
    + 'machine is offline but you know its round is still going.</div>'
    + (rows.length ? rows.map(leaseRow).join("")
       : '<div class="tnote" style="margin-top:10px">No leases held right now. '
       + 'Nothing to extend.</div>')
    + '</div></div>';
}

function leaseRow(l){
  const age = Number(l.age_hours) || 0;
  /* THE AGE IS THE REASON THE ROW EXISTS, so it is the loud thing -- amber from
     18h, red past 24. A row that only said "held" would leave you doing the
     arithmetic that decides whether to act. */
  const cls = age >= 24 ? "bad" : (age >= 18 ? "warn" : "");
  const vouched = l.extended_until_text || "";
  return '<div class="tsec" style="margin-top:12px">'
    + '<div class="trow"><span class="tname">' + esc(l.machine_id || "?") + '</span>'
    + '<span class="chip ' + cls + '">' + esc(dur(age * 3600)) + ' since heartbeat</span>'
    + (vouched ? '<span class="chip gold">vouched to ' + esc(vouched) + '</span>' : "")
    + '</div>'
    + '<div class="tnote">' + esc(humanize(l.group_id || l.key || "")) + '</div>'
    + '<div class="chips" style="margin-top:6px">'
    + [6, 12, 24, 48].map(function(h){
        return '<button type="button" class="chip" data-lease="'
          + esc(l.key) + ':' + h + '">+' + h + 'h</button>'; }).join("")
    + (vouched ? '<button type="button" class="chip" data-lease="'
        + esc(l.key) + ':0">Cancel</button>' : "")
    + '</div></div>';
}

/* ---------- 2. BUCKET PRIORITY ---------- */
/* Trevor, 2026-09-18: *"I want to manually give priority to certain buckets ...
   I want to be able to assign a percentage that the schedular prioritizes each
   bucket. I will need the Percentage of bucket done beside that."*

   THE REGIME CHIPS LEAD AND THE PERCENTAGE SITS DIRECTLY UNDER THEM -- Trevor,
   same day: *"Under the Regimes Chips. We should actually put the percentage
   below that. Integrate it together with the top one."* They are ONE control:
   the chips choose what is targeted, the percentage says how hard. Split across
   the badge, the percentage read as a property of the bucket list below it
   rather than of the targeting above it.

   🔴 WHY A PERCENTAGE MEANS ANYTHING AT ALL. `scheduler.bucket_shares()`
   already gives every bucket a share of the work -- computed from how much of
   the market it covers -- and the round-robin serves whichever bucket is
   furthest below its share. So this is not a new concept bolted on: it
   OVERRIDES that one number. Which is why each row shows the computed share
   greyed beside the override. You are replacing a value, not inventing one. */
function bucketPriorityBadge(){
  const bp = SETTINGS_STATE.bucket_priority || {};
  const mode = bp.mode || "off";
  const regimes = bp.regimes || ["BULL", "BEAR", "RANGING"];
  /* 🔴 `regime` IS NOT AN AUTO MODE, and this predicate is why that matters:
     it gates the focus slider, which only the ranked modes read. Leaving it as
     "anything but off and manual" would put a live slider in front of a field
     MODE_REGIME never looks at -- a control that moves and changes nothing. */
  const auto = (mode === "auto_top" || mode === "auto_bottom"
                || mode === "auto_defaults");
  const modes = [["auto_top", "Top by PF"], ["auto_bottom", "Bottom by PF"],
                 ["auto_defaults", "Most defaults"], ["off", "Off"]];
  return '<div class="card"><div class="card-in">'
    + '<div class="tlab">Bucket priority</div>'
    + '<div class="tnote">' + esc(modeText(mode)) + '</div>'

    + '<div class="section-label" style="margin-top:14px">Target these regimes</div>'
    + '<div class="chips">'
    + ["BULL", "BEAR", "RANGING"].map(function(r){
        return '<button type="button" class="chip '
          + (regimes.indexOf(r) >= 0 ? "on" : "") + '" data-bpregime="' + r + '">'
          + r + '</button>'; }).join("")
    + '</div>'

    /* The percentage, integrated with the chips above rather than floating
       further down -- see the note on this function. */
    + '<div class="trow" style="margin-top:10px">'
    + '<span class="tname">Share given to the target</span>'
    + '<span class="chip ' + (auto ? "gold" : "") + '">' + fmtPct(bp.focus_pct) + '</span>'
    + '</div>'
    + '<input type="range" min="10" max="100" step="5" class="bpslider" data-bpfocus'
    + ' value="' + (Number(bp.focus_pct) || 80) + '"' + (auto ? "" : " disabled") + '>'
    + '<div class="tnote">The targeted buckets share this much of the work between'
    + ' them; everything else splits the rest. '
    + (auto ? "" : "<b>Pick an auto target below to use it.</b>") + '</div>'

    + '<div class="section-label" style="margin-top:14px">Auto prioritize</div>'
    + '<div class="chips">'
    + modes.map(function(m){
        return '<button type="button" class="chip ' + (mode === m[0] ? "on" : "")
          + '" data-bpmode="' + m[0] + '">' + esc(m[1]) + '</button>'; }).join("")
    + '</div>'
    + '<div class="tnote" style="margin-top:6px">Narrowed by the regime chips'
    + ' above. With one bucket per regime today, that narrowing is what makes'
    + ' &ldquo;top 3&rdquo; mean anything at all.</div>'

    + '<div class="section-label" style="margin-top:14px">Regimes</div>'
    + regimePriorityRows(bp)

    + '<div class="section-label" style="margin-top:14px">Buckets</div>'
    + bucketPriorityRows(bp)
    + '<div class="chips" style="margin-top:10px">'
    + '<button type="button" class="chip" data-bpreset>Reset to computed</button>'
    + '</div>'
    + '<div class="tnote" style="margin-top:10px">⚠️ Applied by each machine'
    + ' at its next tick, not immediately. A round already running keeps the'
    + ' bucket it claimed.</div>'
    + '</div></div>';
}

/* ONE ROW PER REGIME. Trevor, 2026-09-19: priority percentages per regime as
   well as per bucket.

   🔴 THIS IS THE CONTROL THAT SURVIVES A SPLIT, and the note under it says so,
   because today the two look identical. While each regime holds one bucket,
   pinning BULL and pinning BULL|1600 do the same thing; the moment BULL becomes
   three buckets a bucket pin silently means a third of what it used to, and
   this one still means what it said. Somebody reading the card a month from now
   needs to know which control to reach for BEFORE the split, not after. */
function regimePriorityRows(bp){
  const pins = bp.regime_pins || {};
  /* The regime's CURRENT total, summed from the published bucket shares rather
     than recomputed -- same reason bucketPriorityRows reads BUCKETS: a second
     derivation of the same number is a second thing to be wrong. */
  const rows = (BUCKETS || []).filter(b =>
    String(b.regime || "").toUpperCase() !== "GLOBALS");
  return ["BULL", "BEAR", "RANGING"].map(function(r){
    const mine = rows.filter(b => String(b.regime).toUpperCase() === r);
    const pinned = pins[r] != null;
    /* An em dash, never 0%, for a regime with no published bucket -- see
       fmtPct. "Nothing computed yet" and "given nothing" are different. */
    const eff = mine.length
      ? mine.reduce((a, b) => a + (Number(b.effective_pct) || 0), 0) : null;
    return '<div class="tsec" style="margin-top:10px">'
      + '<div class="trow">'
      + '<span class="tname">' + esc(r)
      + '<span class="dim"> / ' + mine.length
      + (mine.length === 1 ? " bucket" : " buckets") + '</span></span>'
      + '<span class="chip ' + (pinned ? "gold" : "") + '">'
      + fmtPct(pinned ? pins[r] : eff) + '</span>'
      + '</div>'
      + '<div class="tnote">' + (pinned
          ? "Pinned. Its buckets divide this between them; the other regimes "
            + "split what is left, in their own proportions."
          : "Computed share " + fmtPct(eff) + ".")
      + '</div>'
      + '<div class="chips" style="margin-top:6px">'
      + [10, 25, 40, 60, 80].map(function(p){
          return '<button type="button" class="chip '
            + (pinned && Math.round(pins[r]) === p ? "on" : "")
            + '" data-bprpin="' + r + ':' + p + '">' + p + '%</button>'; }).join("")
      + (pinned ? '<button type="button" class="chip" data-bprpin="' + r
          + ':-1">Unpin</button>' : "")
      + '</div></div>';
  }).join("");
}

/* ONE ROW PER BUCKET: what it would get, what you have pinned, and how far
   through it is. The percentage DONE sits beside the priority deliberately --
   Trevor: *"I will need the Percentage of bucket done beside that."* Together
   they answer one question ("should this get more?"); neither answers it alone,
   because a bucket on a big share that is nearly finished and one on the same
   share that has barely started want opposite things. */
function bucketPriorityRows(bp){
  const pins = bp.pins || {};
  /* ONE bucket list, not two. `collect_buckets` already publishes every bucket
     with its groups done and total, so the shares were added to THAT row rather
     than to a second list -- two lists of buckets is two things to keep in step
     and one of them would eventually be missing a bucket. GLOBALS is filtered:
     it is not tradeable and holds no share, so a priority row for it would be
     a control that cannot do anything. */
  const rows = (BUCKETS || []).filter(b =>
    String(b.regime || "").toUpperCase() !== "GLOBALS");
  if(!rows.length){
    return '<div class="tnote">No bucket shares published yet. The scheduler'
      + ' computes these each tick; until one has, there is nothing to override'
      + ' and a number here would be invented.</div>';
  }
  return rows.map(function(b){
    const key = String(b.regime).toUpperCase() + "|" + b.bucket_id;
    const pinned = pins[key] != null;
    const done = (b.groups_total ? (100 * b.groups_done / b.groups_total) : null);
    return '<div class="tsec" style="margin-top:10px">'
      + '<div class="trow">'
      + '<span class="tname">' + esc(String(b.regime)) + '<span class="dim"> / '
      + esc(String(b.bucket_id)) + '</span></span>'
      + '<span class="chip ' + (pinned ? "gold" : "") + '">'
      + fmtPct(pinned ? pins[key] : b.effective_pct) + '</span>'
      + '<span class="chip">' + fmtPct(done) + ' done</span>'
      + '</div>'
      + '<div class="tnote">' + (pinned
          ? "Pinned. The other buckets split what is left, in their own proportions."
          : "Computed share " + fmtPct(b.natural_pct) + ".")
      + " " + b.groups_done + " of " + b.groups_total + " groups optimized."
      + '</div>'
      + '<div class="chips" style="margin-top:6px">'
      + [10, 25, 40, 60, 80].map(function(p){
          return '<button type="button" class="chip '
            + (pinned && Math.round(pins[key]) === p ? "on" : "")
            + '" data-bppin="' + esc(key) + ':' + p + '">' + p + '%</button>'; }).join("")
      + (pinned ? '<button type="button" class="chip" data-bppin="' + esc(key)
          + ':-1">Unpin</button>' : "")
      + '</div></div>';
  }).join("");
}

/* An em dash, not "0%". A bucket with no reading has not been given nothing --
   nothing has been computed for it yet, and those are different claims. */
function fmtPct(v){
  const n = Number(v);
  return isFinite(n) ? n.toFixed(0) + "%" : "\u2014";
}


/* ==========================================================================
   LIVE -- the VPS: account, open trade, trade history, chart, and the bucket
   ==========================================================================
   Trevor, 2026-09-25: *"another section on the home screen. This is gonna be
   the live trading section ... current trades. Trade history. Then ... a live
   trading graph ... 1min, 5min, 15min, 1hr, 4hr, 1D. Along with indicators for
   current and past trades."* And: *"I also want to know what bucket the live
   graph is currently trading in."*

   WHERE THE DATA COMES FROM. Not the gist -- the VPS itself, over the tailnet.
   GoldBot_LiveFeed.mq5 (an MT5 service beside the EA, read-only) writes the
   account, positions, deals and bars; live_feed_server.ps1 joins them with the
   EA's own monitoring files and the dial's provenance, and serves /live, /bars
   and /regimes on 127.0.0.1, which `tailscale serve` publishes to the tailnet.
   So this page works while every optimizer is asleep, and none of it passes
   through GitHub. paint() never touches it: the chart is built once, and a
   repaint every 20 s would throw it away.

   🔴 THE ADDRESS IS NOT IN THIS FILE, for the gist id's reason: the repo is
   public. It arrives once in the link (#live=https://...) or is typed on the
   page, and is kept in this device's localStorage.

   TIMES ARE BROKER SERVER TIME throughout, as MT5 shows them. A D1 candle is
   the broker's day; shifting it to the phone's clock would split every day
   candle across two dates. */

const LV_TF_LABEL = {M1: "1m", M5: "5m", M15: "15m", H1: "1H", H4: "4H", D1: "1D"};
const LV_TF_SEC = {M1: 60, M5: 300, M15: 900, H1: 3600, H4: 14400, D1: 86400};
/* How far back each timeframe's bars reach (the service keeps 1440 M1 .. 520
   D1), with room to spare -- used to pick a timeframe that still holds an old
   trade before asking for it. */
const LV_TF_REACH = {M1: 20*3600, M5: 2.5*86400, M15: 8*86400, H1: 25*86400,
                     H4: 80*86400, D1: 700*86400};
/* Pinned, and pinned by hash: this page is on a public origin, and a CDN copy
   that changed would otherwise run here with everything the page can reach. */
const LV_LIB = "https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js";
const LV_LIB_SRI = "sha384-OK7vELvjHdhUFi31JYioPIcRHTROLdcDa6ZsNWgvgLaKj+9JqhU0Ad8g4wz3CXjA";
const LV_BAND = {BULL: "rgba(95,190,149,.55)", BEAR: "rgba(224,104,90,.55)",
                 RANGING: "rgba(111,168,212,.55)"};
const LV_C = {card: "#141E26", card2: "#1B2933", grid: "#18242D", line: "#22313C",
              dim: "#8CA0AC", faint: "#5F727E", gold: "#E0B457", good: "#5FBE95", bad: "#E0685A"};
/* The EA's own exit reason wins: the broker records a trailing stop and a
   plain stop both as "sl", and only the EA knows which it was. */
const LV_EA_REASON = {TRAIL: "Trail", SL: "Stop", TP: "Target", SIGNAL: "Signal"};
const LV_BROKER_REASON = {sl: "Stop", tp: "Target", expert: "EA", client: "Manual",
                          mobile: "Manual", web: "Manual", stop_out: "Stop-out"};

let LV = {
  url: "",            // from the link, when localStorage is unavailable
  data: null,         // the last /live answer
  err: "",            // why the last poll failed; "" when it did not
  at: 0,              // Date.now() of the last good /live
  bars: {},           // tf -> {at, bars:[{time,open,high,low,close}]}
  runs: null,         // [[server_time, regime], ...] from /regimes
  runsAt: 0,
  tf: "M5", style: "candles", sel: null, hf: "all",

  trail: null,

/* ---------- address ---------- */
function lvAdoptLink(){

/* ---------- small formatters ---------- */
function lvCur(){
  const c = LV.data && LV.data.account && LV.data.account.currency;
  return !c || c === "USD" ? "$" : c + " ";
}
function lvMoney(v, sign){
  const n = Number(v);
  if(!isFinite(n)) return "—";
  const s = n < 0 ? "−" : (sign !== false && n > 0 ? "+" : "");
  return s + lvCur() + Math.abs(n).toLocaleString("en-US",
    {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
const lvTone = v => v > 0 ? "lv-good" : v < 0 ? "lv-bad" : "";
function lvSigned(v, d){
  const n = Number(v);
  return (n < 0 ? "−" : n > 0 ? "+" : "") + Math.abs(n).toFixed(d == null ? 2 : d);
}
function lvPx(v){
  const n = Number(v);
  const dg = (LV.data && LV.data.symbol && LV.data.symbol.digits) || 2;
  return isFinite(n) && n ? n.toFixed(dg) : "—";
}
const LV_DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
/* Server time now: the last answer's clock, moved on by the wall clock since. */
function lvNow(){
  const d = LV.data;
  if(!d) return Math.floor(Date.now() / 1000);
  return Number(d.served_gmt) + Number(d.gmt_offset || 0) +
         Math.floor((Date.now() - LV.at) / 1000);
}
function lvWhen(t){
  const d = new Date(Number(t) * 1000), p = n => String(n).padStart(2, "0");
  const hm = p(d.getUTCHours()) + ":" + p(d.getUTCMinutes());
  return lvNow() - Number(t) < 6 * 86400
    ? LV_DAYS[d.getUTCDay()] + " " + hm
    : p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()) + " " + hm;
}
function lvSpan(sec){
  const m = Math.max(1, Math.round(Number(sec) / 60));
  if(m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if(h < 24) return h + "h " + String(m % 60).padStart(2, "0") + "m";
  return Math.floor(h / 24) + "d " + (h % 24) + "h";
}
/* Seconds under a minute: "answered 1m ago" for a poll 3 s old read as a
   stall, which is the one thing this page must never fake. */
function lvDur(sec){
  return sec < 60 ? Math.max(0, Math.round(sec)) + "s" : lvSpan(sec);
}
function lvAgo(sec){ return lvDur(sec) + " ago"; }
/* The crosshair readout's clock: short enough that the CLOSE, the number that
   matters, still fits on a phone -- time for intraday, weekday for 4H, date
   for daily candles. */
function lvBarWhen(t){
  const d = new Date(Number(t) * 1000), p = n => String(n).padStart(2, "0");
  if(LV.tf === "D1") return p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate());
  const hm = p(d.getUTCHours()) + ":" + p(d.getUTCMinutes());
  return LV.tf === "H4" ? LV_DAYS[d.getUTCDay()] + " " + hm : hm;
}
function lvGmt(){
  const o = Number(LV.data && LV.data.gmt_offset) / 3600;
  if(!isFinite(o)) return "server time";
  return "server time (GMT" + (o >= 0 ? "+" : "−") + Math.abs(o) + ")";
}
const lvRegTag = r => r ? `<span class="chip ${RC[r] || ""}">${esc(r)}</span>` : "";
const lvDirTag = d => `<span class="lv-dir"><span class="ar">${d === "buy" ? "▲" : "▼"}</span> ` +
                      `${d === "buy" ? "BUY" : "SELL"}</span>`;
function lvReason(t){
  const ea = t.ea_reason ? String(t.ea_reason).toUpperCase() : "";
  if(ea) return LV_EA_REASON[ea] || (ea.charAt(0) + ea.slice(1).toLowerCase());
  return LV_BROKER_REASON[t.reason] || esc(t.reason || "");
}

/* ---------- the data ---------- */
function lvPositions(){
  return LV.data && Array.isArray(LV.data.positions) ? LV.data.positions : [];
}
function lvTrades(){
  return LV.data && Array.isArray(LV.data.trades) ? LV.data.trades : [];
}
const lvDayStart = () => Math.floor(lvNow() / 86400) * 86400;
function lvOpenPnl(){
  return lvPositions().reduce((s, p) => s + Number(p.profit || 0) + Number(p.swap || 0), 0);
}
function lvClosedSince(t){
  return lvTrades().filter(x => Number(x.exit_time) >= t)
                   .reduce((s, x) => s + Number(x.profit || 0), 0);
}
function lvErrText(e){
  if(e && e.name === "AbortError") return "timed out";
  if(e && e.name === "TypeError") return "no answer";
  return String((e && e.message) || e);
}
async function lvGet(path){
  const base = liveUrl();
  if(!base) throw new Error("no address");
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  try{
    const r = await fetch(base + path, {cache: "no-store", signal: ctl.signal});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
function lvVisible(){
  const el = document.getElementById("page-live");
  return !!el && !el.hidden && !document.hidden;
}

/* TWO SPEEDS. Trevor, 2026-09-25: *"I do want this Live page to update as
   fast as possible."* While this page is on screen: /now EVERY SECOND -- the
   price, the positions with their LIVE stop, equity and the forming candles,
   passed straight through from the service, which rewrites it the moment any
   of that changes -- and the heavy /live (history, gates, the stop's path)
   every 15 s, or AT ONCE when /now shows a trade opened or closed. Off screen:
   /live every 20 s for the home badge, and nothing faster -- a phone in a
   pocket has no use for a second-by-second feed. */
const LV_FAST_MS = 1000, LV_SLOW_MS = 15000, LV_IDLE_MS = 20000;
function lvSchedule(delay){
  clearTimeout(LV.timer);
  if(!liveUrl()) return;
  LV.timer = setTimeout(lvTick, delay != null ? delay : (lvVisible() ? LV_FAST_MS : LV_IDLE_MS));
}
async function lvTick(){
  const fast = lvVisible() && LV.data && !LV.wantLive && Date.now() - LV.liveAt < LV_SLOW_MS;
  if(fast) await lvPollNow(); else await lvPoll();
  lvSchedule();
}
async function lvPoll(){
  if(!liveUrl() || LV.busy) return;
  LV.busy = true;
  try{
    const d = await lvGet("/live");
    if(d && d.schema === 1){
      LV.data = d; LV.at = LV.liveAt = Date.now(); LV.err = ""; LV.wantLive = false;
    }
    else LV.err = "an answer this page does not understand";
  }catch(e){ LV.err = lvErrText(e); }
  finally{ LV.busy = false; }
  if(lvVisible() && LV.built){
    if(LV.chart){ await lvMaybeBars(); lvMaybeRegimes(); }   // the band can arrive late
    lvPaint();
  }
  lvPaintBadge();
}
async function lvPollNow(){
  if(LV.busy) return;
  LV.busy = true;
  let r = null;
  try{ r = await lvGet("/now"); LV.err = ""; }
  catch(e){ LV.err = lvErrText(e); }
  finally{ LV.busy = false; }
  if(r) lvMergeNow(r);
  if(lvVisible() && LV.built){
    if(LV.chart) await lvMaybeBars();
    lvPaintFast();
  }
  lvPaintBadge();
}
/* /now ONTO /live. The live numbers -- price, profit, the broker's stop --
   replace the old ones; what only /live knows (regime, bucket, the stop's
   path) stays. A position that appeared or vanished means a trade opened or
   closed, and so does a new deals_sig: either one fetches /live at once. */
function lvMergeNow(r){
  const d = LV.data, n = r && r.now;
  if(!d) return;
  d.served_gmt = r.served_gmt;
  LV.at = Date.now();
  const health = Object.assign({}, d.health || {});
  if(!n){
    health.feed = {status: "missing", age_s: null};
    d.health = health;
    return;
  }
  const age = Number(r.served_gmt) - Number(n.written_gmt);
  health.feed = {status: age > 30 ? "stalled" : "ok", age_s: age, service: n.service};
  d.health = health;
  d.gmt_offset = n.gmt_offset;
  d.account = n.account; d.terminal = n.terminal; d.symbol = n.symbol; d.forming = n.forming;
  const old = new Map((d.positions || []).map(p => [String(p.ticket), p]));
  const live = Array.isArray(n.positions) ? n.positions : [];
  if(live.length !== old.size || live.some(p => !old.has(String(p.ticket)))) LV.wantLive = true;
  if(n.deals_sig != null && d.deals_sig != null && n.deals_sig !== d.deals_sig) LV.wantLive = true;
  d.positions = live.map(p => {
    const q = old.get(String(p.ticket)) || {ticket: p.ticket, id: p.id, symbol: p.symbol, dir: p.type,
      volume: p.volume, entry_price: p.price_open, entry_time: p.time, magic: p.magic,
      regime: null, bucket: null, sl_trail: [], sl_initial: null, sl_gap: null};
    return Object.assign(q, {price: p.price_current, profit: p.profit, swap: p.swap, sl: p.sl, tp: p.tp});
  });
}
/* Every second: only what moves. The history and the gates change with /live
   and are left alone, so a list you are scrolling is not rebuilt under you. */

      .map(b => ({time: b[0], open: b[1], high: b[2], low: b[3], close: b[4]}));
    lvApplyBars(tf, bars);

async function lvMaybeRegimes(){

/* WHAT IS WRONG, in the order it matters. Each line names the fix, and a
   closed market is said plainly rather than looking like a dead feed. */
function lvIssues(){
  const d = LV.data, out = [];
  if(!d){
    out.push(LV.err
      ? ["warn", `Can't reach the VPS at <b>${esc(lvHost())}</b> (${esc(LV.err)}). ` +
                 `Is Tailscale switched on for this phone?`]
      : ["", "Connecting to the VPS…"]);
    return out;
  }
  if(LV.err) out.push(["warn", `No answer from the VPS for ${lvDur((Date.now() - LV.at) / 1000)} ` +
                               `(${esc(LV.err)}). This is what it said last.`]);
  const feed = (d.health && d.health.feed) || {};
  const s = d.symbol || {}, t = d.terminal || {};
  /* CLOSED: the last tick is old -- or, when there is no price feed to ask,
     it is the weekend. Found against the real VPS on a Saturday: with the
     service not yet started, a 6-hour-old EA heartbeat read as "is it still
     attached?" when the market was simply shut. Gold closes about 21:00 UTC
     Friday and reopens about 22:00 UTC Sunday. */
  const u = new Date(), wd = u.getUTCDay(), hr = u.getUTCHours();
  const weekend = wd === 6 || (wd === 5 && hr >= 21) || (wd === 0 && hr < 22);
  const closed = (feed.status === "ok" && s.tick_time)
    ? lvNow() - Number(s.tick_time) > 600
    : weekend;
  if(feed.status === "missing")
    out.push(["warn", "The VPS is answering, but the MT5 feed is not running. In MT5 on the VPS: " +
                      "<b>Navigator → Services → GoldBot_LiveFeed → Start</b>."]);
  else if(feed.status === "stalled")
    out.push(["warn", `The MT5 feed stopped writing ${lvAgo(feed.age_s)}. Is MT5 still running on the VPS?`]);
  if(!d.ea)
    out.push(["warn", "No heartbeat from the EA. Is it attached to its chart on the VPS?"]);
  else if(!closed && d.ea.heartbeat_age_s != null && d.ea.heartbeat_age_s > 180)
    out.push(["warn", `The EA's last heartbeat was ${lvAgo(d.ea.heartbeat_age_s)}. Is it still attached?`]);
  if(feed.status === "ok" && t.connected === false)
    out.push(["warn", "MT5 on the VPS is not connected to the broker."]);
  if(feed.status === "ok" && t.trade_allowed === false)
    out.push(["warn", "Algo trading is switched off in MT5 on the VPS, so the EA cannot open trades."]);
  if(d.ea && d.ea.gate_enforced === false)
    out.push(["warn", "The EA is not enforcing the live gate, so it can trade in ANY regime, armed or not."]);
  if(closed) out.push(["", s.tick_time ? `Market closed. Last price ${lvWhen(s.tick_time)}.`
                                       : "Market closed for the weekend."]);
  return out;
}

/* TRADING IN -- the regime the EA is in, the bucket whose values are in force,
   and whether that bucket's gate lets it trade. Then every regime's gate. */
function lvPaintTin(){
  const el = document.getElementById("lvtin");
  if(!el) return;
  const d = LV.data;
  const tin = d && d.trading_in;
  const gates = d && Array.isArray(d.gates) ? d.gates : [];
  let head = '<div class="lv-tinhead"><span class="lv-k">Trading in</span>';
  let line = "";
  if(!tin || !tin.regime){
    line = d ? "The EA has not reported a regime yet." : "Waiting for the VPS.";
  } else {
    const armed = tin.armed === true;
    head += lvRegTag(tin.regime) + (tin.bucket != null ? bktEl(tin.bucket) : "")
         + `<span class="lv-pill ${armed ? "on" : "off"}">${armed ? "Armed" : "Not armed"}</span>`;
    const say = armed
      ? `The EA can open ${esc(tin.regime)} trades here.`
      : `${esc(tin.regime)} is not armed, so the EA opens nothing until it passes the gate (PF 1.50).`;
    const axis = (tin.axis || "D1") + " slope";
    const slope = tin.slope != null ? ` ${axis} <b>${lvSigned(tin.slope, 4)}</b>,` : "";
    let where = "";
    if(tin.bucket == null)
      where = tin.resolved_by === "unknown_no_slope"
        ? " bucket unknown: this regime has split, and the EA on the VPS does not report its slope yet."
        : " no bucket covers this slope.";
    else if(tin.root)
      where = ` root bucket, one bucket covers every slope until ${esc(tin.regime)} splits.`;
    else
      where = ` bucket range <b>${lvSigned(tin.slope_min, 4)}</b> to <b>${lvSigned(tin.slope_max, 4)}</b>.`;
    /* Without a slope (an EA that does not report one yet) the sentence
       starts at `where`, which then needs its own capital. */
    const w = where.trim();
    line = slope ? say + slope + where : say + " " + w.charAt(0).toUpperCase() + w.slice(1);
  }
  head += "</div>";
  const rows = gates.map(g => {
    const cur = tin && g.regime === tin.regime && String(g.bucket) === String(tin.bucket);
    const pf = g.pf != null ? `PF <b>${Number(g.pf).toFixed(2)}</b> on ${esc(g.trades)}` : "not measured yet";
    const when = g.measured_at ? " · " + esc(fmtWhen(Number(g.measured_at)).slice(0, 5)) : "";
    return `<div class="lv-grow${cur ? " cur" : ""}">${lvRegTag(g.regime)}${bktEl(g.bucket)}<span></span>` +
           `<span class="lv-gst ${g.armed ? "on" : "off"}">${g.armed ? "Armed" : "Off"}</span>` +
           `<span class="lv-gpf">${pf}${when ? " · measured" + when.slice(2) : ""}</span></div>`;
  }).join("");
  el.innerHTML = head + `<div class="lv-line">${line}</div>` +
                 (rows ? `<div class="lv-gates">${rows}</div>` : "");
}

function lvPaintOpen(){

                   'The EA holds at most one position at a time.</div></div>';

  }
  /* BUILT when the stop moves (or the trade changes), UPDATED IN PLACE every
     second otherwise. Rebuilding once a second would replace the button under
     a finger that was halfway through tapping it. */

                                           (p.sl_trail || []).length, !!p.sl_gap]));

    el.innerHTML = pos.map(lvOpenCard).join("");
  }
  pos.forEach(lvOpenLive);
