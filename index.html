// never send a fragment to a server, so it appears in no request log and no
// commit. Without it this page is an empty shell. Obscurity, not security: a
// random 32-hex id is a meaningful lock, not a real one.
const GIST_ID = new URLSearchParams(location.hash.slice(1)).get("g");
const GIST_URL = GIST_ID
  ? "https://gist.githubusercontent.com/twiens99/" + encodeURIComponent(GIST_ID) +
    "/raw/goldbot_snapshot.json"
  : null;

function showState(msg){
  // The HOME page carries it too: it is the page that opens first, and an app
  // whose first screen shows two confident buttons over a snapshot it could
  // not load is lying on the one screen everything else is reached from.
  document.getElementById("page-home").innerHTML =
    '<div class="empty">' + msg + '</div>';
  document.getElementById("page-active").innerHTML = "";
  document.getElementById("page-results").innerHTML = "";
}

/* Groups, not rounds. "26 rounds this epoch" answered a question nobody was
   asking -- it counts attempts at groups, and a group is re-run on purpose. */
function campaignProgress(){
  const done = BUCKETS.reduce((a, b) => a + (b.groups_done || 0), 0);
  const total = BUCKETS.reduce((a, b) => a + (b.groups_total || 0), 0);
  if(!total) return LEDGER.filter(completed).length + " rounds this epoch";
  return `${done} of ${total} groups this epoch`;
}

/* ---------- page: active (current jobs) ---------- */
/* Trevor, 2026-09-14: *"That current jobs page will bring up all current jobs
   that are active. It'll have the Desktop job it's working on, the laptop job
   it's currently working on, along with any job that's been started, and isn't
   fully complete."*

   MACHINES FIRST, in that order, because that is the question the page is
   opened to answer. The seeded work underneath is the rest of "started and not
   complete".

   QUEUED WORK IS STILL SHOWN, last and quietly. It is not active and does not
   belong above the things that are -- but dropping it entirely would hide work
   that is owed, which is the failure this app keeps being rebuilt to avoid. It
   gets its own muted heading rather than being mixed in. */
/* THE JOB SELECTOR. Trevor, 2026-09-14: *"I want a JOB selector. Each Job is
   labeled here, The Desktop will have one, the laptop will have one, and then
   there will be Queued up next job, and Unfinished Jobs. Click on that job,
   and it'll show you everything associated with that job."*

   ONE JOB, ONE ROW. This page used to list machines and seeds as separate
   sections, so the sweep running on the Laptop appeared TWICE -- once as the
   machine's card, once as the seed it was holding -- and read as two jobs. A
   job here is the PAIRING: the machine, and whatever seed it holds. That is
   also what makes a detail view possible at all: there is one thing to open. */
let ACTIVE_JOB = null;
/* WHICH FINISHED JOB IS OPEN, by round_no. Trevor, 2026-09-16: *"the results
   tab I want it to list all the JOB's. Then we'll Click on the job to see all
   the tasks on the Job Card. Then we can click on the Task to get to the Task
   Card."* Three levels, and this is the middle one's cursor. Separate from
   ACTIVE_JOB because the two tabs navigate independently -- opening a finished
   job must not close the running one you were watching. */
let RESULTS_JOB = null;
/* HOW THE RESULTS LIST IS ORDERED AND NARROWED. Trevor, 2026-09-16: the chips
   on a row *"are going to sort the order of the list ... Regime cycles between
   the three and the bucket id will also cycle between all the bucket numbers
   available."*

   ⚠️ EVERY CYCLE PASSES THROUGH null, WHICH MEANS "ALL". Three regimes and
   nothing else would be a filter you cannot turn off: tap BEAR once and the
   only way back to the whole list is to guess how many more taps it takes.
   null is the resting state and the one the list starts in. */
let RESULTS_SORT = "newest";       // or "oldest"
let RESULTS_REGIME = null;         // null = every regime
let RESULTS_BUCKET = null;         // null = every bucket
let RESULTS_MACHINE = null;        // null = every machine
let RESULTS_TASK = null;           // null = every kind of job
/* WHICH TASK OF THE OPEN JOB IS SHOWING, by index into its own task list.
   Trevor, 2026-09-16: *"That chipset will be All the tasks that this job had to
   do ... These will be buttons, And will Bring up each taskcard."*

   Index, not kind: a job can run the same kind twice and two chips that look
   identical must still open different cards. Reset whenever a job opens. */
let RESULTS_TASK_OPEN = 0;

/* WHAT KIND OF JOB THIS ROW WAS. Trevor, 2026-09-16: *"I want to know what type
   of task each task was, So Same spot as SEED, i want Optimize, buckettest
   Fulltest."*

   THE JOB'S OWN KIND IS ITS FIRST TASK. A finished job holds several tasks and
   they are stored oldest-first, so the one that opened it is what the job WAS:
   an ordinary round opens with a sweep, and a seeded backtest opens with the
   backtest and never sweeps at all. Showing every task's chip instead would put
   four chips on a row that already carries a regime, a bucket and a name.

   "" when the reports never resolved -- 15 of 31 rows today -- because the
   tasks are the only record of what a row was, and guessing from the ledger
   fields would be inventing it. */
function jobKind(r){
  const t = ((r.reports || {}).tasks || [])[0];
  return t && t.kind ? t.kind : "";
}

function resultsMachines(){
  const seen = [];
  LEDGER.forEach(r => { if(r.machine && !seen.includes(r.machine)) seen.push(r.machine); });
  return seen.sort();
}

/* EVERY kind any job ran, not just the opening one -- the filter offers what
   it can actually find. */
function resultsTasks(){
  /* PLAN ORDER, DERIVED RATHER THAN LISTED. A job's tasks are stored oldest
     first, and a job runs them in plan order -- so the position a kind first
     appears at IS its place in the plan, and averaging that across every job
     orders the filter without this page holding a copy of the order at all.

     THE FIRST CUT HARDCODED THE LIST and the leak scan refused it, correctly:
     a literal array of phase names here is a second copy of job_control's own
     vocabulary, in a PUBLIC repo, that nothing keeps in step. Deriving it is
     both the fix and the better code -- a phase added upstream orders itself. */
  const at = {};
  LEDGER.forEach(r => {
    ((r.reports || {}).tasks || []).forEach((t, i) => {
      if(!t.kind) return;
      (at[t.kind] = at[t.kind] || []).push(i);
    });
  });
  const mean = k => at[k].reduce((a, b) => a + b, 0) / at[k].length;
  const seen = Object.keys(at);
  return seen.sort((a, b) => mean(a) - mean(b));
}

/* The buckets that actually have rounds, in a stable order -- derived, never
   typed, so a split adds itself to the cycle the day it banks a result. */
function resultsBuckets(){
  const seen = [];
  LEDGER.forEach(r => {
    if(r.bucket_id != null && !seen.includes(r.bucket_id)) seen.push(r.bucket_id);
  });
  return seen.sort((a, b) => a - b);
}

/* Next value in a cycle that always contains null. */
function cycle(list, current){
  const all = [null].concat(list);
  const i = all.findIndex(v => String(v) === String(current));
  return all[(i + 1) % all.length];
}

function resultsRows(){
  let rows = LEDGER.slice();
  if(RESULTS_REGIME) rows = rows.filter(r => r.regime === RESULTS_REGIME);
  if(RESULTS_BUCKET != null)
    rows = rows.filter(r => String(r.bucket_id) === String(RESULTS_BUCKET));
  if(RESULTS_MACHINE) rows = rows.filter(r => r.machine === RESULTS_MACHINE);
  /* A JOB THAT RAN THIS TASK, not a job OF this kind -- a job is not of a
     kind. Filtering by the opening task alone would hide every job that also
     ran the one you asked for. */
  if(RESULTS_TASK)
    rows = rows.filter(r => ((r.reports || {}).tasks || [])
      .some(t => t.kind === RESULTS_TASK));
  /* LEDGER arrives newest-first from the publisher, so "newest" is the identity
     and only the other direction costs a reverse. */
  return RESULTS_SORT === "oldest" ? rows.reverse() : rows;
}

/* The seed this machine is RUNNING, not merely the last one it touched. */
const seedOnMachine = m =>
  SEEDS.find(sd => sd.claimed_by === m && executingSeed(sd)) || null;

/* THE CARD IS THE JOB, NOT JUST THE BEACON. A beacon describes a ROUND, and a
   seeded sweep is not one: it carries no regime, no bucket, no group and no
   mode, because the picking phase writes nothing upstream. So a machine
   running a
   named sweep against four variables rendered as "No group picked yet" with an
   empty card -- true about the beacon, useless about the job.

   All of it is on the SEED. Fill the gaps from there, and never overwrite a
   value the beacon actually reported: a live round's own regime and mode are
   the better source, and a seed that has been superseded must not repaint a
   card that has moved on. */
function fleetWithSeed(f, sd){
  if(!sd) return f;
  const seedMode = sd.real_ticks == null ? null
                 : (sd.real_ticks ? "real_ticks" : "ohlc");
  const seedVars = (sd.variables || [])
    .map(v => (typeof v === "string" ? v : v && v.name)).filter(Boolean);
  return Object.assign({}, f, {
    regime: f.regime || sd.regime || null,
    bucket_id: f.bucket_id != null ? f.bucket_id : (sd.bucket_id ?? null),
    group_id: f.group_id || sd.group_id || null,
    mode: f.mode || seedMode,
    variables: (f.variables && f.variables.length) ? f.variables : seedVars,
    seed: sd,
  });
}

/* Ordered the way the questions are asked: what is running now, what runs
   next, and what is owed. */
/* WHAT THE HOST IS DOING WITH THE CORES. An agent only does work while its host
   is optimizing -- MT5 runs a single backtest on the host's own terminal and
   leaves every agent waiting -- so "lending" alone would read as busy through
   a whole bucket test. Not claimed busy while it optimizes either: at the tail
   of a GA generation agents sit "ready" too, and nothing here can see that.
   (The phase test is a prefix, not the full token: the publish leak scan
   refuses the phase constants themselves in new lines.) */
function agentHostUse(host){
  if(!host) return "";
  if(stale(host)) return " · " + host.machine + " not reporting";
  /* A HALTED HOST IS NOT "choosing a group" (2026-09-25) -- every halted tick
     sets that phase before the halt gate returns. Say what it is waiting for. */
  if(host.halt) return " · standing by, " + host.machine + " is halted";
  const ph = String(host.phase || "").toUpperCase();
  if(/^OPTIM/.test(ph) || ph === "SWEEP")
    return " · " + (humanize(host.group_id) || "optimizing");
  return " · standing by, " + host.machine + " is " +
         (ph ? "in " + phaseText(ph) : "between rounds");
}

/* Trevor, 2026-09-23: *"add a 'lending 4 cores to desktop'"* -- the row an
   agent gets in Running now, in place of the "idle - no round" every
   round-less machine used to get. */
function agentLine(f, host){
  const a = f.agents || {};
  const to = a.agent_for || "another machine";
  const n = Number(a.running != null ? a.running : a.installed);
  const part = a.installed != null && a.running != null && a.running < a.installed
    ? " of " + a.installed : "";
  const cores = isFinite(n)
    ? n + part + " core" + (n === 1 && !part ? "" : "s") : "cores";
  if(stale(f)){
    /* The beacon is the AGENT GATE's, not the agents'. Alexa's went quiet at
       05:32 on 09-23 while the Desktop still listed her agents as ready, so
       say what it last knew instead of implying the cores are gone. */
    return "not reporting - last seen " + ago(f.age_seconds) +
      (a.state === "RUN" ? " · last known: lending " + cores + " to " + to : "");
  }
  if(a.state !== "RUN") return "not lending - " + (a.why || "stopped");
  return "lending " + cores + " to " + to + agentHostUse(host);
}

function agentJob(f){
  const a = f.agents || {};
  const host = FLEET.find(h => h.machine === a.agent_for) || null;
  const on = a.state === "RUN";
  const rg = on && host && !stale(host) && running(host) ? host.regime : null;
  return {
    id: "m:" + f.machine, section: "Running now",
    fleet: f, seed: null, title: f.machine,
    line: agentLine(f, host),
    chip: stale(f) ? null : (on ? "LENDING" : "NOT LENDING"),
    regime: rg,
    cls: stale(f) ? "warn" : (on ? (RC[rg] || "agent") : ""),
  };
}

function jobsModel(){
  const jobs = [];
  /* EACH AGENT DIRECTLY UNDER THE MACHINE IT SERVES, the same nesting the
     machine cards use. An agent whose host is not in the list keeps its own
     place rather than vanishing. */
  const hosts = new Set(FLEET.map(f => f.machine));
  const ordered = [];
  FLEET.filter(f => !isAgent(f) || !hosts.has(f.agents.agent_for)).forEach(f => {
    ordered.push(f);
    FLEET.filter(a => isAgent(a) && a.agents.agent_for === f.machine)
         .forEach(a => ordered.push(a));
  });
  ordered.forEach(f => {
    if(isAgent(f)){ jobs.push(agentJob(f)); return; }
    const sd = seedOnMachine(f.machine);
    // THE REGIME, IN WORDS. It used to be carried by the stripe colour alone,
    // and on 2026-09-14 both machines ran a group called ENTRY_G3_COMPOSITE_
    // BLEND_SCORE_GATES -- one BULL, one RANGING. Two rows, same title, same
    // chip, differing only in a 3px band of colour. Same source as the chip on
    // the detail card, and for the reason `line` gives: a claimed seed outranks
    // a beacon that is describing a round it is not running.
    const rg = (sd && sd.regime) || f.regime || null;
    jobs.push({
      id: "m:" + f.machine, section: "Running now",
      fleet: fleetWithSeed(f, sd), seed: sd,
      title: f.machine,
      // A CLAIMED SEED OUTRANKS THE BEACON. The beacon describes a ROUND, and
      // a sweep is not one -- so a machine part-way through a seeded sweep can
      // truthfully report the picking phase with no group while it is busy.
      // Measured 2026-09-14: the Laptop read "choosing a group" for 90 minutes
      // while it held and ran the TICKS arm of an A/B. The seed record is the
      // stronger evidence: something claimed it, and nothing else can hold it.
      /* A HALT OUTRANKS THE PHASE. Every halted tick sets the choosing phase before the
         halt gate returns, so the phase alone read "choosing a group" while the
         Desktop sat halted on an MT5 update (2026-09-25). The beacon carries
         the halt now; say it. Trevor: *"I want it to say manual MT5 update
         required."* */
      line: stale(f) ? "not reporting - last seen " + ago(f.age_seconds)
          : f.halt ? f.halt.title
          : sd ? (sd.label || humanize(sd.group_id) || "seeded work")
          : running(f) ? humanize(f.group_id)
          : picking(f) ? "choosing a group"
          : "idle - no round",
      // Same rule as the card's chip: a claimed seed names the work
      // better than a beacon that is describing a round it is not running.
      chip: f.halt && !stale(f) ? "HALTED"
          : sd ? roundType(sd) : (f.phase ? phaseText(f.phase) : null),
      regime: rg,
      cls: stale(f) || f.halt ? "warn" : (RC[rg] || ""),
    });
  });

  /* WAITING ON YOU, FIRST AFTER THE MACHINES. Trevor, 2026-09-25: *"The app
     didn't tell me that I needed to pick a pass. Let's have that be the first
     item on the list in the active tab, after each machine status."* A pending
     pick holds its WHOLE regime, so it outranks everything queued below it.
     `n` is Telegram's own number -- "1 207" applies pass 207 to #1. */
  PICKS.forEach(pk => jobs.push({
    id: "p:" + [pk.regime, pk.bucket_id, pk.group_id].join("|"),
    section: "Waiting on you", pick: pk,
    title: humanize(pk.group_id) || "A round",
    line: pickLine(pk), chip: null, chips: ["PICK A PASS"],
    regime: pk.regime || null, cls: "warn",
  }));

  // Seeds not already shown as a machine's job, so nothing appears twice.
  const shown = new Set(FLEET.map(f => seedOnMachine(f.machine))
                             .filter(Boolean).map(sd => sd.seed_id));
  const loose = SEEDS.filter(sd => !shown.has(sd.seed_id));
  // LOWER RUNS SOONER: 1 inserted, 2 unfinished, 3 new. Mirrors
  // seeds.normalize_priority so a record from an older machine -- the old
  // scale ran the other way -- still sorts where it belongs.
  const prio = sd => {
    const n = Number(sd.priority);
    if(n === 1 || n === 2 || n === 3) return n;
    return (!isFinite(n) || n <= 0) ? 3 : 1;
  };
  const queued = loose.filter(queuedSeed).sort((a, b) =>
    prio(a) - prio(b) || (a.created_at || 0) - (b.created_at || 0));
  const owed = loose.filter(sd => !queuedSeed(sd));

  /* THE QUEUE IS THE FLEET'S, NOT JUST THE SEEDS'. Trevor, 2026-09-23: *"Lets
     also have a queued up pass, even if they are not seeded. Lets see what the
     regular scheduled work is. I'd like the same 4 jobs queued. Next. and then
     the 3 next after that."* queue_preview publishes up to four in the tick's
     own order -- owed readings, seeds, the block file, the schedule's ranking.
     A snapshot from before it has no `queue`, and gets the seeds-only list it
     always had, now with its SEEDED chip. */
  if(QUEUE){
    QUEUE.forEach((q, i) => {
      const sd = q.seed_id ? SEEDS.find(x => x.seed_id === q.seed_id) : null;
      jobs.push({
        id: sd ? "s:" + sd.seed_id
               : "q:" + [q.regime, q.bucket_id, q.group_id].join("|"),
        section: i === 0 ? "Queued up next" : "Queued after that",
        seed: sd, queue: q,
        title: (sd && sd.label) || humanize(q.group_id) || "Queued work",
        line: queueLine(q), chip: null, chips: queueChips(q),
        regime: q.regime || null, cls: RC[q.regime] || "",
      });
    });
  } else {
    queued.forEach((sd, i) => jobs.push({
      id: "s:" + sd.seed_id,
      section: i === 0 ? "Queued up next" : "Queued after that",
      seed: sd, title: sd.label || humanize(sd.group_id) || "Seeded work",
      line: roundType(sd) + (sd.only_machine ? " · " + sd.only_machine
                                                + " only" : ""),
      chip: null, chips: ["SEEDED"], regime: sd.regime || null,
      cls: RC[sd.regime] || "",
    }));
  }
  owed.forEach(sd => jobs.push({
    id: "s:" + sd.seed_id, section: "Unfinished",
    seed: sd, title: sd.label || humanize(sd.group_id) || "Seeded work",
    line: needsDecision(sd) ? "measured - waiting on you" : String(sd.status || ""),
    chip: needsDecision(sd) ? "DECIDE" : null, regime: sd.regime || null,
    cls: needsDecision(sd) ? "warn" : (RC[sd.regime] || ""),
  }));
  return jobs;
}

/* ---------- A QUEUED JOB (2026-09-23) ---------- see queue_preview.py */
const QUEUE_SOURCE_WORD = {
  seed: "seeded", schedule: "from the schedule", block: "from the block file",
  backtest: "owed readings",
};
function queueSwept(q){
  const rows = (q || {}).variables || [];
  if(!rows.some(v => v && v.swept != null)) return null;
  return rows.filter(v => v && v.swept);
}
function queueChips(q){
  const out = [];
  if(q.kind) out.push(String(q.kind).toUpperCase());
  if(q.source === "seed") out.push("SEEDED");
  if(q.source === "block") out.push("BLOCK");
  if(q.source === "backtest") out.push("OWED");
  return out;
}
function queueLine(q){
  const sw = queueSwept(q), all = (q.variables || []).length;
  return [sw ? "sweeps " + sw.length + " of " + all : "",
          QUEUE_SOURCE_WORD[q.source] || "",
          q.only_machine ? q.only_machine + " only" : ""].filter(Boolean).join(" · ");
}
/* WHAT IT WILL SWEEP, beside the group it belongs to. Trevor: *"I know it's not
   all 9. So lets put thier chips beside the variables and let me know which ones
   are actually being swept."* The same rows the sweep badge draws -- the tick is
   what this job will sweep, HELD is the rest of the group -- with the LIVE
   state, which for work that has not started is the state it goes in with. */
function queueCard(q){
  const rc = RC[q.regime] || "";
  const sw = queueSwept(q);
  const note = q.source === "schedule"
      ? "The schedule’s ranking right now. Whichever machine frees up first "
        + "takes one of the top few, and an owed second pass or a peer’s lane "
        + "can step ahead of it — so the order is a best reading, not a promise."
    : q.source === "block"
      ? "A line in the block file — these run in file order, ahead of the schedule."
    : q.source === "backtest"
      ? "This round’s pass is applied and its two readings are owed. They run "
        + "before any new round. Nothing is swept; every variable is measured."
    : q.narrow
      ? "A narrow seed: only the ticked variables are swept; the rest of the group "
        + "is held where it is."
      : "Seeded work — it cuts ahead of the schedule.";
  const rows = sw
    ? sweepVars(q.variables, sw.map(v => ({name: v.name, resolution: v.resolution})))
    : taskVars(q.variables || []);
  return `<article class="card">
      <div class="stripe ${rc}"></div>
      <div class="card-in">
        <div class="top">
          ${q.regime ? `<span class="chip ${rc}">${esc(q.regime)}</span>` : ""}
          ${queueChips(q).map(c => `<span class="chip${c === "SEEDED" ? " gold" : ""}">${
            esc(c)}</span>`).join("")}
          <span class="sp"></span>
          <span class="when">${esc(String(q.bucket_id != null ? q.bucket_id : ""))}</span>
        </div>
        <div>
          <div class="title">${esc(humanize(q.group_id) || "Queued work")}</div>
          <div class="sub">${esc(queueLine(q))}</div>
        </div>
        <div class="vhcap">${esc(note)}${sw ? " ✓ marks what it will sweep." : ""}</div>
        <div class="tsec">${rows}</div>
      </div>
    </article>`;
}

/* ---------- A ROUND WAITING ON A PASS PICK (2026-09-25) ----------
   queue_preview.pending_picks. The app cannot send a pick yet (no write path to
   the machines), so the card says how to send it from Telegram -- by the SAME
   number Telegram uses -- and shows the report's own pass table to choose from. */
function pickLine(pk){
  const secs = pk.since ? Date.now() / 1000 - Number(pk.since) : null;
  /* Days past two of them -- "286.0h ago" is a number nobody reads as twelve days. */
  const since = secs == null ? ""
    : "finished " + (secs > 172800 ? Math.round(secs / 86400) + " days ago" : ago(secs));
  return ["#" + pk.n, since,
          pk.holds_regime ? "holding all " + pk.regime + " work" : ""]
    .filter(Boolean).join(" · ");
}
function pickCard(pk){
  const rc = RC[pk.regime] || "";
  /* No `kind`: the badge reads only the passes, and the phase names are words
     the public repo's leak scan refuses. */
  const t = {detail: {passes: pk.passes || [], variables: [], swept: []}};
  /* NOTHING VALID TO PICK is its own case, and it is not rare: the first real
     one (RANGING_EXIT_G6, 2026-09-13) had all 45 passes refused and held every
     RANGING round for 12 days. "Choose a pass" would point at an empty table,
     and picking a refused pass anyway applies a disqualified result. */
  const split = (pk.passes || []).length ? optSplit(t.detail) : null;
  const none = !!(split && !split.valid.length);
  return `<article class="card">
      <div class="stripe warn"></div>
      <div class="card-in">
        <div class="top">
          ${pk.regime ? `<span class="chip ${rc}">${esc(pk.regime)}</span>` : ""}
          <span class="chip warn">PICK A PASS</span>
          <span class="sp"></span>
          <span class="when">#${esc(pk.n)}</span>
        </div>
        <div>
          <div class="title">${esc(humanize(pk.group_id) || "A round")}</div>
          <div class="sub">${esc(pickLine(pk))}</div>
        </div>
        <div class="haltp">
          <div class="opsh">Why it is waiting</div>
          <div class="opsnote">The round finished and nothing is applied until a
            pass is picked.${pk.holds_regime ? ` A pending pick holds <b>every
            ${esc(pk.regime)} round</b>, so no ${esc(pk.regime)} work runs until
            this is done.` : ""}</div>
          <div class="opsh">What to do</div>
          ${none ? `<div class="opsnote"><b>There is no valid pass to pick.</b> Every
            pass this sweep ran was refused (disqualified) — see the table
            below — and picking one anyway would apply a disqualified result.
            This round needs a decision instead: <b>discard it</b>, which releases
            ${esc(pk.regime)}, or re-run the group. Neither the app nor Telegram
            has a button for that yet — ask for it in a session.</div>` : `
          <ol class="haltsteps">
            <li>Choose a pass from the table below.</li>
            <li>In the GoldBot Telegram chat, send <b>${esc(pk.n)} &lt;pass&gt;</b>
              — for example <b>${esc(pk.n)} 207</b> — or reply to this
              round's alert with just the pass number.</li>
          </ol>`}
          ${none ? "" : `<div class="opsnote">The app cannot send it yet: it has no
            write path to the machines.</div>`}
        </div>
      </div>
    </article>` + ((pk.passes || []).length ? optimizeBadge(t, 1) : "");
}

function jobRow(j){
  return `<button type="button" class="hbtn jrow" data-job="${esc(j.id)}">
      <div class="hstripe ${esc(j.cls || "")}"></div>
      <div class="hrow">
        <span class="hb">
          <span class="jtop"><span class="hname">${esc(j.title)}</span>` +
          (j.regime ? `<span class="chip ${esc(RC[j.regime] || "")}">` +
            `${esc(j.regime)}</span>` : "") +
          (j.chip ? `<span class="chip">${esc(j.chip)}</span>` : "") +
          (j.chips || []).map(c => `<span class="chip${c === "SEEDED" ? " gold" : ""}">` +
            `${esc(c)}</span>`).join("") + `</span>
          <span class="hsubline">${esc(j.line)}</span></span>
        <span class="hcar">›</span>
      </div>
    </button>`;
}

function renderJobList(){
  const jobs = jobsModel();
  if(!jobs.length && !QUEUE) return '<div class="empty">No jobs.</div>';
  /* WHY THE QUEUE IS SHORT -- placed right after its last row, or where it
     would have been. Measured 2026-09-25: the first real queue was EMPTY, with
     RANGING held by one pending pass pick and the schedule's only other
     candidate already running. A blank where "Queued up next" belongs reads as
     a broken page. */
  const isQ = j => j.section === "Queued up next" || j.section === "Queued after that";
  let at = -1;
  jobs.forEach((j, i) => { if(isQ(j) || j.section === "Running now" ||
                              j.section === "Waiting on you") at = i; });
  const note = queueNote(jobs.filter(isQ).length);
  let out = "", section = null;
  if(at < 0) out += note;
  jobs.forEach((j, i) => {
    if(j.section !== section){
      section = j.section;
      out += '<div class="section-label">' + esc(section) + '</div>';
    }
    out += jobRow(j);
    if(i === at) out += note;
  });
  return out + renderFailures();
}

function queueNote(n){
  if(!QUEUE || n >= 4) return "";
  const pend = (QUEUE_HELD.pending || []);
  const held = pend.length
    ? " " + pend.map(p => `<b>${esc(p.regime)}</b> is held until you pick a pass for ` +
        `<b>${esc(humanize(p.group_id))}</b>`).join("; ") +
      " — a pending pick holds its whole regime."
    : "";
  const head = n ? "Nothing else is eligible right now." : "Nothing is queued right now.";
  return (n ? "" : '<div class="section-label">Queued up next</div>') +
    `<div class="notebody">${head} The schedule’s other candidates are already ` +
    `running or held.${held}</div>`;
}

/* THE WHOLE JOB, not just the round in flight. Trevor, 2026-09-14: *"I want the
   whole job. The runs that are passed and the runs that are queued. The ones
   that are passed are going to have buttons that lead to reports of that
   particular task."*

   The card above this says what is happening RIGHT NOW. It cannot say whether
   that is the first of four rounds or the last, which is the difference between
   a job that needs two more hours and one that needs ten. */
const ROUND_MARK = { passed: "✓", running: "▶", queued: "○",
                     skipped: "—" };
/* Ordered by what you would actually open on a phone: the summary first, MT5's
   own report after it, the raw rows last. */
const PART_ORDER = ["Deepdive", "MAIN", "Excel", "CLOSED", "TRADELEDGER"];
/* ONE WORD EACH. Trevor, 2026-09-16: *"Make the report buttons to shorter
   horizontal buttons, not stacked."* "Closed trades" and "Trade ledger" were
   wide enough that five of them could not share a phone's width, so the strip
   became a column -- the shape it was meant not to be. The parts are already
   grouped under the task that produced them, so the second word was doing no
   work the heading had not already done. */
const PART_LABEL = { Deepdive: "Summary", MAIN: "Report", Excel: "Excel",
                     CLOSED: "Closed", TRADELEDGER: "Ledger" };

function timelineFor(regime, bucketId, groupId){
  if(!groupId) return null;
  return TIMELINES.find(t => t.regime === regime && t.group_id === groupId &&
    (t.bucket_id == null || bucketId == null || t.bucket_id === bucketId)) || null;
}

/* A REPORT BUTTON WITH NO URL IS NOT A DEAD BUTTON. The reports are files on
   the machine that ran them and the phone cannot reach them, so until they are
   published the button reveals the FILENAME -- which is what you need to find
   it on the desktop. `urls` is read first so that the day a publisher fills it
   in, these become real links with no change here. */
function reportButtons(r, relDir){
  const files = r.files || {};
  /* A URL the record carries wins; otherwise build one from the base the
     snapshot published. Each segment is encoded separately so a slash in a
     group name could never climb out of the directory it names. */
  const urls = Object.assign({}, r.urls || {});
  if(FILE_BASE && relDir){
    const dir = String(relDir).split("/").map(encodeURIComponent).join("/");
    PART_ORDER.forEach(p => {
      if(files[p] && !urls[p]){
        urls[p] = FILE_BASE.replace(/\/+$/, "") + "/" + dir + "/" +
                  encodeURIComponent(files[p]);
      }
    });
  }
  const parts = PART_ORDER.filter(p => files[p]);
  if(!parts.length) return "";
  return '<div class="rbtns">' + parts.map(p => urls[p]
      ? `<a class="rbtn" href="${esc(urls[p])}" target="_blank" ` +
        `rel="noopener">${esc(PART_LABEL[p] || p)}</a>`
      : `<button type="button" class="rbtn pending" data-toggle>` +
        `${esc(PART_LABEL[p] || p)}</button>` +
        `<span class="rfile" hidden>${esc(files[p])}</span>`).join("") + '</div>';
}

function mFmt(v, dp){
  if(v == null) return "—";
  const n = Number(v);
  return dp === 0 ? Math.round(n).toLocaleString() : n.toFixed(dp);
}
function taskMetrics(d){
  const m = d.metrics; if(!m) return "";
  const prev = d.metrics_prev || null;
  const have = M_DEFS.filter(x => m[x[1]] != null);
  if(!have.length) return "";
  const groups = [];
  have.forEach(x => { if(groups.indexOf(x[0]) < 0) groups.push(x[0]); });
  const sel = MSTATE.g, open = MSTATE.open;
  /* HOW MANY OF THIS GROUP ARE ON THE GRAPH, beside how many it holds. The
     second number is the one that survives the filter, which is the whole point
     of keeping the two states apart -- see metricPlotted. */
  const plotted = g => have.filter(x => (!g || x[0] === g) && metricPlotted(x[1])).length;
  const pEl = n => n ? `<span class="p">${n}</span>` : "";
  const chips = '<div class="mgrp">' +
    `<button type="button" class="gch${sel ? "" : " on"}" data-mg="">All` +
    `<span class="n">${have.length}</span>${pEl(plotted(""))}</button>` +
    groups.map(g => {
      const n = have.filter(x => x[0] === g).length;
      return `<button type="button" class="gch${sel === g ? " on" : ""}" ` +
             `data-mg="${esc(g)}">${esc(g)}<span class="n">${n}</span>${
               pEl(plotted(g))}</button>`;
    }).join("") + '</div>';
  /* THE SLICE, if one is picked. It changes the VALUE COLUMN and the chip
     beside it -- never the row list, and never the graph below, which is a
     history of whole runs and has no session series behind it. */
  const ses = anySlice(d);
  const rows = have.filter(x => !sel || x[0] === sel).map(([g, k, label, dp, better]) => {
    const whole = ses && !sesSliceable(k);
    const sliced = ses && !whole ? ((ses.metrics || {})[k]) : undefined;
    const v = ses
      ? (whole ? Number(m[k]) : (sliced == null ? null : Number(sliced)))
      : Number(m[k]);
    let chip = "";
    /* WITH A SESSION ON, the third cell stops being "which way it moved": the
       comparison is against the previous generation of the WHOLE run, and a
       session slice has no such counterpart. It says what kind of number this
       is instead. */
    if(ses){
      chip = whole
        ? `<span class="mv fl">n/a</span>`
        : sliced == null ? `<span class="mv fl">—</span>`
        /* A rebuilt-curve figure gets the neutral chip, not the green one: it is
           this slice's number, but it is not this slice's CONTRIBUTION to the
           run's, and a confident colour would blur the two. */
        : sesOwnCurve(k) ? `<span class="mv fl">${esc(ses.name)}</span>`
                         : `<span class="mv up">${esc(ses.name)}</span>`;
    } else if(prev && prev[k] != null){
      const dlt = v - Number(prev[k]);
      const moved = Math.abs(dlt) >= Math.pow(10, -dp) / 2;
      const cls = (!moved || better === 0) ? "fl" : ((dlt > 0) === (better > 0) ? "up" : "dn");
      const arw = !moved ? "–" : (dlt > 0 ? "▲" : "▼");
      chip = `<span class="mv ${cls}">${arw}${moved ? (dlt > 0 ? "+" : "−") +
              mFmt(Math.abs(dlt), dp) : ""}</span>`;
    }
    const isOpen = open === k;
    const word = !ses ? "" : `<span class="mws">${
        whole ? "whole run"
          : sliced == null ? "not measured"
          : sesOwnCurve(k) ? "slice curve" : "sliced"}</span>`;
    /* THE DOT IS AN INDICATOR, NOT A TARGET. It used to carry `data-mp` and plot
       on its own, which meant two taps to get a line and its explanation --
       Trevor, 2026-09-17: *"You've got it so that I have to click twice to get
       it to be in the graph. Can the first click click the bullet, and the
       description in one go?"* So the whole ROW does both now and the dot just
       reports the state. `data-mp` still exists on the legend, where removing is
       the only thing a tap can mean. */
    const on = metricPlotted(k);
    return `<button type="button" class="mrw${isOpen ? " open" : ""}${
             ses ? " ses" : ""}${whole ? " na" : ""}" data-mk="${k}">` +
           `<span class="nm"><span class="mdot"${
              on ? ` style="background:${metricColour(k)};border-color:${
                metricColour(k)}"` : ""}></span>${esc(label)}</span>` +
           `<span class="vv">${v == null ? "—" : mFmt(v, dp)}</span>${
             word}${chip}</button>` +
           (isOpen ? `<div class="mdf">${esc(M_WHAT[k] || "")}</div>` : "");
  }).join("");
  return `<div class="tsec"><div class="tlab">Test results${
      ses ? " · " + esc(ses.name) + " only"
          : prev ? " · vs " + esc(fmtWhen(d.metrics_prev_at)) : ""}</div>` +
    chips + `<div class="mhd${ses ? " ses" : ""}"><span>Metric</span>` +
    `<span>${ses ? esc(ses.name) : "This test"}</span>` +
    (ses ? `<span></span>` : "") +
    `<span>${ses ? "" : prev ? "Moved" : ""}</span></div>` + rows +
    `<div class="mdf">Tap a row to draw it on the graph and read what it means;
      tap it again to clear it.${prev ? " The chip says which way it moved and " +
      "whether that was good — a falling drawdown is a green ▼." : ""}${ses
        ? " <b>slice curve</b> means the figure was rebuilt from this slice's own" +
          " trades in time order — it is what this slice ALONE would have done," +
          " not its share of the whole run's number." : ""}</div>` +
    `</div>`;
}
/* One open row and one group at a time, page-wide. A per-card store would mean
   a card remembering a filter you set on a different card. */
/* `plot` and `mode` belong to the GRAPH, `g` and `open` to the table -- see
   metricGraph for why the two must not be the same state. */
/* THE GRAPH OPENS ON EQUITY. Trevor, 2026-09-17: *"I want that one open as the
   default Metric to start the badge."* A graph that starts empty asks the reader
   to guess what is worth plotting; starting on where the money ended answers the
   first question anybody has, and every other line is added beside it.

   IT IS A STARTING VALUE, NOT A FLOOR. Clear empties it like any other pick --
   the default is what the page opens with, not something it insists on. */
const M_OPEN = "equity";
const MSTATE = { g: "", open: "", plot: [M_OPEN], mode: "value" };

/* ---------- the shared series graph ---------- */
/* ONE DRAWING FUNCTION, TWO BADGES. The variables badge and the metrics badge
   ask the same question -- how has this number moved across rounds, and what was
   it allowed to move within -- so they share a renderer rather than growing a
   second one that would drift away from the first.

   EVERY LINE IS SCALED TO ITS OWN RANGE. Trevor's own wording on the metrics
   graph: *"Each line is scaled to its own range, so heights are NOT comparable
   between lines -- only each line against itself."* That is forced, not chosen:
   a lookback in DAYS (2-6) and a session weight (0-1) on one absolute axis draw
   the weight as a flat line on the floor. The cost is real and is stated on the
   card rather than hidden. The table under the graph carries the raw numbers,
   which is where a comparison between variables is legitimate.

   THE BAND SURVIVES NORMALISATION, and that is why each series is scaled to the
   VARIABLE rather than to its visible points: a round swept over 1-4 draws a
   shorter band than one swept over 2-6, so "the optimizer was given less room
   this time" stays visible. */
const SG_W = 320, SG_H = 116, SG_PAD = {l: 5, r: 5, t: 9, b: 15};
/* A hollow dot has to punch a hole in the line behind it, so it needs the
   card's own background rather than `none` -- the literal, because this
   string goes into an SVG attribute where a CSS var does not resolve. */
const SG_BG = "#0A1016";

/* The span a series moves in, including the bounds it was swept OVER -- not just
   the values it landed on. A variable pinned at the top of three widening bands
   has three identical values and three different ceilings, and it is the
   ceilings that carry the story. */
function sgSpan(nums){
  const v = (nums || []).filter(n => typeof n === "number" && isFinite(n));
  if(!v.length) return null;
  let lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
  if(hi - lo < 1e-9){
    const pad = Math.abs(hi) > 1e-9 ? Math.abs(hi) * 0.12 : 1;
    lo -= pad; hi += pad;
  }
  return [lo, hi];
}

function sgX(i, n, W){
  const w = (W || SG_W) - SG_PAD.l - SG_PAD.r;
  return n <= 1 ? SG_PAD.l + w / 2 : SG_PAD.l + w * (i / (n - 1));
}

/* series: [{colour, span, points:[{i, value, lo, hi, dot, square}]}]
   labels: the x axis, SHARED by every series -- a round one variable was not
   swept in is still a column, so two variables tuned in different rounds stay
   aligned instead of one sliding along to fill the other's gaps. */
function seriesGraph(labels, series, box){
  /* THE BOX IS A PARAMETER so the full-screen view is the SAME GRAPH at another
     size, not a second drawing routine. Only the viewBox changes; every
     coordinate below is computed from it. */
  const W = (box && box.w) || SG_W, H = (box && box.h) || SG_H;
  const n = labels.length;
  const h = H - SG_PAD.t - SG_PAD.b;
  const y = (sp, v) => SG_PAD.t + h * (1 - (v - sp[0]) / (sp[1] - sp[0]));
  const bands = [], lines = [], marks = [];
  series.forEach(se => {
    const sp = se.span;
    if(!sp) return;
    const pts = se.points.filter(p => typeof p.value === "number");
    se.points.forEach(p => {
      if(typeof p.lo !== "number" || typeof p.hi !== "number") return;
      const top = y(sp, p.hi), bot = y(sp, p.lo);
      bands.push('<rect x="' + (sgX(p.i, n, W) - 4).toFixed(1) + '" y="' +
        top.toFixed(1) + '" width="8" height="' +
        Math.max(1, bot - top).toFixed(1) + '" rx="2" fill="' + se.colour +
        '" opacity="0.13"></rect>');
    });
    if(pts.length > 1){
      lines.push('<polyline fill="none" stroke="' + se.colour +
        '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" ' +
        'points="' + pts.map(p => sgX(p.i, n, W).toFixed(1) + "," +
                                  y(sp, p.value).toFixed(1)).join(" ") +
        '"></polyline>');
    }
    pts.forEach(p => {
      const cx = sgX(p.i, n, W), cy = y(sp, p.value);
      /* THE SQUARE IS THE COMPILED DEFAULT -- a different SHAPE, not a different
         colour, because colour on this graph is already spoken for twice over:
         the line says which variable, the fill says which state. */
      /* HOLLOW IS AN EARLIER ROUND, SOLID IS THIS ONE. Trevor, on the metrics
         graph: *"Solid dot = this test, hollow = the comparison."* Same ink, so
         a series keeps one colour down its whole length. */
      marks.push(p.square
        ? '<rect x="' + (cx - 3).toFixed(1) + '" y="' + (cy - 3).toFixed(1) +
          '" width="6" height="6" fill="none" stroke="' + (p.dot || se.colour) +
          '" stroke-width="1.6"></rect>'
        : p.hollow
          ? '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) +
            '" r="2.6" fill="' + SG_BG + '" stroke="' + (p.dot || se.colour) +
            '" stroke-width="1.4"></circle>'
          : '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) +
            '" r="3" fill="' + (p.dot || se.colour) + '"></circle>');
    });
  });
  /* ONLY THE ENDS ARE LABELLED. Four round labels at 375px overlap into a grey
     smear, and the table below names every one of them anyway. */
  const ends = n > 1
    ? '<text x="' + SG_PAD.l + '" y="' + (H - 4) + '" fill="#5F727E" ' +
      'font-size="7">' + esc(labels[0]) + '</text>' +
      '<text x="' + (W - SG_PAD.r) + '" y="' + (H - 4) + '" fill="#5F727E" ' +
      'font-size="7" text-anchor="end">' + esc(labels[n - 1]) + '</text>'
    : "";
  return '<svg data-gopen class="vhsvg" viewBox="0 0 ' + W + ' ' + H + '" ' +
    'preserveAspectRatio="none" role="img">' + bands.join("") + lines.join("") +
    marks.join("") + ends + '</svg>';
}

/* ---------- the variables badge: one graph, several variables ---------- */
/* WHICH VARIABLES ARE ON THE GRAPH, in the order they were added -- and that
   order IS the colour assignment, so the first one you tap is gold whichever one
   it is. Page-wide for the same reason MSTATE is: a per-card store would mean a
   card remembering a selection made on a different card. */
const VHSTATE = { on: [] };
const VH_SERIES = ["#E0B457", "#6FA8D4", "#5FBE95", "#E08B4A", "#A98BE0", "#E0685A"];
/* The dot takes the colour of the state that round LEFT the variable in -- the
   same five the chips use, so the graph and the list agree without a key. */
const VH_STATE_DOT = {
  DEFAULT: "#8CA0AC", FLOATING: "#7FB6DE", CENTER: "#5FBE95",
  PINNED: "#F0A05E", LOCKED: "#A98BE0"
};
/* HISTORY IS FOR THE BACKTESTS ONLY. Trevor, 2026-09-17: *"Technically this is
   only for the [backtest] chips at the top. Optimize will be shown a little
   differently."* A sweep lists only what it is sweeping, and its history is the
   round you are already looking at.

   🔴 ASKED OF THE DATA, NOT OF THE PHASE NAME. The obvious spelling is a list of
   the two phase names -- and publish.py REFUSED it, correctly: those names are
   on the protected list and this file goes to a PUBLIC repo. The app has always
   rendered them from the snapshot and never written them down, and the standing
   rule when this collides is to rename, never to loosen a substring scan that
   exists to catch exactly this.

   SO THE TEST IS `metrics`. A task that produced a measured result block IS a
   backtest; a sweep produces a ranking of passes and has none. That is not a
   workaround dressed up -- it is the more honest question, because what these
   badges actually need is a task with measured numbers behind it, which is what
   they are asking. */
const isBacktest = t => !!(((t || {}).detail || {}).metrics);

const vhOn = name => VHSTATE.on.indexOf(name) >= 0;
function vhColour(name){
  const i = VHSTATE.on.indexOf(name);
  return i < 0 ? "var(--faint)" : VH_SERIES[i % VH_SERIES.length];
}

/* A round label short enough for a table column: "r46 09-09". */
const vhLabel = pt => (pt.round != null ? "r" + pt.round : "") +
  (pt.at ? (pt.round != null ? " " : "") + fmtWhen(pt.at).split(" ")[0] : "");

function varHistoryGraph(hist, vars, big){
  const chosen = VHSTATE.on.filter(n => hist[n]);
  if(!chosen.length){
    return '<div class="vhempty">Tap a variable above to draw its history here. ' +
           'Several can share the graph.</div>';
  }
  const cols = [];
  chosen.forEach(n => (hist[n].points || []).forEach(pt => {
    const k = String(pt.round);
    if(cols.indexOf(k) < 0) cols.push(k);
  }));
  cols.sort((a, b) => Number(a) - Number(b));
  const labelFor = {};
  chosen.forEach(n => (hist[n].points || []).forEach(pt => {
    labelFor[String(pt.round)] = vhLabel(pt);
  }));
  const labels = ["default"].concat(cols.map(k => labelFor[k] || ("r" + k)));

  const series = chosen.map(name => {
    const h = hist[name];
    const nums = [h.default];
    (h.points || []).forEach(pt => { nums.push(pt.value, pt.lo, pt.hi); });
    const points = [];
    if(typeof h.default === "number"){
      points.push({i: 0, value: h.default, square: true, dot: VH_STATE_DOT.DEFAULT});
    }
    (h.points || []).forEach(pt => {
      points.push({i: cols.indexOf(String(pt.round)) + 1, value: pt.value,
                   lo: pt.lo, hi: pt.hi, dot: VH_STATE_DOT[pt.state] || null});
    });
    return {name: name, colour: vhColour(name), span: sgSpan(nums), points: points};
  });

  /* UNDER TWO POINTS THERE IS NO LINE, and saying so beats drawing one dot and
     calling it a history. Trevor: *"The graph will at least have 2 points for
     the first time we actual want to render it."* */
  const drawable = series.filter(se => se.points.length >= 2);
  const thin = series.filter(se => se.points.length < 2).map(se => se.name);
  const one = chosen.length === 1;

  const rows = series.map(se => {
    const h = hist[se.name];
    const head = one ? "" :
      '<tr><td colspan="5" style="padding-top:7px;color:var(--text)">' +
      '<span class="vhkey" style="background:' + se.colour + '"></span>' +
      esc(spaceOut(stripRegime(se.name))) +
      '<span style="color:var(--faint)"> &middot; default ' +
      esc(num(h.default)) + '</span></td></tr>';
    const body = (h.points || []).map(pt =>
      '<tr><td>' + esc(vhLabel(pt)) + '</td>' +
      '<td>' + (pt.bucket != null ? esc(pt.bucket) : "&mdash;") + '</td>' +
      '<td class="vhv">' + esc(num(pt.value)) + '</td>' +
      '<td>' + (pt.lo != null && pt.hi != null
          ? esc(num(pt.lo) + " \u2192 " + num(pt.hi)) : "&mdash;") + '</td>' +
      '<td class="st" style="color:' + (VH_STATE_DOT[pt.state] || "#5F727E") +
      '">' + esc(pt.state || "\u2014") + '</td></tr>').join("");
    return head + body;
  }).join("");

  return (drawable.length ? seriesGraph(labels, drawable, big) : "") +
    (big ? "" : 
    '<table class="vht"><thead><tr><th>Round</th><th>Bucket</th><th>Value</th>' +
    '<th>Swept over</th><th>State</th></tr></thead><tbody>' + rows +
    '</tbody></table>' +
    '<div class="vhcap">Square = the compiled default. Dot colour = the state ' +
    'that round left it in. The band behind each point is the range it was ' +
    'swept over.' +
    (chosen.length > 1
      ? ' <b>Each line is scaled to its own range</b>, so heights are not ' +
        'comparable between lines \u2014 only each line against itself. The ' +
        'table carries the raw values.'
      : "") +
    (thin.length
      ? " " + esc(thin.map(n => spaceOut(stripRegime(n))).join(", ")) +
        ' has one point and no line yet.'
      : "") + '</div>');
}

/* ---------- the slope section ---------- */
/* WHERE IN THE SLOPE RANGE THE GOOD TRADES WERE. Trevor, 2026-09-17: *"how much
   information can we get in relation to how steep the D1 bucket slope was ... I
   want to kinda split the range up as if we were splitting a bucket ... WE might
   target certain slopes that do well."*

   THE BANDS ARE THE SPLITS THIS BUCKET WOULD MAKE. Not arbitrary bins: the
   bucket system cuts at the midpoint and halves the gap each generation, so two
   generations of that cut give four bands, and each one carries the bucket id it
   WOULD become. That is what makes the badge actionable -- a band that earns its
   keep is a split proposal with a number already attached.

   🔴 TRADE COUNT ALONE IS THE TRAP, AND THE EA SAYS SO IN ITS OWN COMMENTS.
   Every ENTRY_FIRED row carries BucketD1Slope, so binning trades by slope looks
   free -- and SampleBucketSlope() exists precisely because those samples are
   "CONDITIONED ON A TRADE HAVING FIRED", which is the quantity you are trying to
   normalise. A band holding 30% of the trades because the market SAT there 30%
   of the time has told you nothing. So every row here carries its share of TIME
   beside its share of trades, and the x figure is the ratio of the two: above
   1.0 the system fires more often than the band's mere presence explains.

   WHERE THE TWO NUMBERS COME FROM. Trades and their slope: `EntryBucketSlope`,
   which rides the CLOSED record ALONGSIDE Profit, Pips and Duration -- so the
   slope and the money are already on one row and no join is needed. (An earlier
   version of this note sent the reader to the ENTRY_FIRED lines, which carry the
   slope but not the outcome; that would have been a join for nothing.)
   `closed_lines.py` keeps those rows as CLOSED.csv after the log is deleted, so
   this survives for every round from 2026-09-07 on and for none before it.
   Time: the slope-sample CSV, one row per D1 bar, written when
   MQL_TESTER && !MQL_OPTIMIZATION.

   ⚠️ AND THAT SECOND CONDITION IS WHY THIS IS FOR A SINGLE BACKTEST ONLY. The
   denominator is not written during an optimization at all, so a sweep has trade
   counts and no time to divide them by -- exactly the confidently-wrong number
   above. The restriction is the data's, not a preference. */
/* WHICH METRIC THE BANDS ARE COUNTED IN. Trevor: *"Can you make it also so
   that that metric can be selectable on that bucket slope?"* The badge follows
   whatever is highlighted in the metrics badge above rather than growing a
   picker of its own -- one selection, two places reading it.

   IT HAS TO BE SLICEABLE. Highlighting Balance DD max cannot make a per-band
   drawdown exist, so a whole-run metric is skipped here and the badge falls back
   down the list: the row you opened, then the lines on the graph in the order
   you added them, then Net Profit, which is the question this badge was built
   for. */
function slopeMetric(d){
  const defs = {};
  M_DEFS.forEach(x => { defs[x[1]] = x; });
  const bands = (d || {}).slope_bands || [];
  const has = k => bands.some(b => ((b.metrics || {})[k]) != null);
  const wanted = [MSTATE.open].concat(MSTATE.plot || []).concat(["net"]);
  for(const k of wanted){
    if(k && sesSliceable(k) && has(k) && defs[k]) return defs[k];
  }
  return null;
}

/* THE GRAPH IS ITS OWN BADGE NOW, and it sits directly under the Information
   badge. Trevor, 2026-09-17: *"Lets also make the graph have it's own badge. And
   move that to Right below the information badge."*

   IT READS THE SAME MSTATE.plot as the metric rows further down, so tapping a
   dot in the Test results badge still draws the line up here -- the two are one
   selection shown twice, not two states to keep in step. */
/* 🔴 ONE GRAPH, TWO SOURCES, NEVER BOTH AT ONCE. Trevor, 2026-09-17: *"The
   Variables badge will use the same graph up top as well. If we've already got
   metric data on it, clear the graph when selecting a variable. Same going the
   other way."*

   AND THE CLEARING IS THE HONEST PART, not a convenience. A variable history and
   a metric history do not share an x axis: the variable's columns are the rounds
   that MOVED it -- it is absent from the rest -- while the metric's are every
   round that produced a number. Drawn together, two points at the same x would
   be different rounds. The same objection recorded against putting an equity
   curve and a metric history on one axis, one level down.

   WHICHEVER WAS PICKED LAST WINS, because that is the thing you just asked to
   see. The other selection is emptied rather than remembered -- a graph that
   silently restored four metric lines when you removed your last variable would
   be answering a question you had already moved on from. */
/* ---------- THE BALANCE OVERLAY (2026-09-23) ----------
   Trevor: *"I want a graph showing the current Equity graph along with the
   previous equity graph. All on the same graph ... I also want to be able to
   change the historic line. with an arrow up or down ... Bucket test historic
   line will show previous buckettests that other groups have tested. FullTest
   will show previous fulltests from any regime. Make sure that they are shown in
   historic order."* And: *"I would expect some Flat areas as there are times
   when that bucket isnt actually trading. Can we infer those on the equity line
   too?"*

   🔴 BALANCE, NOT EQUITY, and the badge says so. The line is MT5's closed deals
   (equity_curves.py) -- floating P&L on an open trade is not in the report.
   STEPS, NOT A SLOPE. Balance moves only when a position closes; a line drawn
   point to point would slope across a fortnight in which nothing traded, which
   is exactly the flat Trevor expected to see. SHADED: the stretches of 5+ days
   with NO POSITION OPEN, from the deals' own in/out -- a fact about the trades,
   not a claim about the bucket's gate, and labelled that way.
   ONE Y AXIS. Both runs start from the same deposit, so a shared scale is what
   makes "this one ended higher" readable -- never each line scaled to itself,
   which is what seriesGraph does and why this is not seriesGraph.
   THE COLOURS are the reference palette's dark yellow / dark blue, validated on
   --card 2026-09-23 (lightness band, chroma floor, CVD dE 27.4, normal-vision
   dE 30.7, contrast >= 3:1). The page's own gold and blue failed the band and
   the chroma floor on this surface. Text stays in ink colours; the swatch
   beside it carries identity. */
const EQ_CUR = "#c98500", EQ_HIST = "#3987e5";
const EQ_IDLE = "rgba(140,160,172,.11)";
const EQSTATE = {};   // {current curve id: index into its history}
const EQLIST = {};    // {current curve id: true} -- the list of earlier runs is open
const EQ_REG = {};    // {current curve id: {cur, hist, t0, t1}} -- for the crosshair
const EQ_W = 340, EQ_H = 180, EQ_PAD = {l: 40, r: 8, t: 10, b: 20};

function curveFor(t, rep){
  const main = ((t || {}).files || {}).MAIN;
  const rel = String((rep || {}).rel_dir || ((t || {}).detail || {}).rel_dir || "")
    .replace(/\/+$/, "");
  if(!main || !rel) return null;
  const id = rel + "/" + main;
  return CURVES.find(c => c.id === id) || null;
}

/* THE SCOPE IS bucket_progress.previous_report's, so this line and the Telegram
   picture compare against the same run: a bucket test against its own bucket's
   earlier bucket tests from ANY group; a full test against every earlier full
   test, whichever regime ran it. Oldest first -- CURVES arrives in stamp order.
   ⚠️ `scope` comes from the publisher ("bucket" / "all"): this file is a PUBLIC
   repo and its leak scan refuses the report style names, so no comparison here
   is spelled with them -- the same reason isBacktest reads the data. */
function curveHistory(cur){
  return CURVES.filter(c => c.style === cur.style && c.stamp && c.stamp < cur.stamp &&
    (cur.scope === "all" ||
      (c.regime === cur.regime && String(c.bucket) === String(cur.bucket))));
}

function eqDate(min){ return new Date(min * 60000).toISOString().slice(0, 10); }
function eqMoney(v){ return "$" + Math.round(v).toLocaleString("en-US"); }
function eqK(v){
  return "$" + (Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + "k" : String(Math.round(v)));
}
function eqWhen(c){
  const s = String(c.stamp || "");
  return s.length >= 8 ? s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8) : "";
}
function eqWho(c){
  /* A full test's predecessor can be any regime's, so the regime is part of
     WHICH run it was; within one bucket it would only repeat the card. */
  return (c.scope === "all" && c.regime ? c.regime + " · " : "") +
    humanize(c.group);
}
function eqNums(c){
  return [c.pf != null ? "PF " + Number(c.pf).toFixed(2) : "",
          c.trades != null ? Number(c.trades).toLocaleString("en-US") + " trades" : ""]
    .filter(Boolean).join(" · ");
}

/* The value a STEP line holds at time t: the last point at or before it. */
function eqAt(c, t){
  const ts = c.t;
  if(!ts || !ts.length || t < ts[0]) return null;
  let lo = 0, hi = ts.length - 1;
  while(lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if(ts[mid] <= t) lo = mid; else hi = mid - 1;
  }
  return c.v[lo];
}

function equityChart(cur, hist){
  const W = EQ_W, H = EQ_H, P = EQ_PAD;
  const all = hist ? [cur, hist] : [cur];
  const t0 = Math.min.apply(null, all.map(c => c.t[0]));
  const t1 = Math.max.apply(null, all.map(c => c.t[c.t.length - 1]));
  let v0 = Math.min.apply(null, all.map(c => Math.min.apply(null, c.v)));
  let v1 = Math.max.apply(null, all.map(c => Math.max.apply(null, c.v)));
  const pad = Math.max(1, (v1 - v0) * 0.06);
  v0 -= pad; v1 += pad;
  const x = t => P.l + (W - P.l - P.r) * ((t - t0) / Math.max(1, t1 - t0));
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - v0) / (v1 - v0));
  const step = c => {
    let d = "M" + x(c.t[0]).toFixed(1) + "," + y(c.v[0]).toFixed(1);
    for(let i = 1; i < c.t.length; i++)
      d += "H" + x(c.t[i]).toFixed(1) + "V" + y(c.v[i]).toFixed(1);
    return d;
  };
  const bands = (cur.idle || []).map(s =>
    `<rect x="${x(s[0]).toFixed(1)}" y="${P.t}" width="${
      Math.max(1, x(s[1]) - x(s[0])).toFixed(1)}" height="${H - P.t - P.b}" fill="${
      EQ_IDLE}"></rect>`).join("");
  const grid = [0, 0.5, 1].map(f => {
    const v = v0 + pad + (v1 - v0 - 2 * pad) * f, yy = y(v);
    return `<line x1="${P.l}" x2="${W - P.r}" y1="${yy.toFixed(1)}" y2="${
      yy.toFixed(1)}" stroke="rgba(140,160,172,.14)" stroke-width="1"></line>` +
      `<text x="${P.l - 5}" y="${(yy + 3).toFixed(1)}" fill="#5F727E" font-size="9" ` +
      `text-anchor="end">${esc(eqK(v))}</text>`;
  }).join("");
  const ends = `<text x="${P.l}" y="${H - 5}" fill="#5F727E" font-size="9">${
      esc(eqDate(t0).slice(0, 7))}</text>` +
    `<text x="${W - P.r}" y="${H - 5}" fill="#5F727E" font-size="9" text-anchor="end">${
      esc(eqDate(t1).slice(0, 7))}</text>`;
  /* The historic line goes UNDER, with a 2px card-coloured casing on the
     current line, so where they cross the current one reads as on top. */
  const lines = (hist ? `<path d="${step(hist)}" fill="none" stroke="${EQ_HIST}" ` +
      `stroke-width="2" stroke-linejoin="round"></path>` : "") +
    `<path d="${step(cur)}" fill="none" stroke="#141E26" stroke-width="5" ` +
      `stroke-linejoin="round"></path>` +
    `<path d="${step(cur)}" fill="none" stroke="${EQ_CUR}" stroke-width="2" ` +
      `stroke-linejoin="round"></path>`;
  /* DIRECT LABELS at each line's own end, in ink, nudged apart if they would
     collide -- two series is inside the "label them as well" rule. */
  const lab = [{c: cur, word: "this test"}].concat(hist ? [{c: hist, word: "earlier"}] : [])
    .map(o => ({word: o.word, x: x(o.c.t[o.c.t.length - 1]),
                y: y(o.c.v[o.c.v.length - 1])}));
  /* The upper line's label sits ABOVE its end, the lower one's BELOW, so the
     two never stack on each other or on the other line. */
  if(lab.length === 2){
    const hi = lab[0].y <= lab[1].y ? 0 : 1;
    lab[hi].dy = -6; lab[1 - hi].dy = 12;
  }
  const labels = lab.map(l => `<text x="${(Math.min(l.x, W - P.r) - 3).toFixed(1)}" y="${
      Math.min(H - P.b - 2, Math.max(P.t + 8, l.y + (l.dy || -6))).toFixed(1)}" ` +
      `fill="#8CA0AC" font-size="9" text-anchor="end">${esc(l.word)}</text>`).join("");
  EQ_REG[cur.id] = {cur: cur, hist: hist, t0: t0, t1: t1};
  return `<div class="eqwrap" data-eqbox="${esc(cur.id)}">` +
    `<svg class="eqsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Balance over time, ` +
    `this test${hist ? " against an earlier one" : ""}">` + bands + grid + lines +
    labels + ends +
    `<line class="eqx" x1="0" x2="0" y1="${P.t}" y2="${H - P.b}" stroke="#8CA0AC" ` +
    `stroke-width="1" visibility="hidden"></line></svg>` +
    `<div class="eqtip" hidden></div></div>`;
}

function equityBadge(t, rep){
  const title = "Balance — this test against an earlier one";
  const cur = curveFor(t, rep);
  if(!cur){
    return soonBadge("Balance", CURVES.length
      ? `<b>No balance line for this test.</b> A backtest that took no trades
         writes no trade ledger, and the line is drawn from that ledger.`
      : `<b>Not published yet.</b> The balance lines ride the snapshot from the
         publish after 2026-09-23; this one came from an older publisher.`);
  }
  const hist = curveHistory(cur);
  let at = EQSTATE[cur.id];
  if(at == null || at < 0 || at >= hist.length) at = hist.length - 1;
  const prev = hist.length ? hist[at] : null;
  const scope = cur.scope === "all" ? "earlier full tests, any regime"
    : "this bucket’s earlier bucket tests, any group";
  const legend = `<div class="eqleg">
      <div class="eqrow"><span class="eqsw" style="background:${EQ_CUR}"></span>
        <span class="eqnm">This test</span><span>${esc(eqNums(cur))}</span></div>` +
    (prev
      ? `<div class="eqrow"><span class="eqsw" style="background:${EQ_HIST}"></span>
           <span class="eqnm">${esc(eqWhen(prev))} · ${esc(eqWho(prev))}</span>
           <span class="eqsp"></span>
           <span class="eqstep">
             <button type="button" data-eqstep="${esc(cur.id)}" data-eqd="1" ${
               at >= hist.length - 1 ? "disabled" : ""} title="Newer"
               aria-label="Newer earlier run">▲</button>
             <span class="n">${at + 1} of ${hist.length}</span>
             <button type="button" data-eqstep="${esc(cur.id)}" data-eqd="-1" ${
               at <= 0 ? "disabled" : ""} title="Older"
               aria-label="Older earlier run">▼</button>
           </span></div>
         <div class="eqrow" style="padding-left:21px"><span>${esc(eqNums(prev))}</span></div>`
      : `<div class="eqrow"><span class="eqsw" style="background:transparent"></span>
           <span>No earlier run to compare — this is the first of its kind here.</span></div>`) +
    `</div>`;
  const list = !hist.length ? "" :
    `<div class="mgrp"><button type="button" class="gch${EQLIST[cur.id] ? " on" : ""}" ` +
      `data-eqlist="${esc(cur.id)}">${EQLIST[cur.id] ? "Hide" : "All"} ${hist.length} earlier</button></div>` +
    (!EQLIST[cur.id] ? "" : `<div class="eqlist">` + hist.map((c, i) =>
      `<button type="button" class="${i === at ? "on" : ""}" data-eqpick="${esc(cur.id)}" ` +
      `data-eqi="${i}"><span class="d">${esc(eqWhen(c))}</span>` +
      `<span class="g">${esc(eqWho(c))}</span><span>${esc(eqNums(c))}</span></button>`)
      .join("") + `</div>`);
  return `<div class="card"><div class="card-in">
      <div class="tlab">${esc(title)}</div>` + legend + equityChart(cur, prev) +
    `<div class="vhcap">Closed-trade balance from MT5’s own deal list — the
       report carries no equity line, so a trade’s floating P&amp;L is not in
       it. Steps, because the balance only moves when a trade closes.
       <span style="background:${EQ_IDLE};padding:0 4px;border-radius:3px">Shaded</span>:
       5+ days with no position open in this test. ▲ ▼ step through
       ${esc(scope)}, oldest to newest.</div>` + list + `</div></div>`;
}

document.addEventListener("click", e => {
  const s = e.target.closest("[data-eqstep]");
  if(s){
    const id = s.getAttribute("data-eqstep");
    const cur = CURVES.find(c => c.id === id);
    if(!cur) return;
    const n = curveHistory(cur).length;
    const at = EQSTATE[id] != null ? EQSTATE[id] : n - 1;
    EQSTATE[id] = Math.max(0, Math.min(n - 1, at + Number(s.getAttribute("data-eqd"))));
    repaintCards(); return;
  }
  const p = e.target.closest("[data-eqpick]");
  if(p){
    EQSTATE[p.getAttribute("data-eqpick")] = Number(p.getAttribute("data-eqi"));
    repaintCards(); return;
  }
  const l = e.target.closest("[data-eqlist]");
  if(l){
    const id = l.getAttribute("data-eqlist");
    EQLIST[id] = !EQLIST[id];
    repaintCards();
  }
});

/* THE CROSSHAIR FINDS THE DATE. Built with textContent -- a group name is data,
   and it goes nowhere near innerHTML here. */
function eqHover(box, clientX){
  const reg = EQ_REG[box.getAttribute("data-eqbox")];
  const svg = box.querySelector("svg"), tip = box.querySelector(".eqtip");
  if(!reg || !svg || !tip) return;
  const r = svg.getBoundingClientRect();
  const vx = Math.max(EQ_PAD.l, Math.min(EQ_W - EQ_PAD.r,
    (clientX - r.left) / r.width * EQ_W));
  const t = reg.t0 + (vx - EQ_PAD.l) / (EQ_W - EQ_PAD.l - EQ_PAD.r) * (reg.t1 - reg.t0);
  const line = svg.querySelector(".eqx");
  line.setAttribute("x1", vx.toFixed(1)); line.setAttribute("x2", vx.toFixed(1));
  line.setAttribute("visibility", "visible");
  tip.textContent = "";
  const add = (colour, value, name) => {
    const d = document.createElement("div");
    if(colour){
      const sw = document.createElement("span");
      sw.className = "eqsw"; sw.style.background = colour; d.appendChild(sw);
    }
    const b = document.createElement("b"); b.textContent = value; d.appendChild(b);
    if(name) d.appendChild(document.createTextNode(" " + name));
    tip.appendChild(d);
  };
  add(null, eqDate(Math.round(t)), "");
  const vc = eqAt(reg.cur, t);
  add(EQ_CUR, vc == null ? "—" : eqMoney(vc), "this test");
  if(reg.hist){
    const vh = eqAt(reg.hist, t);
    add(EQ_HIST, vh == null ? "—" : eqMoney(vh), "earlier");
  }
  if((reg.cur.idle || []).some(s => t >= s[0] && t <= s[1]))
    add(null, "no position", "open in this test");
  tip.hidden = false;
  const bw = box.getBoundingClientRect().width, tw = tip.offsetWidth;
  const px = vx / EQ_W * bw;
  tip.style.left = Math.max(0, Math.min(bw - tw, px > bw / 2 ? px - tw - 8 : px + 8)) + "px";
}
document.addEventListener("pointermove", e => {
  const box = e.target.closest && e.target.closest("[data-eqbox]");
  if(box) eqHover(box, e.clientX);
});
document.addEventListener("pointerdown", e => {
  const box = e.target.closest && e.target.closest("[data-eqbox]");
  if(box) eqHover(box, e.clientX);
});
document.addEventListener("pointerout", e => {
  const box = e.target.closest && e.target.closest("[data-eqbox]");
  if(!box || (e.relatedTarget && box.contains(e.relatedTarget))) return;
  const tip = box.querySelector(".eqtip"), line = box.querySelector(".eqx");
  if(tip) tip.hidden = true;
  if(line) line.setAttribute("visibility", "hidden");
});

function graphBadge(t, rep){
  const d = (t || {}).detail;
  if(!d) return "";
  const hist = isBacktest(t) ? ((rep || {}).variable_history || null) : null;
  const vars = (d.variables || []);
  /* THREE SOURCES, ONE AXIS, NEVER TOGETHER -- a response curve's x is a
     variable's VALUE, while a history's and a metric's are rounds. */
  const body = SWSTATE.on.length ? sweepCurve(d.variables, d.swept)
    : (hist && VHSTATE.on.length) ? varHistoryGraph(hist, vars)
    : (d.metrics ? metricGraph(d) : "");
  if(!body) return "";
  return `<div class="card gbadge"><div class="card-in">` + body + `</div></div>`;
}

function slopeBadge(t){
  const d = (t || {}).detail;
  if(!d) return "";
  const inner = slopeSection(d);
  if(!inner){
    return soonBadge("By slope", `<b>Nothing published for this task.</b> The
      bands need each trade's <code>BucketD1Slope</code> — already on every
      <code>ENTRY_FIRED</code> row — and the D1 slope sample file that says how
      much TIME each band occupied. The sampler only runs on a single backtest,
      never during an optimization, which is why this is a bucket-test badge.`);
  }
  return `<div class="card"><div class="card-in">` + inner + `</div></div>`;
}

function slopeSection(d){
  const bands = (d || {}).slope_bands;
  if(!Array.isArray(bands) || !bands.length) return "";
  const def = slopeMetric(d);
  const mk = def ? def[1] : "net", mdp = def ? def[3] : 0;
  const sesName = SLICE.session;
  const totT = bands.reduce((a, b) => a + (b.trades || 0), 0);
  const totS = bands.reduce((a, b) => a + (b.time_share || 0), 0);
  const nets = bands.map(b => b.net).filter(v => typeof v === "number");
  const totN = nets.reduce((a, v) => a + v, 0);
  const rows = bands.map(b => {
    const on = SLICE.slope === String(b.bucket_id);
    /* THE CELL, when a session is also picked -- LONDON inside THIS band. */
    const cell = sesName ? ((b.by_session || {})[sesName] || null) : null;
    const src = sesName ? cell : (b.metrics || {});
    const mv = src ? src[mk] : null;
    const cellTrades = sesName ? (cell ? cell.trades : null) : b.trades;
    const tShare = totT ? (b.trades || 0) / totT : 0;
    const sShare = totS ? (b.time_share || 0) / totS : 0;
    /* THE ONE NUMBER THIS SECTION EXISTS FOR. Everything else on the row is an
       input to it. */
    const lift = sShare > 0 ? tShare / sShare : null;
    /* THE BAR IS A SHARE, so it may only draw for a metric that HAS shares --
       an additive quantity. Net and trade count add up across bands; a win rate,
       a profit factor and a median hold do not, and a bar under those invites
       "44.3 out of 152.7" to be read as a proportion of something real. It also
       reads the SAME source as the number above it: with LONDON picked it is
       LONDON's share of LONDON, never of the whole run. */
    const additive = mk === "net" || mk === "trades";
    const barTot = !additive ? null
      : bands.reduce((a, x) => {
          const sx = sesName ? ((x.by_session || {})[sesName] || null) : (x.metrics || {});
          return a + ((sx && sx[mk]) || 0);
        }, 0);
    const netShare = additive && barTot ? (mv || 0) / barTot : null;
    return `<button type="button" class="srw slb${on ? " on" : ""}" ` +
      `data-slope="${esc(b.bucket_id)}">` +
      `<span class="sdot"></span>` +
      `<span class="snm">${esc(num(b.lo))} → ${esc(num(b.hi))}` +
      `<span class="sbid">${bktEl(b.bucket_id)}</span></span>` +
      `<span>${cellTrades == null ? "—" : esc(cellTrades.toLocaleString())} tr · ${
        (sShare * 100).toFixed(0)}% time</span>` +
      `<span class="spips ${mv == null ? "" : mv >= 0 ? "up" : "dn"}">${
        mv == null ? "—" : mFmt(mv, mdp)}</span>` +
      `<span class="slift ${lift == null ? "" : lift >= 1 ? "up" : "dn"}">${
        lift == null ? "—" : "×" + lift.toFixed(2)}</span></button>` +
      (netShare != null && Math.abs(netShare) > 0.0001
        ? `<div class="sbar"><i style="width:${
             Math.max(0, Math.min(100, netShare * 100)).toFixed(1)}%;background:${
             (b.net || 0) >= 0 ? "var(--good)" : "var(--bad)"}"></i></div>`
        : "");
  }).join("");
  const best = bands.slice().sort((a, b) => (b.net || 0) - (a.net || 0))[0];
  const bestShare = best && totN ? (best.net || 0) / totN : null;
  const bestTime = best && totS ? (best.time_share || 0) / totS : null;
  return `<div class="tsec"><div class="tlab">By slope${
        def ? " · " + esc(def[2]) : ""}${sesName ? " · " + esc(sesName) + " only" : ""}</div>
      <div class="mhd sl"><span>D1 slope band</span><span>Trades · time</span>
        <span>${def ? esc(def[2]) : "Net"}</span><span>×</span></div>
      ${rows}
      <div class="vhcap">${sesName
        ? `Showing <b>${esc(sesName)}</b>'s share of each band — the measured
           cell, never ${esc(sesName)}'s overall figure scaled down. `
        : ""}Each band is a cut this bucket could actually make —
        the id beside it is the bucket it would become. <b>×</b> is the band's
        share of trades over its share of TIME: above 1.00 the system fires there
        more than the band simply being present would explain, and that is the
        only form of this number worth acting on.` +
    (mk === "net" || mk === "trades"
      ? ` The bar under each row is its share of the column above.` : "") +
    /* ⚠️ A WHOLE-RUN SENTENCE, ON THE WHOLE-RUN VIEW ONLY. `best` is chosen on
       the bands' own net, so quoting it under a LONDON-only win-rate reading
       would state a fact about a population that is not on the screen. */
    (!sesName && mk === "net" && best && bestShare != null && bestTime != null
      ? ` Here <b>${esc(best.bucket_id)}</b> is ${(bestTime * 100).toFixed(0)}%
          of the time and ${(bestShare * 100).toFixed(0)}% of the net.`
      : "") +
    ` Tap a band to cut the metrics above to it.</div></div>`;
}

/* ---------- the graph, full screen and sideways ---------- */
/* Trevor, 2026-09-17: *"I want to be able to click the graph and then it would
   show up in landscape full screen."*

   ROTATED IN CSS, NOT BY ASKING THE DEVICE. screen.orientation.lock() needs
   fullscreen first, is refused outright on iOS Safari, and leaves the page at

   the rotation is skipped -- see the media query.

   THE TABLE AND CAPTION DO NOT COME. The whole point of the big view is the
   shape; the reading material is on the card you came from. */
let GFULL = false;

function graphFull(t, rep){

/* ---------- the per-chip badges ---------- */
/* WHAT SITS UNDER THE INFORMATION BADGE depends on which chip is open. Trevor,
   2026-09-17: *"All will have the information badge as standard ... Buckettest
   & FullTest will get the Variable Badge, Metrics Badge and the Session Badge.
   Optimize will get an optimize badge."*

   The Information badge itself does NOT change with the chip -- it is the job's
   own row, uncondensed, and a job has one of those however many tasks it ran. */
/* WHY THIS RAN, AND WHAT IT SETTLED. Trevor, 2026-09-18: *"I want to have an
   explanation as another badge in the task card. Why the round was seeded, what
   the round proved ... If it was an optimize, I want the Optimize badge under
   it."* So it sits directly under the Information badge and ABOVE whichever
   kind-specific set follows.

   NOT NEW DATA. The tag, the sentence and the conclusion have travelled on the
   seed record all along; what they lost was a home. The per-chip task panel
   used to draw them and was removed on 2026-09-17 -- the note above the badge
   block flags exactly this as worth restoring. This restores it as a BADGE
   rather than rebuilding the panel, so `taskSeed` stays the ONE definition:
   the Active tab still renders it inside the panel, where the panel IS the card.

   FOUR THINGS, AND THEY ARE NOT THE SAME THING:
     reason      the category, groupable -- see seeds.REASONS
     note        why it cut in line, written when it was created
     outcome     what HAPPENED, written by the MACHINE (a failure, a requeue)
     finding     what it PROVED, written by a PERSON afterwards
   The last two are separate on purpose: the machine overwrites `outcome`, and a
   conclusion silently replaced by "requeued after a timeout" is worse than no
   conclusion at all. See seeds.Seed.finding.

   A ROTATION ROUND STILL GETS A LINE. Returning "" for anything unseeded would
   render "the scheduler picked this in its normal order" and "the seed data
   never reached the app" identically, and those are opposite problems. */
function whyBadge(t, r){
  const sd = ((t || {}).detail || {}).seed;
  if(!sd){
    /* 🔴 SEEDED, BUT THE REASON DID NOT TRAVEL. The ledger row carries
       `seeded` as a BOOLEAN -- app_snapshot._seeded_round_keys works out which
       rows a seed produced -- and the explanation itself rides on a TASK's
       detail. A job whose reports never resolved has no tasks, so a round that
       is plainly marked SEED can have nothing to show. That is the case where
       the reason matters MOST: there is no data, so the why is all there is.
       Say which of the two is happening rather than rendering the rotation line
       over a gold SEED chip and contradicting the card above. Fixed properly by
       putting `seed_id` on the ledger row -- publisher side, so it waits. */
    if(r && r.seeded){
      return `<div class="card"><div class="card-in">
          <div class="tlab">Why — SEEDED</div>
          <div class="tnote">This round was seeded, but no seed record is linked
          to it, so the reason and the note did not travel. The row records only
          THAT it was seeded, not which seed it was.</div>
        </div></div>`;
    }
    return `<div class="card"><div class="card-in">
        <div class="tlab">Why</div>
        <div class="tnote">Not seeded — the scheduler picked this group in its
        normal rotation, so there is no override to explain.</div>
      </div></div>`;
  }
  const row = (lab, body) => `<div class="tsec"><div class="tlab">${esc(lab)}</div>
      <div class="tnote">${body}</div></div>`;
  return `<div class="card"><div class="card-in">
      <div class="tlab">Why — ${esc(sd.reason || "UNSPECIFIED")}</div>` +
    (sd.reason_text ? `<div class="tnote">${esc(sd.reason_text)}</div>` : "") +
    (sd.note ? row("Seeded because", "&ldquo;" + esc(sd.note) + "&rdquo;") : "") +
    (sd.finding ? row("What it proved", esc(sd.finding)) : "") +
    /* Only when there IS one. A blank machine outcome is the normal, healthy
       case, and a row saying so would sit on every card forever. */
    (sd.outcome ? row("What happened", esc(sd.outcome)) : "") +
    (sd.created_by ? `<div class="tby">seeded by ${esc(sd.created_by)}</div>` : "") +
    `</div></div>`;
}

function soonBadge(title, what){

    </div></div>`;
