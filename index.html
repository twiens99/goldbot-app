/* WHICH SESSION IS SINGLED OUT -- one at a time, or none. Trevor, 2026-09-17:
   *"I had it where I could click the session weights and it would single out
   the metric data (that was available)."* One at a time because two sessions
   added together are just a smaller whole run, which is the thing you already
   have above.

   🔴 ONLY FOUR THINGS CANNOT BE CUT, and it is not because the arithmetic is
   hard. `score` is what OnTester RETURNED for the pass it scored. `volr` is
   annualised trades over this BUCKET's trades-per-year target, and `cadterm`
   and `bcredit` are computed from it against the band. There is no LONDON
   target and no 2800-band target -- a per-slice version would have to invent a
   denominator, and a number with an invented denominator is worse than no
   number. These stay whole-run permanently.

   ⚠️ EVERYTHING ELSE CAN BE CUT, INCLUDING THE PATH METRICS -- reviewed
   2026-09-17 against what CLOSED.csv actually holds, which is far more than the
   summary it feeds: `Profit`, `Duration`, `EntryBucketSlope` and the close
   `time` all ride the same per-trade row. So a slice has its own trades in time
   order, and that is an equity path: drawdown, underwater days, months green,
   time-in-trade, recovery, Sharpe and closing equity all follow from it.

   🔴 AND THEY ANSWER A DIFFERENT QUESTION FROM THEIR WHOLE-RUN NAMESAKES. A
   drawdown computed on LONDON's trades alone is "what the LONDON-ONLY strategy
   would have suffered", NOT "LONDON's share of the account's drawdown" -- the
   account fell while ASIAN trades were open too. Both are legitimate; they are
   not the same number and must never be read as each other. That is why these
   are labelled `slice curve` on the card rather than `sliced`: the word is doing
   the work of a footnote nobody would read. See SES_OWN_CURVE.

   A metric outside both lists is a plain sum or ratio over the slice's trades.
   Either way it only shows a number if the record CARRIES one -- missing stays
   missing rather than becoming a zero, per the rule task_metrics is built on. */
const SES_WHOLE_RUN = ["score", "volr", "cadterm", "bcredit"];
/* Sliceable, but only by rebuilding the slice's own curve -- so the card says so
   in a different word. */
const SES_OWN_CURVE = ["equity", "dd", "rec", "sharpe", "uwater", "inpos",
                       "posmon"];
/* TWO CUTS, AND THEY COMPOSE. This said one-at-a-time until Trevor asked for
   the thing that needs both: *"I want to see London's 1200 bucket share for the
   metric that is highlighted."* That is the intersection cell, and it is a
   different question from either margin -- LONDON is not the same population
   inside a rising D1 as it is overall, which is the whole reason to look.

   THE INTERSECTION IS MEASURED, NOT MULTIPLIED. A cell comes from the band's own
   by_session record; it is never LONDON's share times the band's total. Those
   two agree only if session and slope are independent, and if they were
   independent this badge would have nothing to say. */
const SLICE = { session: "", slope: "" };
const sesSliceable = k => SES_WHOLE_RUN.indexOf(k) < 0;
const sesOwnCurve = k => SES_OWN_CURVE.indexOf(k) >= 0;
/* The slice in force for THIS task, or null. A task with no session breakdown
   published cannot be sliced whatever is selected elsewhere. */
function sesRecord(d){
  const all = (d || {}).sessions;
  if(!SLICE.session || !Array.isArray(all)) return null;
  return all.find(x => x.name === SLICE.session) || null;
}
function slopeRecord(d){
  const all = (d || {}).slope_bands;
  if(!SLICE.slope || !Array.isArray(all)) return null;
  return all.find(x => String(x.bucket_id) === SLICE.slope) || null;
}

/* THE CUT IN FORCE -- one name and one metrics dict, whichever combination of
   the two badges produced it. taskMetrics asks this and never branches on which
   badge answered.

   BOTH PICKED AND NO CELL PUBLISHED IS ITS OWN ANSWER, not a silent fallback to
   one of the margins. A card that quietly showed you LONDON when you had asked
   for LONDON-inside-2800 would be answering a question you did not ask. */
function anySlice(d){
  const ses = sesRecord(d), band = slopeRecord(d);
  if(ses && band){
    const cell = ((band.by_session || {})[ses.name]) || null;
    return {name: ses.name + " in " + band.bucket_id,
            metrics: cell ? cell : null, missing: !cell};
  }
  if(band) return {name: "Bucket " + band.bucket_id, metrics: band.metrics};
  if(ses) return ses;
  return null;
}

function sessionBadge(t){

  }
  const sel = SLICE.session;
  const rows = all.map(x => {
    const on = sel === x.name;

    return `<button type="button" class="srw${on ? " on" : ""}" data-ses="${
        esc(x.name)}">` +
      `<span class="sdot"></span>` +
      `<span class="snm">${esc(x.name)}</span>` +
      `<span>${x.trades != null ? esc(x.trades.toLocaleString()) : "—"} trades</span>` +
      `<span class="spips ${pips == null ? "" : pips >= 0 ? "up" : "dn"}">${
        pips == null ? "—" : (pips >= 0 ? "+" : "−") + Math.abs(pips).toFixed(1) +
        " pips"}</span></button>`;
  }).join("");
  return `<div class="card"><div class="card-in">
      <div class="tlab">By session · ${sel ? "1 selected" : "none selected"}</div>
      ${rows}
      <div class="mdf">${sel
        ? `The test results above are cut to <b>${esc(sel)}</b>. Tap it again for
           the whole run. A metric that cannot be cut to a session says
           <i>whole run</i> and keeps the figure it had.`
        : `Tap one to single out the metrics above. Session is tagged at ENTRY
           from the GMT hour, so a trade counts where it opened, not where it
           closed.`}</div>
    </div></div>`;
}

/* THE TRADE BAND LIVES HERE AND NOWHERE ELSE. Trevor, 2026-09-17: *"Put the
   Trade Band information only on the Optimize information panels."*

   It reads as a result and is really an INSTRUCTION: the band is what the
   pre-flight refuses a group on, what a seed's reason quotes, and what decides
   whether a sweep has to go looking for cells that can reach it. That is a
   statement about the search, so it belongs on the badge about the search. A
   backtest's own trade count is already in its metrics, where it is one number
   among thirty-two rather than a verdict. */
/* WHICH SWEEP THIS IS, counted rather than named -- same reason as isBacktest.
   `nth` is how many sweeps this job has reached including this one, which the
   caller knows from the chip order and the renderer must not spell out. */
/* ---------- the sweep's passes ----------
   Trevor, 2026-09-17: *"I was thinking a little more like an excel cell idea
   here. Click on Result, Profit, and two columns are sorted by Top 20 with the
   left side taking the sort. Or click on Profit first, to get left master
   sortable column."*

   SO A COLUMN CHIP IS NOT A SORT, IT IS A COLUMN -- and the order you add them
   is the order they sit in, left to right, with the leftmost doing the sorting
   and the rest breaking its ties. That is how a spreadsheet behaves and it means
   one gesture does two jobs: choosing what you can see, and choosing what ranks
   it. Tapping a chip that is already on takes that column away again.

   🔴 EACH COLUMN CARRIES ITS OWN DIRECTION, and drawdown is why. Ranking every
   column descending would put the WORST drawdown at the top of "Top 20" -- a
   list confidently offering the passes that dug the deepest hole. The third
   entry is which end is GOOD; the fourth is how many decimals the figure wants.

   THE BAND MARKER RIDES THE PASS NUMBER, not a trades column. Whether a pass
   landed inside the trade band is the one fact you must not lose when you stop
   looking at Trades -- so it colours the pass itself and survives any column
   choice. */
const OPT_COLS = [["result", "Result", 1, 3], ["profit", "Profit", 1, 0],
                  ["trades", "Trades", 1, 0], ["dd", "Drawdown", -1, 0],
                  ["payoff", "ExPayoff", 1, 2]];
const OPT_SLICES = [["top", "Top 20"], ["bottom", "Bottom 20"],
                    ["target", "Closest to target"]];
const OPTSTATE = { slice: "top", cols: ["result"], open: false };
/* The pass chosen on THIS card, until something sends it. Keyed by round so two
   jobs open in one session cannot inherit each other's choice. */
let OPT_PICK = {};

const optColDef = k => OPT_COLS.find(x => x[0] === k) || OPT_COLS[0];

function optFmt(p, k){
  const def = optColDef(k);
  const v = Number(p[k]);
  if(!isFinite(v)) return "\u2014";
  if(k === "trades") return v.toLocaleString();
  return def[3] ? v.toFixed(def[3]) : Math.round(v).toLocaleString();
}

/* ---------- 🔴 A SENTINEL IS NOT A SCORE ----------
   A sweep reports back through the Result column and nothing else, so two
   values in it are MESSAGES rather than measurements. Ranking one is not a
   cosmetic error: the early-abort's window was cut short, so its trades, profit
   and drawdown are whatever it had reached at an ARBITRARY date -- and `Closest
   to target` ranks on exactly that trade count, which is how a pass the engine
   refused ends up presented as the best one in the sweep.

   🔴 FILTER WITH THE SET, NEVER AGAINST ONE VALUE. This is the renderer's copy
   of the engine's single definition of a valid pass. Four call sites across
   three files once tested equality against the older, single sentinel, and
   every one of them counted an early-abort as a real candidate -- including the
   one that auto-applies a winner.

   THE TWO STAY APART ON SCREEN FOR THE REASON THEY STAY APART IN THE ENGINE:
   collapsing them loses "this region trades far too much" against "this region
   barely trades", which is most of what a leaderboard is for. */
const OPT_SENTINELS = [
  [-999, "disqualified"],
  [-998, "early-aborted"],
];
const optSentinel = p => OPT_SENTINELS.find(x => Number(p.result) === x[0]) || null;

/* ONE SPLIT, and everything that counts or ranks reads it -- the renderer's
   valid_passes(). Returns null only when nothing was published at all, which is
   a different state from "published, and none of it can be ranked". */
function optSplit(d){
  const all = (d || {}).passes;
  if(!Array.isArray(all) || !all.length) return null;
  const valid = [], held = [];
  all.forEach(p => { (optSentinel(p) ? held : valid).push(p); });
  return {all, valid, held};
}

/* "14 disqualified, 3 early-aborted" -- fixed order, and a kind with none in it
   is left out rather than printed as a zero. */
function optHeldParts(held){
  return OPT_SENTINELS.map(x => {
    const n = held.filter(p => Number(p.result) === x[0]).length;
    return n ? n.toLocaleString() + " " + x[1] : null;
  }).filter(Boolean);
}

function optPasses(valid, d){
  const rows = valid.slice();
  const cad = d.cadence || {};
  const lo = Number(cad.floor_trades), hi = Number(cad.ceiling_trades);
  const mid = (isFinite(lo) && isFinite(hi)) ? (lo + hi) / 2 : null;

  if(OPTSTATE.slice === "target" && mid != null){
    /* Nearest the middle of the band, and the columns are deliberately not
       consulted -- this slice IS a ranking, and it is the one the cadence gate
       actually cares about. */
    return rows.sort((a, b) =>
      Math.abs(Number(a.trades) - mid) - Math.abs(Number(b.trades) - mid)).slice(0, 20);
  }
  /* MASTER FIRST, THEN THE REST AS TIEBREAKS -- left to right, exactly as they
     are drawn. */
  const cols = OPTSTATE.cols.map(optColDef);
  rows.sort((a, b) => {
    for(const c of cols){
      const d2 = c[2] * (Number(b[c[0]]) - Number(a[c[0]]));
      if(d2) return d2;
    }
    return 0;
  });
  /* 🔴 BOTTOM 20 IS THE BOTTOM OF THE WHOLE SHEET, not the tail of the top --
     Trevor: *"Bottom 20 would give the bottom 20 of the entire optimize sheet."*
     Worst first, because when you ask for the bottom the very worst is the row
     you came to see. */
  return OPTSTATE.slice === "bottom" ? rows.slice(-20).reverse() : rows.slice(0, 20);
}

function optimizeBadge(t, nth){
  const two = nth >= 2;
  const d = (t || {}).detail || {};
  const title = two ? "Second pass" : "The sweep";
  const split = optSplit(d);
  if(!split){
    return soonBadge(title, `<b>No pass table published.</b> The sweep's own
      results -- one row per pass with its result, profit and trade count -- are
      in the optimization report the round produced. Nothing forwards them to the
      app yet, so there is nothing here to rank or to choose from.`);
  }
  const heldParts = optHeldParts(split.held);
  /* 🔴 PUBLISHED, AND NONE OF IT RANKABLE IS A REAL OUTCOME, not an error and
     not the same as nothing arriving. A group that cannot reach its band can
     have every cell refused, and an empty table under a full set of chips would
     read as a renderer that broke. */
  if(!split.valid.length){
    return soonBadge(title, `<b>Every pass was refused.</b> All
      ${split.all.length.toLocaleString()} carry a sentinel result instead of a
      score \u2014 ${esc(heldParts.join(", "))}. There is nothing to rank or to
      choose from: every cell this sweep tried traded too little, too much, or
      outside its band.`);
  }
  const rows = optPasses(split.valid, d);

  const cad = d.cadence || {};
  const assigned = cad.pass_number != null ? String(cad.pass_number) : null;
  const key = String((t || {}).at || title);
  const chosen = OPT_PICK[key] != null ? String(OPT_PICK[key]) : assigned;
  /* 🔴 THE FREE FIELD IS THE SAME HOLE WEARING A DIFFERENT HAT. The table can
     only offer valid passes now, but "Or any pass" takes a number and the number
     of a refused pass is as typeable as any other. An ASSIGNED one is louder
     still: it means something upstream ranked a sentinel, which is the exact
     shape of the bug this filter exists for, so the card says so rather than
     dropping the row quietly and leaving the highlight to land nowhere. */
  const chosenHeld = chosen != null
    ? split.held.find(p => String(p.pass) === chosen) : null;
  const assignedHeld = assigned != null
    ? split.held.find(p => String(p.pass) === assigned) : null;
  const heldNote = !split.held.length ? "" :
    `<div class="optheld"><b>${split.held.length.toLocaleString()} of ${
       split.all.length.toLocaleString()} withheld</b> \u2014 ${esc(heldParts.join(", "))}.
       ${split.valid.length.toLocaleString()} ranked.</div>`;
  const lo = Number(cad.floor_trades), hi = Number(cad.ceiling_trades);
  const inBand = n => isFinite(lo) && isFinite(hi) && n >= lo && n <= hi;
  const cols = OPTSTATE.cols;
  /* auto for the pass, then an equal share each -- minmax(0,..) so a long number
     shrinks its own column instead of pushing the row wider than the phone. */
  const grid = `grid-template-columns:auto repeat(${cols.length},minmax(0,1fr))`;

  const slices = '<div class="mgrp">' + OPT_SLICES.map(([k, label]) =>
    `<button type="button" class="gch${OPTSTATE.slice === k ? " on" : ""}" ` +
    `data-optslice="${k}">${esc(label)}</button>`).join("") + '</div>';

  /* The chip shows its POSITION when it is on -- 1 is the master. Without that
     the only way to know which column is sorting is to read the table and infer
     it, which is the thing this design exists to avoid. */
  const colChips = '<div class="mgrp">' + OPT_COLS.map(([k, label]) => {
    const at = cols.indexOf(k);
    return `<button type="button" class="gch${at >= 0 ? " on" : ""}" ` +
      `data-optcol="${k}">${esc(label)}${
        at >= 0 ? `<span class="n">${at + 1}</span>` : ""}</button>`;
  }).join("") + '</div>';

  const head = `<div class="optr opth" style="${grid}"><span>Pass</span>` +
    cols.map(k => `<span>${esc(optColDef(k)[1])}</span>`).join("") + `</div>`;

  const body = rows.map(p => {
    const n = Number(p.trades);
    const is = chosen != null && String(p.pass) === chosen;
    return `<button type="button" class="optr${is ? " on" : ""}" style="${grid}" ` +
      `data-optpick="${esc(key)}" data-optpass="${esc(p.pass)}">
        <span class="optp${inBand(n) ? "" : " oob"}">${esc(p.pass)}</span>` +
      cols.map(k => `<span>${esc(optFmt(p, k))}</span>`).join("") + `</button>`;
  }).join("");

  return `<div class="card"><div class="card-in">
      <div class="tlab">${esc(title)}${
        assigned ? " \u00b7 pass " + esc(assigned) + " assigned" : ""}</div>` +
    (two ? `<div class="sub" style="margin:0 0 2px">A second pass sweeps only what
       the first left PINNED, so this is a handful of variables, not a grid.</div>` : "") +
    statesAtNote(d) +
    sweepVars(taskRows(d), d.swept) +
    /* THE PICKER IS BEHIND A CHIP. Closed, the badge says what was searched and
       which pass carries the round -- all you want most of the time. */
    `<div class="mgrp"><button type="button" class="gch${
        OPTSTATE.open ? " on" : ""}" data-optopen>${
        /* TABLE. Trevor, 2026-09-17 -- and it is the better name: what the chip
           opens is the optimize sheet, which you read as often as you pick from.
           "Pick a different pass" named one of the two things it is for. */
        OPTSTATE.open ? "Hide table" : "Table"}</button></div>` +
    (!OPTSTATE.open ? "" :
      slices + heldNote + colChips + head + body +
      (assigned && !assignedHeld && !rows.some(p => String(p.pass) === assigned)
        ? `<div class="vhcap" style="margin-top:6px">Pass ${esc(assigned)}, the one
             this round assigned, is not in this slice.</div>`
        : "") +
      `<div class="pickother">
         <label for="optin-${esc(key)}">Or any pass</label>
         <input class="pickin" id="optin-${esc(key)}" type="number" inputmode="numeric"
                min="1" placeholder="\u2014" data-optin="${esc(key)}"
                value="${chosen != null && !rows.some(p => String(p.pass) === chosen)
                         ? esc(chosen) : ""}">
       </div>` +
      (assignedHeld
        ? `<div class="pickwarn">Pass ${esc(assigned)} was assigned by the round,
             and it came back ${esc(optSentinel(assignedHeld)[1])} rather than
             scored. Its numbers describe a run that was refused, so they cannot
             be compared with the passes below.</div>`
        : "") +
      (chosenHeld && chosenHeld !== assignedHeld
        ? `<div class="pickwarn">Pass ${esc(chosen)} is not a candidate \u2014 it came
             back ${esc(optSentinel(chosenHeld)[1])} rather than scored, which is
             why it is not in the table.</div>`
        : "") +
      (chosen != null && !chosenHeld && chosen !== assigned
        ? `<div class="pickdone">Pass ${esc(chosen)} chosen \u2014 not sent.
             ${assigned ? "The round still has pass " + esc(assigned) + " assigned." : ""}</div>`
        : "") +
      `<div class="vhcap">Tap a column to add it; the leftmost one sorts and the
        rest break its ties, so tapping <b>Profit</b> first ranks by profit. A
        pass number in amber landed outside the trade band${
        isFinite(lo) ? " (" + esc(lo.toLocaleString()) + "\u2013" +
          esc(hi.toLocaleString()) + " trades)" : ""}. <b>Closest to target</b>
        ignores the columns entirely \u2014 nearness to the band is its own ranking.
        A <b>withheld</b> pass reported a refusal through the result column instead
        of a score: <b>disqualified</b> ran its whole window and missed the band,
        <b>early-aborted</b> was stopped part-way for overtrading so its trades and
        profit describe a window that never finished. Neither is comparable with a
        scored pass, and Closest to target would have ranked one on a trade count
        that was never final.
        \u26a0\ufe0f Choosing changes nothing yet: applying a pass re-runs both backtests
        from the pre-round snapshot, and the app has no channel to ask for that.</div>`) +
    `</div></div>`;
}

/* ---------- the next round: the gate, said as the decision ----------
   🔴 THIS IS THE DECISION; THE SWEEP BADGE ABOVE IS THE EVIDENCE. They are
   read off different things -- that verdict comes from the binned response
   curve, this comes from the win state, the point count and what the budget can
   buy -- so they can disagree, and the disagreement is the fact worth having. A
   variable whose centre keeps winning on a curve with no shape converged on
   nothing.

   🔴 WHAT IT WILL AND WILL NOT PROPOSE, and the line is the pass budget.
   Narrowing keeps the point count and moves the bounds inward, so it cannot
   change what a round costs and the card can state it outright. Widening moves
   the bounds outward, and the amount depends on the WHOLE group's shape rather
   than this variable's curve -- so the card states the evidence and leaves the
   number to the engine, exactly as the verdict above does. The affordable point
   count is the engine's too: it is published, never worked out here.

   🔴 A RANGE IS NOT A LADDER RUNG. Halving is a move along
   FULL/HALF/QUARTER/EIGHTH and stops at the floor. A range rebuilt from the
   curve is not on that ladder at all and has no floor to stop at -- which is
   why the two say different words and only one of them can be held at EIGHTH. */
const NR_CURVE_POINTS = 5;   /* under this, a range has no readable interior */
const NR_LADDER = ["FULL", "HALF", "QUARTER", "EIGHTH"];

/* The centre of the swept range. For a variable whose CENTRE won, this is the
   winning value -- which is what the narrowed range re-centres on. */
function nrCentre(v){ return (Number(v.min) + Number(v.max)) / 2; }

/* 🔴 WOULD A FINER STEP ACTUALLY BE FINER? An INT parameter's step reaches the
   .set file as an integer, so half of 1 is not 0.5, it is 1 -- or worse, 0. The
   engine makes this check per variable against its own value; the card makes
   the same check against the step it was published, which is the same question
   asked of the same number. 87 of 93 INT inputs in the EA hit this at some
   level, so it is the common case and not a corner. */
function nrFloorsToSame(v, nextStep){
  if(String(v.param_type || "DOUBLE").toUpperCase() !== "INT") return false;
  return Math.max(1, Math.round(nextStep)) >= Math.max(1, Math.round(Number(v.step)));
}

/* The peak bin and one either side -- the narrowest window the curve supports,
   clamped so a peak beside an edge still yields two bins. Same arithmetic as
   shapeDetail(), deliberately: two places proposing DIFFERENT narrowed ranges
   off one curve would be worse than either. */
function nrPeakWindow(v){
  const bins = (v || {}).bins || [];
  if(bins.length < 3) return null;
  let k = 0;
  bins.forEach((b, i) => { if(Number(b.result) > Number(bins[k].result)) k = i; });
  return [Number(bins[Math.max(0, k - 1)].v),
          Number(bins[Math.min(bins.length - 1, k + 1)].v)];
}

function nrRound(x){ return Number(Number(x).toPrecision(3)); }

/* WHAT NEXT ROUND DOES TO ONE VARIABLE. Returns the chip, its colour, the
   proposed sweep where there is one, and the sentence that says why. */
function nrGate(v, pointsNext){
  const shape = String(v.shape || "").toUpperCase();
  const state = String(v.state || "").toUpperCase();
  const res = String(v.resolution || "FULL").toUpperCase();
  const pts = Number(v.points) || 0;
  const step = Number(v.step);

  if(state === "LOCKED")
    return {chip: "EXCLUDED", cls: "noisy", why: `Locked. It is not swept next
      round at all — it comes back on its own re-check, and a re-check is where
      a locked variable earns a finer step.`};

  if(shape.indexOf("EDGE-PIN") === 0){
    const up = shape.indexOf("HIGH") >= 0;
    return {chip: up ? "WIDEN UP" : "WIDEN DOWN", cls: "widen", why: `The best
      passes sit at the ${up ? "ceiling" : "floor"} of the tested range, so the
      bounds move ${up ? "up" : "down"}. <b>By how much is the engine's to say</b>
      — the widened step count is solved across the whole group, not off this
      curve.`};
  }

  if(shape.indexOf("NOISY") === 0 || shape.indexOf("MIXED") >= 0)
    return {chip: "HELD", cls: "noisy", why: `The binned response has no shape,
      so nothing here argues for moving the bounds or the step. <b>A winner on a
      curve like this is close to a coin flip</b>, and narrowing around it would
      bake that in for the rest of the epoch.`};

  /* 🔴 ENOUGH POINTS TO READ A CURVE, then rebuild the range from it. This is
     the FLOATING case: a value strictly inside the range won, the bins either
     side of it say where the peak really sits, and the new bounds come from
     that rather than from a ladder. */
  if(shape.indexOf("INTERIOR") === 0 && pts >= NR_CURVE_POINTS){
    const w = nrPeakWindow(v);
    if(w){
      const n = Number(pointsNext) || pts;
      const nextStep = n > 1 ? (w[1] - w[0]) / (n - 1) : null;
      if(nextStep && nrFloorsToSame(v, nextStep))
        return {chip: "HELD", cls: "noisy", why: `The curve brackets the peak,
          but this is an integer parameter and the tighter range still floors to
          a step of ${esc(num(Math.max(1, Math.round(step))))}. <b>Nothing would
          actually be finer</b>, so it holds where it is.`};
      return {chip: "NARROW", cls: "narrow",
        next: `${esc(num(nrRound(w[0])))} \u2192 ${esc(num(nrRound(w[1])))}` +
              (nextStep ? ` \u00b7 \u0394${esc(num(nrRound(nextStep)))} at ${esc(n)} points` : ""),
        why: `A value inside the range won and the bins either side say where the
          peak sits, so the bounds come in to bracket it${
          Number(pointsNext) && Number(pointsNext) !== pts
            ? ` \u2014 at <b>${esc(n)}</b> points rather than ${esc(pts)}, which is what
              the budget buys next round` : " at the same point count"}.`};
    }
  }

  /* 🔴 THE CENTRE WON AND THERE IS NOTHING TO READ. Three points are the floor
     and the ceiling and the middle: the middle winning says the peak is
     somewhere between its neighbours and nothing more. So the same bounds are
     looked at twice as closely -- half the step, half the span, the point count
     and therefore the pass cost untouched. */
  if(state === "CENTER" && pts < NR_CURVE_POINTS){
    const at = NR_LADDER.indexOf(res);
    if(at >= 0 && at >= NR_LADDER.length - 1)
      return {chip: "HELD", cls: "noisy", why: `The centre won again, but the
        resolution ladder is at <b>EIGHTH</b> and there is no finer rung. It
        holds here and keeps its value.`};
    const nextStep = step / 2;
    if(nrFloorsToSame(v, nextStep))
      return {chip: "HELD", cls: "noisy", why: `The centre won, but this is an
        integer parameter and a finer step still floors to
        ${esc(num(Math.max(1, Math.round(step))))}. <b>Halving would change
        nothing that reaches the .set file</b>, so it holds at ${esc(res)}.`};
    const c = nrCentre(v), half = nextStep * (pts - 1) / 2;
    return {chip: "HALVE", cls: "narrow",
      next: `${esc(num(nrRound(c - half)))} \u2192 ${esc(num(nrRound(c + half)))}` +
            ` \u00b7 \u0394${esc(num(nrRound(nextStep)))} at the same ${esc(pts)} points`,
      why: `The centre won at ${esc(pts)} points, which says the peak is between
        its neighbours and nothing more. <b>Same ground, looked at twice as
        closely</b>: half the step, half the span, the same number of passes.` +
        (at >= 0 ? ` ${esc(res)} \u2192 ${esc(NR_LADDER[at + 1])}.` : "")};
  }

  return {chip: "HELD", cls: "noisy", why: `Nothing this round argues for moving
    the bounds or the step. It sweeps again as it is.`};
}

function nextRoundBadge(t){
  const d = (t || {}).detail || {};
  const nr = d.next_round || {};
  const vars = Array.isArray(nr.vars) ? nr.vars : [];
  if(!vars.length)
    return soonBadge("Next round", `<b>Nothing published about the next round.</b>
      What each variable does next -- a finer step, a rebuilt range, or nothing at
      all -- is decided when the round is planned, from this sweep's own shape and
      what the pass budget can buy. None of that is forwarded to the app yet, so
      this card cannot say what is coming.`);

  const pointsNext = Number(nr.points_next) || null;
  const rows = vars.map(v => {
    const g = nrGate(v, pointsNext);
    return `<div class="nrv">
        <div class="nrn">${esc(v.name)}</div>
        <div class="nrc">
          <span class="tshape ${g.cls}">${esc(g.chip)}</span>
          <span class="nrw">${esc(String(v.state || "").toUpperCase())} \u00b7 ${
            esc(Number(v.points) || "\u2014")} points \u00b7 ${
            esc(String(v.resolution || "FULL").toUpperCase())}</span>
        </div>
        <div class="tshaped">${esc(num(Number(v.min)))} \u2192 ${esc(num(Number(v.max)))} \u00b7 \u0394${
          esc(num(Number(v.step)))}${g.next ? `  \u21d2  ${g.next}` : ""}</div>
        <div class="mdf">${g.why}</div>
      </div>`;
  }).join("");

  /* THE BUDGET IS THE ENGINE'S NUMBER AND IS SHOWN AS ONE. The card does not
     solve step**vars <= budget -- it prints what it was handed, because a
     number invented here would look like the engine's and disagree with it. */
  const foot = !pointsNext ? `<div class="vhcap">The point count each variable
      gets next round is the engine's to decide, and it has not been published --
      so a rebuilt range above is shown at the count this round used.</div>`
    : `<div class="vhcap">Next round can buy <b>${esc(pointsNext)} points</b> per
      variable across ${esc(nr.vars_next || vars.length)} active ones${
      nr.budget ? `, against a ceiling of ${esc(Number(nr.budget).toLocaleString())}
      passes for the group` : ""}. That count is the engine's, not this card's:
      narrowing keeps it and costs nothing extra, which is why a narrowed range
      can be proposed here and a widened one cannot.</div>`;

  return `<div class="card"><div class="card-in">
      <div class="tlab">Next round</div>
      <div class="sub" style="margin:0 0 6px">What each variable sweeps next, and
        the gate that decided it. ⚠️ Proposed, not applied \u2014 the round is
        planned when it starts.</div>
      ${rows}${foot}
    </div></div>`;
}

/* ---------- the metrics badge: one graph, several metrics ---------- */
/* WHICH METRICS ARE PLOTTED, in tap order -- the order is the colour, same rule
   as the variables badge, and for the same reason.

   🔴 THE FILTER AND THE PLOT ARE SEPARATE, DELIBERATELY. Trevor: *"Filtering by
   group changes what you READ, never what is plotted -- a picked metric stays on
   the graph with its group hidden."* So MSTATE.g narrows the TABLE only, and
   MSTATE.plot survives it. Anything else would mean picking Profit Factor,
   filtering to Ledger to check something, and silently losing the line you were
   looking at. */
function metricPlotted(k){ return (MSTATE.plot || []).indexOf(k) >= 0; }
function metricColour(k){
  const i = (MSTATE.plot || []).indexOf(k);
  return i < 0 ? "var(--faint)" : VH_SERIES[i % VH_SERIES.length];
}

/* THE ROUNDS THIS TASK HAS NUMBERS FOR, oldest first, this test last. */
function metricRounds(d){
  const h = (d.metrics_history || {}).rounds;
  return Array.isArray(h) && h.length ? h : null;
}

function metricGraph(d, big){
  const rounds = metricRounds(d);
  /* 🔴 A PICKED METRIC WITH NO SERIES USED TO VANISH. It was filtered out here
     and nothing else mentioned it, so tapping Sharpe or Recovery Factor filled
     its dot, changed the count, and drew no line -- a control that reports
     success and does nothing, which is the exact failure this file keeps a
     standing rule about.

     RAGGED COVERAGE IS NORMAL AND PERMANENT, not a fixture quirk. task_metrics
     takes each key from the source that has it, and the sources came online at
     different times: give-back and the MFE/MAE timings need CLOSED.csv, which
     only exists from 2026-09-07; the fitness block comes off the DeepDive. A
     round measured before a source existed has fewer keys -- the gen-1 backtest
     on the sample job has 25 of 32 -- and that is recorded as "a missing source
     is a missing key, never a zero". So the graph has to be able to say
     "measured now, not measured then" for the rest of the campaign. */
  const picked = (MSTATE.plot || []);
  const hasSeries = k => rounds && rounds.some(r => (r.metrics || {})[k] != null);
  const drawn = picked.filter(hasSeries);
  const noSeries = picked.filter(k => !hasSeries(k));
  const defs = {};
  M_DEFS.forEach(x => { defs[x[1]] = x; });

  const head = (n, extra) =>
    '<div class="mghead"><span class="mgttl">' + n + '</span>' + extra + '</div>';
  const clear = picked.length
    ? '<button type="button" class="mgbtn" data-mgclear>Clear</button>' : "";

  if(!rounds){
    /* NO HISTORY IS NOT AN EMPTY GRAPH. A task whose earlier rounds were never
       measured has nothing to draw, and an axis with one column on it would
       imply otherwise. */
    return head("No round history yet", "") +
      '<div class="vhempty">This task carries its own numbers and the previous ' +
      'generation, but not the series behind them, so there is nothing to plot ' +
      'across rounds.</div>';
  }
  if(!picked.length){
    return head(rounds.length + " rounds on file", "") +
      /* NOT "tap the dot" any more -- the dot stopped being a target when the
         row took over both jobs, and an empty graph telling you to press
         something that does nothing is the worst place to be wrong. */
      '<div class="vhempty">Tap a metric below to draw it across those rounds, ' +
      'or a variable to draw its history instead. Several can share the graph.</div>';
  }

  const mode = MSTATE.mode === "index" ? "index" : "value";
  const labels = rounds.map((r, i) =>
    i === rounds.length - 1 ? "this test"
      : "r" + r.round + (r.at ? " " + fmtWhen(r.at).split(" ")[0] : ""));

  /* INDEX MODE puts every series on ONE axis by asking the only question that is
     comparable across metrics: how far has it moved from where it started. The
     axis then names a real number -- per cent -- which the own-range mode
     cannot. A series that STARTS at zero has no percentage to give and is held
     out rather than divided by nothing. */
  const held = [];
  const series = drawn.map(k => {
    const raw = rounds.map(r => {
      const v = (r.metrics || {})[k];
      return typeof v === "number" ? v : null;
    });
    const first = raw.filter(v => v != null)[0];
    let vals = raw;
    if(mode === "index"){
      if(first == null || Math.abs(first) < 1e-9){ held.push(k); return null; }
      vals = raw.map(v => v == null ? null : (v - first) / Math.abs(first) * 100);
    }
    const points = [];
    vals.forEach((v, i) => {
      if(v == null) return;
      points.push({i: i, value: v, hollow: i !== rounds.length - 1});
    });
    return {key: k, colour: metricColour(k), vals: vals, raw: raw, points: points};
  }).filter(Boolean);

  /* ONE SPAN FOR EVERYONE in index mode, each series its own in value mode --
     which IS the difference between the two, stated in the caption below. */
  let shared = null;
  if(mode === "index"){
    const all = [];
    series.forEach(se => se.vals.forEach(v => { if(v != null) all.push(v); }));
    shared = sgSpan(all);
  }
  series.forEach(se => {
    se.span = shared || sgSpan(se.vals.filter(v => v != null));
  });

  const absent = noSeries.map(k => {
    const def = defs[k] || [null, k, k, 2, 0];
    return '<div class="mglgr none"><span class="mgdash" ' +
      'style="background:var(--line)"></span><span class="nm">' + esc(def[2]) +
      '</span><span>not measured in these rounds</span></div>';
  }).join("");

  const legend = series.map(se => {
    const def = defs[se.key] || [null, se.key, se.key, 2, 0];
    const got = se.raw.filter(v => v != null);
    const lo = Math.min.apply(null, got), hi = Math.max.apply(null, got);
    /* THE LEGEND IS THE OFF SWITCH. Trevor, 2026-09-17: *"If i click the metric
       in the graph list, i want to clear that metric from the graph."* Which is
       the right place for it -- once the card is pinned the dots are somewhere
       below the fold, and the line you want rid of is right here under your
       thumb.

       IT CARRIES `data-mp`, THE SAME ATTRIBUTE THE DOT DOES, so the existing
       handler serves it with no second code path: that handler toggles, and a
       metric in the legend is by definition already on, so a tap can only ever
       remove it. A dedicated "remove" branch would be a second thing to keep in
       step with the first, and this file has been bitten by exactly that before. */
    return '<button type="button" class="mglgr" data-mp="' + esc(se.key) +
      '"><span class="mgdash" style="background:' + se.colour +
      '"></span><span class="nm">' + esc(def[2]) + '</span><span>' +
      esc(mFmt(lo, def[3]) + " \u2013 " + mFmt(hi, def[3])) + '</span></button>';
  }).join("");

  const modeBtn = '<button type="button" class="mgbtn' +
    (mode === "index" ? " on" : "") + '" data-mgmode>' +
    (mode === "index" ? "% change" : "Value") + '</button>';

  /* THE COUNT IS WHAT IS DRAWN, with the rest called out beside it -- "1 metric
     · 6 rounds" over a graph holding one line when you have picked two would be
     the same lie one level up. */
  const title = drawn.length + " metric" + (drawn.length === 1 ? "" : "s") +
    (noSeries.length ? " \u00b7 " + noSeries.length + " unplottable" : "") +
    " \u00b7 " + rounds.length + " rounds";
  return head(title, modeBtn + clear) +
    (drawn.length ? seriesGraph(labels, series, big) : "") +
    '<div class="mglg">' + legend + absent + '</div>' +
    /* THE BIG VIEW IS FOR THE SHAPE. The legend stays -- it names the lines and
       three words of it fit anywhere -- but the paragraph explaining the scaling
       belongs on the card you opened this from. */
    (big ? "" : '<div class="vhcap">' +
    (noSeries.length && !drawn.length
      ? 'Nothing to draw: the metrics you picked were measured on THIS test but ' +
        'not on the earlier rounds, so there is no line to run through them. '
      : "") +
    (mode === "index"
      ? 'Every series on ONE axis, as per cent moved from ' + esc(labels[0]) +
        '. Heights are comparable here \u2014 that is what this mode is for.'
      : '<b>Each series is scaled to its own range</b>, so the shape is honest ' +
        'but the axis names no real number and heights are not comparable ' +
        'between lines. Switch to % change to compare them.') +
    ' Solid dot = this test, hollow = an earlier round.' +
    (held.length
      ? ' ' + esc(held.map(k => (defs[k] || [,,k])[2]).join(", ")) +
        ' starts at zero and has no percentage to show, so it is held out of ' +
        'this mode.'
      : "") +
    '</div>');
}

/* ---------- the task card ---------- */
/* The four words for where a variable is up to, straight from the publisher --
   see task_detail.STATE_TEXT for what each one means. Lower-cased here only to
   pick a CSS class; the label shown is the publisher's own. */
function stateClass(s){ return String(s || "").toLowerCase(); }

/* THE STATE CHIP, one renderer for every place a variable's state is drawn.
   Trevor, 2026-09-22: *"show the σ on the chip."* A PINNED carries which edge
   and how hard -- "PINNED ↑ 2.6σ" -- because the word alone made a pin a second
   pass chases look the same as a best pass that happened to sit at the edge.

   2σ IS THE LINE, and it is not this page's number: it is the bar
   decision_engine.select_second_pass_variables uses to decide whether a pin is
   worth a second pass. Below it the chip is drawn QUIETER, because the one
   thing that bar says is "this edge could be noise". Absent a sigma (a pin
   recorded before 2026-09-22, or a sweep too thin to measure one) the chip is
   the bare word, exactly as before -- never a guessed number. */
const SIGMA_BAR = 2.0;
function stateChip(v){
  /* NOT RECORDED is not a state, it is the lack of one -- a sweep that ran
     before tasks recorded what they left behind (2026-09-23). Drawn so the row
     keeps its shape, and never as today's state borrowed for the occasion. */
  if(v && !v.state && v.unrec)
    return `<span class="tst unrec" title="This task ran before per-task states `
      + `were recorded (2026-09-23).">not recorded</span>`;
  if(!v || !v.state) return "";
  const st = String(v.state);
  let label = esc(st), weak = false, tip = "";
  if(st === "PINNED"){
    const arrow = v.edge === "UPPER" ? " ↑" : v.edge === "LOWER" ? " ↓" : "";
    const sig = (v.sigma != null && isFinite(Number(v.sigma))) ? Number(v.sigma) : null;
    label += arrow + (sig != null ? " " + esc(sig.toFixed(1)) + "σ" : "");
    if(sig != null){
      weak = sig < SIGMA_BAR;
      tip = weak ? "Below 2σ -- the edge may be noise; no second pass chases it."
                 : "2σ or more -- a real pin; a second pass chases it.";
    }
  }
  return `<span class="tst ${stateClass(st)}${weak ? " weak" : ""}"${
    tip ? ` title="${esc(tip)}"` : ""}>${label}</span>` +
    /* CHASED -- a first-pass pin the round's own second pass took over in the
       same apply. The PINNED beside it is what this task left it in; where it
       ended up is on the second pass's chip. */
    (v.chased_by ? `<span class="tst chased" title="The second pass in this `
      + `round swept it next.">→ ${esc(v.chased_by)}</span>` : "");
}

/* WHOSE STATES THESE ARE -- task_detail.build's `states_at`. Rows of a sweep
   that predates the record are flagged so stateChip draws "not recorded". */
function taskRows(d){
  const unrec = (d || {}).states_at === "unrecorded";
  return ((d || {}).variables || []).map(v =>
    unrec && v && !v.state && v.swept !== false ? Object.assign({unrec: true}, v) : v);
}
function statesAtNote(d){
  const at = (d || {}).states_at;
  const live = String((d || {}).status || "").toLowerCase();
  const txt = at === "task"
      ? "The state this task left each variable in."
    : at === "unrecorded"
      ? "What this task swept, from its own report. It ran before tasks recorded "
        + "their own states (2026-09-23), so none is shown — today’s "
        + "would describe a different moment."
    : at === "live" && (live === "running" || live === "queued")
      ? "The state each variable went in with — this task has not finished."
    : at === "live"
      ? "Where each variable stands now. This task’s own record was not found."
    : "";
  /* HELD ROWS ARE LISTED TOO, so the caption says what the tick means. */
  const held = ((d || {}).variables || []).some(v => v && v.swept === false);
  const more = held && (at === "task" || at === "unrecorded")
    ? " ✓ marks the variables this task swept; HELD ones were not swept"
      + " here and keep the state the task before left them."
    : "";
  return (txt + more) ? `<div class="vhcap" style="margin:0 0 4px">${esc(txt + more)}</div>` : "";
}

/* EXPLAIN ONLY THE STATES ON SCREEN. Printing all five every time is a
   glossary; printing the ones this task actually has is an answer. Ordered
   PINNED first, matching notify.py's own ordering and for the same reason --
   it is the one worth eyeballing, because a variable stuck there is asking for
   a wider band and is a park waiting to happen. */
function taskStateKey(list){
  const seen = [];
  ["PINNED", "CENTER", "FLOATING", "DEFAULT", "LOCKED"].forEach(st => {
    if((list || []).some(v => v.state === st) && STATE_TEXT[st]) seen.push(st);
  });
  if(!seen.length) return "";
  return seen.map(st =>
    `<div class="tkey"><span class="tst ${stateClass(st)}">${esc(st)}</span>` +
    `<span class="tkt">${esc(STATE_TEXT[st])}</span></div>`).join("");
}

function taskVars(list, hist){
  if(!(list || []).length) return "";
  /* A finished sweep lists its whole group now; when some rows are HELD, the
     swept ones carry the same tick the sweep badge uses. A live list has no
     `swept` field and renders exactly as before. */
  const mark = list.some(x => x && x.swept === false);
  return list.map(v => `<div class="tvar${mark && v.swept === false ? " isheld" : ""}">` +
      (mark && v.swept ? `<span class="tmem in" style="margin-right:2px">✓</span>` : "") +
      /* WITH a history to draw, the name is a button; without one it is the
         same text it always was. `hist` is absent everywhere except the job
         card, so every other caller renders exactly as before. */
      (hist && hist[v.name]
        ? `<button type="button" class="vbtn${vhOn(v.name) ? " on" : ""}"` +
          (vhOn(v.name) ? ` style="border-color:${vhColour(v.name)};color:${
             vhColour(v.name)}"` : "") +
          ` data-vh="${esc(v.name)}">${esc(spaceOut(stripRegime(v.name)))}</button>`
        : `<span class="tvn">${esc(spaceOut(stripRegime(v.name)))}</span>`) +
      stateChip(v) +
      /* ALWAYS A BOX, even with nothing in it -- an absent resolution would
         otherwise pull the state chip right and break the column. */
      `<span class="tvr ${stateClass(v.resolution)}">${
         v.resolution ? esc(v.resolution) : "—"}</span>` +
      `</div>`).join("");
}

/* A SWEPT VARIABLE HAS TWO SHAPES, because a task gets here two ways: a seeded
   sweep carries its own grid on the record, a rotation round sweeps its group's
   active variables at whatever resolution each is on. Same reason the publisher
   has two shapes -- see task_detail.swept_variables. */
/* THE SAME ROW THE VARIABLES BADGE USES. Trevor, 2026-09-17: *"The variable
   names at the top of the badge needs to look like the variable Badge. But I
   want resolution steps and range on the chips."*

   It used to draw the name on one line and drop the whole grid spec onto a
   second, full-width -- a different shape for the same idea, two badges apart on
   one card. Now it is `taskVars`' layout exactly: name on the left, two chips on
   the right, one filled and one outlined.

   WHICH FACT GOES IN WHICH CHIP follows the badge it is copying. There the
   FILLED chip is the state -- the thing worth scanning a column for -- and the
   outlined one is the resolution, a qualifier. Here the filled chip is the
   RANGE, because what a sweep searched is the fact you scan for, and the
   outlined one is how finely it cut that range. Same grammar, different nouns.

   A SECOND PASS CARRIES NEITHER. Its variables arrive as names and a resolution
   word with no grid, because the grid does not exist until the pass is prepared
   -- so that shape renders the word alone, in the outlined chip where a
   resolution already belongs. */
/* THE WHOLE GROUP, AND WHICH OF IT THIS SWEEP IS MOVING. Trevor, 2026-09-17,
   on the second pass: *"the difference is which variables are being optimized so
   I still want the whole list but I want another chip saying whether it's part
   of this optimization or not."*

   AND THAT IS THE SECOND PASS'S ENTIRE POINT. It takes only what the first pass
   left PINNED and holds everything else at the value that was applied -- so a
   list showing just the one variable it sweeps hides the very fact that makes it
   a second pass. Showing four HELD beside one SWEPT says "this round is about
   that one variable" in a way a single row cannot.

   ⚠️ IT DOES THE SAME FOR THE FIRST PASS, which is a change to a card that was
   already agreed. The justification is the same and the omission was the same:
   the first pass of this job sweeps two of the group's five, and the card was
   quietly showing two. A LOCKED variable is not absent from the round, it is
   being held -- and that is worth a chip, not a silence.

   THE MEMBERSHIP CHIP IS THE LOUD ONE. Everything else on the row qualifies a
   variable; this says whether the round is touching it at all, which is the
   question the badge exists to answer.

   🔴 AND THERE ARE THREE ANSWERS, NOT TWO. Trevor, 2026-09-17: *"We also need to
   add to the chip list, a Rider. We will have riders every once in a while."* A
   RIDER is swept alongside the group without belonging to it -- the cadence
   rider bolted onto a Round 1 sweep to drag a trade count toward its band. It is
   in the round, so it is not HELD; it is not the group's, so calling it SWEPT
   would quietly enlarge the group on screen and make the next reader wonder when
   a fifth variable joined it.

   ⚠️ IT IS READ FROM A FLAG, NOT INFERRED FROM ABSENCE. A swept variable missing
   from the group list looks exactly like a rider and might instead be two
   records disagreeing -- so absence alone gets the loud warning below rather
   than a tidy label that would bury it. */
/* ---------- what the sweep's own shape is telling you ----------
   Trevor, 2026-09-17: *"I want a variable shapeset that will tell me if we need
   to narrow the search resolution, or widen it."*

   THE CLASSIFICATION IS NOT NEW WORK -- `GoldBot_OptReportSummarizer` already
   bins each parameter's passes and calls the shape, precisely so a reader can
   "tell narrow-candidates from widen-candidates from dead params at a glance".
   It has never reached a screen. This is that verdict, said as the action:

     EDGE-PIN-HIGH   best at the ceiling of the tested range -> WIDEN UP
     EDGE-PIN-LOW    best at the floor                       -> WIDEN DOWN
     INTERIOR-PEAK   the range brackets the best             -> NARROW
     NOISY/MIXED     no shape at all                         -> NO SIGNAL

   🔴 NARROW AND WIDEN ARE NOT OPPOSITE ENDS OF ONE DIAL. Widen moves the BOUNDS
   because the optimum is outside them; narrow keeps the bounds and spends the
   same passes on finer steps inside them. Answering "which" with a single arrow
   would collapse two different actions.

   ⚠️ IT SHOULD AGREE WITH THE STATE CHIP BESIDE IT, and when it does not that is
   the interesting case rather than a bug: PINNED means the variable WON at its
   edge, EDGE-PIN means the whole binned response leans that way. A PINNED
   variable whose shape is NOISY won at the edge on noise. */
const SHAPE_VERDICT = {
  "EDGE-PIN-HIGH": ["widen", "WIDEN UP", "The best passes sit at the ceiling of the tested range, so the optimum may be outside it. Move the bounds up."],
  "EDGE-PIN-LOW": ["widen", "WIDEN DOWN", "The best passes sit at the floor of the tested range. Move the bounds down."],
  "INTERIOR-PEAK": ["narrow", "NARROW", "The range brackets the best value, so the bounds are right and the steps are coarse. Spend the same passes on a finer grid."],
  "NOISY": ["noisy", "NO SIGNAL", "The binned response has no shape. Neither widening nor narrowing is justified by this round."],
};
/* THE VERDICT WITH NUMBERS ON IT. Trevor, 2026-09-17: *"Can that shape be more
   specific than widen, narrow? How about narrow to a certain point? Variable
   resolution kinda thing."*

   🔴 IT READS THE BINS AND STOPS THERE. A narrowed range is arithmetic on the
   curve -- the peak bin and its two neighbours -- and the step that follows from
   keeping the same point count, which IS the resolution being asked about. That
   much the app can say.

   ⚠️ IT DOES NOT PROPOSE A WIDENED RANGE, and that restraint is deliberate.
   Widening is not "add some room": `compute_directional_widen_step_count` solves
   for the largest step count such that

       widen**widening_vars * base**(other_vars) <= 20,000

   so the answer depends on the whole GROUP's shape, not on this variable's
   curve. A number invented here would look like the engine's and disagree with
   it -- the exact failure this file keeps recording. So for a widen the card
   states the EVIDENCE (still climbing, and by how much in the last bin) and
   leaves the amount to the engine.

   NARROWING HAS NO SUCH PROBLEM: it keeps the point count and moves the bounds
   inward, so the pass budget is untouched by construction. */
function shapeDetail(g){
  const bins = (g || {}).bins || [];
  if(bins.length < 3) return "";
  const v = shapeVerdict(g.shape);
  if(!v) return "";
  const vals = bins.map(b => Number(b.result));
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const pts = Number(g.points) || bins.length;

  if(v[0] === "narrow"){
    let k = 0;
    vals.forEach((x, i) => { if(x > vals[k]) k = i; });
    /* The peak bin and one either side -- the narrowest window the curve
       actually supports. Clamped, so a peak next to an edge still gives two
       bins rather than running off the end. */
    const a = bins[Math.max(0, k - 1)].v, b = bins[Math.min(bins.length - 1, k + 1)].v;
    const step = pts > 1 ? (Number(b) - Number(a)) / (pts - 1) : null;
    return `to ${esc(num(a))} → ${esc(num(b))}` +
      (step ? ` · Δ${esc(num(Number(step.toPrecision(3))))} at the same ${esc(pts)} steps` : "");
  }
  if(v[0] === "widen"){
    const up = v[1].indexOf("UP") >= 0;
    const edge = up ? bins[bins.length - 1] : bins[0];
    const prev = up ? bins[bins.length - 2] : bins[1];
    const d = Number(edge.result) - Number(prev.result);
    return `past ${esc(num(edge.v))} · still climbing, ${d >= 0 ? "+" : "−"}${
      esc(num(Number(Math.abs(d).toPrecision(2))))} in the last bin`;
  }
  /* NOISY: quantify the flatness, so "no signal" is a measurement rather than a
     shrug -- a 0.09 spread and a 0.9 spread are different kinds of nothing. */
  return `best bin only +${esc(num(Number((hi - lo).toPrecision(2))))} over the worst`;
}

function shapeVerdict(shape){
  const k = String(shape || "").toUpperCase();
  if(SHAPE_VERDICT[k]) return SHAPE_VERDICT[k];
  if(k.indexOf("INTERIOR") === 0) return SHAPE_VERDICT["INTERIOR-PEAK"];
  if(k.indexOf("EDGE-PIN-HIGH") === 0) return SHAPE_VERDICT["EDGE-PIN-HIGH"];
  if(k.indexOf("EDGE-PIN-LOW") === 0) return SHAPE_VERDICT["EDGE-PIN-LOW"];
  if(k) return SHAPE_VERDICT["NOISY"];
  return null;
}

/* Which response curves are on the shared graph. Same shape as VHSTATE and for
   the same reason -- and the same exclusivity: a response curve's x axis is a
   VARIABLE'S VALUE, a history's is rounds and a metric's is rounds too. Three
   populations, one axis, never together. */
const SWSTATE = { on: [] };
const swOn = name => SWSTATE.on.indexOf(name) >= 0;
function swColour(name){
  const i = SWSTATE.on.indexOf(name);
  return i < 0 ? "var(--faint)" : VH_SERIES[i % VH_SERIES.length];
}

/* THE RESPONSE CURVE. Mean Result per bin of the variable's tested range -- the
   picture the shape verdict is read off, so you can disagree with it. */
function sweepCurve(all, swept){
  const grid = {};
  (swept || []).forEach(v => { if(v && v.name) grid[v.name] = v; });
  const chosen = SWSTATE.on.filter(n => grid[n] && (grid[n].bins || []).length);
  if(!chosen.length) return "";
  const width = Math.max.apply(null, chosen.map(n => grid[n].bins.length));
  const labels = [];
  for(let i = 0; i < width; i++){
    const b = grid[chosen[0]].bins[i];
    labels.push(b ? num(b.v) : "");
  }
  const series = chosen.map(name => {
    const bins = grid[name].bins;
    return {colour: swColour(name),
            span: sgSpan(bins.map(b => b.result)),
            points: bins.map((b, i) => ({i: i, value: b.result}))};
  });
  const legend = chosen.map(name => {
    const g = grid[name], v = shapeVerdict(g.shape);
    return `<div class="mglgr none" style="cursor:default">
        <span class="mgdash" style="background:${swColour(name)}"></span>
        <span class="nm">${esc(spaceOut(stripRegime(name)))}</span>
        <span>${v ? esc(v[1]) : ""}</span></div>`;
  }).join("");
  return seriesGraph(labels, series) +
    `<div class="mglg">${legend}</div>` +
    `<div class="vhcap">Mean <b>Result</b> per bin across the range each variable
      was swept over \u2014 the picture the shape verdict is read off. Left is the
      floor of the range, right is the ceiling. A line still climbing at the right
      edge is why WIDEN UP; a hump in the middle is why NARROW.
      ${chosen.length > 1 ? "Each line is scaled to its own range." : ""}</div>`;
}

function sweepVars(all, swept){
  const grid = {};
  (swept || []).forEach(v => { if(v && v.name) grid[v.name] = v; });
  /* Anything swept that the group list does not carry is still shown -- a sweep
     naming a variable the task did not list is a disagreement worth seeing, not
     one to hide by iterating the shorter list. */
  const names = (all || []).map(v => v.name);
  (swept || []).forEach(v => { if(v && names.indexOf(v.name) < 0) names.push(v.name); });
  if(!names.length) return "";

  const by = {};
  (all || []).forEach(v => { if(v && v.name) by[v.name] = v; });

  return names.map(name => {
    const v = by[name] || {name: name};
    const g = grid[name];
    const hasGrid = g && g.min != null && g.max != null;
    const range = hasGrid ? `${esc(num(g.min))} → ${esc(num(g.max))}` : "";
    const fine = hasGrid
      ? (g.points ? `${esc(g.points)}` : "") +
        (g.points && g.step ? " × " : "") +
        (g.step ? `Δ${esc(num(g.step))}` : "")
      : (g && g.resolution ? esc(g.resolution) : (v.resolution ? esc(v.resolution) : ""));
    const rider = !!(g && g.rider);
    /* Swept, not the group's, and not declared a rider: say so loudly. */
    const stray = !!(g && !rider && !by[name]);
    /* THE TICK IS WHAT THIS TASK SWEPT. Trevor, 2026-09-23: *"Lets still have
       the full group listed, but note that the optimize 2 only has certain
       variables being swept. Put a tick or something in the chip letting me
       know which ones are actually being swept."* HELD rows stay on the card,
       quieter, at the state the task before left them. */
    const mem = rider ? ["rider", "RIDER"]
              : stray ? ["stray", "NOT IN GROUP"]
              : g ? ["in", "✓ SWEPT"] : ["held", "HELD"];
    return `<div class="tvar swept${g || rider ? "" : " isheld"}">
        <span class="tvn">${esc(spaceOut(stripRegime(name)))}</span>
        <span class="tmem ${mem[0]}"${g || rider ? "" : ` title="Not swept by this task — held where the task before left it."`}>${mem[1]}</span>` +
      stateChip(v) +
      (range ? `<span class="tst grid">${range}</span>` : "") +
      (fine ? `<span class="tvr">${fine}</span>` : "") +
      /* A RIDER CARRIES NO STATE, and that absence is correct rather than
         missing data: DEFAULT/FLOATING/CENTER/PINNED/LOCKED describe a
         variable's progress through ITS GROUP's rounds, and a rider is not on
         that journey. Saying why beats leaving a gap where every other row has
         a chip. */
      (rider ? `<span class="tvr" style="border-color:transparent;color:var(--faint)">no group state</span>` : "") +
      /* THE VERDICT, and it is the row's payload -- what to DO about this
         variable next round. Only a swept variable has one: a held variable
         produced no passes to bin. */
      (g && shapeVerdict(g.shape)
        ? `<span class="tshape ${shapeVerdict(g.shape)[0]}">${
             esc(shapeVerdict(g.shape)[1])}</span>` +
          (shapeDetail(g) ? `<span class="tshaped">${shapeDetail(g)}</span>` : "")
        : "") + `
      </div>` +
      /* The curve behind the verdict, one tap away, in the shared graph at the
         top of the card. Only offered when there are bins to draw. */
      (g && (g.bins || []).length
        ? `<div class="tsub"><button type="button" class="gch${
             swOn(name) ? " on" : ""}" data-swcurve="${esc(name)}">${
             swOn(name) ? "Hide curve" : "Response curve"}</button>
           <span class="tcorr">${
             g.corr_result != null
               ? "r=" + esc(Number(g.corr_result).toFixed(2)) + " vs Result" : ""}${
             g.corr_trades != null
               ? " \u00b7 r=" + esc(Number(g.corr_trades).toFixed(2)) + " vs Trades" : ""}</span>
           </div>`
        : "");
  }).join("");
}

function taskSwept(list, states){
  if(!(list || []).length) return "";
  /* WHAT STATE IT WENT IN AS. Trevor, 2026-09-17: *"If we can have the Previous
     Pinned, or Floating status in there too."* The sweep record carries a name
     and a grid and nothing about the lifecycle, but the task's own variable list
     carries the state -- so it is looked up by name rather than duplicated onto
     the sweep record, the same way the live tile reads its states.

     IT IS THE STATE GOING IN, not the one the round left behind. A sweep runs
     BECAUSE a variable is PINNED or FLOATING; what it became is the variables
     badge's business, one card down. Saying which is why the label reads "went
     in as" rather than just showing the chip bare. */
  const by = {};
  (states || []).forEach(x => { if(x && x.name) by[x.name] = x; });
  return list.map(v => {
    const st = by[v.name];
    const hasGrid = v.min != null && v.max != null;
    const range = hasGrid ? `${esc(num(v.min))} → ${esc(num(v.max))}` : "";
    const fine = hasGrid
      /* "9 x 0.05" rather than "9 steps - 0.05": the multiplication sign says
         steps-of-that-size on its own, and the row has three chips to fit. */
      ? (v.points ? `${esc(v.points)}` : "") +
        (v.points && v.step ? " × " : "") +
        (v.step ? `Δ${esc(num(v.step))}` : "")
      : (v.resolution ? esc(v.resolution) : "");
    return `<div class="tvar swept">
        <span class="tvn">${esc(spaceOut(stripRegime(v.name)))}</span>` +
      stateChip(st) +
      (range ? `<span class="tst grid">${range}</span>` : "") +
      /* ALWAYS A BOX, even with nothing in it -- the same reason taskVars keeps
         an empty one: an absent chip pulls the row's right edge out of line. */
      `<span class="tvr ${esc(String(v.resolution || "").toLowerCase())}">${
         fine || "—"}</span>
      </div>`;
  }).join("");
}

const BAND_WORD = { IN_BAND: "In band", UNDER: "Under", OVER: "Over",
                    UNKNOWN: "Not measured here" };

/* WHERE THE VARIABLE LIST CAME FROM, said out loud. The three answers are not
   equally strong and the card should not pretend they are: `set` is what MT5 is
   sweeping this second, `applied` is what the last confirmed round put under
   test, `group` is every variable tagged to the group -- which a BACKTEST shows
   deliberately, because it measures where they all ended up. */
const SWEPT_LABEL = {
  set: "Sweeping now",
  applied: "Swept last round",
  group: "Variables",
  undecided: "Variables",
  /* 2026-09-23 -- a finished sweep's own set, from its record or its report. */
  task: "Swept this task",
  report: "Swept this task",
};

function taskBand(c){
  if(!c) return "";
  const v = String(c.verdict || "UNKNOWN");
  const cls = v.toLowerCase().replace("_", "");
  let line = "";
  if(v === "UNKNOWN"){
    /* NOT A MISS. A sweep runs with logging off and writes no count at all, and
       the round ledger is per-machine so a peer's round has no row here either.
       Saying "0 trades" or "under" would invent a cadence problem. */
    line = `<span class="tbm">no trade count on this machine</span>`;
  } else {
    line = `<span class="tbm">${esc(c.trades)} trades · band ` +
           `${esc(c.floor_trades)}–${esc(c.ceiling_trades)}</span>` +
           (c.off_by ? `<span class="tbm">${esc(c.off_by)} ${
              v === "UNDER" ? "short" : "over"}</span>` : "") +
           /* THE RATIO IS WHAT THE EA ACTUALLY COMPARED. The trade counts above
              are the readable form of it, and a reader checking this verdict
              against a FITNESS log needs the number that log carries. */
           (c.vol_ratio != null ? `<span class="tbm">ratio ${esc(c.vol_ratio)} ` +
              `(${esc(c.band_lo)}–${esc(c.band_hi)})</span>` : "");
  }
  return `<div class="tband"><span class="tbv ${cls}">${
      esc(BAND_WORD[v] || v)}</span>${line}</div>`;
}

/* WHAT THE TASK PRODUCED. `pass_number`, `profit_factor` and `model` were all
   on the record and none of them were drawn -- which meant the card could tell
   you a round landed in band without telling you WHICH PASS it picked, the one
   thing you would go to the report to look up. */
function taskResult(c){
  if(!c) return "";
  const bits = [];
  if(c.pass_number) bits.push(`pass ${esc(c.pass_number)}`);
  if(c.profit_factor != null) bits.push(`PF ${esc(c.profit_factor)}`);
  /* The same two words the rest of the page uses for the model. A third
     spelling of "real_ticks" on one screen is a third thing to learn. */
  if(c.model) bits.push(esc(c.model === "real_ticks" ? "real ticks"
                           : c.model === "ohlc" ? "OHLC" : c.model));
  if(!bits.length) return "";
  return `<div class="tsec"><div class="tlab">Picked</div>
      <div class="tband"><span class="tbm">${bits.join(" · ")}</span></div></div>`;
}

/* WHY IT CUT IN LINE. The tag is the category and the note is the sentence --
   both, because the tag alone loses the specifics and the note alone cannot be
   grouped. See seeds.REASONS. */
function taskSeed(sd){
  if(!sd) return "";
  return `<div class="tsec">
      <div class="tlab">Seeded — ${esc(sd.reason || "")}</div>` +
    (sd.reason_text ? `<div class="tnote">${esc(sd.reason_text)}</div>` : "") +
    (sd.note ? `<div class="tnote">“${esc(sd.note)}”</div>` : "") +
    (sd.outcome ? `<div class="tnote">${esc(sd.outcome)}</div>` : "") +
    (sd.created_by ? `<div class="tby">by ${esc(sd.created_by)}</div>` : "") +
    `</div>`;
}

/* The pictures. Drawn, not linked -- see .tgraph. Built from the same base and
   the same directory the report buttons use, so a graph can never point
   somewhere its own report does not. */
function taskGraphs(files, relDir, urls){
  const name = (files || {}).CURVE;
  if(!name) return "";
  /* A URL THE RECORD CARRIES WINS, exactly as reportButtons does it -- one rule
     for "where does this file live", so a graph can never resolve differently
     from the report sitting beside it. */
  let url = (urls || {}).CURVE || "";
  if(!url){
    if(!FILE_BASE || !relDir) return "";
    const dir = String(relDir).split("/").map(encodeURIComponent).join("/");
    url = FILE_BASE.replace(/\/+$/, "") + "/" + dir + "/" +
          encodeURIComponent(name);
  }
  return `<div class="tsec"><div class="tlab">Balance curve</div>
      <img class="tgraph" src="${esc(url)}" alt="balance curve" loading="lazy">
      <div class="tgcap">Before and after, on one scale.</div></div>`;
}

/* `lift` -- 2026-09-17. On the RESULTS job card the variables and the test
   results are badges of their own now, sitting under the Information badge
   rather than inside this panel. Lifting them out here rather than rebuilding
   the panel keeps ONE definition of each: the Active tab still gets the whole
   card, because there the task panel IS the card. */
function taskCard(r, relDir, open, skipGraph, lift){
  const d = r.detail;
  if(!d) return "";
  const parts = [
    taskSeed(d.seed),
    taskResult(d.cadence),
    d.cadence ? `<div class="tsec"><div class="tlab">Trade band</div>` +
                taskBand(d.cadence) + `</div>` : "",
    (d.swept || []).length ? `<div class="tsec"><div class="tlab">Swept</div>` +
                             taskSwept(d.swept, d.variables) + `</div>` : "",
    (d.variables || []).length && !lift
      ? `<div class="tsec"><div class="tlab">${esc(SWEPT_LABEL[d.swept_source]
            || "Variables")}</div>` + statesAtNote(d) +
        taskVars(taskRows(d)) + taskStateKey(d.variables) + `</div>`
      /* NOT DECIDED YET is a real answer and the only honest one for a queued
         sweep: a second pass takes whatever the first leaves PINNED, so its
         variable list does not exist until the first one finishes. */
      : d.swept_source === "undecided" && !lift
        ? `<div class="tsec"><div class="tlab">Variables</div>
             <div class="tnote">Not chosen yet — a second pass sweeps whatever
             the pass before it leaves pinned, so this list does not exist
             until that one finishes.</div></div>`
        : "",
    lift ? "" : taskMetrics(d),
    skipGraph ? "" : taskGraphs(d.files, d.rel_dir || relDir, d.urls),
  ].filter(Boolean);
  /* A TASK WITH NOTHING TO SAY SAYS SO. A queued round has no seed, no count,
     no files -- an empty panel would read as a broken card rather than as a
     round that has not happened yet. */
  if(!parts.length){
    parts.push(`<div class="tnote">Nothing recorded yet — this one has not run.</div>`);
  }
  return `<div class="task"${open ? "" : " hidden"}>${parts.join("")}</div>`;
}

function renderTimeline(tl){
  if(!tl || !tl.rounds || !tl.rounds.length) return "";
  const rows = tl.rounds.map(r => {
    /* The conditional is a CONDITION PHRASE from job_plan ("the first pass
       edge-pins"), so it reads correctly after "only if" and nowhere else.
       Negating it inline produced "the job moved past it without the first
       pass edge-pins"; naming it as an unmet condition keeps job_plan's
       wording intact without trying to inflect it. */
    const note = r.status === "skipped"
        ? (r.conditional ? "not needed — condition not met: " + r.conditional
                         : "not needed this pass")
      /* INFERRED, and it says so. This round is mandatory and something after
         it is under way, so it ran -- but no report reached the tree, so there
         is nothing to open and no minute to name. Claiming it silently would
         break the rule the rest of this view rests on: a file is the evidence. */
      : r.inferred ? "ran — no report filed"
      : r.status === "queued" && r.conditional ? "only if " + r.conditional
      : r.status === "running" ? "running now" : "";
    /* Tappable only when there is a card behind it -- a row that opens an
       empty panel teaches you not to tap the ones that are not empty. */
    const card = taskCard(r, tl.rel_dir);
    return `<div class="tlr ${esc(r.status)}${r.inferred ? " inferred" : ""}${
        card ? " tappable" : ""}"${card ? ' data-task' : ""}>
        <div class="tlm">${ROUND_MARK[r.status] || ""}</div>
        <div class="tlb">
          <div class="tlh"><span class="tlk">${esc(phaseText(r.kind))}</span>` +
          (r.at ? `<span class="tlw">${esc(fmtWhen(r.at))}</span>` : "") + `</div>` +
          (note ? `<div class="tlnote">${esc(note)}</div>` : "") +
          reportButtons(r, tl.rel_dir) + card + `</div>
      </div>`;
  }).join("");
  /* WHICH PASS, because a group is deliberately re-run and "it passed"
     means nothing without saying which attempt it belonged to. A job on a NEW
     pass has no folder yet; naming the one before it is what stops the empty
     timeline reading as "nothing has ever run here". */
  const which = tl.pass ? esc(tl.pass)
    : tl.previous_pass ? "new pass · last was " + esc(tl.previous_pass)
    : "first pass";
  return '<div class="section-label">Rounds in this job · ' + which +
         '</div><div class="tl">' + rows + '</div>';
}

/* EVERYTHING ASSOCIATED WITH THAT JOB on one screen: the machine running it,
   the seed it came from, its outcome, and any failure history for the same
   group. Built from the SAME card renderers the list uses, so a job cannot
   describe itself differently depending on which screen you reached it from. */
function renderJobDetail(job){
  const back = '<button type="button" class="backbtn" data-job="">' +
               '‹ All jobs</button>';
  if(!job) return back + '<div class="empty">That job is gone.</div>';
  const gid = (job.fleet && job.fleet.group_id) || (job.seed && job.seed.group_id);
  const fails = FAILURES.filter(f => gid && f.group_id === gid);
  return back
    + (job.fleet ? '<div class="section-label">Machine</div>' +
         /* An agent's own card: cores, why, and its lending meter -- the
            round card would title it "Idle -- no round". */
         (isAgent(job.fleet) ? agentCard(job.fleet) : machineCard(job.fleet)) : "")
    /* ONE MACHINE, ONE JOB, ONE CARD. This used to print the machine card and
       then the seed card underneath it, which read as two jobs on one box --
       Trevor: *"a machine can't have two jobs on the go in the app page."* They
       were never two. `fleetWithSeed` has already folded every fact the seed
       carries into the card above, so the second card restated it with a
       different title and a different timestamp and invited you to reconcile
       them. A loose seed -- queued, or owed with no machine -- still gets its
       own card, because there is no machine card for it to fold into.

       The NOTE does not fold in, and it is the one thing a seed has that a
       beacon never will: why this work cut the line. It is shown open rather
       than behind the disclosure the card used, because by this point it is
       the only thing left on the screen that has not already been said. */
    + (job.pick ? '<div class="section-label">Waiting on you</div>' +
         pickCard(job.pick) : "")
    + (job.queue ? '<div class="section-label">What it will run</div>' +
         queueCard(job.queue) : "")
    + (job.seed && !job.fleet
        ? '<div class="section-label">Seeded work</div>' + seedCard(job.seed) : "")
    + renderTimeline(timelineFor(
        (job.fleet && job.fleet.regime) || (job.seed && job.seed.regime),
        (job.fleet && job.fleet.bucket_id) != null
          ? job.fleet.bucket_id : (job.seed && job.seed.bucket_id),
        gid))
    + (job.seed && job.fleet && job.seed.note
        ? '<div class="section-label">Why it cut in line</div>' +
          '<div class="notebody">' + esc(job.seed.note) + '</div>' : "")
    + (job.seed && job.seed.outcome
        ? '<div class="section-label">Outcome</div>' +
          '<div class="notebody" style="border-left-color:var(--gold)">' +
          esc(job.seed.outcome) + '</div>' : "")
    + (fails.length ? '<div class="section-label">Failure history</div>' +
         fails.map(f => `<article class="card"><div class="stripe warn"></div>` +
           `<div class="card-in"><div class="title">` +
           `${esc(humanize(f.group_id))}</div>` +
           `<div class="sub">${f.failures || 0} failure` +
           `${(f.failures || 0) === 1 ? "" : "s"}` +
           `${f.parked ? " — parked, waiting on you" : ""}</div>` +
           `</div></article>`).join("") : "");
}

function renderActive(){
  if(!ACTIVE_JOB) return renderJobList();
  return renderJobDetail(jobsModel().find(j => j.id === ACTIVE_JOB));
}

/* ---------- page: home ---------- */
/* A button that only says ACTIVE makes you open it to find out whether
   anything is. The COUNT is the point of the screen, so each button carries
   the one number that decides whether you need to go there at all. */
function activeSummary(){
  /* A STALE MACHINE IS NOT A WORKING ONE. `running` only asks whether the
     record carries a group and a phase, and a beacon that stopped mid-round
     keeps both forever -- so a box that died three hours ago still counts as
     working by that test. Measured 2026-09-14: the home screen read "1 machine
     working" while that machine's own card carried "last reported 3.5h ago --
     the beacon is stale, so this page cannot say what it is doing now". The
     button and the card were describing the same machine and disagreeing.

     Same rule as the ETA guard one screen down: past the staleness window this
     page does not get to say what a machine is doing, so it says how many have
     gone quiet instead. */
  const busy = FLEET.filter(f => running(f) && !stale(f)).length;
  const gone = FLEET.filter(stale).length;
  const started = SEEDS.filter(startedSeed).length;
  const decide = SEEDS.filter(needsDecision).length + PICKS.length;
  /* Agents run no round, so `busy` never counts them. Their cores are the other
     half of what the fleet is doing, and the count says how many. */
  const lenders = FLEET.filter(f => isAgent(f) && !stale(f) && f.agents.state === "RUN");
  const lent = lenders.reduce((s, f) => s + (Number(f.agents.running) || 0), 0);
  const bits = [];
  bits.push(busy
    ? `<span class="hcount">${busy}</span> machine${busy === 1 ? "" : "s"} working`
    : `<span class="hcount quiet">no machine</span> is running a round`);
  if(lenders.length) bits.push(`<span class="hcount">${lenders.length}</span> agent` +
    (lenders.length === 1 ? "" : "s") + ` lending ${lent} core${lent === 1 ? "" : "s"}`);
  if(gone) bits.push(`<span class="hcount warn">${gone}</span> not reporting`);
  /* A HALTED machine is waiting on a person, so it is counted as one. */
  const halted = FLEET.filter(f => f.halt && !stale(f)).length;
  if(halted) bits.push(`<span class="hcount warn">${halted}</span> halted — needs you`);
  if(started) bits.push(`<span class="hcount">${started}</span> seeded job` +
    (started === 1 ? "" : "s") + " open");
  if(decide) bits.push(`<span class="hcount warn">${decide}</span> waiting on you`);
  if(FAILURES.length) bits.push(
    `<span class="hcount warn">${FAILURES.length}</span> failing`);
  return bits.join(" · ");
}

function homeButton(page, icon, name, subline, stripe){
  return `<button type="button" class="hbtn" data-go="${esc(page)}">
      <div class="hstripe" style="${stripe ? `background:${stripe}` : ""}"></div>
      <div class="hrow">
        <span class="hic">${icon}</span>
        <span class="hb"><span class="hname">${esc(name)}</span>
          <span class="hsubline">${subline}</span></span>
        <span class="hcar">›</span>
      </div>
    </button>`;
}

/* ---------- what you have not looked at yet ---------- */
/* Trevor, 2026-09-17: *"When a new job is complete, I want the Job badge on the
   home screen. Below Results Under TO REVIEW."*

   THIS IS PER-DEVICE, AND IT HAS TO BE. "Have I read this" is a fact about the
   person holding the phone, not about the round -- the snapshot is shared by
   four machines and a flag in it would mean the desktop marking the phone's jobs
   as read. localStorage is the only place that answer belongs.

   ⚠️ THE FIRST RUN SEEDS ITSELF AND SHOWS NOTHING. Without that, opening the app
   for the first time would present every completed round in the epoch as new --
   fifteen badges saying "look at me" about work you did days ago, which teaches
   you to ignore the section permanently. So the first load records what already
   exists as seen, and only what lands AFTER that is ever flagged.

   AND IT ONLY SEEDS ONCE THERE IS SOMETHING TO SEED. Seeding from an empty
   ledger -- a snapshot that failed to load -- would bank "nothing has happened
   yet" and then flag the entire history the moment a real one arrived. */
const REVIEW_KEY = "gb.reviewed.v1";

/* A Set of round numbers, or null when the key has never been written, or
   undefined when storage cannot be reached at all. Three states, because they
   mean three different things and only one of them is "you have seen nothing". */
function reviewedSet(){
  try{
    const raw = localStorage.getItem(REVIEW_KEY);
    if(raw == null) return null;
    const a = JSON.parse(raw);
    return new Set((Array.isArray(a) ? a : []).map(String));
  }catch(e){
    /* Private windows, blocked site data, a quota error -- all land here. The
       section simply does not render; it never guesses. */
    return undefined;
  }
}

function saveReviewed(set){
  try{ localStorage.setItem(REVIEW_KEY, JSON.stringify([...set])); }
  catch(e){ /* nothing to do: the list is a convenience, not a record */ }
}

function markReviewed(no){
  const seen = reviewedSet();
  if(seen === undefined) return;
  const set = seen || new Set();
  set.add(String(no));
  saveReviewed(set);
}

/* The completed jobs this device has not opened, newest first. */
function toReview(){
  const done = LEDGER.filter(completed);
  if(!done.length) return [];
  const seen = reviewedSet();
  if(seen === undefined) return [];          // no storage: no claim either way
  if(seen === null){                          // first ever load: bank the past
    saveReviewed(new Set(done.map(r => String(r.round_no))));
    return [];
  }
  return done.filter(r => !seen.has(String(r.round_no)))
             .sort((a, b) => (b.round_no || 0) - (a.round_no || 0));
}

/* ONE BADGE. It carries both navigation attributes on purpose: [data-rjob]
