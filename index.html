<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without the viewport tag a phone renders this at desktop width and scales
     it down -- unreadable. Both of these were supplied by the artifact wrapper
     during design; served raw from Pages there is no wrapper. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1016">
<meta name="color-scheme" content="dark">
<!-- Add to Home Screen: launch without browser chrome. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GoldBot">
<meta name="robots" content="noindex, nofollow">
<title>GoldBot Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">

</head>
<body>
<style>
/* The app commits to one visual world -- a dark instrument panel -- rather than
   following the host theme, because that is what it will be as an APK. */
:root{
  --bg:#0A1016;
  --card:#141E26;
  --card-2:#1B2933;
  --line:#22313C;
  --text:#E8EFF3;
  --dim:#8CA0AC;
  --faint:#5F727E;
  --gold:#E0B457;
  --tonal:#1D3244;
  --warn:#E08B4A;
  --bad:#E0685A;
  --good:#5FBE95;
  --bull:#5FBE95;
  --bear:#E0685A;
  --range:#6FA8D4;
  /* 2026-09-16 -- the one hue this palette did not have, added for LOCKED.
     Everything else here is earned by a regime or a severity; LOCKED is neither,
     it is DONE, and it needed a colour that is not competing with either. */
  --done:#A98BE0;
}

*{box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}

/* ---------- header ---------- */
header{
  padding:16px 16px 12px;
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;
  position:sticky;top:0;background:var(--bg);z-index:5;
}
.h-row{display:flex;align-items:baseline;gap:9px;}
h1{
  margin:0;font-size:1.2rem;font-weight:700;letter-spacing:-.02em;
}
.h-sub{font-size:.76rem;color:var(--dim);}
.stamp{
  font-size:.68rem;color:var(--faint);
  font-family:"Roboto Mono",ui-monospace,monospace;
}
.baked{
  margin-top:7px;
  font-size:.7rem;color:var(--warn);
  background:rgba(224,139,74,.1);
  border:1px solid rgba(224,139,74,.25);
  border-radius:6px;padding:5px 8px;
  line-height:1.4;
}

/* ---------- pages ---------- */
main{flex:1;padding:14px 14px 90px;display:flex;flex-direction:column;gap:12px;}
.page[hidden]{display:none;}
.page{display:flex;flex-direction:column;gap:12px;}

.section-label{
  font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--faint);
  margin:4px 0 -4px 2px;
}

/* ---------- card ---------- */
.card{
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.stripe{height:3px;background:var(--gold);}
.stripe.bull{background:var(--bull);}
.stripe.bear{background:var(--bear);}
.stripe.range{background:var(--range);}
.stripe.warn{background:var(--warn);}
.card-in{padding:13px 14px 14px;display:flex;flex-direction:column;gap:11px;}

.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.sp{flex:1;}
.chip{
  font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;
  background:var(--tonal);color:#9CC6E8;white-space:nowrap;
}
.chip.gold{background:rgba(224,180,87,.15);color:var(--gold);}
.chip.warn{background:rgba(224,139,74,.16);color:var(--warn);}
.chip.bull{background:rgba(95,190,149,.14);color:var(--bull);}
.chip.bear{background:rgba(224,104,90,.14);color:var(--bear);}
.chip.range{background:rgba(111,168,212,.14);color:var(--range);}
.when{font-size:.69rem;color:var(--faint);font-family:"Roboto Mono",ui-monospace,monospace;}

.title{font-size:1rem;font-weight:700;letter-spacing:-.012em;line-height:1.25;
  /* A seed label is an identifier, not prose -- EMA_AB_TICKS_BEAR_EMA_PERIODS_MID
     has no spaces to break at and ran off the card. */
  overflow-wrap:anywhere;}
.sub{font-size:.83rem;color:var(--dim);margin-top:1px;}

.meta{
  /* 11px, not 13px. Mode/Rate/Jobs done/ETA needs 306px at 375px wide and the
     card gives it 302 -- four pixels short, so the ETA wrapped alone onto a
     second line and the row grew a ragged half-empty tier. Three gaps at 2px
     less buys 6px and lands it. The longer ETA forms ("Wed 13:38") still wrap,
     which is correct: that is a genuinely wider row, not a near miss. */
  display:flex;gap:11px;flex-wrap:wrap;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:9px 0;font-size:.775rem;
  font-variant-numeric:tabular-nums;
}
.meta .k{color:var(--faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;}
.meta .v{color:var(--text);font-weight:600;}
.meta .v.gold{color:var(--gold);}
.meta div{display:flex;flex-direction:column;gap:1px;}

/* progress */
.prog{display:flex;flex-direction:column;gap:6px;}
.prog-top{display:flex;justify-content:space-between;font-size:.76rem;}
.prog-top .pct{font-weight:700;font-variant-numeric:tabular-nums;}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:3px;background:var(--gold);}
.bar i.bull{background:var(--bull);}
.bar i.bear{background:var(--bear);}
.bar i.range{background:var(--range);}

/* variable list */
.vars{display:flex;flex-direction:column;gap:3px;}
.vhead{
  font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-weight:700;margin-bottom:3px;
}
.v{
  font-family:"Roboto Mono",ui-monospace,monospace;
  font-size:.755rem;color:var(--text);
  word-break:break-all;line-height:1.45;
  display:flex;align-items:center;gap:7px;
}
.sv{display:flex;flex-direction:column;gap:1px;}
.sv .spec{
  color:var(--dim);font-size:.7rem;letter-spacing:.01em;
  word-break:normal;
}
.v::before{
  content:"";width:3px;height:3px;border-radius:50%;
  background:var(--faint);flex:none;
}
.v.rider{color:var(--gold);}
.v.rider::before{background:var(--gold);}

.warnrow{
  font-size:.78rem;color:var(--warn);line-height:1.42;font-weight:500;
  display:flex;gap:7px;align-items:flex-start;
}
.noterow{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:.75rem;color:var(--dim);cursor:pointer;
  border-top:1px solid var(--line);padding-top:9px;
}
.noterow .car{color:var(--faint);font-size:.7rem;}
.notebody{
  font-size:.755rem;color:var(--dim);line-height:1.5;
  border-left:2px solid var(--line);padding-left:10px;
}
.notebody[hidden]{display:none;}

.acts{display:flex;gap:7px;flex-wrap:wrap;}
.acts button{
  font-family:inherit;font-size:.775rem;font-weight:600;
  border-radius:18px;padding:8px 14px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);
}
.acts button.primary{background:var(--gold);color:#121A22;border-color:transparent;}
.acts button:active{transform:translateY(1px);}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;gap:9px;}
.hbtn{
  background:var(--card);
  border:0;border-radius:14px;
  padding:0;cursor:pointer;width:100%;
  font-family:inherit;color:var(--text);
  overflow:hidden;display:flex;flex-direction:column;
  text-align:left;
}
.hbtn .hstripe{height:3px;background:var(--gold);}
.hbtn .hrow{display:flex;align-items:center;gap:13px;padding:15px 15px 16px;}
.hic{font-size:1.45rem;line-height:1;width:30px;text-align:center;flex:none;}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.hname{
  font-size:1rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  /* Same reason .title wraps: a seed label is an identifier with no spaces. */
  overflow-wrap:anywhere;min-width:0;
}
.hsubline{font-size:.79rem;color:var(--dim);line-height:1.35;}
.hcar{color:var(--faint);font-size:1.1rem;flex:none;}
.hbtn:active{transform:translateY(1px);}
.hbtn:focus-visible{outline:2px solid var(--gold);outline-offset:-3px;}
/* The count that decides whether you need to open it at all. */
.hcount{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;}
.hcount.quiet{color:var(--faint);font-weight:600;}
.hcount.warn{color:var(--warn);}

/* ---------- job selector ---------- */
.jrow .hstripe{background:var(--faint);}
.jrow .hstripe.bull{background:var(--bull);}
.jrow .hstripe.bear{background:var(--bear);}
.jrow .hstripe.range{background:var(--range);}
.jrow .hstripe.warn{background:var(--warn);}
.jtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.backbtn{
  background:transparent;border:0;cursor:pointer;
  font-family:inherit;font-size:.82rem;font-weight:600;
  color:var(--dim);padding:2px 0;text-align:left;align-self:flex-start;
}
.backbtn:active{transform:translateY(1px);}

/* ---------- the job's rounds ---------- */
.tl{display:flex;flex-direction:column;gap:0;}
.tlr{
  display:flex;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line);
}
.tlr:last-child{border-bottom:0;}
.tlm{
  width:16px;flex:none;text-align:center;line-height:1.5;
  font-size:.8rem;color:var(--faint);
}
.tlr.passed .tlm{color:var(--good);}
/* Ran, but on inference rather than on a file -- dimmer than a tick backed by
   a report you can open. */
.tlr.inferred .tlm{color:var(--faint);}
.tlr.running .tlm{color:var(--gold);}
.tlb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.tlh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.tlk{
  font-size:.82rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
}
.tlr.queued .tlk,.tlr.skipped .tlk{color:var(--faint);font-weight:600;}
.tlw{
  font-size:.68rem;color:var(--faint);
  font-family:"Roboto Mono",ui-monospace,monospace;
}
.tlnote{font-size:.73rem;color:var(--faint);line-height:1.4;}
.rbtns{display:flex;gap:6px;flex-wrap:wrap;}
.rbtn{
  font-family:inherit;font-size:.71rem;font-weight:600;
  border-radius:14px;padding:4px 10px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);
  text-decoration:none;display:inline-block;
}
.rbtn:active{transform:translateY(1px);}
/* A button with nowhere to go says so rather than looking broken when tapped. */
.rbtn.pending{color:var(--faint);}
.rfile{
  font-family:"Roboto Mono",ui-monospace,monospace;
  font-size:.67rem;color:var(--dim);word-break:break-all;line-height:1.45;
}
.rfile[hidden]{display:none;}

/* ---------- the task card ---------- */
/* ONE ROUND, FULLY DESCRIBED. Trevor, 2026-09-16: *"build a Task Card ...
   clickable from any job card ... as much information about that particular
   task."*

   INLINE, NOT A THIRD SCREEN. The app is already two levels deep by the time a
   job card is open, and a third back button to get out of a detail panel is the
   navigation nobody wants on a phone. Expanding in place also keeps the row it
   belongs to on screen, which is the thing that says WHICH task this is. */
.task{
  margin-top:8px;padding:10px 11px;border-radius:9px;
  background:var(--card-2);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;
}
.task[hidden]{display:none;}
.tsec{display:flex;flex-direction:column;gap:6px;}
.tlab{
  font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);
}
.tnote{font-size:.75rem;color:var(--dim);line-height:1.45;}
.tby{font-size:.67rem;color:var(--faint);font-family:"Roboto Mono",ui-monospace,monospace;}

/* A variable and where it is up to. The state carries the colour because it is
   the thing worth scanning down a list for -- a column of names is a column of
   names whatever colour it is. */
.tvar{
  display:flex;align-items:baseline;gap:8px;
  font-size:.73rem;font-family:"Roboto Mono",ui-monospace,monospace;
}
.tvn{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--text);}
/* TWO BOXES, SIDE BY SIDE. Trevor, 2026-09-16: *"I was hoping to get
   Default, Pinned, Floating, Center. And then next to it i want the Resolution
   in a similar box next to it."* Same shell for both so they read as a pair --
   where the variable is up to, and how finely it is being looked at. */
.tst{
  font-size:.58rem;font-weight:700;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;white-space:nowrap;
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
}
/* THE SCHEME IS THE LIFECYCLE, not five arbitrary colours. A variable travels
   left to right, and the palette travels with it:

     DEFAULT   slate    nothing has happened to this one yet
     FLOATING  blue     active and moving
     CENTER    green    the centre keeps winning -- converging
     PINNED    amber    at the wall, and asking for something
     LOCKED    violet   done

   COOL TO WARM IS THE ATTENTION GRADIENT. Slate and blue are states you scroll
   past; amber is the one that wants you. That ordering is the whole point --
   PINNED has to win a glance down a column of twenty rows, and it only can if
   everything quieter than it actually is quieter.

   VIOLET FOR LOCKED because done is not a severity and not a regime. It used to
   share grey with DEFAULT, which put the two OPPOSITE ends of the lifecycle --
   never touched, and finished forever -- in the same colour. */
.tst.default{background:rgba(140,160,172,.12);color:#8CA0AC;}
.tst.floating{background:rgba(111,168,212,.16);color:#7FB6DE;}
.tst.center{background:rgba(95,190,149,.16);color:var(--good);}
.tst.pinned{background:rgba(224,139,74,.20);color:#F0A05E;}
.tst.locked{background:rgba(169,139,224,.16);color:var(--done);}
/* RESOLUTION IS OUTLINED, NOT FILLED -- deliberately a different KIND of chip
   from the state beside it. Two filled chips in a row would read as two facts
   of equal weight, and they are not: the state is where the variable is, the
   resolution only says how finely the next sweep will look at it.

   It still carries a signal, one notch down: FULL is the normal case and stays
   neutral, COARSE is brighter because a COARSE variable is being looked at
   roughly -- "PINNED at COARSE" may only need a finer pass, "PINNED at FULL" is
   genuinely at the wall. Fixed width so a column of them lines up. */
.tvr{
  font-size:.58rem;font-weight:700;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;white-space:nowrap;
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  background:transparent;color:var(--faint);
  border:1px solid var(--line);
  min-width:58px;text-align:center;
}
.tvr.coarse{color:#C8B78A;border-color:rgba(224,180,87,.30);}
.tvr.full{color:var(--dim);}

/* The trade-band verdict. IN BAND is the quiet one; both misses are loud,
   because a round outside the band is a round whose result the EA discounted. */
.tband{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-size:.76rem;font-variant-numeric:tabular-nums;
}
.tbv{font-weight:700;}
.tbv.inband{color:var(--good);}
.tbv.under{color:var(--bad);}
.tbv.over{color:var(--warn);}
.tbv.unknown{color:var(--faint);font-weight:600;}
.tbm{color:var(--dim);font-family:"Roboto Mono",ui-monospace,monospace;font-size:.68rem;}

/* A graph is the one output you want to SEE rather than tap, so it is drawn
   rather than turned into a button. Bounded height: a curve is wider than it is
   tall and an unbounded one pushes everything below it off the screen. */
.tgraph{
  width:100%;border-radius:7px;border:1px solid var(--line);
  background:var(--bg);display:block;
}
.tgcap{font-size:.65rem;color:var(--faint);margin-top:3px;}
/* The state key. Indented under the list it explains, and quiet -- it is a
   reminder for the reader who has forgotten the vocabulary, not a finding. */
.tkey{display:flex;gap:8px;align-items:baseline;margin-top:6px;}
.tkt{font-size:.68rem;color:var(--faint);line-height:1.45;flex:1;min-width:0;}

/* THE ROW IS THE BUTTON. It was a div; making the whole thing tappable is what
   "clickable from any job card" means, and a small chevron on its own would be
   a target nobody hits on a phone. */
.tlr.tappable{cursor:pointer;}
.tlr.tappable .tlh:after{
  content:"\203A";color:var(--faint);font-size:.9rem;line-height:1;
  margin-left:auto;padding-left:6px;transition:transform .12s;
}
.tlr.tappable.open .tlh:after{content:"\2039";}

/* ---------- picking a pass, in the app ---------- */
/* MOCKUP -- PREVIEW ONLY, NOT IN THE LIVE PAGE. Trevor, 2026-09-16: *"I want to
   apply the pass number on the app now rather than reply with telegram. Lets
   see what that would look like."* This is the dev sandbox doing its job: the
   format is tried here before anything is ported.

   ⚠️ THE APP CANNOT APPLY ANYTHING TODAY. It is a static page on Pages reading
   a published snapshot -- there is no write path back to the machines at all.
   The reply-to-Telegram route exists precisely because the bot is the only
   inbound channel that reaches them. So this is a picture of a screen, and the
   channel underneath it is a separate build. */
.pick{
  border-top:1px solid var(--line);
  padding-top:11px;display:flex;flex-direction:column;gap:9px;
}
.pickhd{
  font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold);
}
.picksub{font-size:.73rem;color:var(--dim);line-height:1.45;}
/* NOTHING ON CADENCE is a different claim, not a footnote -- see
   notify.format_recommendation, which refuses to let that case print under the
   heading it would otherwise inherit. Same rule, same words, one surface. */
.pickwarn{
  font-size:.72rem;color:var(--warn);line-height:1.45;
  background:rgba(224,139,74,.09);border-radius:7px;padding:7px 9px;
}
.pickrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  font-family:inherit;color:var(--text);cursor:pointer;
  background:var(--card-2);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;
}
.pickrow.on{border-color:var(--gold);background:rgba(224,180,87,.10);}
.pickrow .rk{
  font-size:.62rem;font-weight:700;color:var(--faint);
  width:14px;flex:none;font-variant-numeric:tabular-nums;
}
.pickrow.on .rk{color:var(--gold);}
.pickp{font-size:.82rem;font-weight:700;white-space:nowrap;}
.pickm{
  font-size:.67rem;color:var(--dim);font-family:"Roboto Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;line-height:1.4;
}
.pickme{flex:1;min-width:0;}
.pickpf{font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums;}
/* THE FREE FIELD IS NOT A FALLBACK. Trevor picks from the workbook as often as
   from the ranking, and a form that only offers three passes out of 8,192 is a
   form that gets abandoned for the one that takes any number. */
.pickother{display:flex;align-items:center;gap:8px;}
.pickother label{font-size:.72rem;color:var(--dim);white-space:nowrap;}
.pickin{
  font-family:"Roboto Mono",ui-monospace,monospace;font-size:.82rem;
  background:var(--card-2);color:var(--text);
  border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;width:104px;
  font-variant-numeric:tabular-nums;
}
.pickin:focus{outline:none;border-color:var(--gold);}
.applyb{
  font-family:inherit;font-size:.8rem;font-weight:700;letter-spacing:.01em;
  border:0;border-radius:9px;padding:11px 12px;width:100%;
  background:var(--gold);color:#1A1204;cursor:pointer;
}
.applyb:disabled{background:var(--card-2);color:var(--faint);cursor:default;}
.applyb:active:not(:disabled){transform:translateY(1px);}
.pickfoot{font-size:.68rem;color:var(--faint);line-height:1.45;}
.pickdone{
  font-size:.75rem;color:var(--good);line-height:1.45;
  background:rgba(95,190,149,.10);border-radius:7px;padding:9px 10px;
}

/* ---------- results rows ---------- */
.row{
  background:var(--card);
  border-radius:11px;
  padding:11px 12px;
  display:flex;flex-direction:column;gap:7px;
}
.row-top{display:flex;align-items:center;gap:7px;}
.row-grp{
  font-size:.85rem;font-weight:600;letter-spacing:-.005em;
  flex:1;min-width:0;line-height:1.3;
}
/* THE DATE SITS UNDER THE ROW, NOT IN IT. Trevor, 2026-09-16: *"the date can go
   where the red horizontal line. It'll allow longer group names on one line."*
   It was the last thing on the title row, so a long group name wrapped to a
   second line to make room for a timestamp nobody scans first. Down here it
   costs no width at all, and it joins the mono meta line that already carries
   the round number and the machine -- which is where a reader looking for
   "when" was going to end up anyway. */
.row-foot .row-when{margin-left:auto;}
/* THE BUCKET ID WEARS THE CHIP SCHEMA. Trevor, 2026-09-16: its font and
   schema did not match the three chips it sits between, and it was *"too
   close to the background."* It sat in the same row as three chips as a bare
   grey number in the body font -- a different size, a different weight, no
   tracking, no plate -- so it read as something that had leaked into the row
   rather than as one of its parts. Same metrics as .chip now; tabular on top,
   so a column of ids still lines up down the results list.

   THE COLOUR IS THE ONE THING IT DOES NOT SHARE with .chip, and it is not
   decoration -- see bktEl() for what the gradient means.

   One class, used by the results row and the machine card, so the two cannot
   drift apart. inline-block because in the results row it sits inside wrapping
   prose, where a padded inline box would otherwise bleed through the line. */
/* A results row is a BUTTON now, not a card: the whole row opens the job. */
.row.jrowbtn{
  width:100%;text-align:left;font-family:inherit;color:var(--text);
  border:0;cursor:pointer;
}
.row.jrowbtn:active{transform:translateY(1px);}
.row-car{color:var(--faint);font-size:.95rem;line-height:1;padding-left:4px;}
/* THE CONTROL ROW. The same chips as a results row, doing the other job: these
   say what the list is showing, and tapping one moves it on. Kept beside the
   count so the state of the list and the size of it are read together. */
.rctl{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:0 2px 9px;
}
.rctl .rlab{
  font-size:.62rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-right:2px;
}
/* A CHIP THAT DOES SOMETHING looks like it does: the inert ones on a row are
   flat, these carry a hairline. Without it the only difference between a label
   and a control is that one of them moves when you tap it. */
.cchip{
  font-family:inherit;border:1px solid var(--line);cursor:pointer;
  font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;white-space:nowrap;
  background:var(--card-2);color:var(--dim);
}
.cchip:active{transform:translateY(1px);}
/* ON means the list is narrowed -- the one state you must not have to hunt for
   when rows are missing. */
.cchip.on{background:rgba(224,180,87,.15);color:var(--gold);border-color:rgba(224,180,87,.35);}
.cchip .car{opacity:.55;font-weight:400;}
/* A row's own chips are controls too. They keep the regime colours -- the chip
   IS the regime -- and only gain the pointer. */
.row .chip[data-rfilter],.row .bkt[data-rfilter]{cursor:pointer;}
/* MATCHED BY ORDER, NOT BY KEY. Rows written before round_id was recorded are
   placed positionally -- a sound guess, and still a guess. It is said on the
   job it qualifies rather than in a footnote, because the reader is about to
   open these exact reports. */
.inexact{
  font-size:.7rem;color:var(--warn);line-height:1.45;
  background:rgba(224,139,74,.09);border-radius:7px;padding:8px 10px;
  margin-bottom:10px;
}
.bkt{
  display:inline-block;vertical-align:baseline;
  font-size:.65rem;font-weight:700;letter-spacing:.05em;line-height:1.15;
  padding:3px 7px;border-radius:5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
  background:var(--tonal);
}
/* THE DIGITS ARE FILLED WITH THE GRADIENT, not coloured flat, which needs a
   second box: the plate above carries its own background and background-clip
   would eat it. <i> for brevity in a string that is built per row; the font
   style it would normally imply is turned back off.

   THE FALLBACK IS A REAL COLOUR, not transparent text. Everything that renders
   this page supports background-clip:text, but "unsupported" here would mean an
   INVISIBLE id rather than a plainer one, and that is not a failure worth
   risking for a gradient. bktEl() sets the flat colour inline; the @supports
   only takes it away where the clip will actually paint. */
.bkt i{font-style:normal;}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .bkt i{-webkit-background-clip:text;background-clip:text;
         color:transparent;-webkit-text-fill-color:transparent;}
}
.row-when{font-size:.67rem;color:var(--faint);font-family:"Roboto Mono",ui-monospace,monospace;white-space:nowrap;}
.row-pf{

}
.row-pf .lab{color:var(--faint);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;}
.pf{display:flex;align-items:baseline;gap:5px;}
.pf b{font-weight:600;}
.delta{font-weight:700;font-size:.73rem;}
.delta.up{color:var(--good);}
.delta.dn{color:var(--bad);}
.delta.flat{color:var(--faint);}
/* wrap, because the date moved in here and a narrow phone with `heavy` set
   would otherwise push it off the edge rather than onto a second line. */
.row-foot{
  display:flex;gap:12px;font-size:.68rem;color:var(--faint);
  font-family:"Roboto Mono",ui-monospace,monospace;
  flex-wrap:wrap;align-items:baseline;
}

.empty{

  padding:40px 20px;line-height:1.6;
}

/* ---------- tab bar ---------- */

<script>
const EPOCH = "V3.0.0";

// NO DATA IS BAKED INTO THIS REPO. The repo is public (GitHub Pages requires
// that on a free account), and anything committed here is in the git history
// permanently -- deleting a file later does not remove it. Performance figures
// and group/variable names are "how it is built", which is the half Trevor
// wants private: people should copy the ACCOUNT, not rebuild the system.
let FLEET = [], LEDGER = [], SEEDS = [], FAILURES = [], BUCKETS = [], TIMELINES = [];
/* The four words for where a variable is up to, explained -- published once at
   the top of the snapshot rather than repeated on every variable. {} until a
   snapshot carrying it arrives, which is what an older publisher sends. */
let STATE_TEXT = {};
/* Where the report files can be fetched, when something is serving them. null
   is the normal resting state -- the machine that ran the round has to be on
   for its files to exist anywhere at all. */
/* THE NAME IS DELIBERATE, AND SHORTER THAN IT WAS. It used to be prefixed with
   one of job_control's PHASE constants, which puts it on publish.py's derived
   denylist -- and that scan is a SUBSTRING match, on purpose, so a group id
   buried inside a longer identifier cannot slip past it. The old name therefore
   refused every publish that touched a line mentioning it, over a collision
   that was never a leak.

   RENAMING THE IDENTIFIER IS THE FIX. Loosening the scan to special-case this
   would trade a real protection for a cosmetic convenience, and the next thing
   it failed to catch would be an actual one. The snapshot key this reads
   (`reports_base`, lower case) is untouched -- the wire format did not move. */
let FILE_BASE = null;

const REGIME_CLASS = { BULL: "bull", BEAR: "bear", RANGING: "range" };
const ACRONYMS = new Set(["ATR","EMA","MA","BB","SL","TP","RSI","ADX","MACD","OHLC","PF"]);
const TIMEFRAMES = new Set(["M1","M5","M15","M30","H1","H4","D1","W1","MN1"]);

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* Mirrors message_doc.humanize_group -- one implementation per renderer is the
   cost of the split; the canonical id always travels alongside so a tap can
   still look the group up. */
function humanize(gid){
  if(!gid) return "";
  let n = String(gid).replace(/^(BULL|BEAR|RANGING|GLOBALS)_/, "");
  return n.split("_").filter(Boolean).map(t => {
    const u = t.toUpperCase();
    if(ACRONYMS.has(u) || TIMEFRAMES.has(u)) return u;
    if(/^G\d+$/.test(u)) return u;
    return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  }).join(" ");
}

const REGIME_SUFFIXES = ["_Bull", "_Bear", "_Range", "_Ranging"];
function stripRegime(n){
  for(const suf of REGIME_SUFFIXES){
    if(String(n).endsWith(suf)) return String(n).slice(0, -suf.length);
  }
  return String(n);
}

/* Underscores are how the EA writes an identifier; they are not how a person
   reads one. Display only -- the canonical name with its underscores still
   travels in the snapshot, so a tap-through can still look it up. */
const spaceOut = n => String(n).replace(/_/g, " ");

/* A step resolution and the bound it steps between do not share a sensible
   width -- toFixed on either lies about the other. Trim instead of picking. */
const num = x => (typeof x !== "number" || !isFinite(x)) ? ""
  : String(Number(x.toFixed(6)));

/* A SWEPT variable, unlike a round's, carries its own grid -- a sweep has no
   group_id, so the catalog cannot answer for it and the spec travels on the
   seed record itself. Trevor asked for three things here and they are all
   derived from the file the tester is actually running: the NAMES, the STEP
   COUNT, and the STEP RESOLUTION. */
/* ONE SPELLING FOR AN OPERATION, wherever it appears -- machine chip, progress
   bar, seed chip. The trailing digit is split off GENERICALLY (FOO2 -> "FOO 2")
   rather than from a lookup table: the vocabulary lives upstream, and a copy
   here would be the thing that drifts. It already did once on another surface,
   where a numbered variant reached the screen raw and stayed wrong for days --
   and this page was about to repeat it, rendering the raw value into a chip.

   The paused states share a prefix upstream rather than being spelled out one
   by one, so the prefix is unfolded here rather than matched. */
const PAUSED_PREFIX = "PAUSED_AFTER_";
function phaseText(p){
  let t = String(p || "").toUpperCase();
  if(!t) return "";
  const paused = t.startsWith(PAUSED_PREFIX);
  if(paused) t = t.slice(PAUSED_PREFIX.length);
  t = t.replace(/^([A-Z]+?)(\d+)$/, "$1 $2");
  return paused ? "PAUSED · " + t : t;
}

/* The third chip on a seed answers "what KIND of round is this", in the same
   vocabulary the machine cards use for `phase`, so a seed and a rotation round
   read the same way on one screen. `round_type` is the record's own answer and
   wins outright; `kind` is the coarse fallback and cannot tell a second pass
   from a first. */
const roundType = sd => phaseText(sd.round_type || sd.kind || "seed");

function sweptList(vars, cells){
  if(!Array.isArray(vars) || !vars.length) return "";
  const n = vars.length;
  return `<div class="vars">
      <div class="vhead">${n} Variable${n === 1 ? "" : "s"}` +
        (cells ? ` · ${cells}-cell grid` : "") + `</div>
      ${vars.map(v => {
        const bits = [];
        if(v.min != null && v.max != null) bits.push(num(v.min) + " → " + num(v.max));
        if(v.points != null) bits.push(v.points + " step" + (v.points === 1 ? "" : "s"));
        if(v.step != null) bits.push("Δ " + num(v.step));
        return `<div class="v"><span class="sv">` +
          `<span>${esc(spaceOut(stripRegime(v.name || "")))}</span>` +
          (bits.length ? `<span class="spec">${esc(bits.join(" · "))}</span>` : "") +
          `</span></div>`;
      }).join("")}
    </div>`;
}

/* THE LIVE TILE'S VARIABLES, with where each one is up to. Trevor,
   2026-09-16: *"Beside the 3 Variables that are listed there. Lets put their
   resolution and status chips on the right."*

   `vars` is a list of NAMES on the beacon. The states come from the running
   job's own task detail, which the publisher has already built against the same
   bucket -- looked up by name rather than re-derived, so the tile and the task
   card cannot disagree about a variable.

   A name with no state still renders: an older publisher sends no detail at
   all, and a tile that dropped its variable list in that case would look broken
   rather than plain. */
function varList(vars, states){
  if(!Array.isArray(vars) || !vars.length) return "";
  const by = {};
  (states || []).forEach(s => { if(s && s.name) by[s.name] = s; });
  const n = vars.length;
  return `<div class="vars">
      <div class="vhead">${n} Variable${n === 1 ? "" : "s"}</div>
      ${vars.map(v => {
        const st = by[v];
        return `<div class="tvar">
          <span class="tvn">${esc(spaceOut(stripRegime(v)))}</span>` +
          (st && st.state
            ? `<span class="tst ${stateClass(st.state)}">${esc(st.state)}</span>` +
              `<span class="tvr ${stateClass(st.resolution)}">${
                 st.resolution ? esc(st.resolution) : "—"}</span>`
            : "") + `</div>`;
      }).join("")}
    </div>`;
}

/* The states for the job on ONE machine, from the task that machine is ON.
   Null when the publisher sent no detail.

   MATCHED BY PHASE FIRST. A job's tasks do not sweep the same variables -- a
   second pass takes only the pinned ones -- so "whichever round is running"
   would show a machine midway through its second pass the FIRST pass's list.
   The beacon already says which task it is on; that is the one to read. */
function liveStates(f){
  const tl = timelineFor(f.regime, f.bucket_id, f.group_id);
  if(!tl) return null;
  const rounds = tl.rounds || [];
  const mine = (f.phase && rounds.find(r => r.kind === f.phase)) ||
               rounds.find(r => r.status === "running") || rounds[0];
  return mine && mine.detail ? mine.detail.variables : null;
}

const titleCase = s => String(s).charAt(0) + String(s).slice(1).toLowerCase();

/* A LENGTH OF TIME, not a moment. `ago` is this plus the word, and they are
   one function so a heartbeat and a phase duration can never round differently
   on the same screen. */
function dur(sec){
  if(sec == null) return "";
  if(sec < 90) return Math.round(sec) + "s";
  if(sec < 5400) return Math.round(sec/60) + "m";
  return (sec/3600).toFixed(1) + "h";
}

function ago(sec){
  if(sec == null) return "";
  return dur(sec) + " ago";
}

/* HOW LONG THIS MACHINE HAS BEEN IN THIS PHASE. Trevor, 2026-09-16: *"I'd like
   to see the time portion that it is in the SELECTING phase -- the moment the
   last task finished (or upon tray start) and the start of the next."*

   `phase_since` is job_control's own `updated` stamp, written as the phase is
   written, so it IS that moment. Measured against the BEACON, not against now:
   the snapshot was built when the machine last reported, and adding the time
   since would quietly inflate every duration by the beacon's age -- the same
   correction the ETA makes, for the same reason. */
function phaseFor(f){
  if(!f || !f.phase_since) return null;
  const began = new Date(f.phase_since);
  if(isNaN(began.getTime())) return null;
  const beaconMs = Date.now() - (f.age_seconds || 0) * 1000;
  const secs = (beaconMs - began.getTime()) / 1000;
  return secs >= 0 ? dur(secs) : null;
}

/* LOCAL time, deliberately. Everything upstream is UTC -- `recorded_at` carries
   +00:00 and the beacons are unix seconds -- and rendering that raw meant a
   sweep started at 15:00 displayed as 22:00. The stored values stay UTC; only
   the display converts, so the phone and the desktop each read in their own
   zone without the records ever changing.

   Accepts an ISO string OR unix SECONDS, because seeds carry the latter. */
function fmtWhen(v){
  const d = (typeof v === "number") ? new Date(v * 1000) : new Date(v);
  if(isNaN(d.getTime())) return "";
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function deltaEl(before, after){
  if(before == null || after == null) return '<span class="delta flat">—</span>';
  const d = after - before;
  if(Math.abs(d) < 0.005) return '<span class="delta flat">±0.00</span>';
  const cls = d > 0 ? "up" : "dn";
  return `<span class="delta ${cls}">${d > 0 ? "+" : "−"}${Math.abs(d).toFixed(2)}</span>`;
}

/* ---------- page: rounds ---------- */
/* The publisher emits the RECORD shape, faithful to the beacons. Adapting it
   for display is the renderer's job -- that split is the whole reason the app
   can be rebuilt without touching the pipeline. */
const RC = { BULL: "bull", BEAR: "bear", RANGING: "range" };

/* ---------- the bucket id, coloured by where it sits on slope ---------- */
/* A BUCKET ID IS A POSITION, NOT A NAME. Every regime's root is 1600 covering
   the whole slope range, and a split makes two children at parent -/+ gap with
   gap halving each generation (decision_engine.compute_child_bucket_ids). So
   the number itself says where on the slope axis the bucket sits: BELOW 1600 is
   the bearish end of that regime's range, ABOVE it the bullish end, and 1600
   itself is dead centre. Nothing else on the page carries that, and it was
   being spent on a grey number nobody could read.

   HOW FAR THE SCALE RUNS -- i.e. what counts as "max bear". A split needs 100
   trades in the parent (decision_engine.SPLIT_TRADE_VOLUME_MIN), so the
   SMALLEST bucket that can ever exist holds about 50 over the 2yr window, and a
   regime can hold at most (its trades / 50) leaves. Against the band ceilings
   the EA compiles -- hi x target x years -- that is:

       RANGING  1.30 x 500.00 x 2 = 1290 trades  ->  25 leaves
       BULL     1.50 x 166.21 x 2 =  495 trades  ->   9 leaves
       BEAR     1.50 x 108.74 x 2 =  324 trades  ->   6 leaves

   ~40 buckets over the fleet, and the DEEPEST single regime is RANGING at 25,
   which is generation 5 (32 leaves). Generation 5's gap is 1600/2**5 = 50, so
   the outermost ids the campaign can reach are 50 and 3150 -- a reach of 1550
   either side of the root. That is what the gradient is normalised over.

   DEEPER SPLITS CLAMP RATHER THAN RESCALE. If a regime ever does go past
   generation 5 the extra ids pin at full red or full blue, because the
   alternative -- widening the scale -- would silently restain every bucket that
   had not moved, and the colour is supposed to mean the same thing on Tuesday
   as it did on Monday.

   THE COLOURS. Green in the middle, because centre is where an unsplit bucket
   lives and green is this page's "nothing wrong" everywhere else. Red toward
   max bear, matching the BEAR chip beside it. BLUE toward max bull -- NOT the
   app's --bull green, which is the middle of this axis and would make the two
   ends of the scale the same colour.

   WHERE THE ENDS LAND IS TREVOR'S CALL, NOT THE ARITHMETIC'S. First cut spread
   the ramp evenly over the reach, which put full blue out at 3150 and left
   2450 -- a bucket that actually exists -- reading cyan. Trevor, 2026-09-16:
   *"the 2450 bucket would be almost fully blue while the 150 bucket was almost
   Fully Red."* So the stops are placed to hit those two, per regime: **150 is
   red, 2450 is blue, 1600 is green**, and the slack past each of them is a
   short run to a slightly deeper shade rather than the bulk of the ramp.

   THE REACH IS STILL 1550. Only the DISTRIBUTION inside it moved; the
   generation-5 derivation below is untouched.

   WHY STOPS AND NOT ONE MIX. Mixing straight from green to red goes THROUGH
   MUD: the two are near-opposites, so the halfway point comes out a 17%
   saturation tan that is exactly the unreadable grey this change was asked to
   get rid of. Fixed stops keep every step of the ramp saturated, because no
   single mix ever has to cross the whole distance.

   THE BEAR HALF PASSES THROUGH AMBER and there is no way around it -- red and
   green are far enough apart on the wheel that the only routes between them are
   warm (yellow, orange) or through purple, and purple is where the BULL half
   already goes. It is close to --warn, which is a real cost, but --warn never
   appears as a number in this slot, and the alternative is the mud. */
const BKT_ROOT = 1600;
const BKT_REACH = 1550;              // 1600 - 1600/2**5: the generation-5 edge
const BKT_STOPS = [                  // [position on the axis, colour]
  [-1.00, [232,  86,  72]],          // id   50 -- deepest red there is
  [-0.85, [224, 104,  90]],          // id  150 -- "almost fully red", --bear
  [-0.55, [226, 140,  72]],          // id  750 -- orange
  [-0.28, [222, 196,  86]],          // id 1166 -- gold; see THE BEAR HALF above
  [ 0.00, [ 95, 190, 149]],          // id 1600 -- root, --bull/--good exactly
  [ 0.25, [ 95, 198, 200]],          // id 1987 -- cyan
  [ 0.55, [104, 158, 234]],          // id 2450 -- "almost fully blue"
  [ 1.00, [122, 132, 244]],          // id 3150 -- deepest indigo there is
];

const bktMix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const bktRgb = (c, a) => a == null ? `rgb(${c[0]},${c[1]},${c[2]})`
                                   : `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* Which pair of stops `t` falls between, mixed by how far along it is. */
function bktTone(t){
  for(let i = 1; i < BKT_STOPS.length; i++){
    const [hi, cHi] = BKT_STOPS[i];
    if(t <= hi){
      const [lo, cLo] = BKT_STOPS[i - 1];
      return bktMix(cLo, cHi, (t - lo) / (hi - lo));
    }
  }
  return BKT_STOPS[BKT_STOPS.length - 1][1];
}

/* The whole element, so the two call sites cannot disagree about it. A
   non-numeric id renders plain rather than being dropped: an id this cannot
   place is still an id worth showing. */
function bktEl(id, trail, filterId){
  if(id == null) return "";
  const tail = trail ? " " : "";
  /* On a results row the bucket is a control as well as a label -- see the
     results chips. Everywhere else it is just the id. */
  const fil = filterId != null ? ` data-rfilter="bucket:${esc(filterId)}"` : "";
  const n = Number(id);
  if(!isFinite(n)) return `<span class="bkt"${fil}>${esc(id)}</span>` + tail;
  const t = Math.max(-1, Math.min(1, (n - BKT_ROOT) / BKT_REACH));
  const tone = bktTone(t);
  const lift = bktMix(tone, [255, 255, 255], .34);
  return `<span class="bkt"${fil} style="background:${bktRgb(tone, .15)}">` +
         `<i style="color:${bktRgb(lift)};background-image:linear-gradient(` +
         `120deg,${bktRgb(lift)},${bktRgb(tone)})">${esc(id)}</i></span>` + tail;
}

const stale = f => f.age_seconds != null && f.age_seconds > 900;
const running = f => f.group_id && f.phase;
/* A PHASE WITH NO GROUP IS NOT IDLE. SELECTING writes no detail upstream, so
   regime, bucket, group and mode all arrive null and the phase is the only
   true thing on the record. `running` is false for it, which titled the card
   "Idle -- no round" while it wore a SELECTING chip -- the card contradicted
   itself, and the fabricated preview data was hiding it. */
const picking = f => f.phase && !f.group_id;
const completed = r => !r.failed;

/* "5 of 28" -- the groups this BUCKET has optimized, out of its own. null when
   the machine is idle or the bucket is unknown, so metaRow drops the cell
   rather than printing a confident zero. */
function jobsDone(regime, bucketId){
  const b = BUCKETS.find(x => x.regime === regime && x.bucket_id === bucketId);
  if(!b || b.groups_done == null) return null;
  return b.groups_total ? `${b.groups_done} of ${b.groups_total}` : String(b.groups_done);
}

/* ETA -- the LOCAL CLOCK TIME this job should finish at. The rate already on
   this row answers the same question, but only after arithmetic: "64% at
   9.4 %/h" is 3.8 hours, and what you want to know is whether that lands
   before or after you go to bed.

   THE ARITHMETIC IS UPSTREAM'S, RESTATED. mt5_progress.hours_remaining and
   backtest_progress.hours_remaining are both `(100 - percent) / rate` behind
   the same two guards used here, so this agrees with them by construction
   rather than by luck. The figure itself does not ride the beacon --
   _BEACON_PROGRESS_FIELDS forwards percent and pct_per_hour and drops
   hours_remaining -- so the renderer re-derives it rather than the publisher
   growing a field for a thing it already has the inputs for.

   ANCHORED TO THE BEACON, NOT TO NOW. `percent` was true when the machine last
   reported; adding the remaining hours to `now` would push every ETA later by
   the beacon's own age. That is seconds on a live card -- and it is the whole
   story on a stale one, which is why a STALE BEACON GETS NO ETA. Its percent is
   fifteen-plus minutes old, and the card already carries a warning saying the
   page cannot say what that machine is doing now; a confident finishing time
   printed under that warning would contradict it. Same lesson the backtest
   freshness guard was written for: "91% -- ~0h left" on a machine that has
   moved on is worse than no number. */
function etaAt(f){
  if(stale(f)) return null;
  if(f.percent == null || !f.pct_per_hour || f.percent >= 100) return null;
  const beaconMs = Date.now() - (f.age_seconds || 0) * 1000;
  return new Date(beaconMs + ((100 - f.percent) / f.pct_per_hour) * 3600e3);
}

/* A bare "03:12" is a lie by omission when it means tomorrow, and at 9 %/h a
   round is ten hours long -- crossing midnight is the ordinary case here, not
   the edge one. So the day is NAMED whenever it is not today. Local, for the
   reason fmtWhen gives. Day distance is measured midnight-to-midnight and
   rounded, so a 23- or 25-hour DST day still counts as one day. */
const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtEta(d){
  if(!d) return null;
  const p = n => String(n).padStart(2, "0");
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const now = new Date();
  // A LIVE beacon can still sit behind a job that is nearly done: 99% at
  // 60 %/h is one minute left, read four minutes ago. A finishing time in the
  // past is not wrong, but printing it as a clock time reads as one.
  if(d <= now) return "due now";
  const days = Math.round(
    (new Date(d.getFullYear(), d.getMonth(), d.getDate()) -
     new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  if(days === 0) return hm;
  if(days < 7) return DAY_NAMES[d.getDay()] + " " + hm;
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${hm}`;
}

/* No cells means NO ROW. The .meta rule draws a border top and bottom, so an
   empty one is not invisible -- it is a 20px band of two stray rules. Idle
   machines hit this the moment a field is dropped from the row, which is
   exactly what happened when Tier came out. */
function metaRow(pairs){
  const cells = pairs.filter(x => x[1] != null && x[1] !== "");
  if(!cells.length) return "";
  return '<div class="meta">' + cells
    .map(([k, v, cls]) => `<div><span class="k">${esc(k)}</span>` +
      `<span class="v ${cls || ""}">${esc(v)}</span></div>`).join("") + '</div>';
}

function progressBar(f, rc){
  if(f.percent == null) return "";
  return `<div class="prog">
      <div class="prog-top"><span>${esc(f.mode === "real_ticks" ? "Real Ticks"
        : f.mode === "ohlc" ? "OHLC" : (phaseText(f.phase) || "Progress"))}</span>
        <span class="pct">${f.percent}%</span></div>
      <div class="bar"><i class="${rc}" style="width:${Math.max(0, Math.min(100, f.percent))}%"></i></div>
    </div>`;
}

/* STARTED, AND NOT FINISHED WITH. `running`/`claimed` is work in flight;
   `consult` is a sweep that produced its measurement and is waiting on a
   person, which is open work too -- it is the one state that cannot clear
   itself. `pending` is NOT here: nothing has picked it up, so it has not
   started, and the Active page is about what IS happening.

   Read off the seed's own status rather than from a count of leases: the lease
   is the mechanism, the status is the record, and every other surface reads
   the record. */
const STARTED_STATUSES = new Set(["running", "claimed", "consult"]);
const startedSeed = sd => STARTED_STATUSES.has(String(sd.status || "").toLowerCase());
/* EXECUTING IS NOT THE SAME QUESTION AS OPEN, and one set answering both is
   what put the wrong label on a running machine.

   `consult` is a sweep that FINISHED and is waiting on a person. It is open
   work -- it belongs in the counts and in Unfinished -- but nothing is running
   it, and `claimed_by` stays behind as the record of who ran it, not as a claim
   on the machine now.

   Measured 2026-09-16: the Laptop was 69% through a FULLTEST on
   BEAR_EMA_PERIODS_LOW while its card read SWEEP and named an EMA A/B arm that
   had finished two days earlier. Three seeds sat at consult with
   claimed_by=Laptop, `seedOnMachine` matched the first of them, and the rule
   that a claimed seed outranks the beacon then did exactly what it says --
   against a seed that was not being executed at all. */
const EXECUTING_STATUSES = new Set(["running", "claimed"]);
const executingSeed = sd =>
  EXECUTING_STATUSES.has(String(sd.status || "").toLowerCase());
const queuedSeed = sd => String(sd.status || "").toLowerCase() === "pending";
const needsDecision = sd => String(sd.status || "").toLowerCase() === "consult";

function renderSeeds(list, label){
  if(!list || !list.length) return "";
  return (label ? '<div class="section-label">' + esc(label) + '</div>' : "")
    + list.map(seedCard).join("");
}

/* ONE SEED, ONE CARD, wherever it is shown -- the list and the job detail call
   the same function, so a seed cannot read two ways on two screens. */
function seedCard(sd){
      // No `compact` variant any more: this card is only ever drawn for a seed
      // with NO machine card above it, so there is nothing to avoid repeating.
      const rc = RC[sd.regime] || "";
      const when = sd.claimed_at || sd.created_at;
      return `
      <article class="card">
        <div class="stripe ${rc || "warn"}"></div>
        <div class="card-in">
          <div class="top">
            ${sd.regime ? `<span class="chip ${rc}">${esc(sd.regime)}</span>` : ""}
            ${sd.claimed_by ? `<span class="chip gold">${esc(sd.claimed_by)}</span>`
              /* PINNED AND UNCLAIMED. Once a machine has taken it the gold chip
                 says which, and repeating the pin beside it answers a question
                 nobody is still asking. Before that it is the difference
                 between "waiting for a machine" and "waiting for THAT one". */
              : sd.only_machine
                ? `<span class="chip">${esc(sd.only_machine)} only</span>` : ""}
            <span class="chip">${esc(roundType(sd))}</span>
            <span class="sp"></span>
            <span class="when">${esc(String(sd.status || ""))}</span>
          </div>
          <div>
            <div class="title">${esc(sd.label || humanize(sd.group_id) || "Seeded work")}</div>
            <div class="sub">${sd.claimed_by ? "" : "unclaimed"}` +
              `${when ? (sd.claimed_by ? "since " : " · created ") + esc(fmtWhen(when)) : ""}</div>
          </div>
          ${sweptList(sd.variables, sd.cells)}
          ${sd.note ? `<div class="noterow" data-toggle><span>Why it cut in line</span>` +
            `<span class="car">▾</span></div>` +
            `<div class="notebody" hidden>${esc(sd.note)}</div>` : ""}
        </div>
      </article>`;
}

/* A FAILED ROUND WRITES NO LEDGER ROW -- the retry state machine is what
   remembers it, and a success clears that entirely. So this is "what is failing
   NOW", not a history, and it is the only place a failure is visible at all.

   Parked (3 failures) is the one state that does not auto-revive: it is asking
   for a decision, which is exactly what this page should not make someone go
   looking for. */
function renderFailures(){
  if(!FAILURES.length) return "";
  return '<div class="section-label">Failing — needs a look</div>' +
    FAILURES.map(f => {
      const rc = RC[f.regime] || "";
      const n = f.failures || 0;
      const why = f.parked ? "parked after 3 — waiting on you"
        : f.awaiting_other_round ? "one other round runs first, then it retries"
        : "retrying";
      return `
      <article class="card">
        <div class="stripe warn"></div>
        <div class="card-in">
          <div class="top">
            ${f.regime ? `<span class="chip ${rc}">${esc(f.regime)}</span>` : ""}
            ${f.released_by ? `<span class="chip gold">${esc(f.released_by)}</span>` : ""}
            <span class="chip warn">${f.parked ? "PARKED" : "FAILED"}</span>
            <span class="sp"></span>
            <span class="when">${n} failure${n === 1 ? "" : "s"}</span>
          </div>
          <div>
            <div class="title">${esc(humanize(f.group_id) || "Unknown group")}</div>
            <div class="sub">${esc(why)}</div>
          </div>
        </div>
      </article>`;
    }).join("");
}

function renderRounds(){
  if(!FLEET.length) return '<div class="empty">No machines reporting.</div>';
  // Nothing per-machine here any more. "Rounds done by this box" counted a
  // real thing, but not a thing anyone steers by: a ROUND is one group run
  // once, and a group is deliberately re-run (2 consecutive middle wins before
  // a variable can lock), so 26 rounds is 17 groups. The campaign's own unit is
  // GROUPS PER BUCKET, and that belongs to the bucket, not to the box.
  // EVERY machine, not just the ones with a round. A machine that vanishes from
  // this page when it goes idle hides exactly the thing worth knowing -- that is
  // how a manually launched sweep read as a dead Laptop for three hours.
  return FLEET.map(f => machineCard(fleetWithSeed(f, seedOnMachine(f.machine))))
              .join("");
}

/* PICK A PASS, ON THE PHONE. Mockup; see the .pick CSS for what does not
   exist behind it yet.

   THE RANKING IS THE ONE UPSTREAM ALREADY COMPUTES -- pick_pass.rank(), the
   same rows notify.format_recommendation prints into the Telegram message.
   Re-ranking here would put two orders for the same report on two surfaces,
   which is the exact failure that module's docstring warns about: "Two numbers
   that differ are two numbers you cannot use."

   SELECTION IS LOCAL AND UNSENT until Apply. The row and the free field are one
   value, not two -- typing clears the row highlight, tapping a row clears the
   field -- because a form that can show a chosen pass AND a different typed one
   at the same time is a form that applies the wrong number eventually. */
let PICKED = {};

function passRow(r, i, key){
  const on = PICKED[key] != null && Number(PICKED[key]) === Number(r.pass);
  return `<button type="button" class="pickrow${on ? " on" : ""}" ` +
    `data-pick="${esc(key)}" data-pass="${esc(r.pass)}">
      <span class="rk">${i + 1}</span>
      <span class="pickme">
        <span class="pickp">pass ${esc(r.pass)}</span>
        <span class="pickm"> · ${esc(r.trades)} trades (${esc(r.per_year)}/yr)</span>
        <div class="pickm">${r.profit >= 0 ? "+" : ""}${esc(r.profit)}</div>
      </span>
      <span class="pickpf">${esc(r.pf)}</span>
    </button>`;
}

function passPick(f){
  const a = f.awaiting_pass;
  if(!a) return "";
  const key = `${f.regime}|${f.bucket_id}|${f.group_id}`;
  const rows = a.rows || [];
  const sel = PICKED[key];
  const typed = sel != null && !rows.some(r => Number(r.pass) === Number(sel));
  return `<div class="pick">
      <div class="pickhd">⏸ Round finished — pick a pass</div>
      <div class="picksub">Nothing is applied until you do. ${esc(a.passes)} passes ran;
        target is ${esc(a.band_low)}–${esc(a.band_high)} trades.</div>` +
    (a.on_cadence === false
      ? `<div class="pickwarn">⚠️ NOTHING landed on-cadence
           (${esc(a.band_low)}–${esc(a.band_high)} trades). These are NEAREST TO
           TARGET instead, so "best PF among on-cadence" is not what ranked
           them.</div>`
      : `<div class="picksub">Best PF among the on-cadence passes:</div>`) +
    rows.map((r, i) => passRow(r, i, key)).join("") + `
      <div class="pickother">
        <label for="pin-${esc(key)}">Or any pass</label>
        <input class="pickin" id="pin-${esc(key)}" type="number" inputmode="numeric"
               min="1" max="${esc(a.passes)}" placeholder="—"
               data-pickin="${esc(key)}" value="${typed ? esc(sel) : ""}">
      </div>
      <button type="button" class="applyb" data-apply="${esc(key)}"
        ${sel == null ? "disabled" : ""}>${
          sel == null ? "Pick a pass to apply" : "Apply pass " + esc(sel)}</button>
      <div class="pickfoot">Applies from the pre-round snapshot and re-runs both
        backtests. Reversible until the next round on this group.</div>
    </div>`;
}

/* ONE MACHINE, ONE CARD. Same reason as seedCard. */
function machineCard(f){
    const rc = RC[f.regime] || "";
    const live = running(f);
    const st = stale(f);
    return `
    <article class="card">
      <div class="stripe ${st ? "warn" : (live ? rc : "")}"></div>
      <div class="card-in">
        <div class="top">
          ${f.regime ? `<span class="chip ${rc}">${esc(f.regime)}</span>` : ""}
          ${/* THE BUCKET, beside the regime it belongs to. Trevor, 2026-09-16:
                *"add that bucket id on the job tab to the right of BULL."* It
                used to appear only inside the title sentence this card no
                longer has. */
            bktEl(f.bucket_id)}
          <span class="chip gold">${esc(f.machine)}</span>
          ${(f.seed || f.phase)
            ? `<span class="chip">${esc(f.seed ? roundType(f.seed)
                                               : phaseText(f.phase))}</span>` : ""}
          <span class="sp"></span>
          <span class="when">${f.age_seconds != null
            ? "♥ " + esc(ago(f.age_seconds)) : "never reported"}</span>
        </div>
        <div>
          ${/* THE JOB IS THE TITLE. Trevor, 2026-09-16: *"take the 'bull
                1600 round running' line completely out. 'Entry G3 Composite
                Blend Score Gates' takes its place."*

                That line restated the three chips directly above it -- regime,
                round type, and now the bucket -- and spent the card's biggest
                type on them, leaving the one thing unique to this job in the
                small grey sub-line underneath. The chips already say BULL, 1600
                and OPTIMIZE; what they cannot say is WHICH GROUP.

                A SWEEP'S OWN NAME STILL WINS over the group it sweeps: on an
                A/B the arm is the whole point, and two arms over one group are
                two jobs that differ only in their label. */""}
          <div class="title">${live
            ? esc((f.seed && f.seed.label) || humanize(f.group_id))
            : picking(f) ? "No group picked yet"
            : "Idle — no round"}</div>
          ${/* ONLY WHAT THE TITLE DID NOT SAY. The group used to live here
                and is now the title, so repeating it would be the same string
                twice. A LABELLED SWEEP is the one case with something left
                over: its label is the title, so the group it sweeps comes
                here instead of being lost. */
            live && f.seed && f.seed.label && f.group_id
              ? `<div class="sub">${esc(humanize(f.group_id))}</div>` : ""}
        </div>
        ${picking(f)
            /* SELECTING writes no group, no mode and no percent, so this row is
               otherwise empty and the card has nothing to say at all. How long
               it has been choosing is the one fact that exists. */
            ? metaRow([["Selecting for", phaseFor(f)]])
            : metaRow([["Mode", f.mode === "real_ticks" ? "Real Ticks"
                      : f.mode === "ohlc" ? "OHLC" : null, "gold"],
                   ["Rate", f.pct_per_hour != null
                      ? f.pct_per_hour.toFixed(1) + " %/h" : null],
                   ["Jobs done", jobsDone(f.regime, f.bucket_id)],
                   ["ETA", fmtEta(etaAt(f))],
                   ["In phase", phaseFor(f)]])}
        ${progressBar(f, rc)}
        ${passPick(f)}
        ${(f.seed && (f.seed.variables || []).some(v => v && v.min != null))
            ? sweptList(f.seed.variables, f.seed.cells)
            : varList(f.variables, liveStates(f))}
        ${st ? `<div class="warnrow"><span>⚠️</span><span>` +
          `Last reported ${esc(ago(f.age_seconds))} — the beacon is stale, ` +
          `so this page cannot say what it is doing now.</span></div>` : ""}
        ${live ? `<div class="acts">
          <button type="button" class="primary">Skip</button>
          <button type="button">To OHLC</button>
          <button type="button">To Ticks</button>
        </div>` : ""}
      </div>
    </article>`;
}

/* ---------- page: results ---------- */
/* ONE FINISHED JOB: its tasks, its reports, its graphs. Built by handing the
   ledger row's own `reports` block to renderTimeline -- the SAME renderer the
   running job uses, so a task looks and behaves identically whether the job
   finished five minutes ago or five days ago, and the task card comes along
   with it for free. */
/* The variable states a finished job left behind. "" when no task carried
   any, which is every job whose reports never resolved. */
function jobVariables(tasks){
  let vars = null;
  (tasks || []).forEach(t => {
    const v = (t.detail || {}).variables;
    if(v && v.length) vars = v;
  });
  if(!vars) return "";
  return `<div class="card"><div class="card-in">
      <div class="tlab">Variables — where they stand</div>` +
      taskVars(vars) + taskStateKey(vars) + `</div></div>`;
}

function renderResultsJob(r){
  if(!r) { RESULTS_JOB = null; return renderResultsList(); }
  const rc = REGIME_CLASS[r.regime] || "";
  const rep = r.reports || {};
  const back = '<button type="button" class="backbtn" data-rjob="">' +
               '\u2039 All jobs</button>';
  /* The pass number comes off the folder, which is the only place it exists for
     a finished job -- `round_no` is a fleet-wide counter, not this. */
  const pass = String(rep.rel_dir || "").split("/").filter(Boolean).pop() || null;
  return back + `
    <article class="card">
      <div class="stripe ${esc(rc)}"></div>
      <div class="card-in">
        <div class="top">
          ${r.regime ? `<span class="chip ${esc(rc)}">${esc(r.regime)}</span>` : ""}
          ${bktEl(r.bucket_id)}
          <span class="chip gold">${esc(r.machine)}</span>
          ${r.seeded ? `<span class="chip gold">SEED</span>` : ""}
          <span class="sp"></span>
          <span class="when">${esc(fmtWhen(r.recorded_at))}</span>
        </div>
        <div><div class="title">${esc(humanize(r.group_id))}</div></div>
        ${metaRow([["Round", "r" + r.round_no],
                   ["Pass picked", r.picked_pass ?? null],
                   ["Mode", r.ticks_mode === "real_ticks" ? "Real Ticks"
                          : r.ticks_mode === "ohlc" ? "OHLC" : null, "gold"],
                   ["Passes", r.passes ?? null]])}
        <div class="row-pf">
          <div>
            <div class="lab">Bucket PF</div>
            <div class="pf"><b>${r.bucket_pf_before ?? "—"}</b>→<b>${r.bucket_pf_after ?? "—"}</b>
              ${deltaEl(r.bucket_pf_before, r.bucket_pf_after)}</div>
          </div>
          <div>
            <div class="lab">Portfolio PF</div>
            <div class="pf"><b>${r.pf_before ?? "—"}</b>→<b>${r.pf_after ?? "—"}</b>
              ${deltaEl(r.pf_before, r.pf_after)}</div>
          </div>
        </div>
      </div>
    </article>` +
    /* THE VARIABLES, BELOW THE PF AND ABOVE THE BUTTONS. Trevor, 2026-09-16:
       *"I want the Variables and their status info in here right below the PF
       numbers, above the Reports."*

       TAKEN FROM THE LAST TASK THAT HAS ANY. A job's tasks narrow as it runs --
       the second pass sweeps fewer than the first -- and the LAST one to carry a
       list is the backtest, which carries the group entire with every state as
       it stands once the job is done. That is the right thing on a card about a
       FINISHED job: not what was swept, but where everything ended up. */
    jobVariables(rep.tasks) +
    (rep.exact === false
      ? `<div class="inexact">⚠️ These reports were matched to this round <b>by
           order</b>, not by key — it ran before the pass number was recorded on
           the row. They are almost certainly this round's, and this page will
           not claim more than that.</div>`
      : "") +
    renderTimeline({regime: r.regime, bucket_id: r.bucket_id,
                    group_id: r.group_id, rel_dir: rep.rel_dir,
                    pass: pass, rounds: rep.tasks || []});
}

function renderResultsList(){
  const rows = resultsRows().map(r => {
    const rc = REGIME_CLASS[r.regime] || "";
    /* THE WHOLE ROW OPENS THE JOB, and only when there is a job to open. A
       row whose reports never resolved has no tasks behind it, so it stays an
       inert card rather than a button that does nothing. */
    const hasJob = !!(r.reports && (r.reports.tasks || []).length);
    return `
    <${hasJob ? "button type=\"button\"" : "article"} class="row${
        hasJob ? " jrowbtn" : ""}"${hasJob ? ` data-rjob="${esc(r.round_no)}"` : ""}>
      <div class="row-top">
        <span class="chip ${r.failed ? "warn" : rc}"${
          r.failed ? "" : ` data-rfilter="regime:${esc(r.regime)}"`}>${
          r.failed ? "FAILED" : esc(r.regime)}</span>` +
        /* WAS IT SEEDED. Trevor, 2026-09-16: *"I want to know if it was a
           seed."* Derived upstream from the seed records, not from the ledger
           row -- see app_snapshot._seeded_round_keys for why, and for the rule
           that stops a group seeded once from marking every later round too. */
        (r.seeded ? `<span class="chip gold">SEED</span>` : "") + `
        <span class="row-grp">${
          /* THE BUCKET, because a group name alone does not say which bucket
             earned the round -- and buckets are the campaign's own unit. Its
             own span so it stays legible when the name wraps beside it. */
          bktEl(r.bucket_id, true, r.bucket_id)}${esc(humanize(r.group_id))}</span>` +
        (hasJob ? `<span class="row-car">›</span>` : "") + `
      </div>
      ${r.failed ? `<div class="sub" style="padding:0 0 2px">${
          esc(r.fail_reason || "no reason recorded")}</div>` : `
      <div class="row-pf">
        <div>
          <div class="lab">Bucket PF</div>
          <div class="pf"><b>${r.bucket_pf_before ?? "—"}</b>→<b>${r.bucket_pf_after ?? "—"}</b>
            ${deltaEl(r.bucket_pf_before, r.bucket_pf_after)}</div>
        </div>
        <div>
          <div class="lab">Portfolio PF</div>
          <div class="pf"><b>${r.pf_before ?? "—"}</b>→<b>${r.pf_after ?? "—"}</b>
            ${deltaEl(r.pf_before, r.pf_after)}</div>
        </div>
      </div>`}
      ${/* THIS ROUND'S OWN REPORT FILES. Trevor, 2026-09-16, pointing between
            the PF numbers and the meta line: *"I want the Report Buttons
            inserted where the Green Line is."* The same buttons the timeline has
            had, on the row for the round that produced them -- results is where
            you are when you want to go and read one.

            SAME FUNCTION, NOT A SECOND COPY. reportButtons() already handles
            every case this needs: no files at all returns "" and the row closes
            up, and a file with no URL yet reveals the FILENAME instead of
            pretending to be a link. So a ledger row that carries nothing simply
            has no button strip, which is what every row does today.

            ⚠️ THE PUBLISHER DOES NOT FILL `files` ON LEDGER ROWS YET --
            `_LEDGER_FIELDS` is a whitelist and reports are keyed by timestamp
            under a PASS folder, not by round_no. Until app_snapshot attaches
            them these stay empty on the live app; the format preview fills them
            so the layout is real. */""}
      ${reportButtons(r, r.rel_dir)}
      <div class="row-foot">
        <span>r${r.round_no}</span>
        <span>${esc(r.machine)}</span>
        <span>${r.ticks_mode === "real_ticks" ? "ticks" : "ohlc"}</span>
        <span>pass ${r.picked_pass ?? "—"}</span>
        ${r.heavy ? "<span>heavy</span>" : ""}
        <span class="row-when">${esc(fmtWhen(r.recorded_at))}</span>
      </div>
    </${hasJob ? "button" : "article"}>`;
  }).join("") ||
    /* NARROWED TO NOTHING is not the same as having no results, and the
       difference is one tap away. */
    `<div class="empty">No rounds match this filter.<br><br>` +
    `Tap a chip above to widen it.</div>`;
  // "completed" has to mean completed. Counting every row here while the
  // machine cards count only finished ones would put two different totals for
  // the same thing on two tabs of one app.
  const shown = resultsRows();
  const nf = shown.length - shown.filter(completed).length;
  const buckets = resultsBuckets();
  /* "newest first" WAS TEXT AND IS NOW A CONTROL. Trevor: *"Where it currently
     says NEWEST FIRST, i want that to be a button chip also."* Same words, same
     place -- it simply does something now. */
  return `<div class="section-label">${shown.filter(completed).length} completed` +
    (nf ? ` · ${nf} failed` : "") + `</div>
    <div class="rctl">
      <span class="rlab">Show</span>
      <button type="button" class="cchip${RESULTS_SORT === "oldest" ? " on" : ""}"
        data-rfilter="sort">${RESULTS_SORT === "oldest" ? "Oldest first"
                                                        : "Newest first"}</button>
      <button type="button" class="cchip${RESULTS_REGIME ? " on" : ""}"
        data-rfilter="regime">${esc(RESULTS_REGIME || "All regimes")}</button>` +
    (buckets.length > 1 || RESULTS_BUCKET != null
      ? `<button type="button" class="cchip${RESULTS_BUCKET != null ? " on" : ""}"
           data-rfilter="bucket">${RESULTS_BUCKET != null
             ? "Bucket " + esc(RESULTS_BUCKET) : "All buckets"}</button>`
      /* ONE BUCKET IS NOT A CHOICE. Hiding the control until a split gives it
         something to cycle through keeps a dead button off the screen. */
      : "") + `
    </div>` + rows;
}

/* The tab itself: the list, or the one job that is open. */
function renderResults(){
  if(RESULTS_JOB == null) return renderResultsList();
  const r = LEDGER.find(x => String(x.round_no) === String(RESULTS_JOB));
  return renderResultsJob(r);
}

/* ---------- shell ---------- */

// The gist id is deliberately NOT in this repo. It arrives in the URL
// fragment -- https://twiens99.github.io/goldbot-app/#g=<id> -- and browsers
// never send a fragment to a server, so it appears in no request log and no
// commit. Without it this page is an empty shell. Obscurity, not security: a
// random 32-hex id is a meaningful lock, not a real one.
const GIST_ID = new URLSearchParams(location.hash.slice(1)).get("g");
const GIST_URL = GIST_ID
  ? "https://gist.githubusercontent.com/twiens99/" + encodeURIComponent(GIST_ID) +
    "/raw/goldbot_snapshot.json"
  : null;

function showState(msg){
  // The HOME page carries it too: it is the page that opens first, and an app
  // whose first screen shows two confident buttons over a snapshot it could
  // not load is lying on the one screen everything else is reached from.
  document.getElementById("page-home").innerHTML =
    '<div class="empty">' + msg + '</div>';
  document.getElementById("page-active").innerHTML = "";
  document.getElementById("page-results").innerHTML = "";
}

/* Groups, not rounds. "26 rounds this epoch" answered a question nobody was
   asking -- it counts attempts at groups, and a group is re-run on purpose. */
function campaignProgress(){
  const done = BUCKETS.reduce((a, b) => a + (b.groups_done || 0), 0);
  const total = BUCKETS.reduce((a, b) => a + (b.groups_total || 0), 0);
  if(!total) return LEDGER.filter(completed).length + " rounds this epoch";
  return `${done} of ${total} groups this epoch`;
}

/* ---------- page: active (current jobs) ---------- */
/* Trevor, 2026-09-14: *"That current jobs page will bring up all current jobs
   that are active. It'll have the Desktop job it's working on, the laptop job
   it's currently working on, along with any job that's been started, and isn't
   fully complete."*

   MACHINES FIRST, in that order, because that is the question the page is
   opened to answer. The seeded work underneath is the rest of "started and not
   complete".

   QUEUED WORK IS STILL SHOWN, last and quietly. It is not active and does not
   belong above the things that are -- but dropping it entirely would hide work
   that is owed, which is the failure this app keeps being rebuilt to avoid. It
   gets its own muted heading rather than being mixed in. */
/* THE JOB SELECTOR. Trevor, 2026-09-14: *"I want a JOB selector. Each Job is
   labeled here, The Desktop will have one, the laptop will have one, and then
   there will be Queued up next job, and Unfinished Jobs. Click on that job,
   and it'll show you everything associated with that job."*

   ONE JOB, ONE ROW. This page used to list machines and seeds as separate
   sections, so the sweep running on the Laptop appeared TWICE -- once as the
   machine's card, once as the seed it was holding -- and read as two jobs. A
   job here is the PAIRING: the machine, and whatever seed it holds. That is
   also what makes a detail view possible at all: there is one thing to open. */
let ACTIVE_JOB = null;
/* WHICH FINISHED JOB IS OPEN, by round_no. Trevor, 2026-09-16: *"the results
   tab I want it to list all the JOB's. Then we'll Click on the job to see all
   the tasks on the Job Card. Then we can click on the Task to get to the Task
   Card."* Three levels, and this is the middle one's cursor. Separate from
   ACTIVE_JOB because the two tabs navigate independently -- opening a finished
   job must not close the running one you were watching. */
let RESULTS_JOB = null;
/* HOW THE RESULTS LIST IS ORDERED AND NARROWED. Trevor, 2026-09-16: the chips
   on a row *"are going to sort the order of the list ... Regime cycles between
   the three and the bucket id will also cycle between all the bucket numbers
   available."*

   ⚠️ EVERY CYCLE PASSES THROUGH null, WHICH MEANS "ALL". Three regimes and
   nothing else would be a filter you cannot turn off: tap BEAR once and the
   only way back to the whole list is to guess how many more taps it takes.
   null is the resting state and the one the list starts in. */
let RESULTS_SORT = "newest";       // or "oldest"
let RESULTS_REGIME = null;         // null = every regime
let RESULTS_BUCKET = null;         // null = every bucket

/* The buckets that actually have rounds, in a stable order -- derived, never
   typed, so a split adds itself to the cycle the day it banks a result. */
function resultsBuckets(){
  const seen = [];
  LEDGER.forEach(r => {
    if(r.bucket_id != null && !seen.includes(r.bucket_id)) seen.push(r.bucket_id);
  });
  return seen.sort((a, b) => a - b);
}

/* Next value in a cycle that always contains null. */
function cycle(list, current){
  const all = [null].concat(list);
  const i = all.findIndex(v => String(v) === String(current));
  return all[(i + 1) % all.length];
}

function resultsRows(){
  let rows = LEDGER.slice();
  if(RESULTS_REGIME) rows = rows.filter(r => r.regime === RESULTS_REGIME);
  if(RESULTS_BUCKET != null)
    rows = rows.filter(r => String(r.bucket_id) === String(RESULTS_BUCKET));
  /* LEDGER arrives newest-first from the publisher, so "newest" is the identity
     and only the other direction costs a reverse. */
  return RESULTS_SORT === "oldest" ? rows.reverse() : rows;
}

/* The seed this machine is RUNNING, not merely the last one it touched. */
const seedOnMachine = m =>
  SEEDS.find(sd => sd.claimed_by === m && executingSeed(sd)) || null;

/* THE CARD IS THE JOB, NOT JUST THE BEACON. A beacon describes a ROUND, and a
   seeded sweep is not one: it carries no regime, no bucket, no group and no
   mode, because `SELECTING writes nothing` upstream. So a machine running a
   named sweep against four variables rendered as "No group picked yet" with an
   empty card -- true about the beacon, useless about the job.

   All of it is on the SEED. Fill the gaps from there, and never overwrite a
   value the beacon actually reported: a live round's own regime and mode are
   the better source, and a seed that has been superseded must not repaint a
   card that has moved on. */
function fleetWithSeed(f, sd){
  if(!sd) return f;
  const seedMode = sd.real_ticks == null ? null
                 : (sd.real_ticks ? "real_ticks" : "ohlc");
  const seedVars = (sd.variables || [])
    .map(v => (typeof v === "string" ? v : v && v.name)).filter(Boolean);
  return Object.assign({}, f, {
    regime: f.regime || sd.regime || null,
    bucket_id: f.bucket_id != null ? f.bucket_id : (sd.bucket_id ?? null),
    group_id: f.group_id || sd.group_id || null,
    mode: f.mode || seedMode,
    variables: (f.variables && f.variables.length) ? f.variables : seedVars,
    seed: sd,
  });
}

/* Ordered the way the questions are asked: what is running now, what runs
   next, and what is owed. */
function jobsModel(){
  const jobs = [];
  FLEET.forEach(f => {
    const sd = seedOnMachine(f.machine);
    // THE REGIME, IN WORDS. It used to be carried by the stripe colour alone,
    // and on 2026-09-14 both machines ran a group called ENTRY_G3_COMPOSITE_
    // BLEND_SCORE_GATES -- one BULL, one RANGING. Two rows, same title, same
    // chip, differing only in a 3px band of colour. Same source as the chip on
    // the detail card, and for the reason `line` gives: a claimed seed outranks
    // a beacon that is describing a round it is not running.
    const rg = (sd && sd.regime) || f.regime || null;
    jobs.push({
      id: "m:" + f.machine, section: "Running now",
      fleet: fleetWithSeed(f, sd), seed: sd,
      title: f.machine,
      // A CLAIMED SEED OUTRANKS THE BEACON. The beacon describes a ROUND, and
      // a sweep is not one -- so a machine part-way through a seeded sweep can
      // truthfully report SELECTING with no group while it is plainly busy.
      // Measured 2026-09-14: the Laptop read "choosing a group" for 90 minutes
      // while it held and ran the TICKS arm of an A/B. The seed record is the
      // stronger evidence: something claimed it, and nothing else can hold it.
      line: stale(f) ? "not reporting - last seen " + ago(f.age_seconds)
          : sd ? (sd.label || humanize(sd.group_id) || "seeded work")
          : running(f) ? humanize(f.group_id)
          : picking(f) ? "choosing a group"
          : "idle - no round",
      // Same rule as the card's chip: a claimed seed names the work
      // better than a beacon that is describing a round it is not running.
      chip: sd ? roundType(sd) : (f.phase ? phaseText(f.phase) : null),
      regime: rg,
      cls: stale(f) ? "warn" : (RC[rg] || ""),
    });
  });

  // Seeds not already shown as a machine's job, so nothing appears twice.
  const shown = new Set(FLEET.map(f => seedOnMachine(f.machine))
                             .filter(Boolean).map(sd => sd.seed_id));
  const loose = SEEDS.filter(sd => !shown.has(sd.seed_id));
  // LOWER RUNS SOONER: 1 inserted, 2 unfinished, 3 new. Mirrors
  // seeds.normalize_priority so a record from an older machine -- the old
  // scale ran the other way -- still sorts where it belongs.
  const prio = sd => {
    const n = Number(sd.priority);
    if(n === 1 || n === 2 || n === 3) return n;
    return (!isFinite(n) || n <= 0) ? 3 : 1;
  };
