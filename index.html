  const queued = loose.filter(queuedSeed).sort((a, b) =>
    prio(a) - prio(b) || (a.created_at || 0) - (b.created_at || 0));
  const owed = loose.filter(sd => !queuedSeed(sd));

  queued.forEach((sd, i) => jobs.push({
    id: "s:" + sd.seed_id,
    section: i === 0 ? "Queued up next" : "Queued after that",
    seed: sd, title: sd.label || humanize(sd.group_id) || "Seeded work",
    line: roundType(sd) + (sd.only_machine ? " · " + sd.only_machine
                                              + " only" : ""),
    chip: null, regime: sd.regime || null, cls: RC[sd.regime] || "",
  }));
  owed.forEach(sd => jobs.push({
    id: "s:" + sd.seed_id, section: "Unfinished",
    seed: sd, title: sd.label || humanize(sd.group_id) || "Seeded work",
    line: needsDecision(sd) ? "measured - waiting on you" : String(sd.status || ""),
    chip: needsDecision(sd) ? "DECIDE" : null, regime: sd.regime || null,
    cls: needsDecision(sd) ? "warn" : (RC[sd.regime] || ""),
  }));
  return jobs;
}

function jobRow(j){
  return `<button type="button" class="hbtn jrow" data-job="${esc(j.id)}">
      <div class="hstripe ${esc(j.cls || "")}"></div>
      <div class="hrow">
        <span class="hb">
          <span class="jtop"><span class="hname">${esc(j.title)}</span>` +
          (j.regime ? `<span class="chip ${esc(RC[j.regime] || "")}">` +
            `${esc(j.regime)}</span>` : "") +
          (j.chip ? `<span class="chip">${esc(j.chip)}</span>` : "") + `</span>
          <span class="hsubline">${esc(j.line)}</span></span>
        <span class="hcar">›</span>
      </div>
    </button>`;
}

function renderJobList(){
  const jobs = jobsModel();
  if(!jobs.length) return '<div class="empty">No jobs.</div>';
  let out = "", section = null;
  jobs.forEach(j => {
    if(j.section !== section){
      section = j.section;
      out += '<div class="section-label">' + esc(section) + '</div>';
    }
    out += jobRow(j);
  });
  return out + renderFailures();
}

/* THE WHOLE JOB, not just the round in flight. Trevor, 2026-09-14: *"I want the
   whole job. The runs that are passed and the runs that are queued. The ones
   that are passed are going to have buttons that lead to reports of that
   particular task."*

   The card above this says what is happening RIGHT NOW. It cannot say whether
   that is the first of four rounds or the last, which is the difference between
   a job that needs two more hours and one that needs ten. */
const ROUND_MARK = { passed: "✓", running: "▶", queued: "○",
                     skipped: "—" };
/* Ordered by what you would actually open on a phone: the summary first, MT5's
   own report after it, the raw rows last. */
const PART_ORDER = ["Deepdive", "MAIN", "Excel", "CLOSED", "TRADELEDGER"];
const PART_LABEL = { Deepdive: "Summary", MAIN: "Report", Excel: "Excel",
                     CLOSED: "Closed trades", TRADELEDGER: "Trade ledger" };

function timelineFor(regime, bucketId, groupId){
  if(!groupId) return null;
  return TIMELINES.find(t => t.regime === regime && t.group_id === groupId &&
    (t.bucket_id == null || bucketId == null || t.bucket_id === bucketId)) || null;
}

/* A REPORT BUTTON WITH NO URL IS NOT A DEAD BUTTON. The reports are files on
   the machine that ran them and the phone cannot reach them, so until they are
   published the button reveals the FILENAME -- which is what you need to find
   it on the desktop. `urls` is read first so that the day a publisher fills it
   in, these become real links with no change here. */
function reportButtons(r, relDir){
  const files = r.files || {};
  /* A URL the record carries wins; otherwise build one from the base the
     snapshot published. Each segment is encoded separately so a slash in a
     group name could never climb out of the directory it names. */
  const urls = Object.assign({}, r.urls || {});
  if(FILE_BASE && relDir){
    const dir = String(relDir).split("/").map(encodeURIComponent).join("/");
    PART_ORDER.forEach(p => {
      if(files[p] && !urls[p]){
        urls[p] = FILE_BASE.replace(/\/+$/, "") + "/" + dir + "/" +
                  encodeURIComponent(files[p]);
      }
    });
  }
  const parts = PART_ORDER.filter(p => files[p]);
  if(!parts.length) return "";
  return '<div class="rbtns">' + parts.map(p => urls[p]
      ? `<a class="rbtn" href="${esc(urls[p])}" target="_blank" ` +
        `rel="noopener">${esc(PART_LABEL[p] || p)}</a>`
      : `<button type="button" class="rbtn pending" data-toggle>` +
        `${esc(PART_LABEL[p] || p)}</button>` +
        `<span class="rfile" hidden>${esc(files[p])}</span>`).join("") + '</div>';
}

/* ---------- the task card ---------- */
/* The four words for where a variable is up to, straight from the publisher --
   see task_detail.STATE_TEXT for what each one means. Lower-cased here only to
   pick a CSS class; the label shown is the publisher's own. */
function stateClass(s){ return String(s || "").toLowerCase(); }

/* EXPLAIN ONLY THE STATES ON SCREEN. Printing all five every time is a
   glossary; printing the ones this task actually has is an answer. Ordered
   PINNED first, matching notify.py's own ordering and for the same reason --
   it is the one worth eyeballing, because a variable stuck there is asking for
   a wider band and is a park waiting to happen. */
function taskStateKey(list){
  const seen = [];
  ["PINNED", "CENTER", "FLOATING", "DEFAULT", "LOCKED"].forEach(st => {
    if((list || []).some(v => v.state === st) && STATE_TEXT[st]) seen.push(st);
  });
  if(!seen.length) return "";
  return seen.map(st =>
    `<div class="tkey"><span class="tst ${stateClass(st)}">${esc(st)}</span>` +
    `<span class="tkt">${esc(STATE_TEXT[st])}</span></div>`).join("");
}

function taskVars(list){
  if(!(list || []).length) return "";
  return list.map(v => `<div class="tvar">
      <span class="tvn">${esc(spaceOut(stripRegime(v.name)))}</span>` +
      (v.state ? `<span class="tst ${stateClass(v.state)}">${esc(v.state)}</span>`
               : "") +
      /* ALWAYS A BOX, even with nothing in it -- an absent resolution would
         otherwise pull the state chip right and break the column. */
      `<span class="tvr ${stateClass(v.resolution)}">${
         v.resolution ? esc(v.resolution) : "—"}</span>` +
      `</div>`).join("");
}

/* A SWEPT VARIABLE HAS TWO SHAPES, because a task gets here two ways: a seeded
   sweep carries its own grid on the record, a rotation round sweeps its group's
   active variables at whatever resolution each is on. Same reason the publisher
   has two shapes -- see task_detail.swept_variables. */
function taskSwept(list){
  if(!(list || []).length) return "";
  return list.map(v => {
    const grid = (v.min != null && v.max != null)
      ? `${esc(v.min)} → ${esc(v.max)}` +
        (v.points ? ` · ${esc(v.points)} steps` : "") +
        (v.step ? ` · Δ ${esc(v.step)}` : "")
      : (v.resolution ? esc(v.resolution) + " resolution" : "");
    return `<div class="tvar"><span class="tvn">${esc(spaceOut(stripRegime(v.name)))}</span></div>` +
           (grid ? `<div class="tvr" style="padding-left:2px">${grid}</div>` : "");
  }).join("");
}

const BAND_WORD = { IN_BAND: "In band", UNDER: "Under", OVER: "Over",
                    UNKNOWN: "Not measured here" };

/* WHERE THE VARIABLE LIST CAME FROM, said out loud. The three answers are not
   equally strong and the card should not pretend they are: `set` is what MT5 is
   sweeping this second, `applied` is what the last confirmed round put under
   test, `group` is every variable tagged to the group -- which a BACKTEST shows
   deliberately, because it measures where they all ended up. */
const SWEPT_LABEL = {
  set: "Sweeping now",
  applied: "Swept last round",
  group: "Variables",
  undecided: "Variables",
};

function taskBand(c){
  if(!c) return "";
  const v = String(c.verdict || "UNKNOWN");
  const cls = v.toLowerCase().replace("_", "");
  let line = "";
  if(v === "UNKNOWN"){
    /* NOT A MISS. A sweep runs with logging off and writes no count at all, and
       the round ledger is per-machine so a peer's round has no row here either.
       Saying "0 trades" or "under" would invent a cadence problem. */
    line = `<span class="tbm">no trade count on this machine</span>`;
  } else {
    line = `<span class="tbm">${esc(c.trades)} trades · band ` +
           `${esc(c.floor_trades)}–${esc(c.ceiling_trades)}</span>` +
           (c.off_by ? `<span class="tbm">${esc(c.off_by)} ${
              v === "UNDER" ? "short" : "over"}</span>` : "") +
           /* THE RATIO IS WHAT THE EA ACTUALLY COMPARED. The trade counts above
              are the readable form of it, and a reader checking this verdict
              against a FITNESS log needs the number that log carries. */
           (c.vol_ratio != null ? `<span class="tbm">ratio ${esc(c.vol_ratio)} ` +
              `(${esc(c.band_lo)}–${esc(c.band_hi)})</span>` : "");
  }
  return `<div class="tband"><span class="tbv ${cls}">${
      esc(BAND_WORD[v] || v)}</span>${line}</div>`;
}

/* WHAT THE TASK PRODUCED. `pass_number`, `profit_factor` and `model` were all
   on the record and none of them were drawn -- which meant the card could tell
   you a round landed in band without telling you WHICH PASS it picked, the one
   thing you would go to the report to look up. */
function taskResult(c){
  if(!c) return "";
  const bits = [];
  if(c.pass_number) bits.push(`pass ${esc(c.pass_number)}`);
  if(c.profit_factor != null) bits.push(`PF ${esc(c.profit_factor)}`);
  /* The same two words the rest of the page uses for the model. A third
     spelling of "real_ticks" on one screen is a third thing to learn. */
  if(c.model) bits.push(esc(c.model === "real_ticks" ? "real ticks"
                           : c.model === "ohlc" ? "OHLC" : c.model));
  if(!bits.length) return "";
  return `<div class="tsec"><div class="tlab">Picked</div>
      <div class="tband"><span class="tbm">${bits.join(" · ")}</span></div></div>`;
}

/* WHY IT CUT IN LINE. The tag is the category and the note is the sentence --
   both, because the tag alone loses the specifics and the note alone cannot be
   grouped. See seeds.REASONS. */
function taskSeed(sd){
  if(!sd) return "";
  return `<div class="tsec">
      <div class="tlab">Seeded — ${esc(sd.reason || "")}</div>` +
    (sd.reason_text ? `<div class="tnote">${esc(sd.reason_text)}</div>` : "") +
    (sd.note ? `<div class="tnote">“${esc(sd.note)}”</div>` : "") +
    (sd.outcome ? `<div class="tnote">${esc(sd.outcome)}</div>` : "") +
    (sd.created_by ? `<div class="tby">by ${esc(sd.created_by)}</div>` : "") +
    `</div>`;
}

/* The pictures. Drawn, not linked -- see .tgraph. Built from the same base and
   the same directory the report buttons use, so a graph can never point
   somewhere its own report does not. */
function taskGraphs(files, relDir, urls){
  const name = (files || {}).CURVE;
  if(!name) return "";
  /* A URL THE RECORD CARRIES WINS, exactly as reportButtons does it -- one rule
     for "where does this file live", so a graph can never resolve differently
     from the report sitting beside it. */
  let url = (urls || {}).CURVE || "";
  if(!url){
    if(!FILE_BASE || !relDir) return "";
    const dir = String(relDir).split("/").map(encodeURIComponent).join("/");
    url = FILE_BASE.replace(/\/+$/, "") + "/" + dir + "/" +
          encodeURIComponent(name);
  }
  return `<div class="tsec"><div class="tlab">Balance curve</div>
      <img class="tgraph" src="${esc(url)}" alt="balance curve" loading="lazy">
      <div class="tgcap">Before and after, on one scale.</div></div>`;
}

function taskCard(r, relDir){
  const d = r.detail;
  if(!d) return "";
  const parts = [
    taskSeed(d.seed),
    taskResult(d.cadence),
    d.cadence ? `<div class="tsec"><div class="tlab">Trade band</div>` +
                taskBand(d.cadence) + `</div>` : "",
    (d.swept || []).length ? `<div class="tsec"><div class="tlab">Swept</div>` +
                             taskSwept(d.swept) + `</div>` : "",
    (d.variables || []).length
      ? `<div class="tsec"><div class="tlab">${esc(SWEPT_LABEL[d.swept_source]
            || "Variables")}</div>` +
        taskVars(d.variables) + taskStateKey(d.variables) + `</div>`
      /* NOT DECIDED YET is a real answer and the only honest one for a queued
         sweep: a second pass takes whatever the first leaves PINNED, so its
         variable list does not exist until the first one finishes. */
      : d.swept_source === "undecided"
        ? `<div class="tsec"><div class="tlab">Variables</div>
             <div class="tnote">Not chosen yet — a second pass sweeps whatever
             the pass before it leaves pinned, so this list does not exist
             until that one finishes.</div></div>`
        : "",
    taskGraphs(d.files, d.rel_dir || relDir, d.urls),
  ].filter(Boolean);
  /* A TASK WITH NOTHING TO SAY SAYS SO. A queued round has no seed, no count,
     no files -- an empty panel would read as a broken card rather than as a
     round that has not happened yet. */
  if(!parts.length){
    parts.push(`<div class="tnote">Nothing recorded yet — this one has not run.</div>`);
  }
  return `<div class="task" hidden>${parts.join("")}</div>`;
}

function renderTimeline(tl){
  if(!tl || !tl.rounds || !tl.rounds.length) return "";
  const rows = tl.rounds.map(r => {
    /* The conditional is a CONDITION PHRASE from job_plan ("the first pass
       edge-pins"), so it reads correctly after "only if" and nowhere else.
       Negating it inline produced "the job moved past it without the first
       pass edge-pins"; naming it as an unmet condition keeps job_plan's
       wording intact without trying to inflect it. */
    const note = r.status === "skipped"
        ? (r.conditional ? "not needed — condition not met: " + r.conditional
                         : "not needed this pass")
      /* INFERRED, and it says so. This round is mandatory and something after
         it is under way, so it ran -- but no report reached the tree, so there
         is nothing to open and no minute to name. Claiming it silently would
         break the rule the rest of this view rests on: a file is the evidence. */
      : r.inferred ? "ran — no report filed"
      : r.status === "queued" && r.conditional ? "only if " + r.conditional
      : r.status === "running" ? "running now" : "";
    /* Tappable only when there is a card behind it -- a row that opens an
       empty panel teaches you not to tap the ones that are not empty. */
    const card = taskCard(r, tl.rel_dir);
    return `<div class="tlr ${esc(r.status)}${r.inferred ? " inferred" : ""}${
        card ? " tappable" : ""}"${card ? ' data-task' : ""}>
        <div class="tlm">${ROUND_MARK[r.status] || ""}</div>
        <div class="tlb">
          <div class="tlh"><span class="tlk">${esc(phaseText(r.kind))}</span>` +
          (r.at ? `<span class="tlw">${esc(fmtWhen(r.at))}</span>` : "") + `</div>` +
          (note ? `<div class="tlnote">${esc(note)}</div>` : "") +
          reportButtons(r, tl.rel_dir) + card + `</div>
      </div>`;
  }).join("");
  /* WHICH PASS, because a group is deliberately re-run and "OPTIMIZE passed"
     means nothing without saying which attempt it belonged to. A job on a NEW
     pass has no folder yet; naming the one before it is what stops the empty
     timeline reading as "nothing has ever run here". */
  const which = tl.pass ? esc(tl.pass)
    : tl.previous_pass ? "new pass · last was " + esc(tl.previous_pass)
    : "first pass";
  return '<div class="section-label">Rounds in this job · ' + which +
         '</div><div class="tl">' + rows + '</div>';
}

/* EVERYTHING ASSOCIATED WITH THAT JOB on one screen: the machine running it,
   the seed it came from, its outcome, and any failure history for the same
   group. Built from the SAME card renderers the list uses, so a job cannot
   describe itself differently depending on which screen you reached it from. */
function renderJobDetail(job){
  const back = '<button type="button" class="backbtn" data-job="">' +
               '‹ All jobs</button>';
  if(!job) return back + '<div class="empty">That job is gone.</div>';
  const gid = (job.fleet && job.fleet.group_id) || (job.seed && job.seed.group_id);
  const fails = FAILURES.filter(f => gid && f.group_id === gid);
  return back
    + (job.fleet ? '<div class="section-label">Machine</div>' +
         machineCard(job.fleet) : "")
    /* ONE MACHINE, ONE JOB, ONE CARD. This used to print the machine card and
       then the seed card underneath it, which read as two jobs on one box --
       Trevor: *"a machine can't have two jobs on the go in the app page."* They
       were never two. `fleetWithSeed` has already folded every fact the seed
       carries into the card above, so the second card restated it with a
       different title and a different timestamp and invited you to reconcile
       them. A loose seed -- queued, or owed with no machine -- still gets its
       own card, because there is no machine card for it to fold into.

       The NOTE does not fold in, and it is the one thing a seed has that a
       beacon never will: why this work cut the line. It is shown open rather
       than behind the disclosure the card used, because by this point it is
       the only thing left on the screen that has not already been said. */
    + (job.seed && !job.fleet
        ? '<div class="section-label">Seeded work</div>' + seedCard(job.seed) : "")
    + renderTimeline(timelineFor(
        (job.fleet && job.fleet.regime) || (job.seed && job.seed.regime),
        (job.fleet && job.fleet.bucket_id) != null
          ? job.fleet.bucket_id : (job.seed && job.seed.bucket_id),
        gid))
    + (job.seed && job.fleet && job.seed.note
        ? '<div class="section-label">Why it cut in line</div>' +
          '<div class="notebody">' + esc(job.seed.note) + '</div>' : "")
    + (job.seed && job.seed.outcome
        ? '<div class="section-label">Outcome</div>' +
          '<div class="notebody" style="border-left-color:var(--gold)">' +
          esc(job.seed.outcome) + '</div>' : "")
    + (fails.length ? '<div class="section-label">Failure history</div>' +
         fails.map(f => `<article class="card"><div class="stripe warn"></div>` +
           `<div class="card-in"><div class="title">` +
           `${esc(humanize(f.group_id))}</div>` +
           `<div class="sub">${f.failures || 0} failure` +
           `${(f.failures || 0) === 1 ? "" : "s"}` +
           `${f.parked ? " — parked, waiting on you" : ""}</div>` +
           `</div></article>`).join("") : "");
}

function renderActive(){
  if(!ACTIVE_JOB) return renderJobList();
  return renderJobDetail(jobsModel().find(j => j.id === ACTIVE_JOB));
}

/* ---------- page: home ---------- */
/* A button that only says ACTIVE makes you open it to find out whether
   anything is. The COUNT is the point of the screen, so each button carries
   the one number that decides whether you need to go there at all. */
function activeSummary(){
  /* A STALE MACHINE IS NOT A WORKING ONE. `running` only asks whether the
     record carries a group and a phase, and a beacon that stopped mid-round
     keeps both forever -- so a box that died three hours ago still counts as
     working by that test. Measured 2026-09-14: the home screen read "1 machine
     working" while that machine's own card carried "last reported 3.5h ago --
     the beacon is stale, so this page cannot say what it is doing now". The
     button and the card were describing the same machine and disagreeing.

     Same rule as the ETA guard one screen down: past the staleness window this
     page does not get to say what a machine is doing, so it says how many have
     gone quiet instead. */
  const busy = FLEET.filter(f => running(f) && !stale(f)).length;
  const gone = FLEET.filter(stale).length;
  const started = SEEDS.filter(startedSeed).length;
  const decide = SEEDS.filter(needsDecision).length;
  const bits = [];
  bits.push(busy
    ? `<span class="hcount">${busy}</span> machine${busy === 1 ? "" : "s"} working`
    : `<span class="hcount quiet">no machine</span> is running a round`);
  if(gone) bits.push(`<span class="hcount warn">${gone}</span> not reporting`);
  if(started) bits.push(`<span class="hcount">${started}</span> seeded job` +
    (started === 1 ? "" : "s") + " open");
  if(decide) bits.push(`<span class="hcount warn">${decide}</span> waiting on you`);
  if(FAILURES.length) bits.push(
    `<span class="hcount warn">${FAILURES.length}</span> failing`);
  return bits.join(" · ");
}

function homeButton(page, icon, name, subline, stripe){
  return `<button type="button" class="hbtn" data-go="${esc(page)}">
      <div class="hstripe" style="${stripe ? `background:${stripe}` : ""}"></div>
      <div class="hrow">
        <span class="hic">${icon}</span>
        <span class="hb"><span class="hname">${esc(name)}</span>
          <span class="hsubline">${subline}</span></span>
        <span class="hcar">›</span>
      </div>
    </button>`;
}

function renderHome(){
  return '<div class="home">'
    + homeButton("active", "▶", "Active", activeSummary())
    + homeButton("results", "✓", "Results",
        `<span class="hcount">${LEDGER.filter(completed).length}</span> ` +
        `completed · ${campaignProgress()}`, "var(--good)")
    + '</div>';
}

function paint(stamp){
  document.getElementById("page-home").innerHTML = renderHome();
  document.getElementById("page-active").innerHTML = renderActive();
  document.getElementById("page-results").innerHTML = renderResults();
  document.getElementById("stamp").textContent = stamp;
  document.getElementById("hsub").textContent =
    FLEET.length + " running · " + campaignProgress();
  document.getElementById("banner").hidden = true;
}

let LAST_SNAPSHOT = null;

function snapAge(d){
  try{
    const t = new Date(d.generated_at).getTime();
    if(isNaN(t)) return "";
    const secs = (Date.now() - t) / 1000;
    return secs < 0 ? "" : " · " + dur(secs) + " old";
  }catch(e){ return ""; }
}

function applySnapshot(d, source){
  if(!d || d.kind !== "goldbot.app.snapshot") return false;
  if(!Array.isArray(d.fleet) || !Array.isArray(d.ledger)) return false;
  FLEET = d.fleet;
  SEEDS = Array.isArray(d.seeds) ? d.seeds : [];
  FAILURES = Array.isArray(d.failures) ? d.failures : [];
  BUCKETS = Array.isArray(d.buckets) ? d.buckets : [];
  STATE_TEXT = (d.state_text && typeof d.state_text === "object") ? d.state_text : {};
  TIMELINES = Array.isArray(d.timelines) ? d.timelines : [];
  FILE_BASE = typeof d.reports_base === "string" ? d.reports_base : null;
  LEDGER = d.ledger.filter(x => x.epoch === EPOCH);
  /* HOW OLD IS WHAT YOU ARE LOOKING AT. A page that never says would sit on a
     nine-minute-old snapshot looking exactly like a live one -- which is what
     it did. Recomputed on every repaint, so the poll below keeps it honest. */
  LAST_SNAPSHOT = d;
  paint(source + " · " + fmtWhen(d.generated_at) + snapAge(d) +
        " · epoch " + EPOCH);
  return true;
}

/* TWO HOSTS, ONE PAGE.
   - As an ARTIFACT: read the runtime `db` store. An artifact's CSP blocks
     cross-origin fetch, so it can never reach the gist -- the snapshot is
     seeded into db from the Claude session instead, and onSnapshot repaints
     live when a new one is written.
   - On GITHUB PAGES: window.claude does not exist, so fall through and fetch
     the gist, which is the live path the phone uses.
   Trying db FIRST matters: on the artifact the gist fetch would fail silently
   and leave the page looking broken. */
async function fromArtifactDb(){
  try{
    if(!(window.claude && typeof window.claude.use === "function")) return false;
    const db = await window.claude.use("db");   // null = not granted/served
    if(!db) return false;
    const ref = db.doc("snapshot/current");
    const snap = await ref.get();
    let painted = snap.exists && applySnapshot(snap.data(), "artifact");
    if(!painted){
      showState("No snapshot in this artifact's store yet.<br><br>" +
                "Ask Claude to push one.");
      document.getElementById("stamp").textContent = "artifact · empty";
    }
    // Live: repaint whenever a new snapshot is written.
    ref.onSnapshot(s => { if(s.exists) applySnapshot(s.data(), "artifact"); },
                   () => {});
    return true;
  }catch(e){ return false; }
}

/* ONE FETCH WAS THE WHOLE PROBLEM. This ran once, at load, and nothing ever
   re-read the gist -- so an open page was frozen at whatever the snapshot said
   when you opened it. Telegram announced a round instantly while the app still
   read "idle", and refreshing by hand was the only cure. `?t=` made that single
   fetch cache-proof, which is exactly what made it look like it should refresh
   on its own.

   `first` keeps the failure text for the OPENING load only: once a snapshot has
   painted, a dropped poll (a phone that slept, a moment of no signal) must not
   wipe the screen -- the stamp is already saying how old the data is, and stale
   numbers beat an error page over the top of them. */
async function loadLive(first){
  if(!GIST_URL){
    if(first){
      showState("This page has no data source.<br><br>It needs the snapshot id in " +
                "the link: <b>#g=&lt;id&gt;</b><br>Open it from your saved shortcut.");
      document.getElementById("stamp").textContent = "no source";
    }
    return;
  }
  try{
    // ?t= defeats the raw URL's 5-minute CDN cache (verified 200).
    const r = await fetch(GIST_URL + "?t=" + Date.now(), {cache: "no-store"});
    if(!r.ok){
      if(first) showState("Snapshot unreachable — HTTP " + r.status + ".");
      return;
    }
    const d = await r.json();
    if(!applySnapshot(d, "live") && first){
      showState("The publisher has not written a snapshot yet.<br><br>" +
                "This page goes live on its own once it does.");
      document.getElementById("stamp").textContent = "waiting for first publish";
    }
  } catch(e){
    if(first){
      showState("Could not load the snapshot.<br><br>Offline, or the id in the " +
                "link is wrong.");
    }
  }
}

/* 20s, matching the publisher's own wake interval -- polling faster than the
   fleet can publish only spends battery. */
const POLL_MS = 20000;

(async () => {
  showState("Loading…");
  if(await fromArtifactDb()) return;
  await loadLive(true);

  setInterval(() => { if(!document.hidden) loadLive(false); }, POLL_MS);

  /* THE ONE THAT MATTERS ON A PHONE. A backgrounded tab is throttled hard and
     may not have polled for minutes, so the moment you look at it again is
     exactly when it is most likely to be wrong -- and exactly when you care. */
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden) loadLive(false);
  });

  /* The stamp ages between fetches, so it has to tick on its own or a page
     sitting open would keep claiming the data is as fresh as its last poll. */
  setInterval(() => {
    if(document.hidden || !LAST_SNAPSHOT) return;
    const el = document.getElementById("stamp");
    if(el) el.textContent = "live · " + fmtWhen(LAST_SNAPSHOT.generated_at) +
                            snapAge(LAST_SNAPSHOT) + " · epoch " + EPOCH;
  }, 5000);
})();

const PAGES = ["home", "active", "results"];
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b =>
      b.setAttribute("aria-selected", String(b === btn)));
    PAGES.forEach(p =>
      document.getElementById("page-" + p).hidden = (p !== btn.dataset.p));
    window.scrollTo(0, 0);
  });
});

/* A HOME BUTTON IS THE TAB IT NAMES. Routing it through `go()` rather than
   duplicating the show/hide means the tab bar's selected state follows a home
   tap -- otherwise the app would be on Active with Home still lit. */
function go(page){
  const btn = document.querySelector(`nav button[data-p="${page}"]`);
  if(btn) btn.click();
}

/* RESULTS NAVIGATION. Its own handler and its own attribute: [data-job] drives
   the ACTIVE tab, and reusing it here would have opening a finished job also
   change what the Active tab was showing. */
/* A CHIP INSIDE THE ROW BUTTON IS NOT THE ROW. Checked FIRST and returns, so
   tapping a regime chip narrows the list instead of opening the job underneath
   it -- which is the whole reason Trevor carved the chips out of the button. */
document.addEventListener("click", e => {
  const c = e.target.closest("[data-rfilter]");
  if(!c) return;
  e.stopPropagation();
  e.preventDefault();
  const [what, value] = String(c.dataset.rfilter).split(":");
  if(what === "sort"){
    RESULTS_SORT = RESULTS_SORT === "newest" ? "oldest" : "newest";
  } else if(what === "regime"){
    /* A TAP ON A ROW'S OWN CHIP JUMPS STRAIGHT TO THAT REGIME -- it is the
       fastest thing it could mean, and cycling from wherever the filter happens
       to be would make the same tap do different things on different rows. The
       control-row chip, which names no regime, cycles. */
    RESULTS_REGIME = value
      ? (RESULTS_REGIME === value ? null : value)
      : cycle(["BULL", "BEAR", "RANGING"], RESULTS_REGIME);
  } else if(what === "bucket"){
    RESULTS_BUCKET = value
      ? (String(RESULTS_BUCKET) === value ? null : value)
      : cycle(resultsBuckets(), RESULTS_BUCKET);
  }
  RESULTS_JOB = null;              // a narrowed list has no job open
  document.getElementById("page-results").innerHTML = renderResults();
  window.scrollTo(0, 0);
});

document.addEventListener("click", e => {
  const j = e.target.closest("[data-rjob]");
  if(!j) return;
  RESULTS_JOB = j.dataset.rjob || null;
  document.getElementById("page-results").innerHTML = renderResults();
  window.scrollTo(0, 0);
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if(b) go(b.dataset.go);
  const j = e.target.closest("[data-job]");
  if(j){
    // "" is the back button. Repaints ONLY the Active page: opening a job is
    // navigation, not new data, so nothing else should flicker.
    ACTIVE_JOB = j.dataset.job || null;
    document.getElementById("page-active").innerHTML = renderActive();
    window.scrollTo(0, 0);
  }
});

/* MOCKUP HANDLERS. THEY EDIT THE CARD IN PLACE and never repaint a page.
   The first cut called renderActive(), which is correct in the app and wrong
   everywhere else: the format preview builds its own page out of these cards,
   so repainting Active deleted the very card being tapped. Touching only the
   nodes inside this .pick block works in both, and in the app it also stops a
   tap on one machine's card from flickering every other machine's. */
function syncPick(scope, key, value){
  PICKED[key] = value;
  scope.querySelectorAll("[data-pick]").forEach(r =>
    r.classList.toggle("on", value != null &&
                       Number(r.dataset.pass) === Number(value)));
  const btn = scope.querySelector("[data-apply]");
  if(btn){
    btn.disabled = value == null;
    btn.textContent = value == null ? "Pick a pass to apply"
                                    : "Apply pass " + value;
  }
}

document.addEventListener("click", e => {
  const row = e.target.closest("[data-pick]");
  if(row){
    const scope = row.closest(".pick");
    /* ONE VALUE, NOT TWO -- the typed field is cleared, so the card can never
       show a highlighted row and a different number in the box at once. */
    const inp = scope.querySelector("[data-pickin]");
    if(inp) inp.value = "";
    syncPick(scope, row.dataset.pick, Number(row.dataset.pass));
    return;
  }
  const ap = e.target.closest("[data-apply]");
  if(ap && !ap.disabled){
    const n = PICKED[ap.dataset.apply];
    const box = ap.parentElement;
    /* WHAT IT WOULD SAY, not what it did. The preview must not imply a round
       was applied -- nothing was sent, and there is nowhere to send it. */
    box.innerHTML = `<div class="pickhd">⏸ Round finished — pick a pass</div>` +
      `<div class="pickdone">✓ Pass ${n} would be applied here, and the two
        post-round backtests queued. <b>Nothing was sent</b> — this page has no
        write path to the machines yet.</div>`;
  }
});

document.addEventListener("input", e => {
  const inp = e.target.closest("[data-pickin]");
  if(!inp) return;
  const v = inp.value.trim();
  syncPick(inp.closest(".pick"), inp.dataset.pickin, v === "" ? null : Number(v));
});

/* OPEN THE TASK CARD. Separate from [data-toggle] because the row contains
   report buttons and a [data-toggle] of their own -- a single handler would
   open the card every time one of those was tapped. */
document.addEventListener("click", e => {
  if(e.target.closest(".rbtn")) return;      // a report button is not the row
  const row = e.target.closest("[data-task]");
  if(!row) return;
  const card = row.querySelector(".task");
  if(!card) return;
  card.hidden = !card.hidden;
  row.classList.toggle("open", !card.hidden);
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if(!t) return;
  const body = t.nextElementSibling;
  if(!body) return;
  body.hidden = !body.hidden;
  // The report buttons carry no caret -- they are the disclosure themselves.
  const car = t.querySelector(".car");
  if(car) car.textContent = body.hidden ? "▾" : "▴";
});
</script>
