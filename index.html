/* Money per 1.0 of price, for this position: the broker's tick value when it
   is the chart's symbol, else read back off the position's own profit. */
function lvPerPoint(p){
  const s = (LV.data && LV.data.symbol) || {};
  const tv = Number(s.tick_value), ts = Number(s.tick_size);
  if(p.symbol === s.name && tv > 0 && ts > 0) return tv / ts * Number(p.volume);
  const mv = (Number(p.price) - Number(p.entry_price)) * (p.dir === "buy" ? 1 : -1);
  return Math.abs(mv) > 1e-9 ? Number(p.profit) / mv : null;
}
/* WHAT THE STOP WOULD CLOSE THE TRADE AT, in money. Trevor, 2026-09-25: the
   stop "should be the one that eventually kills the trade in profit or loss."
   The EA sends no take-profit (TP is 0 on every order and every modify), so
   unless it closes on a signal, this IS the trade's result. Swap is included;
   slippage past the stop is not, so it reads "about". */
function lvStopPnl(p){
  const v = lvPerPoint(p), sl = Number(p.sl);
  if(!v || !sl) return null;
  return (sl - Number(p.entry_price)) * (p.dir === "buy" ? 1 : -1) * v + Number(p.swap || 0);
}

function lvOpenCard(p){
  const t = esc(p.ticket), sl = Number(p.sl), tp = Number(p.tp);
  const stopPnl = lvStopPnl(p);
  let head, line = "";
  if(!sl){
    head = `<span class="lv-pill risk">No stop</span>`;
    line = "This trade has no stop at the broker. Nothing closes it automatically.";
  } else {
    const kind = stopPnl == null ? "" : Math.abs(stopPnl) < 0.005 ? "Break-even"
               : stopPnl > 0 ? "Locks " + lvMoney(stopPnl) : "Risks " + lvMoney(stopPnl);
    head = `<span class="lv-v">${lvPx(sl)}</span>` +
      (kind ? `<span class="lv-pill ${stopPnl > 0 ? "on" : stopPnl < 0 ? "risk" : "off"}">${kind}</span>` : "");
    const trail = Array.isArray(p.sl_trail) ? p.sl_trail : [];
    const moves = Math.max(0, trail.length - 1);
    const init = Number(p.sl_initial);
    line = init && Math.abs(init - sl) > 1e-9
      ? `Started at <b>${lvPx(init)}</b> and moved ${moves || "at least once"}${moves ? (moves === 1 ? " time" : " times") : ""}. `
      : "Where the EA placed it at entry. ";
    line += "This is the stop that closes the trade; the EA only ever tightens it. " +
            `<span id="lvo-${t}-room"></span>`;
  }
  const g = p.sl_gap;
  const gap = g ? `<div class="lv-note warn">The broker refused the EA's last stop move` +
      (g.target_sl ? ` to <b>${lvPx(g.target_sl)}</b>` : "") + (g.since ? ` (${lvWhen(g.since)})` : "") +
      `. The stop shown is still the one that would close the trade; the EA tries again on every tick.</div>`
    : "";
  return `<div class="card lv-otrade">
    <div class="lv-orow">${lvDirTag(p.dir)}<span class="lv-dir">${Number(p.volume).toFixed(2)} lot</span>` +
      `${lvRegTag(p.regime)}${p.bucket != null ? bktEl(p.bucket) : ""}` +
      `<span class="lv-oage" id="lvo-${t}-age"></span></div>
    <div class="lv-opnl"><span class="lv-big" id="lvo-${t}-pnl"></span>` +
      `<span class="lv-sub" id="lvo-${t}-move"></span></div>
    <div class="lv-stop">
      <div class="lv-stophead"><span class="lv-k">Stop</span>${head}</div>
      <div class="lv-line">${line}</div>
      ${sl ? `<div class="lv-gauge" id="lvo-${t}-gauge" aria-hidden="true"></div>
      <div class="lv-glabels"><span><i class="lv-sw stop"></i>stop</span><span><i class="lv-sw entry"></i>entry</span>` +
        `<span><i class="lv-sw now"></i>price</span></div>` : ""}
      ${tp ? `<div class="lv-line">Target at the broker: <b>${lvPx(tp)}</b>.</div>` : ""}
    </div>
    ${gap}
    <div class="lv-ogrid">
      <div><span class="lv-k">Entry</span><span class="lv-v">${lvPx(p.entry_price)}</span></div>
      <div><span class="lv-k">Now</span><span class="lv-v" id="lvo-${t}-now"></span></div>
      <div><span class="lv-k">Opened</span><span class="lv-v">${lvWhen(p.entry_time)}</span></div>
    </div>
    <button type="button" class="lv-link" data-lvfocus="p${t}">Show stop on chart</button>
  </div>`;
}

/* The numbers that move every second, written into the card that is there. */
function lvOpenLive(p){
  const t = String(p.ticket), $ = id => document.getElementById("lvo-" + t + "-" + id);
  const pnl = Number(p.profit || 0) + Number(p.swap || 0);
  const dir = p.dir === "buy" ? 1 : -1;
  const move = (Number(p.price) - Number(p.entry_price)) * dir;
  const e = $("pnl"); if(e){ e.textContent = lvMoney(pnl); e.className = "lv-big " + lvTone(pnl); }
  const m = $("move"); if(m) m.textContent = lvSigned(move) + " from entry";
  const a = $("age"); if(a) a.textContent = "open " + lvSpan(lvNow() - Number(p.entry_time));
  const n = $("now"); if(n) n.textContent = lvPx(p.price);
  const sl = Number(p.sl);
  const room = $("room");
  if(room && sl){
    const gap = (Number(p.price) - sl) * dir;
    room.textContent = gap > 0 ? `The price is ${gap.toFixed(2)} away from it.`
                               : "The price is at or through it.";
  }
  const g = $("gauge");
  if(g && sl){
    /* One axis for everything that matters: where it started, the stop now,
       the entry and the price. The shaded run is the money at the stop --
       green when the stop has already locked in a profit, red when a loss. */
    const vals = [sl, Number(p.entry_price), Number(p.price)];
    const init = Number(p.sl_initial);
    if(init) vals.push(init);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = Math.max((hi - lo) * 0.12, 0.5);
    lo -= pad; hi += pad;
    const pct = v => ((v - lo) / (hi - lo) * 100).toFixed(2);
    const locked = (sl - Number(p.entry_price)) * dir > 0;
    const s = pct(sl), en = pct(Number(p.entry_price)), pr = pct(Number(p.price));
    g.innerHTML =
      `<div class="fill" style="left:${Math.min(s, en)}%;width:${Math.abs(s - en).toFixed(2)}%;` +
      `background:${locked ? LV_C.good : LV_C.bad};opacity:.45"></div>` +
      (init && Math.abs(init - sl) > 1e-9 ? `<div class="init" style="left:${pct(init)}%"></div>` : "") +
      `<div class="tick" style="left:${en}%"></div>` +
      `<div class="stopmk" style="left:${s}%;background:${locked ? LV_C.good : LV_C.bad}"></div>` +
      `<div class="now" style="left:${pr}%"></div>`;
  }
}

const LV_HF = [["today", "Today"], ["week", "Week"], ["month", "Month"], ["all", "All"]];
function lvHistoryRows(){
  const now = lvNow();
  const from = LV.hf === "today" ? lvDayStart() : LV.hf === "week" ? now - 7 * 86400
             : LV.hf === "month" ? now - 30 * 86400 : -Infinity;
  return lvTrades().filter(t => Number(t.exit_time) >= from);
}
function lvPaintHistory(){
  const hf = document.getElementById("lvhf"), sum = document.getElementById("lvhsum"),
        list = document.getElementById("lvhist");
  if(!hf || !sum || !list) return;
  hf.innerHTML = LV_HF.map(([k, l]) =>
    `<button type="button" class="lv-hfb" data-lvhf="${k}" aria-pressed="${LV.hf === k}">${l}</button>`).join("");
  if(!LV.data){ sum.innerHTML = ""; list.innerHTML = ""; list.hidden = true; return; }
  const rows = lvHistoryRows();
  const won = rows.filter(t => Number(t.profit) > 0);
  const gw = won.reduce((s, t) => s + Number(t.profit), 0);
  const gl = -rows.filter(t => Number(t.profit) < 0).reduce((s, t) => s + Number(t.profit), 0);
  const net = gw - gl;
  sum.innerHTML = rows.length
    ? `<b>${rows.length}</b> trades · <b>${won.length}</b> won ` +
      `(${Math.round(won.length / rows.length * 100)}%) · PF <b>${gl > 0 ? (gw / gl).toFixed(2) : "—"}</b>` +
      ` · net <b class="${lvTone(net)}">${lvMoney(net)}</b>`
    : (lvTrades().length ? "Nothing closed in this range." : "No closed trades on this account yet.");
  const shown = rows.slice(0, 100);
  list.innerHTML = shown.map(t => {
    const id = "t" + t.position;
    return `<button type="button" class="lv-hrow" data-lvfocus="${esc(id)}" aria-current="${LV.sel === id}">
      <span class="lv-hl1">${lvDirTag(t.dir)}${lvRegTag(t.regime)}${t.bucket != null ? bktEl(t.bucket) : ""}` +
        `<span class="lv-when">${lvWhen(t.entry_time)} · ${lvSpan(Number(t.exit_time) - Number(t.entry_time))}</span></span>
      <span class="lv-hpnl ${lvTone(Number(t.profit))}">${lvMoney(t.profit)}</span>
      <span class="lv-hl2">${lvPx(t.entry_price)} → ${lvPx(t.exit_price)}</span>
      <span class="lv-hwhy">${lvReason(t)}</span>
    </button>`;
  }).join("") + (rows.length > shown.length
    ? `<div class="lv-line" style="padding:9px 13px">Showing the newest ${shown.length} of ${rows.length}.</div>` : "");
  list.hidden = !shown.length;
}

/* ---------- the chart ---------- */
function lvLib(){
  if(window.LightweightCharts) return Promise.resolve(window.LightweightCharts);
  if(LV_LIB_P) return LV_LIB_P;
  LV_LIB_P = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = LV_LIB;
    s.integrity = LV_LIB_SRI;
    s.crossOrigin = "anonymous";
    s.async = true;
    s.onload = () => window.LightweightCharts ? resolve(window.LightweightCharts)
                                              : reject(new Error("no chart global"));
    s.onerror = () => { LV_LIB_P = null; reject(new Error("could not load")); };
    document.head.appendChild(s);
  });
  return LV_LIB_P;
}
function lvEnsureChart(){
  if(LV.chart) return Promise.resolve(true);
  if(LV.chartP) return LV.chartP;
  LV.chartP = (async () => {
    let LC;
    try{ LC = await lvLib(); }
    catch(e){
      const box = document.getElementById("lvchart");
      if(box) box.innerHTML = '<div class="empty">The chart library could not be loaded from ' +
        'jsdelivr, so there is no chart. Everything else on this page still works.</div>';
      LV.chartP = null;
      return false;
    }
    const box = document.getElementById("lvchart");
    if(!box){ LV.chartP = null; return false; }
    LV.LC = LC;
    LV.chart = LC.createChart(box, {
      autoSize: true,
      layout: {background: {type: "solid", color: LV_C.card}, textColor: LV_C.dim, fontSize: 11,
               fontFamily: "Roboto Mono, ui-monospace, monospace", attributionLogo: false},
      grid: {vertLines: {color: LV_C.grid}, horzLines: {color: LV_C.grid}},
      rightPriceScale: {borderColor: LV_C.line, scaleMargins: {top: 0.12, bottom: 0.11}},
      timeScale: {borderColor: LV_C.line, timeVisible: true, secondsVisible: false,
                  rightOffset: 4, barSpacing: 6},
      crosshair: {mode: LC.CrosshairMode.Normal,
                  vertLine: {color: LV_C.faint, labelBackgroundColor: LV_C.card2},
                  horzLine: {color: LV_C.faint, labelBackgroundColor: LV_C.card2}},
      /* A vertical swipe scrolls the PAGE; only sideways drags pan the chart. */
      handleScroll: {vertTouchDrag: false},
    });
    LV.path = LV.chart.addLineSeries({lineWidth: 2, lineStyle: LC.LineStyle.Dashed,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false});
    LV.band = LV.chart.addHistogramSeries({priceScaleId: "band", priceLineVisible: false,
      lastValueVisible: false, base: 0});
    LV.trail = LV.chart.addLineSeries({lineType: LC.LineType.WithSteps, lineWidth: 2,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false});
    LV.chart.priceScale("band").applyOptions({scaleMargins: {top: 0.945, bottom: 0}, visible: false});
    lvMakeSeries();
    LV.chart.subscribeCrosshairMove(p => {
      const b = p && p.seriesData && LV.series ? p.seriesData.get(LV.series) : null;
      lvOhlc(b || lvLastBar());
    });
    return true;
  })();
  return LV.chartP;
}
function lvDestroyChart(){
  if(LV.chart){ try{ LV.chart.remove(); }catch(e){} }
  LV.chart = LV.chartP = LV.series = LV.band = LV.path = LV.trail = null;
  LV.lines = []; LV.sig = "";
}
function lvMakeSeries(){
  if(!LV.chart) return;
  if(LV.series){ LV.chart.removeSeries(LV.series); LV.lines = []; }
  /* THE OPEN TRADE'S STOP AND TARGET STAY ON THE SCALE. Autoscale fits the
     candles only, so a stop a few dollars under the last hour's low was drawn
     off the chart. Widened only while the newest candle is in view -- scrolled
     back through last month, the old prices are what should fill the height. */
  const common = {upColor: LV_C.good, downColor: LV_C.bad, priceLineColor: LV_C.dim,
                  priceFormat: {type: "price", precision: 2, minMove: 0.01},
                  autoscaleInfoProvider: original => {
                    const res = original(), ext = lvLineExtent();
                    if(!res || !res.priceRange || !ext) return res;
                    return {priceRange: {minValue: Math.min(res.priceRange.minValue, ext[0]),
                                         maxValue: Math.max(res.priceRange.maxValue, ext[1])},
                            margins: res.margins};
                  }};
  LV.series = LV.style === "bars"
    ? LV.chart.addBarSeries(Object.assign({thinBars: false}, common))
    : LV.chart.addCandlestickSeries(Object.assign({borderVisible: false,
        wickUpColor: LV_C.good, wickDownColor: LV_C.bad}, common));
  LV.sig = "";
  lvSetSeriesData(false);
}
function lvBars(){ const c = LV.bars[LV.tf]; return c && Array.isArray(c.bars) ? c.bars : []; }
function lvShowLatest(){
  const n = lvBars().length, box = document.getElementById("lvchart");
  if(!LV.chart || !n) return;
  const k = Math.max(30, Math.floor(((box && box.clientWidth) || 320) / 6));
  LV.chart.timeScale().setVisibleLogicalRange({from: n - k, to: n + 4});
}
function lvLineExtent(){
  if(!LV.chart) return null;
  const r = LV.chart.timeScale().getVisibleLogicalRange(), n = lvBars().length;
  if(!r || !n || r.to < n - 1) return null;
  const vals = [];
  lvChartTrades().filter(t => t.open).forEach(t =>
    [t.entry_price, LV.showStop ? t.sl : 0, t.tp].forEach(v => { if(Number(v)) vals.push(Number(v)); }));
  return vals.length ? [Math.min(...vals), Math.max(...vals)] : null;
}
function lvLastBar(){ const b = lvBars(); return b.length ? b[b.length - 1] : null; }
function lvIdx(arr, t){
  let lo = 0, hi = arr.length - 1;
  if(hi < 0 || t < arr[0].time) return -1;
  while(lo < hi){ const mid = (lo + hi + 1) >> 1; if(arr[mid].time <= t) lo = mid; else hi = mid - 1; }
  return lo;
}
/* A trade's time, moved onto a bar that exists on this timeframe. Anything the
   loaded bars do not reach is left off rather than pinned to the wrong candle. */
function lvSnap(t){
  const arr = lvBars(), i = lvIdx(arr, Number(t));
  return i < 0 ? null : arr[i].time;
}
function lvRegimeAt(t){
  const runs = LV.runs;
  if(!runs || !runs.length || t < runs[0][0]) return null;
  let lo = 0, hi = runs.length - 1;
  while(lo < hi){ const mid = (lo + hi + 1) >> 1; if(runs[mid][0] <= t) lo = mid; else hi = mid - 1; }
  return runs[lo][1];
}
function lvBandPoint(b){
  const r = lvRegimeAt(b.time);
  return {time: b.time, value: 1, color: (r && LV_BAND[r]) || "rgba(0,0,0,0)"};
}
function lvBandData(){ return lvBars().map(lvBandPoint); }
function lvApplyBars(tf, bars){
  const old = LV.bars[tf] && LV.bars[tf].bars;
  LV.bars[tf] = {at: Date.now(), bars};
  if(!LV.series || LV.tf !== tf) return;
  /* A refresh that continues the series is applied as UPDATES, so the chart
     keeps the place you scrolled to; anything else is a reload. */
  if(old && old.length && bars.length && bars[0].time <= old[old.length - 1].time){
    const lastT = old[old.length - 1].time;
    bars.filter(b => b.time >= lastT).forEach(b => {
      LV.series.update(b);
      LV.band.update(lvBandPoint(b));
    });
    lvMarks(true);
  } else lvSetSeriesData(!!(old && old.length));   // a first load: the caller decides the view
}
function lvSetSeriesData(fit){
  if(!LV.series) return;
  const bars = lvBars();
  LV.series.setData(bars);
  LV.band.setData(lvBandData());
  lvMarks(true);
  lvOhlc(lvLastBar());
  /* NOT scrollToRealTime(): it ANIMATES, so it finished after a trade tap had
     centred the chart and threw the chart back to the newest candles. Found in
     testing; an immediate range cannot be overtaken. */
  if(fit) lvShowLatest();
  const box = document.getElementById("lvchart");
  const c = LV.bars[LV.tf];
  if(box) box.title = c && c.err ? "No bars: " + c.err : "";
}
/* Every second: move the forming candle, and redraw the marks only when trades,
   positions, stops or the selection changed -- a trailing stop moves. */
function lvChartLive(){
  const d = LV.data, f = d && d.forming && d.forming[LV.tf];
  const arr = lvBars();
  if(f && arr.length && f[0] >= arr[arr.length - 1].time){
    const bar = {time: f[0], open: f[1], high: f[2], low: f[3], close: f[4]};
    if(bar.time === arr[arr.length - 1].time) arr[arr.length - 1] = bar; else arr.push(bar);
    LV.series.update(bar);
    LV.band.update(lvBandPoint(bar));
    lvOhlc(bar);
  }
  lvMarks(false);
  lvTrailLive();
}
function lvChartTrades(){
  const sym = LV.data && LV.data.symbol && LV.data.symbol.name;
  const closed = lvTrades().filter(t => !sym || t.symbol === sym)
    .map(t => ({id: "t" + t.position, dir: t.dir, entry_time: t.entry_time, entry_price: t.entry_price,
                exit_time: t.exit_time, exit_price: t.exit_price, profit: Number(t.profit)}));
  const open = lvPositions().filter(p => !sym || p.symbol === sym)
    .map(p => ({id: "p" + p.ticket, dir: p.dir, entry_time: p.entry_time, entry_price: p.entry_price,
                open: true, price: p.price, sl: p.sl, tp: p.tp, pos: p,
                profit: Number(p.profit || 0) + Number(p.swap || 0)}));
  return closed.concat(open);
}
/* THE STOP'S PATH: a step line from the entry's stop, through every ratchet the
   EA's heartbeat recorded, to the broker's stop right now -- red while a hit
   would lose money, green once it would lock a profit. Snapped onto this
   timeframe's candles; a step before the first loaded candle is carried in. */
function lvTrailData(t){
  const arr = lvBars();
  if(!t || !arr.length) return [];
  const pts = (Array.isArray(t.pos.sl_trail) ? t.pos.sl_trail : []).slice().sort((a, b) => a[0] - b[0]);
  const out = [];
  let carry = null;
  pts.forEach(([time, sl]) => {
    const s = lvSnap(time);
    if(s == null){ carry = sl; return; }
    if(carry != null && !out.length && s > arr[0].time) out.push({time: arr[0].time, value: carry});
    carry = null;
    if(out.length && out[out.length - 1].time === s) out[out.length - 1].value = sl;
    else out.push({time: s, value: sl});
  });
  if(!out.length && carry != null) out.push({time: arr[0].time, value: carry});
  const last = arr[arr.length - 1].time, live = Number(t.sl);
  if(live){
    if(out.length && out[out.length - 1].time === last) out[out.length - 1].value = live;
    else if(!out.length || out[out.length - 1].time < last) out.push({time: last, value: live});
  }
  const dir = t.dir === "buy" ? 1 : -1, entry = Number(t.entry_price);
  out.forEach(p => { p.color = (p.value - entry) * dir > 0 ? LV_C.good : LV_C.bad; });
  return out;
}
function lvStopTrade(list){
  return (list || lvChartTrades()).find(t => t.open && Number(t.sl));
}
function lvMarks(force){
  if(!LV.series) return;
  const list = lvChartTrades();
  const sig = JSON.stringify([LV.tf, LV.sel, LV.showStop, lvBars().length ? lvBars()[0].time : 0,
    list.map(t => [t.id, t.exit_time || 0, t.sl || 0, t.tp || 0,
                   t.pos ? (t.pos.sl_trail || []).length : 0])]);
  if(force || sig !== LV.sig){
    LV.sig = sig;
    const marks = [];
    list.forEach(t => {
      const sel = LV.sel === t.id;
      const a = lvSnap(t.entry_time);
      if(a != null) marks.push({time: a, position: t.dir === "buy" ? "belowBar" : "aboveBar",
        color: LV_C.gold, shape: t.dir === "buy" ? "arrowUp" : "arrowDown", size: sel ? 1.6 : 1,
        text: sel ? (t.dir === "buy" ? "BUY " : "SELL ") + lvPx(t.entry_price) : ""});
      if(!t.open){
        const b = lvSnap(t.exit_time);
        if(b != null) marks.push({time: b, position: "inBar", color: t.profit >= 0 ? LV_C.good : LV_C.bad,
          shape: "circle", size: sel ? 1.3 : 0.7, text: sel ? lvMoney(t.profit) : ""});
      }
    });
    marks.sort((x, y) => x.time - y.time);
    LV.series.setMarkers(marks);
    LV.lines.forEach(l => { try{ LV.series.removePriceLine(l); }catch(e){} });
    LV.lines = [];
    const LS = LV.LC.LineStyle;
    list.filter(t => t.open).forEach(t => {
      LV.lines.push(LV.series.createPriceLine({price: Number(t.entry_price), color: LV_C.gold, lineWidth: 1,
        lineStyle: LS.Solid, axisLabelVisible: true, title: t.dir === "buy" ? "BUY" : "SELL"}));
      /* THE STOP, labelled with what a hit would close the trade at -- the
         number Trevor asked to see. Solid and heavier than the rest: of every
         line here, it is the one that ends the trade. */
      if(LV.showStop && Number(t.sl)){
        const at = lvStopPnl(t.pos);
        LV.lines.push(LV.series.createPriceLine({price: Number(t.sl),
          color: at != null && at > 0 ? LV_C.good : LV_C.bad, lineWidth: 2, lineStyle: LS.Solid,
          axisLabelVisible: true, title: "SL " + (at != null ? lvMoney(at) : "")}));
      }
      if(Number(t.tp)) LV.lines.push(LV.series.createPriceLine({price: Number(t.tp), color: LV_C.good,
        lineWidth: 1, lineStyle: LS.Dashed, axisLabelVisible: true, title: "TP"}));
    });
    if(LV.trail){
      const st = LV.showStop ? lvStopTrade(list) : null;
      LV.trail.setData(st ? lvTrailData(st) : []);
    }
  }
  lvPath(list);
}
/* Every second: the trail's last step follows the broker's stop. */
function lvTrailLive(){
  if(!LV.trail || !LV.showStop) return;
  const t = lvStopTrade(), last = lvLastBar();
  if(!t || !last) return;
  const dir = t.dir === "buy" ? 1 : -1, sl = Number(t.sl);
  try{
    LV.trail.update({time: last.time, value: sl,
                     color: (sl - Number(t.entry_price)) * dir > 0 ? LV_C.good : LV_C.bad});
  }catch(e){ /* an older point than the trail's last: the next setData fixes it */ }
}
/* The selected trade, entry to exit (or to now), as a dashed line. */
function lvPath(list){
  if(!LV.path) return;
  const t = (list || lvChartTrades()).find(x => x.id === LV.sel);
  const a = t ? lvSnap(t.entry_time) : null;
  const last = lvLastBar();
  const b = t ? (t.open ? (last && last.time) : lvSnap(t.exit_time)) : null;
  if(!t || a == null || b == null || b <= a){ LV.path.setData([]); return; }
  LV.path.applyOptions({color: t.profit >= 0 ? LV_C.good : LV_C.bad});
  LV.path.setData([{time: a, value: Number(t.entry_price)},
                   {time: b, value: Number(t.open ? t.price : t.exit_price)}]);
}
function lvOhlc(bar){
  const el = document.getElementById("lvohlc");
  if(!el) return;
  if(!bar){ el.textContent = lvBars().length ? "" : "No bars yet on this timeframe."; return; }
  const ch = bar.close - bar.open;
  el.innerHTML = `${lvBarWhen(bar.time)} O <b>${lvPx(bar.open)}</b> H <b>${lvPx(bar.high)}</b> ` +
                 `L <b>${lvPx(bar.low)}</b> C <b class="${lvTone(ch)}">${lvPx(bar.close)}</b>`;
}
async function lvSetTf(tf, keepView){
  LV.viewGen++;
  LV.tf = tf;
  lvPaintControls();
  if(!LV.series) return;
  await lvMaybeBars();
  lvSetSeriesData(!keepView);

/* Tap a trade: a timeframe that fits how long it lasted AND still reaches back
   to it, then the chart centred on it. */
async function lvFocus(id){
  const t = lvChartTrades().find(x => x.id === id);
  if(!t) return;
  LV.viewGen++;
  LV.sel = id;
  lvPaintHistory();
  const end = t.open ? lvNow() : Number(t.exit_time);
  const span = end - Number(t.entry_time), age = lvNow() - Number(t.entry_time);
  let i = LV_TFS.indexOf(span <= 75 * 60 ? "M1" : span <= 6 * 3600 ? "M5"
                        : span <= 18 * 3600 ? "M15" : span <= 5 * 86400 ? "H1" : "H4");
  while(i < LV_TFS.length - 1 && age > LV_TF_REACH[LV_TFS[i]]) i++;
  document.getElementById("lvchartcard").scrollIntoView(
    {behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  if(!(await lvEnsureChart())) return;
  await lvSetTf(LV_TFS[i], true);
  /* Still before the first loaded bar? One timeframe up, until it fits. */
  while(i < LV_TFS.length - 1 && lvSnap(t.entry_time) == null){ i++; await lvSetTf(LV_TFS[i], true); }
  const arr = lvBars();
  const a = lvIdx(arr, Number(t.entry_time));
  const b = t.open ? arr.length - 1 : lvIdx(arr, Number(t.exit_time));
  if(a >= 0){
    const pad = Math.max(8, Math.round(Math.max(12, b - a) * 0.5));
    LV.chart.timeScale().setVisibleLogicalRange({from: a - pad, to: b + pad});
  }
  lvMarks(true);
}

function paint(stamp){
  document.getElementById("page-home").innerHTML = renderHome();
  document.getElementById("page-active").innerHTML = renderActive();
  document.getElementById("page-results").innerHTML = renderResults();
  document.getElementById("page-settings").innerHTML = renderSettings();
  repaintSchedule();
  /* The snapshot's age and the PAGE's build are different questions, and only
     one of them was ever on screen. A stale snapshot under a current app and a
     current snapshot under a stale app look identical without this. */
  document.getElementById("stamp").textContent = stamp + " · app " + APP_BUILD;
  document.getElementById("hsub").textContent =
    FLEET.length + " running · " + campaignProgress();
  document.getElementById("banner").hidden = true;
}

let LAST_SNAPSHOT = null;

function snapAge(d){
  try{
    const t = new Date(d.generated_at).getTime();
    if(isNaN(t)) return "";
    const secs = (Date.now() - t) / 1000;
    return secs < 0 ? "" : " · " + dur(secs) + " old";
  }catch(e){ return ""; }
}

/* ONE ROW PER MACHINE, the newest beacon winning. The publisher emits one entry
   per beacon FILE, and OneDrive keeps a conflict copy as a second file with the
   same machine inside (`Kylee-DESKTOP-8U429RL.beacon`), so on 2026-09-23 Kylee
   was listed twice: once live, once "not reporting - last seen 43.7h". The
   scheduler already collapses these by machine (presence.read_beacons); this is
   the same rule, here because an older publisher keeps sending the duplicates
   until its tray updates. Order is kept. */
function oneRowPerMachine(list){
  const best = new Map();
  list.forEach(f => {
    if(!f || !f.machine) return;
    const prev = best.get(f.machine);
    if(!prev || (Number(f.beat_at) || 0) > (Number(prev.beat_at) || 0))
      best.set(f.machine, f);
  });
  return list.filter(f => f && f.machine && best.get(f.machine) === f);
}

function applySnapshot(d, source){
  if(!d || d.kind !== "goldbot.app.snapshot") return false;
  if(!Array.isArray(d.fleet) || !Array.isArray(d.ledger)) return false;
  FLEET = oneRowPerMachine(d.fleet);
  AGENTEFF = d.agent_efficiency || {};
  AGENTCONTRIB = d.agent_contribution || {};
  SEEDS = Array.isArray(d.seeds) ? d.seeds : [];
  FAILURES = Array.isArray(d.failures) ? d.failures : [];
  BUCKETS = Array.isArray(d.buckets) ? d.buckets : [];
  /* 2026-09-18 -- the Settings badge. Absent on a snapshot from a machine
     whose runtime predates them, which must read as "nothing to show"
     rather than as "nothing is set": the badge says which. */
  LEASES = Array.isArray(d.leases) ? d.leases : [];
  if(d.settings && d.settings.bucket_priority) SETTINGS_STATE = d.settings;
  if(d.settings && d.settings.schedule_vocab) VOCAB = d.settings.schedule_vocab;
  STATE_TEXT = (d.state_text && typeof d.state_text === "object") ? d.state_text : {};
  TIMELINES = Array.isArray(d.timelines) ? d.timelines : [];
  /* 2026-09-23 -- every backtest's balance line, oldest first. Absent on a
     snapshot from an older publisher, which leaves the badge saying so. */
  CURVES = Array.isArray(d.curves) ? d.curves : [];
  QUEUE = Array.isArray(d.queue) ? d.queue : null;
  QUEUE_HELD = (d.queue_held && typeof d.queue_held === "object") ? d.queue_held : {};
  PICKS = Array.isArray(d.pending_picks) ? d.pending_picks : [];
  FILE_BASE = typeof d.reports_base === "string" ? d.reports_base : null;
  LEDGER = d.ledger.filter(x => x.epoch === EPOCH);
  /* HOW OLD IS WHAT YOU ARE LOOKING AT. A page that never says would sit on a
     nine-minute-old snapshot looking exactly like a live one -- which is what
     it did. Recomputed on every repaint, so the poll below keeps it honest. */
  LAST_SNAPSHOT = d;
  paint(source + " · " + fmtWhen(d.generated_at) + snapAge(d) +
        " · epoch " + EPOCH);
  return true;
}

/* TWO HOSTS, ONE PAGE.
   - As an ARTIFACT: read the runtime `db` store. An artifact's CSP blocks
     cross-origin fetch, so it can never reach the gist -- the snapshot is
     seeded into db from the Claude session instead, and onSnapshot repaints
     live when a new one is written.
   - On GITHUB PAGES: window.claude does not exist, so fall through and fetch
     the gist, which is the live path the phone uses.
   Trying db FIRST matters: on the artifact the gist fetch would fail silently
   and leave the page looking broken. */
async function fromArtifactDb(){
  try{
    if(!(window.claude && typeof window.claude.use === "function")) return false;
    const db = await window.claude.use("db");   // null = not granted/served
    if(!db) return false;
    const ref = db.doc("snapshot/current");
    const snap = await ref.get();
    let painted = snap.exists && applySnapshot(snap.data(), "artifact");
    if(!painted){
      showState("No snapshot in this artifact's store yet.<br><br>" +
                "Ask Claude to push one.");
      document.getElementById("stamp").textContent = "artifact · empty";
    }
    // Live: repaint whenever a new snapshot is written.
    ref.onSnapshot(s => { if(s.exists) applySnapshot(s.data(), "artifact"); },
                   () => {});
    return true;
  }catch(e){ return false; }
}

/* ONE FETCH WAS THE WHOLE PROBLEM. This ran once, at load, and nothing ever
   re-read the gist -- so an open page was frozen at whatever the snapshot said
   when you opened it. Telegram announced a round instantly while the app still
   read "idle", and refreshing by hand was the only cure. `?t=` made that single
   fetch cache-proof, which is exactly what made it look like it should refresh
   on its own.

   `first` keeps the failure text for the OPENING load only: once a snapshot has
   painted, a dropped poll (a phone that slept, a moment of no signal) must not
   wipe the screen -- the stamp is already saying how old the data is, and stale
   numbers beat an error page over the top of them. */
async function loadLive(first){
  if(!GIST_URL){
    if(first){
      showState("This page has no data source.<br><br>It needs the snapshot id in " +
                "the link: <b>#g=&lt;id&gt;</b><br>Open it from your saved shortcut.");
      document.getElementById("stamp").textContent = "no source";
    }
    return;
  }
  try{
    // ?t= defeats the raw URL's 5-minute CDN cache (verified 200).
    const r = await fetch(GIST_URL + "?t=" + Date.now(), {cache: "no-store"});
    if(!r.ok){
      if(first) showState("Snapshot unreachable — HTTP " + r.status + ".");
      return;
    }
    const d = await r.json();
    if(!applySnapshot(d, "live") && first){
      showState("The publisher has not written a snapshot yet.<br><br>" +
                "This page goes live on its own once it does.");
      document.getElementById("stamp").textContent = "waiting for first publish";
    }
  } catch(e){
    if(first){
      showState("Could not load the snapshot.<br><br>Offline, or the id in the " +
                "link is wrong.");
    }
  }
}

/* 20s, matching the publisher's own wake interval -- polling faster than the
   fleet can publish only spends battery. */
const POLL_MS = 20000;

(async () => {
  showState("Loading…");
  if(await fromArtifactDb()) return;
  await loadLive(true);

  setInterval(() => { if(!document.hidden) loadLive(false); }, POLL_MS);

  /* THE ONE THAT MATTERS ON A PHONE. A backgrounded tab is throttled hard and
     may not have polled for minutes, so the moment you look at it again is
     exactly when it is most likely to be wrong -- and exactly when you care. */
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden) loadLive(false);
  });

  /* The stamp ages between fetches, so it has to tick on its own or a page
     sitting open would keep claiming the data is as fresh as its last poll. */
  setInterval(() => {
    if(document.hidden || !LAST_SNAPSHOT) return;
    const el = document.getElementById("stamp");
    /* THE BUILD GOES HERE TOO, and forgetting it is why this ticker was a bug
       the day the stamp shipped: the id appeared on load and vanished five
       seconds later, so the one question it exists to answer -- which build is
       this phone running -- could only be answered in the instant after a
       refresh. Any writer of this element owes the whole line. */
    if(el) el.textContent = "live · " + fmtWhen(LAST_SNAPSHOT.generated_at) +
                            snapAge(LAST_SNAPSHOT) + " · epoch " + EPOCH +
                            " · app " + APP_BUILD;
  }, 5000);
})();

/* Every page the tab bar can show. A section added to the markup and not
   added HERE renders correctly and can never be reached -- it stays
   hidden, because the handler only ever unhides what this lists. */
const PAGES = ["home", "active", "results", "schedule", "settings", "live"];
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b =>
      b.setAttribute("aria-selected", String(b === btn)));
    PAGES.forEach(p =>
      document.getElementById("page-" + p).hidden = (p !== btn.dataset.p));
    window.scrollTo(0, 0);
  });
});

/* A HOME BUTTON IS THE TAB IT NAMES. Routing it through `go()` rather than
   duplicating the show/hide means the tab bar's selected state follows a home
   tap -- otherwise the app would be on Active with Home still lit. */
function go(page){
  const btn = document.querySelector(`nav button[data-p="${page}"]`);
  if(btn){ btn.click(); return; }
  /* 🔴 A PAGE WITH NO TAB, and the tab bar keeps HOME lit while you are on it.
     That is not a cosmetic choice: home is where you came from and what the
     bar's own Home button returns you to, so lighting nothing would leave the
     one escape hatch looking inactive. */
  PAGES.forEach(p => {
    const el = document.getElementById("page-" + p);
    if(el) el.hidden = (p !== page);
  });
  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.p === "home")));
  window.scrollTo(0, 0);
  /* Live builds its chart the first time it is SHOWN: a chart created inside a
     hidden section measures zero wide. */
  if(page === "live") lvShow();
}

/* RESULTS NAVIGATION. Its own handler and its own attribute: [data-job] drives
   the ACTIVE tab, and reusing it here would have opening a finished job also
   change what the Active tab was showing. */
/* THE CONTROL ROW OWNS EVERY FILTER. It sits outside the rows, so nothing here
   competes with the row button -- but the guard stays: it is registered first
   and stops propagation, which is what keeps that true if a control is ever
   placed inside a row again. */
document.addEventListener("click", e => {
  const c = e.target.closest("[data-rfilter]");
  if(!c) return;
  e.stopPropagation();
  e.preventDefault();
  const [what, value] = String(c.dataset.rfilter).split(":");
  if(what === "sort"){
    RESULTS_SORT = RESULTS_SORT === "newest" ? "oldest" : "newest";
  } else if(what === "regime"){
    /* `value` is still honoured so a control CAN name a target, but nothing
       does today -- every chip cycles. */
    RESULTS_REGIME = value
      ? (RESULTS_REGIME === value ? null : value)
      : cycle(["BULL", "BEAR", "RANGING"], RESULTS_REGIME);
  } else if(what === "bucket"){
    RESULTS_BUCKET = value
      ? (String(RESULTS_BUCKET) === value ? null : value)
      : cycle(resultsBuckets(), RESULTS_BUCKET);
  } else if(what === "machine"){
    RESULTS_MACHINE = value
      ? (RESULTS_MACHINE === value ? null : value)
      : cycle(resultsMachines(), RESULTS_MACHINE);
  } else if(what === "task"){
    RESULTS_TASK = value
      ? (RESULTS_TASK === value ? null : value)
      : cycle(resultsTasks(), RESULTS_TASK);
  }
  RESULTS_JOB = null;              // a narrowed list has no job open
  document.getElementById("page-results").innerHTML = renderResults();
  window.scrollTo(0, 0);
});

document.addEventListener("click", e => {
  const g = e.target.closest("[data-mg]");
  if(g){
    MSTATE.g = g.getAttribute("data-mg");
    MSTATE.open = "";
    repaintCards();
    return;
  }
  /* THE DOT BEFORE THE ROW. Checked ahead of [data-mk] because it sits inside
     that row -- closest() would otherwise find the row first and explain the
     metric instead of plotting it. */
  if(e.target.closest("[data-gclose]")){ GFULL = false; repaintCards(); return; }
  if(e.target.closest("[data-gopen]")){ GFULL = true; repaintCards(); return; }
  if(e.target.closest("[data-optopen]")){
    OPTSTATE.open = !OPTSTATE.open; repaintCards(); return;
  }
  /* OPENING OR CLOSING A PANEL DISARMS IT. An action armed on one machine must
     not still be armed when you come back to that card later -- the whole point
     of arming is that the confirm is read in the same breath as the tap. */
  const oo = e.target.closest("[data-opsopen]");
  if(oo){
    const k = oo.getAttribute("data-opsopen");
    OPSTATE.open = OPSTATE.open === k ? null : k;
    OPSTATE.arm = null; OPSTATE.said = null; repaintCards(); return;
  }
  if(e.target.closest("[data-opscancel]")){
    OPSTATE.arm = null; repaintCards(); return;
  }
  const fo = e.target.closest("[data-failopen]");
  if(fo){
    const k = fo.getAttribute("data-failopen");
    FAILSTATE.open = FAILSTATE.open === k ? null : k;
    FAILSTATE.arm = null; FAILSTATE.said = null; repaintCards(); return;
  }
  if(e.target.closest("[data-failcancel]")){
    FAILSTATE.arm = null; repaintCards(); return;
  }
  const fa = e.target.closest("[data-failarm]");
  if(fa){
    FAILSTATE.arm = {key: fa.getAttribute("data-failarm"),
                     act: fa.getAttribute("data-failact")};
    FAILSTATE.said = null; repaintCards(); return;
  }
  const fg = e.target.closest("[data-failgo]");
  if(fg){
    FAILSTATE.arm = null;
    failSend(fg.getAttribute("data-failgo"), fg.getAttribute("data-failact"),
             fg.getAttribute("data-failn"));
    return;
  }
  const oa = e.target.closest("[data-opsarm]");
  if(oa){
    OPSTATE.arm = {key: oa.getAttribute("data-opsarm"),
                   act: oa.getAttribute("data-opsact")};
    OPSTATE.said = null; repaintCards(); return;
  }
  const og = e.target.closest("[data-opsgo]");
  if(og){
    const k = og.getAttribute("data-opsgo"), act = og.getAttribute("data-opsact");
    OPSTATE.arm = null;
    /* THE COMMIT IS WHERE THE MISSING CHANNEL SURFACES, and it names the action
       back rather than saying "not implemented" -- so what you confirmed and
       what did not happen are the same sentence. */
    OPSTATE.said = "\u26a0\ufe0f <b>" + esc(opsLabel(act)) + "</b> was not sent. This page "
      + "reads a published snapshot and has no route back to "
      + esc(String(k).split("|")[0]) + " yet \u2014 it needs the app served from the "
      + "laptop rather than a public host.";
    repaintCards(); return;
  }
  const os = e.target.closest("[data-optslice]");
  if(os){ OPTSTATE.slice = os.getAttribute("data-optslice"); repaintCards(); return; }
  const oc = e.target.closest("[data-optcol]");
  if(oc){
    const k = oc.getAttribute("data-optcol");
    const at = OPTSTATE.cols.indexOf(k);
    /* NEVER EMPTY. A table with no columns is a list of pass numbers, and the
       way back from it is not obvious -- so the last one standing stays. */
    if(at >= 0){ if(OPTSTATE.cols.length > 1) OPTSTATE.cols.splice(at, 1); }
    else OPTSTATE.cols.push(k);
    repaintCards();
    return;
  }
  const op = e.target.closest("[data-optpick]");
  if(op){
    const k = op.getAttribute("data-optpick"), p = op.getAttribute("data-optpass");
    /* Tapping the one already chosen clears it, which is the only way back to
       "whatever the round assigned" without reloading. */
    if(String(OPT_PICK[k]) === String(p)) delete OPT_PICK[k];
    else OPT_PICK[k] = p;
    repaintCards();
    return;
  }
  const sb = e.target.closest("[data-slope]");
  if(sb){
    const key = sb.getAttribute("data-slope");
    SLICE.slope = SLICE.slope === key ? "" : key;
    repaintCards();
    return;
  }
  const sr = e.target.closest("[data-ses]");
  if(sr){
    const name = sr.getAttribute("data-ses");
    SLICE.session = SLICE.session === name ? "" : name;
    repaintCards();
    return;
  }
  const mp = e.target.closest("[data-mp]");
  if(mp){
    const key = mp.getAttribute("data-mp");
    const at = MSTATE.plot.indexOf(key);
    if(at >= 0){ MSTATE.plot.splice(at, 1); }
    else { MSTATE.plot.push(key); VHSTATE.on = []; SWSTATE.on = []; }
    repaintCards();
    return;
  }
  if(e.target.closest("[data-mgmode]")){
    MSTATE.mode = MSTATE.mode === "index" ? "value" : "index";
    repaintCards();
    return;
  }
  if(e.target.closest("[data-mgclear]")){
    MSTATE.plot = [];
    repaintCards();
    return;
  }
  const k = e.target.closest("[data-mk]");
  if(k){
    const key = k.getAttribute("data-mk");
    const at = MSTATE.plot.indexOf(key);
    if(at >= 0){
      /* SECOND TAP CLEARS BOTH. */
      MSTATE.plot.splice(at, 1);
      /* ...but only closes the explanation if it was THIS row's. Unplotting a
         metric you left open three rows ago must not shut the one you are
         reading now. */
      if(MSTATE.open === key) MSTATE.open = "";
    } else {
      MSTATE.plot.push(key);
      MSTATE.open = key;
      SWSTATE.on = [];
      /* Same exchange as the dot made: a metric and a variable cannot share the
         graph, so the variables let go. */
      VHSTATE.on = [];
    }
    repaintCards();
    return;
  }
  /* A VARIABLE NAME: add it to the shared graph, or take it off. APPENDED, never
     inserted, because position in this list IS the series colour -- a variable
     that changed colour when a different one was removed would no longer match
     its own block in the table underneath. */
  const vh = e.target.closest("[data-vh]");
  if(vh){
    const name = vh.getAttribute("data-vh");
    const at = VHSTATE.on.indexOf(name);
    if(at >= 0){ VHSTATE.on.splice(at, 1); }
    else { VHSTATE.on.push(name); MSTATE.plot = []; SWSTATE.on = []; }
    repaintCards();
    return;
  }
  const sw = e.target.closest("[data-swcurve]");
  if(sw){
    const name = sw.getAttribute("data-swcurve");
    const at = SWSTATE.on.indexOf(name);
    if(at >= 0){ SWSTATE.on.splice(at, 1); }
    else { SWSTATE.on.push(name); MSTATE.plot = []; VHSTATE.on = []; }
    repaintCards();
    return;
  }
});

/* BOTH PAGES, NOT JUST RESULTS. taskCard() is reached from taskPanel on the
   Results job card AND from renderTimeline inside renderActive(), so a handler
   that repainted only `page-results` left every one of these controls dead on
   the Active tab -- while still mutating the shared state behind it, which then
   surfaced on Results as a filter nobody set there. Repainting both is what
   "page-wide" already claimed to mean. */
/* WHERE THE STICKY GRAPH COMES TO REST: directly under the header, whatever
   height the header happens to be. Measured rather than assumed, and re-measured
   on resize because the header wraps. */
function stickTop(){
  const h = document.querySelector("header");
  if(h) document.documentElement.style.setProperty("--hdr", h.offsetHeight + "px");
}
window.addEventListener("resize", stickTop);

/* IS IT HOLDING THE TOP RIGHT NOW. Read off the element's own rectangle rather
   than off a scroll threshold: the card's position in the document changes every
   time a badge above it grows or shrinks, and a remembered offset would be wrong
   the first time anything did.

   rAF-throttled, and the listener is passive -- this runs on every scroll frame
   on a phone and must never be the reason a scroll stutters. */
let _stuckRaf = 0;
function syncStuck(){
  _stuckRaf = 0;
  const hdr = parseFloat(getComputedStyle(document.documentElement)
                .getPropertyValue("--hdr")) || 64;
  document.querySelectorAll(".gbadge").forEach(el => {
    /* +1 for sub-pixel: a card resting exactly on the header reports 76.98. */
    el.classList.toggle("stuck", el.getBoundingClientRect().top <= hdr + 1);
  });
}
window.addEventListener("scroll", () => {
  if(!_stuckRaf) _stuckRaf = requestAnimationFrame(syncStuck);
}, {passive: true});
/* Once the page exists, and again after any repaint -- a wrapped header is a
   different height, and a repaint can change what the header says. */
if(document.readyState === "loading")
  document.addEventListener("DOMContentLoaded", stickTop);
else stickTop();

/* Typing a pass selects it; clearing the field hands the round back to whatever
   it was assigned. Only the results page is repainted, so the field keeps focus
   and the caret while the rows below it follow along. */
/* 🔴 A TYPED VALUE DOES NOT REPAINT. The preset chips beside this field would
   re-render on every keystroke and take the caret with them, so the draft is
   updated in place and the chips catch up at the next tap. The input already
   shows what you typed; repainting only to agree with it costs the cursor. */
document.addEventListener("input", e => {
  const si = e.target.closest("[data-schedvalin]");
  if(si){
    const blk = schedDraft().find(function(x){
      return x.id === si.getAttribute("data-schedvalin"); });
    if(blk){
      const u = blk.until || (blk.until = {kind: "jobs"});
      const field = schedUntilField(u.kind);
      const raw = si.value.trim();
      if(raw === "") delete u[field];
      else u[field] = schedUntilIsCount(field)
                    ? Math.max(1, parseInt(raw, 10) || 1) : Number(raw);
    }
    return;
  }
  const inp = e.target.closest("[data-optin]");
  if(!inp) return;
  const k = inp.getAttribute("data-optin"), v = inp.value.trim();
  if(v === "") delete OPT_PICK[k]; else OPT_PICK[k] = v;
  document.getElementById("page-results").innerHTML = renderResults();
});

/* 🔴 ONE PLACE PAINTS THE ACTIVE PAGE, and there are two callers: a repaint
   after new data, and opening or closing a job. The second used to write
   `renderActive()` straight into the element -- correct in the app, and wrong in
   the format preview, which paints its own Active page and lost its
   invented-data warning on the way into a job detail made entirely of invented
   numbers. That warning is the one line on this page that must never go missing.

   THE PREVIEW DECLARES A HOOK; the phone has none and takes the plain path. */
function paintActive(){
  if(typeof window !== "undefined" && typeof window.__PREVIEW_ACTIVE__ === "function")
    window.__PREVIEW_ACTIVE__();
  else document.getElementById("page-active").innerHTML = renderActive();
}

function repaintCards(){
  document.getElementById("page-results").innerHTML = renderResults();
  paintActive();
  stickTop();
  /* The card is a new element after a repaint, so the class has to be put back
     on it -- otherwise tapping a metric while scrolled down un-collapses the
     graph under your thumb. */
  syncStuck();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-rtask]");
  if(!t) return;
  RESULTS_TASK_OPEN = Number(t.dataset.rtask) || 0;
  document.getElementById("page-results").innerHTML = renderResults();
  window.scrollTo(0, 0);
});

/* Taking it off the list is its own listener, so the two navigation handlers
   stay exactly as they were -- a badge is a job link that happens to also be a
   notification, not a third kind of control. */
document.addEventListener("click", e => {
  const v = e.target.closest("[data-review]");
  if(!v) return;
  markReviewed(v.dataset.review);
  document.getElementById("page-home").innerHTML = renderHome();
});

document.addEventListener("click", e => {
  const j = e.target.closest("[data-rjob]");
  if(!j) return;
  RESULTS_TASK_OPEN = 0;           // a newly opened job starts at its first task
  RESULTS_JOB = j.dataset.rjob || null;
  document.getElementById("page-results").innerHTML = renderResults();
  window.scrollTo(0, 0);
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if(b) go(b.dataset.go);
  const j = e.target.closest("[data-job]");
  if(j){
    // "" is the back button. Repaints ONLY the Active page: opening a job is
    // navigation, not new data, so nothing else should flicker.
    ACTIVE_JOB = j.dataset.job || null;
    paintActive();
    window.scrollTo(0, 0);
  }
});

/* MOCKUP HANDLERS. THEY EDIT THE CARD IN PLACE and never repaint a page.
   The first cut called renderActive(), which is correct in the app and wrong
   everywhere else: the format preview builds its own page out of these cards,
   so repainting Active deleted the very card being tapped. Touching only the
   nodes inside this .pick block works in both, and in the app it also stops a
   tap on one machine's card from flickering every other machine's. */
function syncPick(scope, key, value){
  PICKED[key] = value;
  scope.querySelectorAll("[data-pick]").forEach(r =>
    r.classList.toggle("on", value != null &&
                       Number(r.dataset.pass) === Number(value)));
  const btn = scope.querySelector("[data-apply]");
  if(btn){
    btn.disabled = value == null;
    btn.textContent = value == null ? "Pick a pass to apply"
                                    : "Apply pass " + value;
  }
}

document.addEventListener("click", e => {
  const row = e.target.closest("[data-pick]");
  if(row){
    const scope = row.closest(".pick");
    /* ONE VALUE, NOT TWO -- the typed field is cleared, so the card can never
       show a highlighted row and a different number in the box at once. */
    const inp = scope.querySelector("[data-pickin]");
    if(inp) inp.value = "";
    syncPick(scope, row.dataset.pick, Number(row.dataset.pass));
    return;
  }
  const ap = e.target.closest("[data-apply]");
  if(ap && !ap.disabled){
    const n = PICKED[ap.dataset.apply];
    const box = ap.parentElement;
    /* WHAT IT WOULD SAY, not what it did. The preview must not imply a round
       was applied -- nothing was sent, and there is nowhere to send it. */
    box.innerHTML = `<div class="pickhd">⏸ Round finished — pick a pass</div>` +
      `<div class="pickdone">✓ Pass ${n} would be applied here, and the two
        post-round backtests queued. <b>Nothing was sent</b> — this page has no
        write path to the machines yet.</div>`;
  }
});

document.addEventListener("input", e => {
  const inp = e.target.closest("[data-pickin]");
  if(!inp) return;
  const v = inp.value.trim();
  syncPick(inp.closest(".pick"), inp.dataset.pickin, v === "" ? null : Number(v));
});

/* OPEN THE TASK CARD. Separate from [data-toggle] because the row contains
   report buttons and a [data-toggle] of their own -- a single handler would
   open the card every time one of those was tapped. */
document.addEventListener("click", e => {
  if(e.target.closest(".rbtn")) return;      // a report button is not the row
  const row = e.target.closest("[data-task]");
  if(!row) return;
  const card = row.querySelector(".task");
  if(!card) return;
  card.hidden = !card.hidden;
  row.classList.toggle("open", !card.hidden);
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if(!t) return;
  const body = t.nextElementSibling;
  if(!body) return;
  body.hidden = !body.hidden;
  // The report buttons carry no caret -- they are the disclosure themselves.
  const car = t.querySelector(".car");
  if(car) car.textContent = body.hidden ? "▾" : "▴";
});
</script>
</body>
</html>
